<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEX — دخول العملاء</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png?v=20260816">
<style>
:root{--bg:#0b0e11;--surface:#141920;--surface2:#1a1f2e;--border:#262e39;--green:#00e701;--green-dim:rgba(0,231,1,.12);--text:#eef2f6;--muted:#8794a3;--red:#ff4757}
*{margin:0;padding:0;box-sizing:border-box;font-family:Cairo,Tahoma,sans-serif}
body{background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;width:100%;max-width:400px;padding:34px 28px;position:relative;z-index:2}
.logo{text-align:center;margin-bottom:22px}
.logo img{height:64px}
.logo-fallback{display:none;width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#00e701,#0d7a2f);align-items:center;justify-content:center;font-size:32px;font-weight:900;color:#0b0e11;margin:0 auto 10px;border:2px solid rgba(0,231,1,.3)}
.title{text-align:center;font-size:19px;font-weight:900;margin-bottom:4px}
.sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:700}
.field input{width:100%;background:#0b0e11;border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;padding:12px 14px;outline:none;transition:border .2s}
.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,231,1,.08)}
.btn{width:100%;background:linear-gradient(135deg,#00e701,#00c101);color:#04210a;font-weight:900;font-size:14px;border:none;border-radius:12px;padding:13px;cursor:pointer;margin-top:6px}
.btn:disabled{opacity:.6;cursor:wait}
.alert{background:rgba(255,71,87,.12);border:1px solid rgba(255,71,87,.3);color:#ff7090;border-radius:10px;padding:10px 14px;font-size:12px;margin-bottom:16px;display:none}
.alert.show{display:block}
.footer{text-align:center;font-size:10px;color:var(--muted);margin-top:20px}
.bg{position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(0,231,1,.07),transparent),radial-gradient(ellipse 40% 30% at 80% 100%,rgba(0,231,1,.05),transparent)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <div class="logo">
    <img src="/static/icons/logo-full.png" alt="VEX" onerror="this.style.display='none';document.querySelector('.logo-fallback').style.display='flex'">
    <div class="logo-fallback">V</div>
  </div>
  <div class="title">دخول العملاء</div>
  <div class="sub">لوحة إدارة بوتك وعملياتك</div>
  <div class="alert" id="err"></div>
  <div class="field">
    <label>اسم المستخدم</label>
    <input id="u" dir="ltr" autocomplete="username" placeholder="username">
  </div>
  <div class="field">
    <label>كلمة المرور</label>
    <input id="p" type="password" dir="ltr" autocomplete="current-password" placeholder="••••••••">
  </div>
  <button class="btn" id="go" onclick="login()">🔐 تسجيل الدخول</button>
  <div class="footer">بوابة عملاء VEX — لإدارة اشتراكك وبوتك</div>
</div>
<script>
function login(){
  var u=document.getElementById('u').value.trim(), p=document.getElementById('p').value;
  var err=document.getElementById('err'), btn=document.getElementById('go');
  err.classList.remove('show');
  if(!u||!p){err.textContent='أدخل اسم المستخدم وكلمة المرور';err.classList.add('show');return}
  btn.disabled=true;btn.textContent='⏳ جارٍ التحقق...';
  fetch('/api/client/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})})
    .then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d}})})
    .then(function(res){
      if(res.ok&&res.d.success){window.location='/client';return}
      err.textContent=res.d.error||'بيانات الدخول غير صحيحة';err.classList.add('show');
      btn.disabled=false;btn.textContent='🔐 تسجيل الدخول';
    })
    .catch(function(){err.textContent='خطأ في الاتصال — حاول مجدداً';err.classList.add('show');btn.disabled=false;btn.textContent='🔐 تسجيل الدخول'});
}
document.getElementById('p').addEventListener('keydown',function(e){if(e.key==='Enter')login()});
</script>
</body>
</html>
