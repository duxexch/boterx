<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>اختطف</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
body { overflow:hidden; font-family:system-ui,sans-serif; background:var(--tg-theme-bg-color,#0f172a); color:var(--tg-theme-text-color,#fff); touch-action:none; }
#game { position:fixed; inset:0; display:flex; flex-direction:column; }

/* HUD */
#hud { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:rgba(0,0,0,0.3); backdrop-filter:blur(10px); z-index:100; }
#score { font-size:20px; font-weight:900; }
#lives { font-size:18px; }
#round-info { font-size:14px; opacity:0.7; }

/* Arena */
#arena { flex:1; position:relative; overflow:hidden; }

/* Gift */
.gift { position:absolute; width:80px; height:80px; display:flex; align-items:center; justify-content:center; font-size:40px; border-radius:20px; cursor:pointer; transition:transform 0.15s, opacity 0.2s; will-change:transform,opacity; }
.gift.golden { background:linear-gradient(135deg,#fbbf24,#f59e0b); box-shadow:0 0 30px rgba(251,191,36,0.6); }
.gift.flash { background:linear-gradient(135deg,#06b6d4,#3b82f6); box-shadow:0 0 30px rgba(6,182,212,0.6); }
.gift.bomb { background:linear-gradient(135deg,#ef4444,#dc2626); box-shadow:0 0 30px rgba(239,68,68,0.6); }
.gift.decoy { background:linear-gradient(135deg,#a78bfa,#8b5cf6); box-shadow:0 0 30px rgba(167,139,250,0.6); }
.gift.appear { animation:appear 0.3s ease-out; }
.gift.caught { animation:caught 0.3s ease-in forwards; }
.gift.missed { animation:missed 0.2s ease-in forwards; }
@keyframes appear { from{transform:scale(0) rotate(-180deg);opacity:0} to{transform:scale(1) rotate(0);opacity:1} }
@keyframes caught { to{transform:scale(2) rotate(360deg);opacity:0} }
@keyframes missed { to{transform:scale(0.5);opacity:0} }

/* Gift label */
.gift-label { position:absolute; bottom:-20px; left:50%; transform:translateX(-50%); font-size:9px; white-space:nowrap; background:rgba(0,0,0,0.6); padding:2px 6px; border-radius:6px; pointer-events:none; }

/* Start screen */
#start-screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:200; background:var(--tg-theme-bg-color,#0f172a); }
#start-screen h1 { font-size:48px; margin-bottom:8px; }
#start-screen p { font-size:16px; opacity:0.7; margin-bottom:24px; text-align:center; padding:0 32px; }
#start-btn { background:linear-gradient(135deg,#fbbf24,#f59e0b); color:#000; border:none; padding:16px 48px; border-radius:16px; font-size:24px; font-weight:900; cursor:pointer; box-shadow:0 8px 24px rgba(251,191,36,0.4); transition:transform 0.2s; }
#start-btn:active { transform:scale(0.95); }

/* Result screen */
#result-screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:200; background:var(--tg-theme-bg-color,#0f172a); }
#result-screen h1 { font-size:40px; margin-bottom:16px; }
#result-screen .prizes { font-size:18px; margin-bottom:24px; text-align:center; }
#result-screen .prizes div { margin:4px 0; }

/* Confetti */
.confetti { position:absolute; width:10px; height:10px; pointer-events:none; }

/* Tease text */
.tease-text { position:absolute; font-size:18px; font-weight:900; pointer-events:none; animation:teaseFloat 1s ease-out forwards; z-index:150; }
@keyframes teaseFloat { from{transform:translateY(0);opacity:1} to{transform:translateY(-40px);opacity:0} }

/* Countdown */
#countdown { position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:300; font-size:120px; font-weight:900; color:#fbbf24; }
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div id="score">🎁 0</div>
    <div id="round-info">جولة 0/7</div>
    <div id="lives">❤️❤️❤️</div>
  </div>
  <div id="arena"></div>
</div>

<div id="start-screen">
  <h1>🎁 اختطف!</h1>
  <p>هدايا ستظهر وتختفي بسرعة!<br>اخطفها قبل ما تهرب!<br>⚡ أحياناً تظهر وتختفي فوراً<br>🟢 أحياناً تنتظرك<br>🔴 احذر القنابل!</p>
  <button id="start-btn" onclick="startGame()">ابدأ!</button>
</div>

<div id="countdown"></div>

<div id="result-screen">
  <h1 id="result-title"></h1>
  <div class="prizes" id="result-prizes"></div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.expand(); tg.ready(); }

let score = 0, lives = 3, round = 0, maxRounds = 7;
let gameActive = false, currentGift = null, gameTimer = null;
let caughtGifts = [];
const giftsData = window.giftsData || [];

const ARENA = document.getElementById('arena');
const EL_SCORE = document.getElementById('score');
const EL_LIVES = document.getElementById('lives');
const EL_ROUND = document.getElementById('round-info');
const EL_START = document.getElementById('start-screen');
const EL_RESULT = document.getElementById('result-screen');
const EL_COUNTDOWN = document.getElementById('countdown');

const GIFT_EMOJIS = ['🎁','💎','🏆','⭐','🎉','🪙','💍','🎯'];
const COLORS = ['golden','golden','flash','flash','decoy','bomb'];

// Sounds
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq, dur, type='sine', vol=0.2) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.frequency.value = freq; o.type = type;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function soundCatch() { beep(523,0.1); setTimeout(()=>beep(784,0.15),80); setTimeout(()=>beep(1047,0.2),160); }
function soundMiss() { beep(300,0.2,'sawtooth',0.15); }
function soundBomb() { beep(150,0.3,'square',0.3); setTimeout(()=>beep(100,0.2,'square',0.3),100); }
function soundTease() { beep(800,0.05,'sine',0.1); }

// Haptics
function haptic(type='light') { if(tg?.HapticFeedback?.impactOccurred) tg.HapticFeedback.impactOccurred(type); }
function hapticNotify(type='success') { if(tg?.HapticFeedback?.notificationOccurred) tg.HapticFeedback.notificationOccurred(type); }

function startGame() {
  EL_START.style.display = 'none';
  if (audioCtx.state === 'suspended') audioCtx.resume();
  countdown(3, () => { gameActive = true; nextRound(); });
}

function countdown(n, cb) {
  if (n <= 0) { EL_COUNTDOWN.style.display = 'none'; cb(); return; }
  EL_COUNTDOWN.style.display = 'flex';
  EL_COUNTDOWN.textContent = n;
  beep(440, 0.1);
  setTimeout(() => countdown(n - 1, cb), 700);
}

function nextRound() {
  round++;
  if (round > maxRounds || lives <= 0) { endGame(); return; }
  EL_ROUND.textContent = `جولة ${round}/${maxRounds}`;
  
  // Choose behavior
  const behaviors = ['golden','golden','flash','flash','decoy','bomb','golden'];
  const behavior = behaviors[Math.floor(Math.random() * behaviors.length)];
  
  // Choose gift data
  const gift = giftsData[Math.floor(Math.random() * giftsData.length)] || { text: 'هدية', id: '', link: '' };
  
  spawnGift(behavior, gift);
}

function spawnGift(behavior, gift) {
  // Clear previous
  if (currentGift) { currentGift.remove(); currentGift = null; }
  
  const el = document.createElement('div');
  el.className = `gift ${behavior} appear`;
  
  const emoji = behavior === 'bomb' ? '💣' : GIFT_EMOJIS[Math.floor(Math.random()*GIFT_EMOJIS.length)];
  el.innerHTML = emoji;
  
  // Label with gift name
  if (behavior !== 'bomb' && gift.text) {
    const label = document.createElement('div');
    label.className = 'gift-label';
    label.textContent = gift.text.substring(0, 20);
    el.appendChild(label);
  }
  
  // Random position
  const aw = ARENA.clientWidth - 100, ah = ARENA.clientHeight - 100;
  let x = 10 + Math.random() * aw, y = 10 + Math.random() * ah;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  
  el.onclick = () => onCatch(el, behavior, gift);
  ARENA.appendChild(el);
  currentGift = el;
  
  // Behavior timing
  let duration;
  if (behavior === 'flash') duration = 300 + Math.random() * 400; // 0.3-0.7s
  else if (behavior === 'golden') duration = 1200 + Math.random() * 1800; // 1.2-3s
  else if (behavior === 'bomb') duration = 800 + Math.random() * 1200; // 0.8-2s
  else if (behavior === 'decoy') duration = 500 + Math.random() * 500; // 0.5-1s then move
  else duration = 800;
  
  // For decoy: move after short time
  if (behavior === 'decoy') {
    setTimeout(() => {
      if (el.parentNode && !el.classList.contains('caught')) {
        // Move to new position
        x = 10 + Math.random() * aw; y = 10 + Math.random() * ah;
        el.style.transition = 'left 0.3s, top 0.3s';
        el.style.left = x + 'px'; el.style.top = y + 'px';
        soundTease();
        showTease('هربت! 😜', x, y);
      }
    }, 300);
    duration = 1200 + Math.random() * 800; // stays a bit after moving
  }
  
  // Auto-miss after duration
  gameTimer = setTimeout(() => {
    if (el.parentNode && !el.classList.contains('caught')) {
      el.classList.add('missed');
      if (behavior === 'golden' || behavior === 'flash') {
        showTease('فوتتك! 😅', x, y);
        soundMiss();
        haptic('light');
      }
      setTimeout(() => { el.remove(); currentGift = null; nextRound(); }, 200);
    }
  }, duration);
}

function onCatch(el, behavior, gift) {
  if (el.classList.contains('caught') || el.classList.contains('missed')) return;
  clearTimeout(gameTimer);
  el.classList.add('caught');
  
  if (behavior === 'bomb') {
    // Bomb!
    lives--;
    EL_LIVES.textContent = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
    soundBomb();
    hapticNotify('error');
    showTease('💥 خداع!', parseFloat(el.style.left), parseFloat(el.style.top));
    confetti(parseFloat(el.style.left) + 40, parseFloat(el.style.top) + 40, '#ef4444');
    setTimeout(() => { el.remove(); currentGift = null; if (lives <= 0) endGame(); else nextRound(); }, 400);
  } else {
    // Caught a gift!
    score++;
    EL_SCORE.textContent = '🎁 ' + score;
    soundCatch();
    hapticNotify('success');
    if (behavior === 'flash') {
      showTease('⚡ سريع!', parseFloat(el.style.left), parseFloat(el.style.top));
    } else {
      showTease('🎉 اختطفتها!', parseFloat(el.style.left), parseFloat(el.style.top));
    }
    confetti(parseFloat(el.style.left) + 40, parseFloat(el.style.top) + 40, '#fbbf24');
    caughtGifts.push({ id: gift.id, text: gift.text, link: gift.link });
    setTimeout(() => { el.remove(); currentGift = null; nextRound(); }, 400);
  }
}

function showTease(text, x, y) {
  const el = document.createElement('div');
  el.className = 'tease-text';
  el.textContent = text;
  el.style.left = (x + 20) + 'px';
  el.style.top = (y - 10) + 'px';
  ARENA.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function confetti(x, y, color) {
  const colors = [color, '#fbbf24', '#06b6d4', '#a78bfa', '#34d399'];
  for (let i = 0; i < 15; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = x + 'px'; c.style.top = y + 'px';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    ARENA.appendChild(c);
    const angle = Math.random() * Math.PI * 2;
    const dist = 50 + Math.random() * 100;
    const dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist;
    c.animate([
      { transform: 'translate(0,0) rotate(0)', opacity: 1 },
      { transform: `translate(${dx}px,${dy}px) rotate(${Math.random()*720}deg)`, opacity: 0 }
    ], { duration: 600 + Math.random()*400, easing: 'ease-out' });
    setTimeout(() => c.remove(), 1000);
  }
}

function endGame() {
  gameActive = false;
  if (currentGift) { currentGift.remove(); currentGift = null; }
  clearTimeout(gameTimer);
  
  EL_RESULT.style.display = 'flex';
  const title = score > 0 ? `🎉 ${score} هدية!` : '😔 حظ أوفر!';
  document.getElementById('result-title').textContent = title;
  
  let prizesHTML = '';
  caughtGifts.forEach(g => { prizesHTML += `<div>🎁 ${g.text}</div>`; });
  if (caughtGifts.length === 0) prizesHTML = '<div>لم تتمكن من اصطياد أي هدية</div>';
  document.getElementById('result-prizes').innerHTML = prizesHTML;
  
  // إرسال البيانات للبوت تلقائياً بدون انتظار ضغط زر
  const resultData = JSON.stringify({ gifts: caughtGifts, score: score });
  if (tg) {
    // إرسال مباشر ثم إغلاق
    try {
      tg.sendData(resultData);
    } catch(e) {
      // لو sendData فشلت، استخدم MainButton كحل بديل
      tg.MainButton.setText('🎁 استلام الجوائز');
      tg.MainButton.show();
      tg.MainButton.offClick(sendResult);
      tg.MainButton.onClick(sendResult);
    }
  }
  
  beep(523, 0.1); setTimeout(()=>beep(659,0.1),100); setTimeout(()=>beep(784,0.2),200);
}

function sendResult() {
  const resultData = JSON.stringify({ gifts: caughtGifts, score: score });
  if (tg) {
    tg.sendData(resultData);
    tg.close();
  }
}
</script>
<script>
// Gifts data injected by Flask
window.giftsData = {{ gifts_json|safe }};
</script>
</body>
</html>
