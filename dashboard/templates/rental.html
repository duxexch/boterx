{% extends 'base.html' %}
{% block title %}Rental System — VEX{% endblock %}
{% block content %}
<style>
/* ── Rental Page Mobile-First Styles ── */
.rental-app{--accent:#00e701;--accent2:#60a5fa;--bg2:#0f1218;--card:#161c28;--card2:#1a2233;--border:#252e3d;--text:#e8edf4;--muted:#6b7a90;--danger:#ff4757;--amber:#fbbf24;position:relative;min-height:70vh}
.rental-app *{box-sizing:border-box}
.bottom-tabs{display:none;position:fixed;bottom:0;left:0;right:0;z-index:45;background:var(--card);border-top:1px solid var(--border);padding:6px 4px env(safe-area-inset-bottom)}
.bottom-tabs-inner{display:flex;justify-content:space-around;align-items:center}
.bottom-tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:12px;font-size:9px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .2s;position:relative;min-width:52px;-webkit-tap-highlight-color:transparent}
.bottom-tab:active{transform:scale(.93)}
.bottom-tab.active{color:var(--accent)}
.bottom-tab .b-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .2s}
.bottom-tab.active .b-icon{background:rgba(0,231,1,.15)}
.bottom-tab .b-badge{position:absolute;top:2px;right:10px;background:var(--danger);color:#fff;font-size:8px;min-width:15px;height:15px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:900}
.top-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.top-tab{padding:9px 16px;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;border:1px solid transparent;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.top-tab:hover{color:var(--text);background:var(--card2)}
.top-tab.active{background:var(--accent);color:#000;border-color:var(--accent)}
.top-tab .t-badge{background:var(--danger);color:#fff;font-size:8px;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:900}
.r-card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:border-color .2s}
.r-card:hover{border-color:#354055}
body.light-mode .rental-app{--accent:#16a34a;--accent2:#2563eb;--bg2:#f1f5f9;--card:#ffffff;--card2:#f1f5f9;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--danger:#dc2626;--amber:#d97706}
body.light-mode .rental-app .r-card:hover{border-color:#cbd5e1}
body.light-mode .rental-app .modal-overlay{background:rgba(0,0,0,.3)}
.r-card-header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.r-card-body{padding:16px 18px}
.r-card-footer{padding:10px 18px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 12px;text-align:center;transition:transform .15s}
.stat-card:active{transform:scale(.97)}
.stat-icon{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:6px}
.stat-val{font-size:22px;font-weight:900;line-height:1}
.stat-label{font-size:10px;color:var(--muted);margin-top:4px}
.client-grid{display:grid;grid-template-columns:1fr;gap:14px}
.client-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;transition:all .2s}
.client-card:active{transform:scale(.99);border-color:var(--accent)}
.cc-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cc-avatar{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;flex-shrink:0}
.cc-name{font-weight:800;font-size:15px}
.cc-id{font-size:10px;color:var(--muted);font-family:monospace}
.cc-status{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700}
.cc-status .dot{width:7px;height:7px;border-radius:99px;flex-shrink:0}
.cc-info{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-bottom:12px}
.cc-row{display:flex;justify-content:space-between;align-items:center;font-size:11px}
.cc-row .lbl{color:var(--muted)}
.cc-row .val{font-weight:700;text-align:left}
.cc-features{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.cc-feat{font-size:9px;padding:3px 8px;border-radius:99px;background:rgba(0,231,1,.08);color:rgba(0,231,1,.7);border:1px solid rgba(0,231,1,.2)}
.cc-feat.more{background:rgba(107,122,144,.1);color:var(--muted);border-color:var(--border)}
.cc-actions{display:flex;gap:6px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--border)}
.cc-btn{flex:1;min-width:60px;padding:8px;border-radius:10px;font-size:10px;font-weight:700;text-align:center;cursor:pointer;transition:all .15s;border:1px solid transparent}
.cc-btn:active{transform:scale(.95)}
.cc-btn.primary{background:rgba(0,231,1,.12);color:var(--accent);border-color:rgba(0,231,1,.25)}
.cc-btn.danger{background:rgba(255,71,87,.1);color:var(--danger);border-color:rgba(255,71,87,.25)}
.cc-btn.warn{background:rgba(251,191,36,.1);color:var(--amber);border-color:rgba(251,191,36,.25)}
.cc-btn.info{background:rgba(96,165,250,.1);color:var(--accent2);border-color:rgba(96,165,250,.25)}
.pm-grid{display:grid;grid-template-columns:1fr;gap:12px}
.pm-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;transition:all .2s}
.pm-card.active-pm{border-color:rgba(0,231,1,.4)}
.pm-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pm-card-body{background:var(--bg2);border-radius:12px;padding:12px}
.pm-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.pm-row .k{font-size:10px;color:var(--muted)}
.pm-row .v{font-size:13px;font-weight:700;font-family:monospace}
.pm-copy{display:inline-flex;align-items:center;gap:4px;background:rgba(0,231,1,.12);color:var(--accent);border:none;border-radius:8px;padding:5px 10px;font-size:10px;font-weight:700;cursor:pointer}
.pm-copy:active{transform:scale(.93)}
.tx-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.tx-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-title{font-size:13px;font-weight:700}
.tx-sub{font-size:10px;color:var(--muted);margin-top:2px}
.tx-amount{font-size:15px;font-weight:900;text-align:left}
.tx-status{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:3px 8px;border-radius:99px}
.r-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--text);font-size:13px;outline:none;transition:border-color .2s}
.r-input:focus{border-color:var(--accent)}
.r-label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px}
.r-btn{padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s}
.r-btn:active{transform:scale(.96)}
.r-btn.primary{background:var(--accent);color:#000}
.r-btn.danger{background:var(--danger);color:#fff}
.r-btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.r-btn.ghost:hover{color:var(--text);border-color:#45556d}
.modal-overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:24px 18px env(safe-area-inset-bottom);animation:slideUp .25s ease-out}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:36px;height:4px;border-radius:99px;background:#3a4559;margin:0 auto 16px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99;background:var(--card);border:1px solid var(--accent);border-radius:14px;padding:10px 20px;font-size:13px;font-weight:700;color:var(--accent);box-shadow:0 8px 30px rgba(0,0,0,.5);animation:toastIn .3s ease-out;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.search-box{position:relative}
.search-box input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 14px 10px 36px;color:var(--text);font-size:13px;outline:none}
.search-box .s-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.qa-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.qa-btn{display:flex;align-items:center;gap:8px;padding:12px;border-radius:14px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;border:1px solid var(--border);background:var(--card2)}
.qa-btn:active{transform:scale(.96)}
.qa-btn i{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px}
.rev-table{width:100%;font-size:11px;border-collapse:collapse}
.rev-table th{background:var(--bg2);color:var(--muted);padding:10px 12px;font-size:10px;text-align:right;white-space:nowrap}
.rev-table td{padding:10px 12px;border-top:1px solid var(--border);white-space:nowrap}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-state i{font-size:40px;margin-bottom:12px;display:block;opacity:.5}
@media(min-width:640px){.stats-grid{grid-template-columns:repeat(3,1fr)}.client-grid{grid-template-columns:repeat(2,1fr)}.pm-grid{grid-template-columns:repeat(2,1fr)}.qa-grid{grid-template-columns:repeat(3,1fr)}.modal-box{border-radius:20px;max-width:560px}}
@media(min-width:1024px){.stats-grid{grid-template-columns:repeat(6,1fr)}.client-grid{grid-template-columns:repeat(3,1fr)}.pm-grid{grid-template-columns:repeat(3,1fr)}.bottom-tabs{display:none!important}}
@media(max-width:1023px){.top-tabs{display:none}.bottom-tabs{display:block}.rental-app{padding-bottom:80px}}
</style>

<div class="rental-app" x-data="rentalSystem()" x-init="init()" :dir="rl==='ar'?'rtl':'ltr'">
  <div x-show="toastMsg" x-transition class="toast" x-text="toastMsg"></div>

  <!-- HEADER -->
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:10px">
      <h1 style="font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px">
        <span style="font-size:26px">🏢</span> <span x-text="rt('title')"></span>
      </h1>
      <button @click="rl=rl==='ar'?'en':'ar'" style="background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--accent2);cursor:pointer" x-text="rl==='ar'?'EN':'AR'"></button>
    </div>
    <button @click="openCreateClient()" class="r-btn primary" style="display:flex;align-items:center;gap:6px">
      <i class="fas fa-plus"></i> <span x-text="rt('new_client')"></span>
    </button>
  </div>

  <!-- DESKTOP TABS -->
  <div class="top-tabs">
    <div class="top-tab" :class="tab==='dashboard'&&'active'" @click="tab='dashboard';loadAll()"><i class="fas fa-chart-pie"></i> <span x-text="rt('tab_dashboard')"></span></div>
    <div class="top-tab" :class="tab==='clients'&&'active'" @click="tab='clients'"><i class="fas fa-users"></i> <span x-text="rt('tab_clients')"></span></div>
    <div class="top-tab" :class="tab==='payments'&&'active'" @click="tab='payments';loadPaymentMethods()"><i class="fas fa-credit-card"></i> <span x-text="rt('tab_payments')"></span></div>
    <div class="top-tab" :class="tab==='transactions'&&'active'" @click="tab='transactions';loadAllTransactions()"><i class="fas fa-exchange-alt"></i> <span x-text="rt('tab_transactions')"></span> <span x-show="pendingCount>0" class="t-badge" x-text="pendingCount"></span></div>
    <div class="top-tab" :class="tab==='revenue'&&'active'" @click="tab='revenue';loadRevenue()"><i class="fas fa-coins"></i> <span x-text="rt('tab_revenue')"></span></div>
    <div class="top-tab" :class="tab==='admins'&&'active'" @click="tab='admins';loadAdmins()"><i class="fas fa-user-shield"></i> <span x-text="rt('tab_admins')"></span></div>
    <div class="top-tab" :class="tab==='domains'&&'active'" @click="tab='domains';loadDomains()"><i class="fas fa-globe"></i> <span x-text="rt('tab_domains')"></span></div>
  </div>

  <!-- ═══ TAB: DASHBOARD ═══ -->
  <div x-show="tab==='dashboard'" x-transition>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon" style="background:rgba(96,165,250,.12)"><i class="fas fa-users" style="color:var(--accent2)"></i></div><div class="stat-val" style="color:var(--text)" x-text="stats.total"></div><div class="stat-label" x-text="rt('stat_total')"></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:rgba(0,231,1,.12)"><i class="fas fa-check" style="color:var(--accent)"></i></div><div class="stat-val" style="color:var(--accent)" x-text="stats.active"></div><div class="stat-label" x-text="rt('stat_active')"></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:rgba(255,71,87,.12)"><i class="fas fa-times" style="color:var(--danger)"></i></div><div class="stat-val" style="color:var(--danger)" x-text="stats.expired"></div><div class="stat-label" x-text="rt('stat_expired')"></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:rgba(251,191,36,.12)"><i class="fas fa-clock" style="color:var(--amber)"></i></div><div class="stat-val" style="color:var(--amber)" x-text="stats.expiringSoon"></div><div class="stat-label" x-text="rt('stat_expiring')"></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:rgba(168,85,247,.12)"><i class="fas fa-robot" style="color:#a855f7"></i></div><div class="stat-val" style="color:#a855f7" x-text="stats.running"></div><div class="stat-label" x-text="rt('stat_running')"></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:rgba(34,211,238,.12)"><i class="fas fa-coins" style="color:#22d3ee"></i></div><div class="stat-val" style="color:#22d3ee;font-size:16px" x-text="fmtMoney(revenueStats.total_game_profit)"></div><div class="stat-label" x-text="rt('stat_revenue')"></div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr;gap:16px">
      <div class="r-card">
        <div class="r-card-header"><span style="font-size:13px;font-weight:700">🕐 <span x-text="rt('recent_clients')"></span></span></div>
        <div class="r-card-body" style="padding:8px">
          <template x-for="c in clients.slice(0,5)" :key="c.id">
            <div @click="openEditClient(c)" style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;cursor:pointer;transition:background .15s" onmouseover="this.style.background='var(--card2)'" onmouseout="this.style.background=''">
              <div style="display:flex;align-items:center;gap:10px">
                <span style="width:8px;height:8px;border-radius:99px;flex-shrink:0" :class="c.running?'animate-pulse':''" :style="'background:'+(c.running?'var(--accent)':c.expired?'var(--danger)':'var(--muted)')"></span>
                <div>
                  <div style="font-size:13px;font-weight:700" x-text="c.name"></div>
                  <div style="font-size:10px;color:var(--muted)" x-text="'@'+(c.bot_username||'—')"></div>
                </div>
              </div>
              <div style="text-align:left">
                <div style="font-size:12px;font-weight:700" :style="'color:'+(c.expired?'var(--danger)':c.days_left<=3?'var(--amber)':'var(--accent)')" x-text="c.expired?rt('expired'):c.days_left+' '+rt('days')"></div>
              </div>
            </div>
          </template>
          <div x-show="clients.length===0" class="empty-state" style="padding:20px"><p x-text="rt('no_clients')"></p></div>
        </div>
      </div>
      <div class="r-card">
        <div class="r-card-header"><span style="font-size:13px;font-weight:700">⚡ <span x-text="rt('quick_actions')"></span></span></div>
        <div class="r-card-body">
          <div class="qa-grid">
            <div class="qa-btn" @click="openCreateClient()"><i style="background:rgba(0,231,1,.12);color:var(--accent)" class="fas fa-plus"></i> <span x-text="rt('add_client')"></span></div>
            <div class="qa-btn" @click="tab='clients'"><i style="background:rgba(96,165,250,.12);color:var(--accent2)" class="fas fa-list"></i> <span x-text="rt('all_clients')"></span></div>
            <div class="qa-btn" @click="tab='revenue';loadRevenue()"><i style="background:rgba(34,211,238,.12);color:#22d3ee" class="fas fa-chart-bar"></i> <span x-text="rt('tab_revenue')"></span></div>
            <div class="qa-btn" @click="tab='payments';loadPaymentMethods()"><i style="background:rgba(168,85,247,.12);color:#a855f7" class="fas fa-credit-card"></i> <span x-text="rt('tab_payments')"></span></div>
            <div class="qa-btn" @click="tab='admins';loadAdmins()"><i style="background:rgba(251,191,36,.12);color:var(--amber)" class="fas fa-user-shield"></i> <span x-text="rt('tab_admins')"></span></div>
            <div class="qa-btn" @click="loadAll()"><i style="background:rgba(107,122,144,.12);color:var(--muted)" class="fas fa-refresh"></i> <span x-text="rt('refresh')"></span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ TAB: CLIENTS ═══ -->
  <div x-show="tab==='clients'" x-transition>
    <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <div class="search-box" style="flex:1;min-width:200px">
        <i class="fas fa-search s-icon"></i>
        <input x-model="search" :dir="rl==='ar'?'rtl':'ltr'" :placeholder="rt('search_placeholder')">
      </div>
      <select x-model="filterStatus" class="r-input" style="width:auto;min-width:110px">
        <option value="" x-text="rt('all')"></option><option value="active" x-text="rt('stat_active')"></option><option value="suspended" x-text="rt('suspended')"></option><option value="expired" x-text="rt('expired')"></option>
      </select>
    </div>
    <div class="client-grid">
      <template x-for="c in filteredClients" :key="c.id">
        <div class="client-card">
          <div class="cc-top">
            <div class="cc-avatar" :style="'background:'+(c.running?'rgba(0,231,1,.12)':c.expired?'rgba(255,71,87,.12)':'rgba(107,122,144,.12)')+';color:'+(c.running?'var(--accent)':c.expired?'var(--danger)':'var(--muted)')" x-text="c.name.charAt(0)"></div>
            <div style="flex:1;min-width:0"><div class="cc-name" x-text="c.name"></div><div class="cc-id" x-text="c.id"></div></div>
            <div class="cc-status">
              <span class="dot" :style="'background:'+(c.running?'var(--accent)':c.expired?'var(--danger)':c.status==='suspended'?'var(--amber)':'var(--muted)')"></span>
              <span :style="'color:'+(c.expired?'var(--danger)':c.status==='suspended'?'var(--amber)':'var(--accent)')" x-text="c.expired?rt('expired'):(c.status==='suspended'?rt('suspended'):rt('stat_active'))"></span>
            </div>
          </div>
          <div class="cc-info">
            <div class="cc-row"><span class="lbl" x-text="rt('bot')"></span><span class="val" style="color:var(--text)" x-text="'@'+(c.bot_username||'—')"></span></div>
            <div class="cc-row"><span class="lbl" x-text="rt('dashboard_login')"></span><span class="val" style="color:var(--accent2)" x-text="c.dash_username"></span></div>
            <div class="cc-row"><span class="lbl" x-text="rt('domain')"></span><span class="val" style="color:#a855f7;font-size:10px" x-text="c.custom_domain||'—'"></span></div>
            <div class="cc-row"><span class="lbl" x-text="rt('subscription')"></span><span class="val" :style="'color:'+(c.expired?'var(--danger)':c.days_left<=3?'var(--amber)':'var(--accent)')" x-text="c.expired?rt('expired'):c.days_left+' '+rt('days')"></span></div>
            <div class="cc-row"><span class="lbl" x-text="rt('balance')"></span><span class="val" style="color:var(--accent)" x-text="fmtMoney(c.balance)+' EGP'"></span></div>
            <div class="cc-row"><span class="lbl" x-text="rt('revenue_share')"></span><span class="val"><span style="color:var(--accent)" x-text="c.revenue_share+'%'"></span> / <span style="color:var(--accent2)" x-text="(100-c.revenue_share)+'%'"></span></span></div>
          </div>
          <div class="cc-features">
            <template x-for="f in (c.features||[]).slice(0,4)" :key="f"><span class="cc-feat" x-text="features[f]||f"></span></template>
            <span x-show="(c.features||[]).length>4" class="cc-feat more" x-text="'+'+((c.features||[]).length-4)"></span>
          </div>

  <!-- Add Admin Modal -->

    <div class="modal-box" style="max-width:420px">
      <div class="modal-handle"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px"><h3 style="font-size:16px;font-weight:900" x-text="rt('add_admin')"></h3><button @click="showAddAdmin=false" style="color:var(--muted);font-size:18px">✕</button></div>
      <div style="display:grid;gap:12px">
        <div><label class="r-label">Telegram ID *</label><input x-model="addAdminForm.telegram_id" dir="ltr" class="r-input"></div>
        <div><label class="r-label" x-text="rt('name')"></label><input x-model="addAdminForm.name" class="r-input"></div>
        <div><label class="r-label" x-text="rt('role')"></label>
          <select x-model="addAdminForm.role" class="r-input"><option value="support_admin" x-text="rt('role_support')"></option><option value="finance_admin" x-text="rt('role_finance')"></option><option value="game_admin" x-text="rt('role_games')"></option><option value="broadcast_admin" x-text="rt('role_broadcast')"></option><option value="super_admin">Super Admin</option></select>
        </div>
        <div><label class="r-label" x-text="rt('assign_client')"></label><select x-model="addAdminForm.tenant_id" class="r-input"><option value="" x-text="'— '+rt('none')+' —'"></option><template x-for="c in clients" :key="c.id"><option :value="c.id" x-text="c.name"></option></template></select></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:18px"><button @click="showAddAdmin=false" class="r-btn ghost" style="flex:1" x-text="rt('cancel')"></button><button @click="saveAdmin()" class="r-btn primary" style="flex:1" x-text="rt('add')"></button></div>
    </div>
  </div>

  <!-- Tenant Assign Modal -->
  <div x-show="showTenantModal" x-cloak class="modal-overlay" @click.self="showTenantModal=false" style="display:none">
    <div class="modal-box" style="max-width:360px">
      <div class="modal-handle"></div>
      <h3 style="font-size:16px;font-weight:900;margin-bottom:14px" x-text="rt('assign_client')"></h3>
      <select x-model="tenantForm.tenant_id" class="r-input" style="margin-bottom:14px"><option value="" x-text="'— '+rt('none')+' —'"></option><template x-for="c in clients" :key="c.id"><option :value="c.id" x-text="c.name"></option></template></select>
      <div style="display:flex;gap:10px"><button @click="showTenantModal=false" class="r-btn ghost" style="flex:1" x-text="rt('cancel')"></button><button @click="saveTenantAssign()" class="r-btn primary" style="flex:1" x-text="rt('save')"></button></div>
    </div>
  </div>

  <!-- Add Payment Method Modal -->
  <div x-show="showAddPM" x-cloak class="modal-overlay" @click.self="showAddPM=false" style="display:none">
    <div class="modal-box" style="max-width:420px">
      <div class="modal-handle"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px"><h3 style="font-size:16px;font-weight:900">💳 <span x-text="rt('new_payment_method')"></span></h3><button @click="showAddPM=false" style="color:var(--muted);font-size:18px">✕</button></div>
      <div style="display:grid;gap:12px">
        <div><label class="r-label" x-text="rt('pm_name')+' *'"></label><input x-model="pmForm.name" class="r-input"></div>
        <div><label class="r-label" x-text="rt('type')+' *'"></label>
          <select x-model="pmForm.pm_type" class="r-input"><option value="bank_transfer" x-text="'🏦 '+rt('bank_transfer')"></option><option value="vodafone_cash" x-text="'📱 '+rt('vodafone_cash')"></option><option value="usdt">💵 USDT</option><option value="instapay">⚡ InstaPay</option></select>
        </div>
        <div><label class="r-label" x-text="rt('account_number')+' *'"></label><input x-model="pmForm.account_number" dir="ltr" class="r-input" style="font-family:monospace"></div>
        <div><label class="r-label" x-text="rt('bank')"></label><input x-model="pmForm.bank_name" class="r-input"></div>
        <div><label class="r-label" x-text="rt('holder')"></label><input x-model="pmForm.holder_name" class="r-input"></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:18px"><button @click="showAddPM=false" class="r-btn ghost" style="flex:1" x-text="rt('cancel')"></button><button @click="savePM()" class="r-btn primary" style="flex:1"><i class="fas fa-save"></i> <span x-text="rt('save')"></span></button></div>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div x-show="showDelete" x-cloak class="modal-overlay" @click.self="showDelete=false" style="display:none">
    <div class="modal-box" style="max-width:340px;text-align:center">
      <div class="modal-handle"></div>
      <div style="font-size:36px;margin-bottom:8px">🗑️</div>
      <h3 style="font-size:16px;font-weight:900;margin-bottom:4px" x-text="rt('delete')+' '+deleteType+'?'"></h3>
      <p style="font-size:12px;color:var(--muted);margin-bottom:18px" x-text="rt('confirm_delete')+' '+deleteTarget?.name+'?'"></p>
      <div style="display:flex;gap:10px"><button @click="showDelete=false" class="r-btn ghost" style="flex:1" x-text="rt('cancel')"></button><button @click="doDelete()" class="r-btn danger" style="flex:1" x-text="rt('delete')"></button></div>
    </div>
  </div>

  <!-- BOTTOM TABS (Mobile) -->
  <div class="bottom-tabs">
    <div class="bottom-tabs-inner">
      <div class="bottom-tab" :class="tab==='dashboard'&&'active'" @click="tab='dashboard';loadAll()"><div class="b-icon"><i class="fas fa-chart-pie"></i></div><span x-text="rt('btab_dash')"></span></div>
      <div class="bottom-tab" :class="tab==='clients'&&'active'" @click="tab='clients'"><div class="b-icon"><i class="fas fa-users"></i></div><span x-text="rt('btab_clients')"></span></div>
      <div class="bottom-tab" :class="tab==='payments'&&'active'" @click="tab='payments';loadPaymentMethods()"><div class="b-icon"><i class="fas fa-credit-card"></i></div><span x-text="rt('btab_pay')"></span></div>
      <div class="bottom-tab" :class="tab==='transactions'&&'active'" @click="tab='transactions';loadAllTransactions()"><div class="b-icon"><i class="fas fa-exchange-alt"></i></div><span x-text="rt('btab_tx')"></span><span x-show="pendingCount>0" class="b-badge" x-text="pendingCount"></span></div>
      <div class="bottom-tab" :class="tab==='revenue'&&'active'" @click="tab='revenue';loadRevenue()"><div class="b-icon"><i class="fas fa-coins"></i></div><span x-text="rt('btab_rev')"></span></div>
      <div class="bottom-tab" :class="(tab==='admins'||tab==='domains')&&'active'" @click="tab='admins';loadAdmins()"><div class="b-icon"><i class="fas fa-cog"></i></div><span x-text="rt('btab_settings')"></span></div>
    </div>
  </div>

</div>

<script>
function rentalSystem(){
  const I18N = {
    ar: {
      title:'نظام التاجير',new_client:'عميل جديد',tab_dashboard:'لوحة التحكم',tab_clients:'العملاء',tab_payments:'وسائل الدفع',tab_transactions:'المعاملات',tab_revenue:'الأرباح',tab_admins:'المسؤولين',tab_domains:'الدومينات',
      stat_total:'إجمالي',stat_active:'نشط',stat_expired:'منتهي',stat_expiring:'ينتهي قريباً',stat_running:'بوت شغال',stat_revenue:'أرباح',
      recent_clients:'آخر العملاء',quick_actions:'إجراءات سريعة',add_client:'إضافة عميل',all_clients:'كل العملاء',refresh:'تحديث',no_clients:'لا يوجد عملاء بعد',no_matching:'لا يوجد عملاء مطابقين',
      search_placeholder:'بحث بالاسم أو المعرف...',all:'الكل',suspended:'موقوف',expired:'منتهي',days:'يوم',
      start:'تشغيل',stop:'إيقاف',edit:'تعديل',renew:'تجديد',delete:'حذف',save:'حفظ',cancel:'إلغاء',create:'إنشاء',add:'إضافة',close:'إغلاق',
      bot:'البوت',dashboard_login:'لوحة التحكم',domain:'الدومين',subscription:'الاشتراك',balance:'الرصيد',revenue_share:'نسبة الربح',
      client_name:'اسم العميل',contact:'التواصل',bot_username:'يوزر البوت',bot_token:'توكن البوت',dash_user:'يوزر اللوحة',dash_pass:'باسورد اللوحة',new_password:'باسورد جديد',admin_ids:'أدمن تيليجرام',sub_duration:'مدة الاشتراك',preferred_pm:'وسيلة الدفع المفضلة',pm_change_hint:'العميل يقدر يغيرها من لوحته',features:'المميزات',notes:'ملاحظات',select_all:'تحديد الكل',deselect_all:'إلغاء الكل',
      client:'العميل',profit:'الربح',you:'أنت',none:'بدون',
      pending:'معلق',approved:'مقبول',rejected:'مرفوض',deposit:'إيداع',withdraw:'سحب',pending_requests:'طلبات معلقة',review_action:'راجعها واتخذ القرار',no_transactions:'لا توجد معاملات',
      total_profit:'إجمالي الربح',my_share:'نصيبي',client_share:'نصيب العملاء',rounds:'الجولات',
      admins:'المسؤولون',name:'الاسم',role:'الدور',sections:'الأقسام',actions:'إجراءات',role_support:'الدعم',role_finance:'المالية',role_games:'الألعاب',role_broadcast:'البث',assign_client:'ربط بعميل',add_admin:'إضافة مسؤول',
      generate_nginx:'توليد nginx',no_domains:'لا توجد دومينات',disabled:'معطل',
      bank_transfer:'تحويل بنكي',vodafone_cash:'فودافون كاش',account_number:'رقم الحساب',bank:'البنك',holder:'المالك',copy:'نسخ',no_payment_methods:'لا توجد وسائل دفع',new_payment_method:'وسيلة دفع جديدة',pm_name:'اسم الوسيلة',type:'النوع',
      id:'المعرف',expires:'ينتهي',confirm_delete:'هل أنت متأكد من حذف',btab_dash:'لوحة',btab_clients:'عملاء',btab_pay:'دفع',btab_tx:'معاملات',btab_rev:'أرباح',btab_settings:'إعدادات',
    },
    en: {
      title:'Rental System',new_client:'New Client',tab_dashboard:'Dashboard',tab_clients:'Clients',tab_payments:'Payment Methods',tab_transactions:'Transactions',tab_revenue:'Revenue',tab_admins:'Admins',tab_domains:'Domains',
      stat_total:'Total',stat_active:'Active',stat_expired:'Expired',stat_expiring:'Expiring Soon',stat_running:'Bot Running',stat_revenue:'Revenue',
      recent_clients:'Recent Clients',quick_actions:'Quick Actions',add_client:'Add Client',all_clients:'All Clients',refresh:'Refresh',no_clients:'No clients yet',no_matching:'No matching clients',
      search_placeholder:'Search by name or ID...',all:'All',suspended:'Suspended',expired:'Expired',days:'days',
      start:'Start',stop:'Stop',edit:'Edit',renew:'Renew',delete:'Delete',save:'Save',cancel:'Cancel',create:'Create',add:'Add',close:'Close',
      bot:'Bot',dashboard_login:'Dashboard',domain:'Domain',subscription:'Subscription',balance:'Balance',revenue_share:'Revenue Share',
      client_name:'Client Name',contact:'Contact',bot_username:'Bot Username',bot_token:'Bot Token',dash_user:'Dashboard User',dash_pass:'Dashboard Pass',new_password:'New Password',admin_ids:'Admin Telegram',sub_duration:'Duration',preferred_pm:'Preferred Payment',pm_change_hint:'Client can change it from their panel',features:'Features',notes:'Notes',select_all:'Select All',deselect_all:'Deselect All',
      client:'Client',profit:'Profit',you:'You',none:'None',
      pending:'Pending',approved:'Approved',rejected:'Rejected',deposit:'Deposit',withdraw:'Withdraw',pending_requests:'pending requests',review_action:'Review and take action',no_transactions:'No transactions',
      total_profit:'Total Profit',my_share:'My Share',client_share:'Client Share',rounds:'Rounds',
      admins:'Admins',name:'Name',role:'Role',sections:'Sections',actions:'Actions',role_support:'Support',role_finance:'Finance',role_games:'Games',role_broadcast:'Broadcast',assign_client:'Assign to Client',add_admin:'Add Admin',
      generate_nginx:'Generate Nginx',no_domains:'No domains',disabled:'Disabled',
      bank_transfer:'Bank Transfer',vodafone_cash:'Vodafone Cash',account_number:'Account Number',bank:'Bank',holder:'Holder',copy:'Copy',no_payment_methods:'No payment methods',new_payment_method:'New Payment Method',pm_name:'Method Name',type:'Type',
      id:'ID',expires:'Expires',confirm_delete:'Are you sure you want to delete',btab_dash:'Home',btab_clients:'Clients',btab_pay:'Pay',btab_tx:'Tx',btab_rev:'Revenue',btab_settings:'Settings',
    }
  };
  const ALL_SECTIONS = [
    {key:'transactions',label:'المعاملات',en:'Transactions'},{key:'matching',label:'المطابقة',en:'Matching'},{key:'agents',label:'الوكلاء',en:'Agents'},{key:'trading',label:'التداول',en:'Trading'},
    {key:'users',label:'المستخدمين',en:'Users'},{key:'svrp',label:'التعويض',en:'Compensation'},{key:'lottery',label:'اليانصيب',en:'Lottery'},{key:'wheel',label:'العجلة',en:'Wheel'},
    {key:'companies',label:'الشركات',en:'Companies'},{key:'payment_methods',label:'طرق الدفع',en:'Payments'},{key:'apps',label:'التطبيقات',en:'Apps'},{key:'referrals',label:'الإحالات',en:'Referrals'},
    {key:'channels',label:'القنوات',en:'Channels'},{key:'broadcast',label:'البث',en:'Broadcast'},{key:'complaints',label:'الشكاوى',en:'Complaints'},{key:'tickets',label:'التذاكر',en:'Tickets'},
    {key:'bots',label:'البوتات',en:'Bots'},{key:'browser',label:'المتصفح',en:'Browser'},{key:'clients',label:'العملاء',en:'Clients'},{key:'statistics',label:'الإحصائيات',en:'Statistics'},
    {key:'admins',label:'المسؤولين',en:'Admins'},{key:'settings',label:'الإعدادات',en:'Settings'},{key:'backup',label:'النسخ الاحتياطي',en:'Backup'},{key:'themes',label:'الثيمات',en:'Themes'},
  ];
  return {
    rl: localStorage.getItem('rental_lang') || 'ar',
    tab:'dashboard',search:'',filterStatus:'',saving:false,
    clients:[],features:{},admins:[],domains:[],nginxConfigs:[],
    auditLogs:[],toastMsg:'',
    revenueStats:{total_game_profit:0,admin_share:0,client_share:0,total_rounds:0},
    revenueByClient:[],
    stats:{total:0,active:0,expired:0,expiringSoon:0,running:0},
    showClientModal:false,showRenew:false,showAddAdmin:false,showDelete:false,showTenantModal:false,showAddPM:false,
    clientForm:{},renewTarget:null,deleteTarget:null,deleteType:'',
    addAdminForm:{telegram_id:'',name:'',role:'support_admin',tenant_id:''},
    tenantTarget:null,tenantForm:{tenant_id:''},
    paymentMethods:[],allTransactions:[],pendingCount:0,
    pmForm:{name:'',pm_type:'bank_transfer',account_number:'',bank_name:'',holder_name:''},
    txFilter:'',txTypeFilter:'',
    sectionAdmin:null,sectionForm:[],
    allSectionsList:ALL_SECTIONS,
    domainForm:{client_id:'',domain:''},
    rt(key){ return (I18N[this.rl]||I18N.ar)[key]||key },
    get filteredClients(){
      return this.clients.filter(c=>{
        if(this.filterStatus==='expired'&&!c.expired)return false;
        if(this.filterStatus==='active'&&(c.expired||c.status==='suspended'))return false;
        if(this.filterStatus==='suspended'&&c.status!=='suspended')return false;
        if(this.search){const s=this.search.toLowerCase();return c.name.toLowerCase().includes(s)||c.id.toLowerCase().includes(s)||(c.bot_username||'').toLowerCase().includes(s)}
        return true;
      });
    },
    async init(){
      this.$watch('rl',v=>localStorage.setItem('rental_lang',v));
      await this.loadAll();await this.loadPendingCount();this.loadPaymentMethods();
    },
    async loadAll(){await Promise.all([this.loadClients(),this.loadRevenue()])},
    async loadPendingCount(){try{const d=await api('/api/rental/pending-count');this.pendingCount=d.count||0}catch(e){}setInterval(()=>{this.loadPendingCount()},30000)},
    async loadClients(){try{const d=await api('/api/clients');this.clients=d.clients||[];this.features=d.features||{};this.stats={total:this.clients.length,active:this.clients.filter(c=>!c.expired&&c.status!=='suspended').length,expired:this.clients.filter(c=>c.expired).length,expiringSoon:this.clients.filter(c=>!c.expired&&c.days_left<=3).length,running:this.clients.filter(c=>c.running).length}}catch(e){}},
    async loadRevenue(){try{const d=await api('/api/admin-center/revenue');this.revenueStats=d.stats||{};this.revenueByClient=d.by_client||[]}catch(e){}},
    async loadDomains(){try{const d=await api('/api/admin-center/domains');this.domains=d.domains||[]}catch(e){}},
    async loadAdmins(){try{const d=await api('/api/admin-center/admins');this.admins=d.admins||[]}catch(e){}},
    openCreateClient(){this.clientForm={name:'',contact:'',bot_username:'',bot_token:'',dash_username:'',dash_password:'',admin_ids:'',subscription_days:30,revenue_share:30,features:Object.keys(this.features),notes:'',preferred_pm:''};this.showClientModal=true},
    openEditClient(c){this.clientForm={...c,features:[...(c.features||[])]};this.showClientModal=true},
    openRenew(c){this.renewTarget=c;this.showRenew=true},
    async saveClient(){
      this.saving=true;
      try{
        if(this.clientForm.id){await api('/api/clients/'+this.clientForm.id,{method:'POST',body:JSON.stringify(this.clientForm)});toast(this.rt('save'),'success')}
        else{await api('/api/clients',{method:'POST',body:JSON.stringify(this.clientForm)});toast(this.rt('create'),'success')}
        this.showClientModal=false;await this.loadClients();
      }catch(e){toast(e.message||'Error','error')}
      this.saving=false;
    },
    async doRenew(d){try{await api('/api/clients/'+this.renewTarget.id+'/renew',{method:'POST',body:JSON.stringify({days:d})});toast(this.rt('renew'),'success');this.showRenew=false;await this.loadClients()}catch(e){toasrt('Error','error')}},
    async control(c,action){try{await api('/api/clients/'+c.id+'/'+action,{method:'POST'});await this.loadClients();toast(action,'success')}catch(e){toasrt('Error','error')}},
    confirmDelete(c){this.deleteTarget=c;this.deleteType=this.rl==='ar'?'عميل':'client';this.showDelete=true},
    confirmDeleteAdmin(a){this.deleteTarget=a;this.deleteType=this.rl==='ar'?'مسؤول':'admin';this.showDelete=true},
    async doDelete(){
      try{
        if(this.deleteType==='عميل'||this.deleteType==='client'){await api('/api/clients/'+this.deleteTarget.id,{method:'DELETE'})}
        else{await api('/api/admin-center/admins/'+this.deleteTarget.telegram_id,{method:'DELETE'})}
        toast(this.rt('delete'),'success');this.showDelete=false;(this.deleteType==='عميل'||this.deleteType==='client')?await this.loadClients():await this.loadAdmins();
      }catch(e){toasrt('Error','error')}
    },
    async saveDomain(){try{await api('/api/admin-center/domains',{method:'POST',body:JSON.stringify(this.domainForm)});toast(this.rt('save'),'success');this.domainForm={client_id:'',domain:''};await this.loadDomains()}catch(e){toasrt('Error','error')}},
    async removeDomain(cid){if(!confirm(this.rt('delete')+'?'))return;await api('/api/admin-center/domains/'+cid,{method:'DELETE'});await this.loadDomains()},
    async generateNginx(){const d=await api('/api/admin-center/domains/generate-nginx');this.nginxConfigs=d.configs||[];toast(this.rt('save'),'success')},
    async updateRevenueShare(cid,val){await api('/api/admin-center/revenue-share/'+cid,{method:'POST',body:JSON.stringify({revenue_share:parseInt(val)})});toast(this.rt('save'),'success')},
    async saveAdmin(){await api('/api/admin-center/admins',{method:'POST',body:JSON.stringify(this.addAdminForm)});toast(this.rt('add'),'success');this.showAddAdmin=false;await this.loadAdmins()},
    async saveTenantAssign(){await api('/api/admin-center/admins/'+this.tenantTarget.telegram_id+'/tenant',{method:'POST',body:JSON.stringify(this.tenantForm)});toast(this.rt('save'),'success');this.showTenantModal=false;await this.loadAdmins()},
    openTenantAssign(a){this.tenantTarget=a;this.tenantForm={tenant_id:a.tenant_id||''};this.showTenantModal=true},
    openSections(a){this.sectionAdmin=a.telegram_id;this.sectionForm=a.sections||[]},
    selectAllSections(){this.sectionForm=this.allSectionsList.map(s=>s.key)},
    async saveSections(){await api('/api/admin-center/admins/'+this.sectionAdmin+'/sections',{method:'POST',body:JSON.stringify({sections:this.sectionForm})});toast(this.rt('save'),'success');await this.loadAdmins();this.sectionAdmin=null},
    async loadPaymentMethods(){try{const d=await api('/api/rental/payment-methods');this.paymentMethods=d.methods||[]}catch(e){}},
    async savePM(){if(!this.pmForm.name||!this.pmForm.account_number){toast(this.rt('account_number')+' required','error');return}await api('/api/rental/payment-methods',{method:'POST',body:JSON.stringify(this.pmForm)});toast(this.rt('add'),'success');this.showAddPM=false;await this.loadPaymentMethods()},
    async togglePMStatus(pm){await api('/api/rental/payment-methods/'+pm.id,{method:'PUT',body:JSON.stringify({status:pm.status==='active'?'inactive':'active'})});await this.loadPaymentMethods()},
    async deletePM(pm){if(!confirm(this.rt('delete')+' "'+pm.name+'"'))return;await api('/api/rental/payment-methods/'+pm.id,{method:'DELETE'});await this.loadPaymentMethods()},
    async loadAllTransactions(){try{let url='/api/rental/all-transactions';const p=[];if(this.txFilter)p.push('status='+this.txFilter);if(this.txTypeFilter)p.push('type='+this.txTypeFilter);if(p.length)url+='?'+p.join('&');const d=await api(url);this.allTransactions=d.transactions||[]}catch(e){}},
    async processTx(tx,action){if(!confirm((action==='approved'?this.rt('approved'):this.rt('rejected'))+'?'))return;await api('/api/rental/transactions/'+tx.client_id+'/'+tx.id,{method:'POST',body:JSON.stringify({action})});toast(this.rt('save'),'success');await this.loadAllTransactions();await this.loadPendingCount()},
    copyText(t){navigator.clipboard.writeText(t).then(()=>toast(this.rt('copy'),'success')).catch(()=>{})},
    toast(msg){this.toastMsg=msg;setTimeout(()=>{this.toastMsg=''},2000)},
    getTenantName(tid){const c=this.clients.find(c=>c.id===tid);return c?c.name:tid},
    roleLabel(r){const m={ar:{super_admin:'Super Admin',finance_admin:'المالية',support_admin:'الدعم',game_admin:'الألعاب',broadcast_admin:'البث'},en:{super_admin:'Super Admin',finance_admin:'Finance',support_admin:'Support',game_admin:'Games',broadcast_admin:'Broadcast'}};return(m[this.rl]||m.ar)[r]||r},
    roleBadge(r){return{super_admin:'background:rgba(255,71,87,.12);color:var(--danger)',finance_admin:'background:rgba(251,191,36,.12);color:var(--amber)',support_admin:'background:rgba(0,231,1,.12);color:var(--accent)',game_admin:'background:rgba(168,85,247,.12);color:#a855f7',broadcast_admin:'background:rgba(34,211,238,.12);color:#22d3ee'}[r]||'background:rgba(107,122,144,.12);color:var(--muted)'},
    fmtNum(n){return(n||0).toLocaleString()},
    fmtMoney(n){return(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})},
  };
}
</script>
{% endblock %}
