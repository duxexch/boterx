<style>
body{overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh}
.game-area{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:10px;align-items:center}
/* Draw type tabs */
.draw-tabs{display:flex;gap:4px;width:100%;max-width:380px}
.draw-tab{flex:1;padding:8px 4px;border-radius:10px;background:var(--surface-2);border:2px solid var(--border);cursor:pointer;text-align:center;transition:all .15s}
.draw-tab:active{transform:scale(.95)}
.draw-tab.active{border-color:var(--gold);background:rgba(255,215,0,.1)}
.draw-tab-icon{font-size:20px}
.draw-tab-name{font-size:10px;font-weight:700;color:var(--text);margin-top:2px}
.draw-tab-time{font-size:9px;color:var(--muted);margin-top:1px}
/* Timer */
.lottery-timer{text-align:center;padding:8px 16px;background:var(--surface);border-radius:12px;border:1px solid var(--border);width:100%;max-width:380px}
.timer-label{font-size:10px;color:var(--muted);margin-bottom:2px}
.timer-val{font-size:28px;font-weight:900;font-family:'Courier New',monospace;color:var(--gold)}
/* Stats */
.lottery-info{display:flex;gap:6px;justify-content:center;width:100%;max-width:380px;flex-wrap:wrap}
.linfo{flex:1;min-width:70px;text-align:center;background:var(--surface);padding:6px 4px;border-radius:8px;border:1px solid var(--border)}
.linfo-val{font-size:14px;font-weight:900;color:var(--text);font-family:'Courier New',monospace}
.linfo-val.gold{color:var(--gold)}
.linfo-label{font-size:8px;color:var(--muted);margin-top:1px}
/* Prize tiers */
.prize-tiers{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;width:100%;max-width:380px}
.pt-title{font-size:11px;color:var(--gold);margin-bottom:4px;font-weight:700}
.pt-row{display:flex;align-items:center;gap:6px;padding:3px 0}
.pt-badge{font-size:9px;font-weight:900;padding:2px 6px;border-radius:8px;font-family:'Courier New',monospace;min-width:28px;text-align:center}
.pt-badge.jackpot{background:rgba(255,215,0,.25);color:var(--gold)}
.pt-badge.secondary{background:rgba(59,130,246,.2);color:#93c5fd}
.pt-badge.small{background:rgba(148,163,184,.15);color:var(--muted)}
.pt-label{flex:1;font-size:11px;color:var(--text)}
.pt-amount{font-size:12px;font-weight:900;font-family:'Courier New',monospace;color:var(--gold)}
/* Tickets */
.tickets-title{font-size:12px;color:var(--text-dim);width:100%;max-width:380px;margin-top:4px}
.ticket-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;width:100%;max-width:380px}
.ticket-card{background:linear-gradient(135deg,var(--surface-2),var(--surface-3));border:1px solid var(--border);border-radius:10px;padding:8px;position:relative;overflow:hidden}
.ticket-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ticket-id{font-size:9px;color:var(--muted);font-family:'Courier New',monospace}
.ticket-status{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px}
.ticket-status.pending{background:rgba(255,215,0,.2);color:var(--gold)}
.ticket-status.win{background:rgba(0,231,1,.2);color:var(--green)}
.ticket-status.lose{background:rgba(255,71,87,.15);color:var(--red)}
.ticket-nums{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin:4px 0}
.tic-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;font-family:'Courier New',monospace;border:1px solid var(--border);background:rgba(148,163,184,.15)}
.tic-num.match{background:rgba(0,231,1,.15);border-color:var(--green);color:var(--green)}
.ticket-prize{text-align:center;font-size:13px;font-weight:900;font-family:'Courier New',monospace;margin-top:2px}
.ticket-prize.win{color:var(--green)}
.ticket-prize.lose{color:var(--muted)}
/* Buy section */
.buy-section{width:100%;max-width:380px;display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.count-row{display:flex;align-items:center;gap:8px;justify-content:center}
.count-btn{width:36px;height:36px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:20px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center}
.count-btn:active{transform:scale(.88)}
.count-val{font-size:24px;font-weight:900;font-family:'Courier New',monospace;color:var(--gold);min-width:40px;text-align:center}
.total-box{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(0,231,1,.08);border-radius:8px;border:1px solid rgba(0,231,1,.2)}
.total-label{font-size:12px;font-weight:700;color:var(--text)}
.total-val{font-size:18px;font-weight:900;color:var(--gold);font-family:'Courier New',monospace}
.buy-btn{width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:900;border:none;cursor:pointer;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;transition:all .15s}
.buy-btn:active{transform:scale(.97)}
.buy-btn:disabled{opacity:.4;cursor:not-allowed}
.buy-btn-deposit{width:100%;padding:12px;border-radius:12px;font-size:14px;font-weight:700;border:1px solid var(--border);cursor:pointer;background:var(--surface-2);color:var(--text)}
.buy-btn-deposit:active{transform:scale(.97)}
.no-tickets{text-align:center;padding:20px;color:var(--muted);font-size:12px;width:100%;max-width:380px}
</style>

    </div>
    <div class="topbar-right">
      <button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊</button>

  <div class="game-area">
    <!-- Draw type tabs -->

    <!-- Timer -->

    <!-- Stats -->

    <!-- Prize tiers -->
    <div class="prize-tiers" id="prizeTiers" style="display:none">

      <div class="pt-row"><span class="pt-badge jackpot">5/5</span><span class="pt-label" data-i18n="x092">جائزة كبرى</span><span class="pt-amount gold" id="tierJackpot">—</span></div>
      <div class="pt-row"><span class="pt-badge secondary">4/5</span><span class="pt-label" data-i18n="x090">جائزة ثانية</span><span class="pt-amount" id="tierSecondary">—</span></div>
      <div class="pt-row"><span class="pt-badge small">3/5</span><span class="pt-label" data-i18n="x091">جائزة صغيرة</span><span class="pt-amount" id="tierSmall">—</span></div>

    <!-- My tickets -->
    <div class="tickets-title" id="ticketsTitle" data-i18n="x218">🎟️ تذاكري</div>
    <div class="ticket-grid" id="ticketArea"></div>
    <div class="no-tickets" id="noTickets" data-i18n="x153">لا توجد تذاكر بعد — اشترِ تذكرة بالأسفل</div>

    <!-- Buy section -->
    <div class="buy-section">
      <div class="count-row">
        <button class="count-btn" onclick="changeCount(-1)">−</button>
        <div class="count-val" id="countVal">1</div>
        <button class="count-btn" onclick="changeCount(1)">+</button>
      </div>
      <div class="total-box">
        <div class="total-label" data-i18n="x010">إجمالي المطلوب</div>
        <div class="total-val" id="totalCost">50</div>
      </div>
      <button class="buy-btn" id="buyBtn" onclick="buyTickets()" data-i18n="x219">🎟️ شراء بالرصيد</button>

</div>

  <div style="color:var(--text-dim);font-size:14px" data-i18n="x096">جارٍ التحميل...</div>

<script src="/static/js/game-base.js?v=20260819b"></script>
<script>
'use strict';
pfGameName='lottery';
var ticketCount = 1;
var myTicketsList = [];
var timerInterval = null;
var ticketPrice = 50;
var selectedDrawType = 'hourly';
var drawTypesData = {};

function initDrawTabs() {
  var c = document.getElementById('drawTabs');
  c.innerHTML = '';
  var types = [
    {key:'hourly', icon:'⏰', name:I18N.t('z044')},
    {key:'daily', icon:'📅', name:I18N.t('y112')},
    {key:'weekly', icon:'🏆', name:I18N.t('y011')},
  ];
  types.forEach(function(t) {
    var d = document.createElement('div');
    d.className = 'draw-tab' + (t.key === selectedDrawType ? ' active' : '');
    d.dataset.type = t.key;
    d.innerHTML = '<div class="draw-tab-icon">'+t.icon+'</div><div class="draw-tab-name">'+t.name+'</div><div class="draw-tab-time" id="tabTime_'+t.key+'">—</div>';
    d.onclick = function() { selectDrawType(this.dataset.type); };
    c.appendChild(d);
  });
}

function selectDrawType(type) {
  selectedDrawType = type;
  document.querySelectorAll('.draw-tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.type === type);
  });
  loadState();
}

function changeCount(delta) {
  ticketCount = Math.max(1, Math.min(10, ticketCount + delta));
  document.getElementById('countVal').textContent = ticketCount;
  document.getElementById('totalCost').textContent = (ticketPrice * ticketCount).toLocaleString();
}

function fmtAmount(n) { return parseFloat(n || 0).toLocaleString(); }

function loadState() {
  apiFetch(BASE + '/api/lottery/state').then(function(r) {
    if (r.status === 401 || r.status === 403) { if (window._stopLotteryPolls) window._stopLotteryPolls(); throw new Error('unauthorized'); }
    return r.json();
  }).then(function(d) {
    var ci = document.getElementById('connIndicator'); if (ci) ci.textContent = '🟢';

    if (d.draw_time) startTimer(d.draw_time);
    if (d.prize_pool !== undefined) document.getElementById('prizePool').textContent = fmtAmount(d.prize_pool);
    if (d.tickets_sold !== undefined) document.getElementById('ticketsSold').textContent = d.tickets_sold;
    if (d.participants_count !== undefined) document.getElementById('participantsCount').textContent = d.participants_count;
    if (d.tickets_available !== undefined) document.getElementById('ticketsAvail').textContent = d.tickets_available;
    if (d.ticket_price !== undefined) {
      ticketPrice = parseFloat(d.ticket_price) || 50;
      document.getElementById('totalCost').textContent = (ticketPrice * ticketCount).toLocaleString();
    }
    if (d.my_tickets) { myTicketsList = d.my_tickets; renderTickets(); }
    document.getElementById('myTickets').textContent = myTicketsList.length;
    if (d.prize_tiers) renderPrizeTiers(d.prize_tiers);

    // Update draw type tabs with stats
    if (d.draw_types) {
      drawTypesData = d.draw_types;
      Object.keys(d.draw_types).forEach(function(key) {
        var dt = d.draw_types[key];
        var el = document.getElementById('tabTime_' + key);
        if (el) el.textContent = dt.tickets_sold + I18N.t('y001');
      });
    }
  }).catch(function(e) { var ci = document.getElementById('connIndicator'); if (ci) ci.textContent = '🔴'; });
}

function renderPrizeTiers(tiers) {
  var el = document.getElementById('prizeTiers');
  el.style.display = 'block';
  document.getElementById('tierJackpot').textContent = tiers.jackpot && tiers.jackpot.pool > 0 ? fmtAmount(tiers.jackpot.pool) : '—';
  document.getElementById('tierSecondary').textContent = tiers.secondary && tiers.secondary.pool > 0 ? fmtAmount(tiers.secondary.pool) : '—';
  document.getElementById('tierSmall').textContent = tiers.small && tiers.small.pool > 0 ? fmtAmount(tiers.small.pool) : '—';
}

function startTimer(drawTime) {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(function() {
    var diff = Math.max(0, drawTime - Date.now() / 1000);
    var h = Math.floor(diff / 3600);
    var m = Math.floor((diff % 3600) / 60);
    var s = Math.floor(diff % 60);
    document.getElementById('timerVal').textContent = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    if (diff <= 0) { clearInterval(timerInterval); loadState(); }
  }, 1000);
}

function buyTickets() {
  var btn = document.getElementById('buyBtn');
  btn.disabled = true; btn.textContent = '⏳...';
  apiFetchCritical(BASE + '/api/lottery/buy', {
    method: 'POST',
    body: JSON.stringify({ count: ticketCount, draw_type: selectedDrawType })
  }).then(function(r) { return r.json(); }).then(function(d) {
    btn.disabled = false; btn.textContent = I18N.t('x219');
    if (d.need_deposit) { showToast(I18N.t('y071'), 'info'); return; }
    if (d.error) { showToast(d.error, 'error'); return; }
    if (d.success) {
      showToast(I18N.t('y043') + ticketCount + I18N.t('y002'), 'success');
      if (d.balance_after !== undefined) document.getElementById('bal').textContent = d.balance_after.toLocaleString();
      if (d.tickets) { myTicketsList = d.tickets.concat(myTicketsList); renderTickets(); }
      document.getElementById('myTickets').textContent = myTicketsList.length;
      loadBalance();
    }
  }).catch(function(e) {
    btn.disabled = false; btn.textContent = I18N.t('x219');
    showToast(I18N.t('x108'), 'error');
  });
}

function showBuyDepositModal() {
  var totalCost = ticketPrice * ticketCount;
  var overlay = document.createElement('div');
  overlay.id = 'modal'; overlay.className = 'modal-overlay'; overlay.style.display = 'flex';
  overlay.innerHTML = '<div class="modal-box" id="mb"></div>';
  document.body.appendChild(overlay);
  var mb = document.getElementById('mb');
  mb.innerHTML = '<div class="modal-title" data-i18n="x221">🎟️ شراء تذاكر بإيداع</div><div class="modal-subtitle" data-i18n="x100">جارٍ تحميل وسائل الدفع...</div>';
  apiFetch(BASE + '/api/games/payment-methods').then(function(r) { return r.json(); }).then(function(d) {
    var methods = d.methods || [];
    if (methods.length === 0) {
      mb.innerHTML = '<div class="modal-title" data-i18n="x220">🎟️ شراء تذاكر</div><div class="modal-subtitle">'+I18N.t('z045')+' ' + totalCost.toLocaleString() + '</div><div class="modal-subtitle" data-i18n="x278">🔐 رقم محفظتك:</div><input class="modal-input" id="lotW" type="text" placeholder="رقم محفظتك" data-i18n-ph="x124"><div class="modal-subtitle" data-i18n="x260">📋 اسم الوسيلة:</div><input class="modal-input" id="lotMN" type="text" placeholder="اسم الوسيلة" data-i18n-ph="x035"><div class="modal-subtitle" data-i18n="x261">📋 بيانات الحساب:</div><input class="modal-input" id="lotMD2" type="text" placeholder="بيانات الحساب" data-i18n-ph="x067"><button class="modal-btn-primary" onclick="lotSubManual(' + totalCost + ')" data-i18n="x206">✅ تأكيد طلب الشراء</button><button class="modal-btn-secondary" onclick="document.getElementById(\'modal\').remove()" data-i18n="x017">إغلاق</button>';
      return;
    }
    var mHtml = methods.map(function(m) {
      return '<div class="method-item" onclick="lotSel(\'' + m.id + '\',\'' + (m.method_name||'').replace(/'/g,"\\'") + '\',\'' + (m.account_data||'').replace(/'/g,"\\'") + '\')"><span class="method-icon">' + (m.icon||'💳') + '</span><div class="method-info"><div class="method-name">' + (m.method_name||'') + '</div><div class="method-type">' + (m.method_type||'') + '</div></div><span class="method-arrow">‹</span></div>';
    }).join('');
    mb.innerHTML = '<div class="modal-title" data-i18n="x221">🎟️ شراء تذاكر بإيداع</div><div class="modal-subtitle">'+I18N.t('z045')+' ' + totalCost.toLocaleString() + ' — '+I18N.t('z046')+'</div><div id="vm">' + mHtml + '</div><div id="vs2" style="display:none"><div class="modal-subtitle" style="margin-top:8px" data-i18n="x263">📋 بيانات الوسيلة:</div><div class="copy-box" onclick="lotCopy()"><code class="copy-data" id="lotMD"></code><span class="copy-label" id="lotCL" data-i18n="x266">📋 نسخ</span></div><div class="modal-subtitle" data-i18n="x278">🔐 رقم محفظتك:</div><input class="modal-input" id="lotW" type="text" placeholder="رقم محفظتك" data-i18n-ph="x124"><button class="modal-btn-primary" onclick="lotSub(' + totalCost + ')" data-i18n="x206">✅ تأكيد طلب الشراء</button><button class="modal-btn-secondary" onclick="document.getElementById(\'vm\').style.display=\'block\';document.getElementById(\'vs2\').style.display=\'none\'" data-i18n="x188">‹ رجوع</button></div><button class="modal-btn-secondary" onclick="document.getElementById(\'modal\').remove()" data-i18n="x017">إغلاق</button>';
  }).catch(function() {
    mb.innerHTML = '<div class="modal-title" data-i18n="x106">خطأ</div><button class="modal-btn-secondary" onclick="document.getElementById(\'modal\').remove()" data-i18n="x017">إغلاق</button>';
  });
}

var _lotSelId='', _lotSelName='', _lotSelData='';
function lotSel(id, name, data) {
  _lotSelId=id; _lotSelName=name; _lotSelData=data;
  document.getElementById('vm').style.display='none';
  document.getElementById('vs2').style.display='block';
  document.getElementById('lotMD').textContent = data;
}
function lotCopy() {
  navigator.clipboard.writeText(document.getElementById('lotMD').textContent);
  var lbl=document.getElementById('lotCL'); if(lbl){lbl.textContent='✓';setTimeout(function(){lbl.textContent=I18N.t('x266')},1500);}
}
function lotSub(amount) {
  var w = document.getElementById('lotW').value.trim();
  if (!w) { alert(I18N.t('x002')); return; }
  apiFetch(BASE + '/api/deposit/quick', {
    method: 'POST',
    body: JSON.stringify({ amount: amount, method_id: _lotSelId, method_name: _lotSelName, method_account_data: _lotSelData, player_wallet: w, save_method: false, purpose: 'lottery_tickets', ticket_count: ticketCount, draw_type: selectedDrawType })
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.success) {
      document.getElementById('mb').innerHTML = '<div style="text-align:center;padding:16px"><div style="font-size:28px">⏳</div><div class="modal-title" data-i18n="x087">تم طلب الشراء</div><div class="modal-subtitle" data-i18n="x066">بانتظار موافقة الإدارة — سيتم شراء التذاكر تلقائياً</div><button class="modal-btn-secondary" onclick="document.getElementById(\'modal\').remove();loadState();" data-i18n="x017">إغلاق</button></div>';
    } else { alert(d.error || I18N.t('x106')); }
  }).catch(function() { alert(I18N.t('x106')); });
}
function lotSubManual(amount) {
  var w = document.getElementById('lotW').value.trim();
  var mn = document.getElementById('lotMN') ? document.getElementById('lotMN').value.trim() : '';
  var md = document.getElementById('lotMD2') ? document.getElementById('lotMD2').value.trim() : '';
  if (!w) { alert(I18N.t('x002')); return; }
  if (!mn) { alert(I18N.t('y007')); return; }
  apiFetch(BASE + '/api/deposit/quick', {
    method: 'POST',
    body: JSON.stringify({ amount: amount, method_id: 'manual', method_name: mn, method_account_data: md, player_wallet: w, save_method: false, purpose: 'lottery_tickets', ticket_count: ticketCount, draw_type: selectedDrawType })
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.success) {
      document.getElementById('mb').innerHTML = '<div style="text-align:center;padding:16px"><div style="font-size:28px">⏳</div><div class="modal-title" data-i18n="x087">تم طلب الشراء</div><div class="modal-subtitle" data-i18n="x066">بانتظار موافقة الإدارة — سيتم شراء التذاكر تلقائياً</div><button class="modal-btn-secondary" onclick="document.getElementById(\'modal\').remove();loadState();" data-i18n="x017">إغلاق</button></div>';
    } else { alert(d.error || I18N.t('x106')); }
  }).catch(function() { alert(I18N.t('x106')); });
}

function renderTickets() {
  var area = document.getElementById('ticketArea');
  var noTickets = document.getElementById('noTickets');
  area.innerHTML = '';
  if (myTicketsList.length === 0) {
    noTickets.style.display = 'block';
    return;
  }
  noTickets.style.display = 'none';
  myTicketsList.forEach(function(t) {
    var div = document.createElement('div');
    div.className = 'ticket-card';
    var statusClass = t.status === 'win' ? 'win' : t.status === 'lose' ? 'lose' : 'pending';
    var statusText = t.status === 'win' ? I18N.t('y080') : t.status === 'lose' ? I18N.t('y059') : I18N.t('y031');
    var numsHtml = '';
    (t.numbers || []).forEach(function(n) {
      var cls = 'tic-num';
      if (t.drawn && t.drawn.indexOf(n) !== -1) cls += ' match';
      numsHtml += '<div class="' + cls + '">' + n + '</div>';
    });
    var matchInfo = (t.matches !== undefined) ? ' (' + t.matches + '/5)' : '';
    var prizeText = t.prize && t.prize > 0 ? '+' + fmtAmount(t.prize) : (t.status === 'lose' ? I18N.t('y089') : '🤞');
    div.innerHTML = '<div class="ticket-card-header"><span class="ticket-id">#' + (t.id || '?').substring(0,12) + '</span><span class="ticket-status ' + statusClass + '">' + statusText + matchInfo + '</span></div><div class="ticket-nums">' + numsHtml + '</div><div class="ticket-prize ' + statusClass + '">' + prizeText + '</div>';
    area.appendChild(div);
  });
}

// Init
document.getElementById('loading').style.display = 'none';
initDrawTabs();
loadBalance();
loadState();
var _statePoll = setInterval(loadState, 15000);
var _balPoll = setInterval(loadBalance, 10000);
window._stopLotteryPolls = function() { clearInterval(_statePoll); clearInterval(_balPoll); };
setTimeout(injectDepositButton, 100);
