<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>اليانصيب — VEX</title>
<link rel="stylesheet" href="/static/css/game-base.css">
<style>
.ticket-card{background:linear-gradient(135deg,var(--surface-2),var(--surface));border:2px solid var(--gold);border-radius:16px;padding:16px 24px;margin:12px 0;text-align:center;position:relative;overflow:hidden;width:100%;max-width:300px}
.ticket-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0,rgba(251,191,36,0.1),transparent)}
.ticket-num{font-size:38px;font-weight:900;color:var(--gold);letter-spacing:6px;font-family:'Courier New',monospace;margin:8px 0}
.ticket-label{font-size:11px;color:var(--muted)}
.prize-box{background:rgba(0,231,1,0.08);border:1px solid rgba(0,231,1,0.3);border-radius:var(--radius);padding:10px 20px;margin:8px 0;text-align:center}
.prize-label{font-size:10px;color:var(--green);text-transform:uppercase;letter-spacing:1px}
.prize-amount{font-size:22px;font-weight:900;color:var(--green);font-family:'Courier New',monospace}
</style>
</head>
<body>
<div class="loader-screen" id="loading"><div class="spinner"></div></div>
<div id="app" style="display:none">
  <div class="game-topbar">
    <div class="topbar-left"><button class="btn-back" onclick="goBack()">‹</button><div class="bal-pill"><span class="bal-icon">💰</span><span class="bal-val" id="bal">0</span><span class="bal-cur" id="cur">EGP</span></div></div>
    <div class="topbar-right"><span class="streak-badge" id="streak" style="display:none">🔥 0</span><button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊</button></div>
  </div>
  <div class="hist-bar" id="history"></div>
  <div class="game-area" id="gameArea" style="display:flex;flex-direction:column;align-items:center;padding:12px;overflow-y:auto">
    <div style="font-size:26px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--gold-dim));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px">🎟️ اليانصيب</div>
    <div class="prize-box"><div class="prize-label">جائزة الدور</div><div class="prize-amount" id="prizePool">50,000</div></div>
    <div class="ticket-card"><div class="ticket-label">رقم تذكرتك</div><div class="ticket-num" id="ticketNum">------</div><div class="ticket-label" id="ticketStatus">لم تشترِ بعد</div></div>
    <div class="result-msg" id="result" style="position:static;transform:none;margin:4px 0"></div>
  </div>
  <div class="bet-panel">
    <div class="bet-row"><div class="bet-input-wrap"><input type="number" class="bet-input" id="betInput" value="5" min="5" max="500"><span class="bet-cur" id="betCur">EGP</span></div></div>
    <div class="bet-controls"><div class="bet-ctrl" onclick="adjustBet(0.5)">½</div><div class="bet-ctrl" onclick="adjustBet(2)">2×</div><div class="bet-ctrl" onclick="setBet('min')">Min</div><div class="bet-ctrl" onclick="setBet('max')">Max</div></div>
    <div class="action-row"><button class="btn-action btn-bet-green" id="buyBtn" onclick="buyTicket()">🎟️ اشتري تذكرة</button></div>
  </div>
</div>
<div class="lp-bar"><div class="lp-header"><span>👥 <span class="lp-count" id="lpCount">0</span></span><span id="lpTotal">💰 0</span></div><div class="lp-list" id="lpList"></div></div>
<script src="/static/js/game-base.js"></script>
<script>
let buying=0,tickets=0;
function buyTicket(){
  if(buying)return;const bet=parseFloat(document.getElementById('betInput').value)||0;if(bet<5)return;
  buying=1;document.getElementById('buyBtn').disabled=1;
  apiFetch(`${BASE}/api/engine/result`,{method:'POST',body:JSON.stringify({uid,game_id:'GAME008',bet_amount:bet})}).then(r=>r.json()).then(d=>{
    if(!d.success){if(d.need_deposit)showVexDepositModal(bet);else showToast(d.error||'خطأ','error');buying=0;document.getElementById('buyBtn').disabled=0;return;}
    const num=Math.floor(100000+Math.random()*900000);document.getElementById('ticketNum').textContent=num;tickets++;
    document.getElementById('ticketStatus').textContent=`تذاكرك: ${tickets}`;
    document.getElementById('bal').textContent=(d.balance_after||0).toLocaleString();beep(440,0.08,'sine',0.1);haptic('light');
    const r=document.getElementById('result');r.classList.add('show');
    if(d.result==='win'){r.textContent=`🎉 ربحت ${d.payout.toFixed(0)}!`;r.style.color='var(--green)';soundWin(d.payout/bet>=10);haptic('medium');fireConfetti(document.getElementById('gameArea'));streakWin++;updateStreak(document.getElementById('streak'));}
    else{r.textContent='💔 حظ أوفر';r.style.color='var(--red)';soundLose();streakWin=0;updateStreak(document.getElementById('streak'));}
    addHistory('history',d.payout/bet,d.result==='win',d.payout/bet>=10);
    buying=0;document.getElementById('buyBtn').disabled=0;
  }).catch(()=>{buying=0;document.getElementById('buyBtn').disabled=0;showToast('خطأ','error');});
}
loadBalance();document.getElementById('loading').style.display='none';document.getElementById('app').style.display='flex';setInterval(loadBalance,5000);setInterval(simulatePlayers,2500);simulatePlayers();renderPlayers();
</script>
</body>
</html>
