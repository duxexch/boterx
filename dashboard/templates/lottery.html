<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>اليانصيب — VEX</title>
<link rel="stylesheet" href="/static/css/game-base.css">
<style>
.game-area{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px;overflow-y:auto}
.lottery-timer{text-align:center;padding:10px 20px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border)}
.timer-label{font-size:11px;color:var(--text-dim);margin-bottom:4px}
.timer-val{font-size:24px;font-weight:900;font-family:'Courier New',monospace;color:var(--gold)}
.lottery-info{display:flex;gap:8px;justify-content:center;width:100%;max-width:360px}
.linfo{flex:1;text-align:center;background:var(--surface);padding:8px;border-radius:var(--radius-sm);border:1px solid var(--border)}
.linfo-val{font-size:16px;font-weight:900;color:var(--text);font-family:'Courier New',monospace}
.linfo-val.gold{color:var(--gold)}
.linfo-label{font-size:9px;color:var(--text-dim);margin-top:2px}
.ticket-area{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%;max-width:360px}
.ticket{background:linear-gradient(135deg,var(--surface-2),var(--surface-3));border:1px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;position:relative;overflow:hidden;transition:all .2s var(--ease)}
.ticket:active{transform:scale(.97)}
.ticket.scratched{cursor:default}
.ticket-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ticket-id{font-size:10px;color:var(--text-dim);font-family:'Courier New',monospace}
.ticket-status{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}
.ticket-status.pending{background:rgba(251,191,36,.2);color:var(--gold)}
.ticket-status.win{background:rgba(0,231,1,.2);color:var(--green)}
.ticket-status.lose{background:rgba(255,71,87,.2);color:var(--red)}
.ticket-numbers{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.tic-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;font-family:'Courier New',monospace;border:1px solid var(--border-light)}
.tic-num.covered{background:rgba(148,163,184,.2)}
.tic-num.revealed{background:rgba(59,130,246,.2);border-color:#3b82f6;color:#93c5fd}
.tic-num.match{background:rgba(0,231,1,.2);border-color:var(--green);color:var(--green);animation:numMatch .4s var(--ease-spring)}
@keyframes numMatch{0%{transform:scale(1.5);opacity:0}100%{transform:scale(1);opacity:1}}
.ticket-prize{text-align:center;font-size:15px;font-weight:900;margin-top:6px;font-family:'Courier New',monospace}
.ticket-prize.win{color:var(--green)}
.ticket-prize.lose{color:var(--muted)}
.ticket-scratch-hint{text-align:center;font-size:11px;color:var(--text-dim);margin-top:4px}
.scratch-overlay{position:absolute;inset:0;background:linear-gradient(135deg,#374151,#1f2937);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .5s}
.scratch-icon{font-size:32px;opacity:.6}
/* Prize tiers */
.prize-tiers{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pt-title{font-size:11px;color:var(--text-dim);margin-bottom:2px;font-weight:700}
.pt-row{display:flex;align-items:center;gap:8px}
.pt-badge{font-size:10px;font-weight:900;padding:2px 7px;border-radius:10px;font-family:'Courier New',monospace;min-width:32px;text-align:center}
.pt-badge.jackpot{background:rgba(251,191,36,.25);color:var(--gold);border:1px solid rgba(251,191,36,.4)}
.pt-badge.secondary{background:rgba(59,130,246,.2);color:#93c5fd;border:1px solid rgba(59,130,246,.35)}
.pt-badge.small{background:rgba(148,163,184,.15);color:var(--text-dim);border:1px solid var(--border)}
.pt-label{flex:1;font-size:11px;color:var(--text)}
.pt-amount{font-size:12px;font-weight:900;font-family:'Courier New',monospace;color:var(--text)}
.pt-amount.gold{color:var(--gold)}
.pt-note{font-size:10px;color:var(--text-dim);margin-top:2px;text-align:center}
/* Ticket tier badges */
.ticket-tier{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:4px}
.ticket-tier.t1{background:rgba(251,191,36,.25);color:var(--gold)}
.ticket-tier.t2{background:rgba(59,130,246,.2);color:#93c5fd}
.ticket-tier.t3{background:rgba(148,163,184,.15);color:var(--text-dim)}
.buy-section{width:100%;max-width:360px;display:flex;flex-direction:column;gap:8px}
.count-row{display:flex;align-items:center;gap:8px;justify-content:center}
.count-btn{width:36px;height:36px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:20px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.count-btn:active{transform:scale(.88);background:var(--surface-3)}
.count-val{font-size:24px;font-weight:900;font-family:'Courier New',monospace;color:var(--gold);min-width:40px;text-align:center}
.ticket-price-info{text-align:center;font-size:12px;color:var(--text-dim)}
.buy-btn{width:100%;padding:14px;border-radius:var(--radius);font-size:16px;font-weight:900;border:none;cursor:pointer;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;transition:all .2s}
.buy-btn:active{transform:scale(.97)}
.buy-btn:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
.draw-history{width:100%;max-width:360px}
.draw-history-title{font-size:12px;color:var(--text-dim);margin-bottom:6px}
.draw-item{display:flex;justify-content:space-between;padding:6px 10px;background:var(--surface);border-radius:var(--radius-sm);margin-bottom:4px;border:1px solid var(--border);font-size:11px}
.draw-nums{display:flex;gap:3px}
.draw-num{width:20px;height:20px;border-radius:50%;background:rgba(124,58,237,.2);border:1px solid #7c3aed;color:#a78bfa;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
</style>
</head>
<body>
<div id="app" style="display:none">
  <div class="game-topbar">
    <div class="topbar-left">
      <button class="btn-back" onclick="if(tg)tg.close();else history.back()">←</button>
      <div class="bal-pill"><span class="bal-icon">💰</span><span class="bal-val" id="bal">0</span><span class="bal-cur" id="cur">EGP</span></div>
    </div>
    <div class="topbar-right">
      <button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊</button>
      <span id="connIndicator">🟢</span>
    </div>
  </div>

  <div class="game-area" style="flex:1">
    <!-- Timer -->
    <div class="lottery-timer">
      <div class="timer-label">🎲 السحب التالي</div>
      <div class="timer-val" id="timerVal">--:--</div>
    </div>

    <!-- Stats -->
    <div class="lottery-info" style="width:100%;max-width:360px">
      <div class="linfo"><div class="linfo-val gold" id="prizePool">0</div><div class="linfo-label">جائزة الجولة</div></div>
      <div class="linfo"><div class="linfo-val" id="ticketsSold">0</div><div class="linfo-label">تذاكر مباعة</div></div>
      <div class="linfo"><div class="linfo-val" id="myTickets">0</div><div class="linfo-label">تذاكري</div></div>
    </div>

    <!-- Prize Tiers -->
    <div class="prize-tiers" id="prizeTiers" style="width:100%;max-width:360px;display:none">
      <div class="pt-title">🏆 درجات الجوائز</div>
      <div class="pt-row">
        <span class="pt-badge jackpot">5/5</span>
        <span class="pt-label">جائزة كبرى</span>
        <span class="pt-amount gold" id="tierJackpot">—</span>
      </div>
      <div class="pt-row">
        <span class="pt-badge secondary">4/5</span>
        <span class="pt-label">جائزة ثانية</span>
        <span class="pt-amount" id="tierSecondary">—</span>
      </div>
      <div class="pt-row">
        <span class="pt-badge small">3/5</span>
        <span class="pt-label">جائزة صغيرة</span>
        <span class="pt-amount" id="tierSmall">—</span>
      </div>
      <div class="pt-note" id="rolloverNote"></div>
    </div>

    <!-- My Tickets -->
    <div class="ticket-area" id="ticketArea"></div>

    <!-- Buy Section -->
    <div class="buy-section">
      <div class="ticket-price-info" id="priceInfo">سعر التذكرة: 10 لكل واحدة</div>
      <div class="count-row">
        <button class="count-btn" onclick="changeCount(-1)">−</button>
        <div class="count-val" id="countVal">1</div>
        <button class="count-btn" onclick="changeCount(1)">+</button>
      </div>
      <button class="buy-btn" id="buyBtn" onclick="buyTickets()">🎟️ شراء تذاكر</button>
    </div>

    <!-- Draw History -->
    <div class="draw-history">
      <div class="draw-history-title">📋 آخر السحوبات</div>
      <div id="drawHistory"></div>
    </div>
  </div>
</div>
<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);flex-direction:column;gap:12px">
  <div style="font-size:40px">🎟️</div>
  <div style="color:var(--text-dim);font-size:14px">جارٍ التحميل...</div>
</div>
<script src="/static/js/game-base.js"></script>
<script>
'use strict';
var ticketCount = 1;
var myTicketsList = [];
var timerInterval = null;

function changeCount(delta) {
  ticketCount = Math.max(1, Math.min(10, ticketCount + delta));
  document.getElementById('countVal').textContent = ticketCount;
}

function loadState() {
  apiFetch(BASE + '/api/lottery/state').then(function(r) { return r.json(); }).then(function(d) {
    if (d.draw_time) startTimer(d.draw_time);
    if (d.prize_pool !== undefined) document.getElementById('prizePool').textContent = fmtAmount(d.prize_pool);
    if (d.tickets_sold !== undefined) document.getElementById('ticketsSold').textContent = d.tickets_sold;
    if (d.ticket_price !== undefined) document.getElementById('priceInfo').textContent = 'سعر التذكرة: ' + d.ticket_price + ' لكل واحدة';
    if (d.my_tickets) { myTicketsList = d.my_tickets; renderTickets(); }
    if (d.history) renderHistory(d.history);
    document.getElementById('myTickets').textContent = myTicketsList.length;
    if (d.prize_tiers) renderPrizeTiers(d.prize_tiers);
  }).catch(function() {});
}

function renderPrizeTiers(tiers) {
  var el = document.getElementById('prizeTiers');
  if (!el) return;
  el.style.display = 'flex';
  var jPool = tiers.jackpot && tiers.jackpot.pool > 0 ? fmtAmount(tiers.jackpot.pool) : '—';
  var sPool = tiers.secondary && tiers.secondary.pool > 0 ? fmtAmount(tiers.secondary.pool) : '—';
  var smPool = tiers.small && tiers.small.pool > 0 ? fmtAmount(tiers.small.pool) : '—';
  document.getElementById('tierJackpot').textContent = jPool;
  document.getElementById('tierSecondary').textContent = sPool;
  document.getElementById('tierSmall').textContent = smPool;
  var note = document.getElementById('rolloverNote');
  if (note && tiers.rollover_pct) {
    note.textContent = '⚡ ' + Math.round(tiers.rollover_pct * 100) + '% من الجائزة ينتقل للجولة القادمة عند غياب الجائزة الكبرى';
  }
}

function startTimer(drawTime) {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(function() {
    var now = Date.now() / 1000;
    var diff = Math.max(0, drawTime - now);
    var m = Math.floor(diff / 60);
    var s = Math.floor(diff % 60);
    document.getElementById('timerVal').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    if (diff <= 0) { clearInterval(timerInterval); loadState(); }
  }, 1000);
}

function buyTickets() {
  var btn = document.getElementById('buyBtn');
  btn.disabled = true;
  apiFetchCritical(BASE + '/api/lottery/buy', {
    method: 'POST',
    body: JSON.stringify({ uid: uid, count: ticketCount })
  }).then(function(r) { return r.json(); }).then(function(d) {
    btn.disabled = false;
    if (d.error) { showToast(d.error, 'error'); if (d.need_deposit) showDepositModal(); return; }
    showToast('تم شراء ' + ticketCount + ' تذكرة!', 'success');
    soundDraw(); hapticNotif('success');
    loadState(); loadBalance();
  }).catch(function() {
    btn.disabled = false; showToast('خطأ في الشبكة', 'error');
  });
}

function tierLabel(tier) {
  if (tier === 1) return '<span class="ticket-tier t1">🏆 جائزة كبرى</span>';
  if (tier === 2) return '<span class="ticket-tier t2">🥈 جائزة ثانية</span>';
  if (tier === 3) return '<span class="ticket-tier t3">🥉 جائزة صغيرة</span>';
  return '';
}

function renderTickets() {
  var area = document.getElementById('ticketArea');
  area.innerHTML = '';
  myTicketsList.forEach(function(t) {
    var div = document.createElement('div');
    div.className = 'ticket' + (t.scratched ? ' scratched' : '');
    var statusClass = t.status === 'win' ? 'win' : t.status === 'lose' ? 'lose' : 'pending';
    var statusText = t.status === 'win' ? 'فائز!' : t.status === 'lose' ? 'خسارة' : 'انتظار';
    var tierHtml = (t.status === 'win' && t.tier) ? tierLabel(t.tier) : '';
    var numsHtml = '';
    (t.numbers || []).forEach(function(n) {
      var cls = 'tic-num';
      if (t.drawn && t.drawn.indexOf(n) !== -1) cls += ' match';
      else if (t.scratched) cls += ' revealed';
      numsHtml += '<div class="' + cls + '">' + n + '</div>';
    });
    var matchInfo = (t.scratched && t.matches !== undefined) ? ' (' + t.matches + '/5)' : '';
    div.innerHTML = '<div class="ticket-header"><span class="ticket-id">#' + (t.id || '?') + '</span>' +
      '<span class="ticket-status ' + statusClass + '">' + statusText + matchInfo + '</span>' + tierHtml + '</div>' +
      '<div class="ticket-numbers">' + numsHtml + '</div>' +
      '<div class="ticket-prize ' + statusClass + '">' + (t.prize ? '+' + fmtAmount(t.prize) : t.status === 'lose' ? 'لا جائزة' : '🤞') + '</div>' +
      '<div class="ticket-scratch-hint">' + (t.scratched ? '' : 'انقر لكشف التذكرة') + '</div>';
    if (!t.scratched) {
      var overlay = document.createElement('div');
      overlay.className = 'scratch-overlay';
      overlay.innerHTML = '<span class="scratch-icon">🪙</span>';
      overlay.onclick = function() { scratchTicket(t.id, div, overlay); };
      div.appendChild(overlay);
    }
    area.appendChild(div);
  });
}

function scratchTicket(ticketId, div, overlay) {
  overlay.style.opacity = '0';
  setTimeout(function() { overlay.remove(); }, 500);
  soundDraw(); haptic('medium');
}

function renderHistory(history) {
  var container = document.getElementById('drawHistory');
  container.innerHTML = '';
  history.slice(0, 5).forEach(function(h) {
    var item = document.createElement('div');
    item.className = 'draw-item';
    var nums = h.drawn || h.numbers || [];
    var numsHtml = nums.map(function(n) {
      return '<div class="draw-num">' + n + '</div>';
    }).join('');
    // Winner summary: prefer tiered fields, fall back to legacy 'winners'
    var winnerSummary = '';
    if (h.jackpot_winners !== undefined) {
      if (h.jackpot_winners > 0) {
        winnerSummary = '🏆×' + h.jackpot_winners;
      } else if ((h.secondary_winners || 0) > 0 || (h.small_winners || 0) > 0) {
        var parts = [];
        if (h.secondary_winners > 0) parts.push('🥈×' + h.secondary_winners);
        if (h.small_winners > 0) parts.push('🥉×' + h.small_winners);
        winnerSummary = parts.join(' ');
      } else {
        winnerSummary = '↩️ ترحيل';
      }
    } else {
      winnerSummary = (h.winners || 0) > 0 ? '🏆×' + h.winners : 'لا فائز';
    }
    var rolloverBadge = (h.rollover_amount && h.rollover_amount > 0 && !h.jackpot_winners)
      ? ' <span style="font-size:9px;color:var(--text-dim)">+' + fmtAmount(h.rollover_amount) + ' ترحيل</span>' : '';
    var dateStr = h.date || (h.drawn_at ? new Date(h.drawn_at * 1000).toLocaleDateString('ar') : '');
    item.innerHTML = '<span>' + dateStr + '</span><div class="draw-nums">' + numsHtml + '</div>' +
      '<span style="color:var(--gold);font-size:10px">' + winnerSummary + rolloverBadge + '</span>';
    container.appendChild(item);
  });
}

// Init
document.getElementById('loading').style.display = 'none';
document.getElementById('app').style.display = 'flex';
document.getElementById('app').style.flexDirection = 'column';
document.getElementById('app').style.height = '100dvh';
loadBalance();
loadState();
setInterval(loadState, 30000);
setInterval(loadBalance, 10000);
initBackButton();
</script>
</body>
</html>
