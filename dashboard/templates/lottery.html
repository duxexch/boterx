{% extends 'base.html' %}
{% block title %}اليانصيب — Boterx{% endblock %}
{% block page_title %}🎰 اليانصيب{% endblock %}

{% block content %}
<div x-data="lotteryApp()" x-init="init()" class="space-y-6">

    <!-- Refresh button -->
    <div class="flex justify-between items-center">
        <p class="text-slate-400 text-sm">إدارة جولات اليانصيب</p>
        <button @click="loadData()" class="btn btn-primary btn-sm">
            <i class="fas fa-rotate ml-1"></i> تحديث
        </button>
    </div>

    <!-- Loading -->
    <template x-if="loading">
        <div class="text-center p-12 text-slate-400">
            <i class="fas fa-spinner fa-spin text-3xl"></i>
            <p class="mt-2">جارٍ التحميل...</p>
        </div>
    </template>

    <!-- Empty -->
    <template x-if="!loading && rounds.length === 0">
        <div class="bg-slate-800 rounded-xl border border-slate-700 p-12 text-center">
            <i class="fas fa-dice text-5xl text-slate-600 mb-3"></i>
            <p class="text-slate-400 text-lg">لا توجد جولات يانصيب</p>
        </div>
    </template>

    <!-- Rounds cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <template x-for="r in rounds" :key="r.id">
            <div class="bg-slate-800 rounded-xl border border-slate-700 p-5 hover:border-amber-500 transition card-hover">
                <!-- Card header -->
                <div class="flex items-start justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl bg-amber-500/10 flex items-center justify-center text-2xl">🎰</div>
                        <div>
                            <h3 class="font-bold text-lg" x-text="r.name || r.id || 'جولة'"></h3>
                            <p class="text-xs text-slate-500 font-mono" x-text="r.id || ''"></p>
                        </div>
                    </div>
                    <span x-html="statusBadge(r.status)"></span>
                </div>

                <!-- Stats -->
                <div class="space-y-3">
                    <div class="flex items-center justify-between p-3 bg-slate-900/50 rounded-lg">
                        <span class="text-sm text-slate-400 flex items-center gap-2">
                            <i class="fas fa-ticket text-amber-400"></i> التذاكر المباعة
                        </span>
                        <span class="font-bold text-lg text-amber-400" x-text="fmtNum(r.tickets_sold || 0)"></span>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-slate-900/50 rounded-lg">
                        <span class="text-sm text-slate-400 flex items-center gap-2">
                            <i class="fas fa-users text-blue-400"></i> المشاركون
                        </span>
                        <span class="font-bold text-lg text-blue-400" x-text="fmtNum(r.participants || 0)"></span>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-slate-900/50 rounded-lg">
                        <span class="text-sm text-slate-400 flex items-center gap-2">
                            <i class="fas fa-trophy text-green-400"></i> الفائزون
                        </span>
                        <span class="font-bold text-lg text-green-400" x-text="fmtNum(r.winners_count || r.winner_count || 0)"></span>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-slate-900/50 rounded-lg">
                        <span class="text-sm text-slate-400 flex items-center gap-2">
                            <i class="fas fa-coins text-purple-400"></i> مجموعة الجوائز
                        </span>
                        <span class="font-bold text-lg text-purple-400" x-text="fmtAmount(r.prize_pool || r.ticket_price || 0, r.currency || '')"></span>
                    </div>
                </div>

                <!-- Dates -->
                <div class="mt-4 pt-4 border-t border-slate-700 flex items-center justify-between text-xs text-slate-500">
                    <span x-text="r.start_date || r.created_at || ''"></span>
                    <span x-show="r.end_date" x-text="'← ' + r.end_date"></span>
                </div>
            </div>
        </template>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
function lotteryApp() {
    return {
        rounds: [],
        loading: true,

        init() {
            this.loadData();
        },

        async loadData() {
            this.loading = true;
            try {
                const res = await fetch('/api/lottery/rounds');
                const data = await res.json();
                this.rounds = data.rounds || [];
            } catch (e) {
                console.error(e);
                toast('فشل تحميل جولات اليانصيب', 'error');
            } finally {
                this.loading = false;
            }
        }
    }
}
</script>
{% endblock %}
