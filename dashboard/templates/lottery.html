{% extends 'base.html' %}
{% block title %}اليانصيب — Boterx{% endblock %}
{% block page_title %}🎰 اليانصيب{% endblock %}

{% block content %}
<div x-data="lotteryApp()" x-init="init()" class="space-y-6">

    <div class="flex justify-between items-center">
        <p class="text-slate-400 text-sm">إدارة جولات اليانصيب — إنشاء + سحب</p>
        <div class="flex gap-2">
            <button @click="showCreateModal = true" class="btn btn-primary btn-sm">
                <i class="fas fa-plus ml-1"></i> إنشاء جولة
            </button>
            <button @click="loadData()" class="btn btn-sm" style="background:#475569">
                <i class="fas fa-rotate ml-1"></i> تحديث
            </button>
        </div>
    </div>

    <template x-if="loading">
        <div class="text-center p-12 text-slate-400">
            <i class="fas fa-spinner fa-spin text-3xl"></i>
            <p class="mt-2">جارٍ التحميل...</p>
        </div>
    </template>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <template x-for="r in rounds" :key="r.id">
            <div class="bg-slate-800 rounded-xl border border-slate-700 p-5 hover:border-amber-500 transition card-hover"
                 :class="r.status === 'active' ? 'border-amber-500/50 ring-1 ring-amber-500/20' : ''">
                <div class="flex items-start justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl bg-amber-500/10 flex items-center justify-center text-2xl">🎰</div>
                        <div>
                            <h3 class="font-bold text-lg" x-text="r.name || r.id"></h3>
                            <p class="text-xs text-slate-500 font-mono" x-text="r.id"></p>
                        </div>
                    </div>
                    <span x-html="statusBadge(r.status)"></span>
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between p-2 bg-slate-900/50 rounded text-sm">
                        <span class="text-slate-400">🎫 سعر التذكرة</span>
                        <span class="font-bold" x-text="`${r.ticket_price || ''} ${r.currency || ''}`"></span>
                    </div>
                    <div class="flex justify-between p-2 bg-slate-900/50 rounded text-sm">
                        <span class="text-slate-400">📊 التذاكر المباعة</span>
                        <span class="font-bold text-amber-400" x-text="fmtNum(r.tickets_sold || 0)"></span>
                    </div>
                    <div class="flex justify-between p-2 bg-slate-900/50 rounded text-sm">
                        <span class="text-slate-400">👥 المشاركون</span>
                        <span class="font-bold text-blue-400" x-text="fmtNum(r.participants || 0)"></span>
                    </div>
                    <div class="flex justify-between p-2 bg-slate-900/50 rounded text-sm">
                        <span class="text-slate-400">🏆 الفائزون</span>
                        <span class="font-bold text-green-400" x-text="r.winner_count || r.winners_count || 0"></span>
                    </div>
                    <div class="flex justify-between p-2 bg-slate-900/50 rounded text-sm">
                        <span class="text-slate-400">🏢 نسبة الإدارة</span>
                        <span class="font-bold" x-text="(r.admin_profit_pct || 0) + '%'"></span>
                    </div>
                    <div class="flex justify-between p-2 bg-slate-900/50 rounded text-sm">
                        <span class="text-slate-400">⏰ موعد السحب</span>
                        <span class="font-bold text-xs" x-text="r.draw_time || '—'"></span>
                    </div>
                </div>

                <!-- Winners list for completed -->
                <template x-if="r.status === 'completed' && r.winners_list && r.winners_list.length > 0">
                    <div class="mt-3 pt-3 border-t border-slate-700">
                        <p class="text-xs text-slate-400 mb-2">الفائزون:</p>
                        <div class="space-y-1">
                            <template x-for="w in r.winners_list" :key="w.id || w.ticket_number">
                                <div class="flex justify-between text-xs p-1.5 bg-slate-900/30 rounded">
                                    <span x-text="w.user_name || '—'"></span>
                                    <span class="font-bold text-green-400" x-text="fmtAmount(w.prize_amount, w.currency)"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Actions -->
                <div class="mt-4 pt-4 border-t border-slate-700 flex gap-2">
                    <template x-if="r.status === 'active'">
                        <button @click="drawRound(r.id)" class="btn btn-warning btn-sm flex-1">
                            🎲 تنفيذ السحب
                        </button>
                    </template>
                    <template x-if="r.status === 'active'">
                        <button @click="endRound(r.id)" class="btn btn-danger btn-sm">
                            🏁 إنهاء
                        </button>
                    </template>
                </div>
            </div>
        </template>
    </div>

    <template x-if="!loading && rounds.length === 0">
        <div class="bg-slate-800 rounded-xl border border-slate-700 p-12 text-center">
            <i class="fas fa-dice text-5xl text-slate-600 mb-3"></i>
            <p class="text-slate-400 text-lg">لا توجد جولات — أنشئ واحدة جديدة</p>
        </div>
    </template>

    <!-- Create Modal -->
    <div x-show="showCreateModal" x-transition class="modal-overlay" @click.self="showCreateModal = false" style="display:none">
        <div class="modal">
            <h3 class="font-bold text-lg mb-4">إنشاء جولة يانصيب جديدة</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">اسم الجولة</label>
                    <input type="text" x-model="form.name" class="input w-full" placeholder="مثال: جولة الصيف">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">سعر التذكرة</label>
                        <input type="number" x-model="form.ticket_price" class="input w-full" placeholder="10">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">العملة</label>
                        <select x-model="form.currency" class="input w-full">
                            <option value="SAR">SAR</option>
                            <option value="USD">USD</option>
                            <option value="EGP">EGP</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">عدد الفائزين</label>
                        <input type="number" x-model="form.winner_count" class="input w-full" placeholder="3" min="1" max="10">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">حد التذاكر لكل مستخدم</label>
                        <input type="number" x-model="form.max_tickets_per_user" class="input w-full" placeholder="5" min="1">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">نسبة ربح الإدارة %</label>
                        <input type="number" x-model="form.admin_profit_pct" class="input w-full" placeholder="10" min="0" max="100">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">موعد السحب</label>
                        <input type="text" x-model="form.draw_time" class="input w-full" placeholder="2026-08-15 20:00">
                    </div>
                </div>
            </div>
            <div class="flex gap-2 justify-end mt-4">
                <button @click="showCreateModal = false" class="btn btn-sm" style="background:#475569">إلغاء</button>
                <button @click="createRound()" class="btn btn-primary btn-sm">إنشاء</button>
            </div>
        </div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
function lotteryApp() {
    return {
        rounds: [], loading: true, showCreateModal: false,
        form: { name: '', ticket_price: 10, currency: 'SAR', winner_count: 3, max_tickets_per_user: 5, admin_profit_pct: 10, draw_time: '' },

        init() { this.loadData(); },

        async loadData() {
            this.loading = true;
            try {
                const data = await api('/api/lottery/rounds');
                this.rounds = data.rounds || [];
            } catch(e) { toast('فشل التحميل', 'error'); }
            this.loading = false;
        },

        async createRound() {
            if (!this.form.name) return toast('اكتب اسم الجولة', 'warning');
            try {
                await api('/api/lottery/create', { method: 'POST', body: JSON.stringify(this.form) });
                toast('تم إنشاء الجولة', 'success');
                Notifier?.playSuccessSound?.();
                this.showCreateModal = false;
                this.form = { name: '', ticket_price: 10, currency: 'SAR', winner_count: 3, max_tickets_per_user: 5, admin_profit_pct: 10, draw_time: '' };
                await this.loadData();
            } catch(e) { toast('خطأ في الإنشاء', 'error'); }
        },

        async drawRound(id) {
            if (!confirm('تنفيذ السحب الآن؟ لا يمكن التراجع.')) return;
            try {
                await api(`/api/lottery/${id}/draw`, { method: 'POST', body: '{}' });
                toast('تم السحب بنجاح!', 'success');
                Notifier?.playSuccessSound?.();
                await this.loadData();
            } catch(e) { toast('خطأ في السحب', 'error'); }
        },

        async endRound(id) {
            if (!confirm('إنهاء الجولة؟')) return;
            try {
                await api(`/api/wheel/${id}/end`, { method: 'POST', body: '{}' });
                toast('تم الإنهاء', 'warning');
                await this.loadData();
            } catch(e) { toast('خطأ', 'error'); }
        }
    }
}
</script>
{% endblock %}
