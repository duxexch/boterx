<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VEX — التعويضات</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0b0e11">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.build.css') }}?v=20260831">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome.min.css') }}">
    <script defer src="{{ url_for('static', filename='vendor/alpine.min.js') }}"></script>
    <style>
        *{font-family:'Cairo',sans-serif;box-sizing:border-box;margin:0;padding:0}
        body{background:#0b0e11;color:#eef2f6;min-height:100dvh}
        .app{max-width:520px;margin:0 auto;padding:14px}
        .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0;margin-bottom:16px}
        .logo{font-size:22px;font-weight:900;background:linear-gradient(135deg,#00e701,#69f0ae);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .back-btn{color:#8794a3;text-decoration:none;font-size:14px}
        .hero{text-align:center;padding:20px 0}
        .hero-icon{font-size:48px;margin-bottom:10px}
        .hero-title{font-size:20px;font-weight:900;margin-bottom:6px}
        .hero-sub{font-size:13px;color:#8794a3;line-height:1.6}
        .company-card{background:#1a2028;border:1px solid #262e39;border-radius:16px;padding:16px;margin-bottom:12px;transition:all .25s}
        .company-card:active{transform:scale(.98)}
        .company-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
        .company-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;background:#262e39}
        .company-name{font-size:16px;font-weight:800}
        .company-desc{font-size:12px;color:#8794a3;line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .promo-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);color:#ffd700;font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;margin-bottom:10px}
        .btn{padding:12px 20px;border-radius:12px;border:none;font-size:14px;font-weight:800;cursor:pointer;transition:all .15s;font-family:'Cairo',sans-serif;width:100%}
        .btn:active{transform:scale(.95)}
        .btn-green{background:linear-gradient(135deg,#00e701,#00c101);color:#0b0e11}
        .btn-blue{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff}
        .btn-outline{background:transparent;border:1px solid #262e39;color:#8794a3}
        .btn-outline:active{background:#262e39}
        .btn-amber{background:linear-gradient(135deg,#f59e0b,#d97706);color:#0b0e11}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
        .modal{background:#1a2028;border:1px solid #262e39;border-radius:20px;padding:24px;width:100%;max-width:400px}
        .modal-title{font-size:18px;font-weight:900;margin-bottom:16px;text-align:center}
        .input{width:100%;background:#0b0e11;border:1px solid #262e39;border-radius:12px;padding:12px 16px;color:#eef2f6;font-size:14px;font-family:'Cairo',sans-serif;outline:none;text-align:center;letter-spacing:4px}
        .input:focus{border-color:#00e701}
        .label{font-size:13px;color:#8794a3;margin-bottom:8px;display:block}
        .option-btn{display:flex;align-items:center;gap:12px;background:#0b0e11;border:2px solid #262e39;border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all .2s;width:100%;text-align:right}
        .option-btn:active{transform:scale(.97)}
        .option-btn.selected{border-color:#00e701;background:rgba(0,231,1,.05)}
        .option-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
        .option-title{font-size:14px;font-weight:800}
        .option-desc{font-size:11px;color:#8794a3}
        .status-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px}
        .status-pending{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
        .status-approved{background:rgba(0,231,1,.15);color:#00e701;border:1px solid rgba(0,231,1,.3)}
        .status-rejected{background:rgba(255,71,87,.15);color:#ff4757;border:1px solid rgba(255,71,87,.3)}
        .spinner{width:20px;height:20px;border:3px solid #262e39;border-top-color:#00e701;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto}
        @keyframes spin{to{transform:rotate(360deg)}}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a2028;border:1px solid #262e39;border-radius:12px;padding:12px 20px;font-size:13px;z-index:100;animation:slideUp .3s ease}
        .toast.success{border-color:#00e701;color:#00e701}
        .toast.error{border-color:#ff4757;color:#ff4757}
        @keyframes slideUp{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
    </style>
</head>
<body>
<div class="app" x-data="compApp()" x-init="init()">
    <!-- Top Bar -->
    <div class="topbar">
        <a href="/" class="back-btn"><i class="fas fa-arrow-right"></i> الرئيسية</a>
        <div class="logo">VEX</div>
        <a href="/webapp/account" class="back-btn">حسابي <i class="fas fa-user"></i></a>
    </div>

    <!-- STEP 1: Company Selection -->
    <template x-if="step === 'list'">
        <div>
            <div class="hero">
                <span class="hero-icon">💎</span>
                <h1 class="hero-title">نظام التعويضات</h1>
                <p class="hero-sub">سجّل في الشركات واحصل على تعويض كامل عند الخسارة</p>
            </div>

            <!-- Registered Companies -->
            <template x-if="myAccounts.length > 0">
                <div>
                    <h3 class="section-title" style="font-size:15px;font-weight:800;margin:18px 0 10px;display:flex;align-items:center;gap:8px">
                        <i class="fas fa-check-circle" style="color:#00e701"></i> شركات مسجل فيها
                    </h3>
                    <template x-for="acc in myAccounts" :key="acc.id">
                        <div class="company-card" style="border-color:#00e701">
                            <div class="company-header">
                                <div class="company-icon" x-text="getIcon(acc.company_name)"></div>
                                <div>
                                    <div class="company-name" x-text="acc.company_name"></div>
                                    <div style="font-size:11px;color:#8794a3">رقم الحساب: <span x-text="acc.account_number" style="color:#eef2f6"></span></div>
                                </div>
                                <div style="margin-right:auto">
                                    <span class="status-badge" :class="'status-' + acc.status">
                                        <template x-if="acc.status==='pending'"><span>⏳ قيد المراجعة</span></template>
                                        <template x-if="acc.status==='active'"><span>✅ مؤكد</span></template>
                                        <template x-if="acc.status==='rejected'"><span>❌ مرفوض</span></template>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- All Companies -->
            <h3 class="section-title" style="font-size:15px;font-weight:800;margin:18px 0 10px;display:flex;align-items:center;gap:8px">
                <i class="fas fa-building" style="color:#f59e0b"></i> جميع الشركات
            </h3>
            <template x-for="c in companies" :key="c.id">
                <div class="company-card">
                    <div class="company-header">
                        <div class="company-icon" x-text="c.icon || '🏢'"></div>
                        <div>
                            <div class="company-name" x-text="c.name"></div>
                            <div class="company-desc" x-text="c.desc"></div>
                        </div>
                    </div>
                    <div class="promo-badge" x-show="c.promo_code">
                        <i class="fas fa-tag"></i> <span x-text="c.promo_code"></span>
                    </div>
                    <div style="display:flex;gap:8px">
                        <button class="btn btn-green" style="flex:1" @click="chooseCompany(c, 'direct')">
                            <i class="fas fa-bolt"></i> تسجيل مباشر
                        </button>
                        <button class="btn btn-blue" style="flex:1" @click="chooseCompany(c, 'compensation')">
                            <i class="fas fa-shield-alt"></i> تسجيل بالتعويض
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </template>

    <!-- STEP 2: Choose Registration Type -->
    <template x-if="step === 'choose'">
        <div>
            <div class="hero">
                <span class="hero-icon" x-text="selectedCompany.icon || '🏢'"></span>
                <h1 class="hero-title" x-text="selectedCompany.name"></h1>
                <p class="hero-sub">اختر طريقة التسجيل</p>
            </div>

            <div class="option-btn" @click="startDirect()">
                <div class="option-icon" style="background:rgba(0,231,1,.1);color:#00e701"><i class="fas fa-bolt"></i></div>
                <div>
                    <div class="option-title">تسجيل مباشر</div>
                    <div class="option-desc">افتح رابط التسجيل وسجّل حساب جديد في الشركة</div>
                </div>
            </div>

            <div class="option-btn" @click="startCompensation()">
                <div class="option-icon" style="background:rgba(59,130,246,.1);color:#3b82f6"><i class="fas fa-shield-alt"></i></div>
                <div>
                    <div class="option-title">تسجيل بنظام التعويض</div>
                    <div class="option-desc">سجّل وادخل رقم حسابك — عند الخسارة هنعدلك 100%</div>
                </div>
            </div>

            <button class="btn btn-outline" style="margin-top:16px" @click="step='list'">رجوع</button>
        </div>
    </template>

    <!-- STEP 3A: Direct Registration -->
    <template x-if="step === 'direct'">
        <div>
            <div class="hero">
                <span class="hero-icon">🔗</span>
                <h1 class="hero-title">تسجيل مباشر</h1>
                <p class="hero-sub">افتح الرابط وسجّل حسابك في الشركة</p>
            </div>

            <div style="text-align:center;margin-bottom:16px">
                <div style="font-size:12px;color:#8794a3;margin-bottom:8px">كود البرومو الخاص بك</div>
                <div style="background:#1a2028;border:1px solid #262e39;border-radius:12px;padding:12px 20px;display:inline-flex;align-items:center;gap:10px">
                    <span style="font-size:18px;font-weight:900;color:#ffd700" x-text="selectedCompany.promo_code"></span>
                    <button style="background:#262e39;border:none;color:#8794a3;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px" @click="copyPromo()">نسخ</button>
                </div>
            </div>

            <a :href="selectedCompany.affiliate_link" target="_blank" class="btn btn-green" style="display:block;text-decoration:none;text-align:center;margin-bottom:10px">
                <i class="fas fa-external-link-alt"></i> فتح رابط التسجيل
            </a>

            <div style="background:#1a2028;border:1px solid #262e39;border-radius:12px;padding:14px;margin-bottom:16px">
                <div style="font-size:13px;font-weight:800;margin-bottom:8px">الخطوات:</div>
                <div style="font-size:12px;color:#8794a3;line-height:1.8">
                    1. اضغط "فتح رابط التسجيل" أعلاه<br>
                    2. سجّل حساب جديد في الشركة<br>
                    3. استخدم كود البرومو: <span style="color:#ffd700" x-text="selectedCompany.promo_code"></span><br>
                    4. ارجع هنا بعد التسجيل
                </div>
            </div>

            <button class="btn btn-outline" @click="step='list'">رجوع</button>
        </div>
    </template>

    <!-- STEP 3B: Compensation Registration - Enter Account Number + PIN -->
    <template x-if="step === 'compensation'">
        <div>
            <div class="hero">
                <span class="hero-icon">🛡️</span>
                <h1 class="hero-title">تسجيل بنظام التعويض</h1>
                <p class="hero-sub" x-text="selectedCompany.name + ' — أدخل رقم حسابك والرمز'"></p>
            </div>

            <a :href="selectedCompany.affiliate_link" target="_blank" class="btn btn-green" style="display:block;text-decoration:none;text-align:center;margin-bottom:16px">
                <i class="fas fa-external-link-alt"></i> 1. فتح رابط التسجيل والسجّل أولاً
            </a>

            <div style="background:#1a2028;border:1px solid #262e39;border-radius:12px;padding:14px;margin-bottom:16px">
                <div style="font-size:12px;color:#8794a3;line-height:1.8">
                    <i class="fas fa-info-circle" style="color:#f59e0b"></i>
                    سجّل أولاً عبر الرابط أعلاه ثم عد هنا وأدخل بياناتك
                </div>
            </div>

            <div style="margin-bottom:14px">
                <label class="label">رقم الحساب في <span x-text="selectedCompany.name"></span></label>
                <input class="input" x-model="accNumber" placeholder="أدخل رقم حسابك" style="letter-spacing:0;text-align:right">
            </div>

            <div style="margin-bottom:16px">
                <label class="label">الرمز السري (4 أرقام)</label>
                <input class="input" x-model="accPin" type="password" maxlength="4" placeholder="••••" inputmode="numeric" style="letter-spacing:8px">
            </div>

            <button class="btn btn-blue" @click="submitAccount()" :disabled="submitting" :style="submitting && 'opacity:.6'">
                <template x-if="!submitting"><span><i class="fas fa-paper-plane"></i> تسجيل الحساب</span></template>
                <template x-if="submitting"><span><div class="spinner" style="display:inline-block;width:16px;height:16px;border-width:2px"></div> جارٍ التسجيل...</span></template>
            </button>

            <button class="btn btn-outline" style="margin-top:10px" @click="step='list'">رجوع</button>
        </div>
    </template>

    <!-- STEP 4: Success / Pending -->
    <template x-if="step === 'pending'">
        <div style="text-align:center;padding:40px 0">
            <div style="font-size:64px;margin-bottom:16px">⏳</div>
            <h1 style="font-size:22px;font-weight:900;margin-bottom:8px">طلبك قيد المعالجة</h1>
            <p style="font-size:14px;color:#8794a3;line-height:1.8;margin-bottom:24px">
                تم استلام طلبك بنجاح<br>
                سيتم مراجعة حسابك من قبل الإدارة<br>
                وستتلقى إشعاراً عند التأكيد
            </p>

            <div style="background:#1a2028;border:1px solid #262e39;border-radius:12px;padding:14px;margin-bottom:20px;text-align:right">
                <div style="font-size:12px;color:#8794a3;margin-bottom:4px">الشركة</div>
                <div style="font-size:14px;font-weight:800" x-text="selectedCompany.name"></div>
                <div style="font-size:12px;color:#8794a3;margin-top:8px;margin-bottom:4px">رقم الحساب</div>
                <div style="font-size:14px;font-weight:800" x-text="lastAccountNumber"></div>
            </div>

            <button class="btn btn-green" @click="step='list'; selectedCompany=null" style="margin-bottom:10px">
                <i class="fas fa-plus"></i> سجّل في شركة أخرى
            </button>
            <button class="btn btn-outline" @click="window.location.href='/'">الرئيسية</button>
        </div>
    </template>

    <!-- Toast -->
    <div x-show="toast.show" x-transition class="toast" :class="toast.type" x-text="toast.msg"></div>
</div>

<script>
function compApp() {
    return {
        step: 'list',
        companies: [],
        myAccounts: [],
        selectedCompany: null,
        accNumber: '',
        accPin: '',
        submitting: false,
        toast: { show: false, msg: '', type: 'success' },

        async init() {
            await this.loadCompanies();
            await this.loadMyAccounts();
        },

        async api(url, opts = {}) {
            const r = await fetch(url, {
                headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
                ...opts
            });
            return r.json();
        },

        async loadCompanies() {
            try {
                const data = await this.api('/api/comp/status');
                this.companies = (data.companies || []).map(c => ({
                    id: c.id,
                    name: c.name,
                    icon: c.icon || '🏢',
                    desc: c.description || c.name + ' — شركة مراهنة مرخصة',
                    promo_code: c.promo_code || '',
                    affiliate_link: c.affiliate_link || '#',
                    app_link: c.app_link || '',
                }));
            } catch(e) { console.error(e); }
        },

        async loadMyAccounts() {
            try {
                const data = await this.api('/api/comp/status');
                this.myAccounts = data.accounts || [];
            } catch(e) { console.error(e); }
        },

        getIcon(name) {
            const icons = {'1XBET':'⚽','MELBET':'🎯','BETJAM':'🎲','MOSTBET':'🏆','BIZBET':'⚡','XPARI':'🌟','LINEBET':'📈','GOOOBET':'🎮'};
            return icons[name] || '🏢';
        },

        chooseCompany(c, type) {
            this.selectedCompany = c;
            if (type === 'direct') {
                this.step = 'choose';
            } else {
                this.step = 'choose';
            }
        },

        startDirect() {
            this.step = 'direct';
        },

        startCompensation() {
            this.step = 'compensation';
        },

        copyPromo() {
            navigator.clipboard.writeText(this.selectedCompany.promo_code);
            this.showToast('تم نسخ كود البرومو', 'success');
        },

        async submitAccount() {
            if (!this.accNumber.trim()) { this.showToast('أدخل رقم الحساب', 'error'); return; }
            if (!this.accPin || this.accPin.length < 4) { this.showToast('أدخل الرمز (4 أرقام)', 'error'); return; }
            this.submitting = true;
            try {
                await this.api('/api/comp/pin', {
                    method: 'POST',
                    body: JSON.stringify({ pin: this.accPin })
                });
                await this.api('/api/comp/register', {
                    method: 'POST',
                    body: JSON.stringify({
                        company_id: this.selectedCompany.id,
                        company_name: this.selectedCompany.name,
                        account_number: this.accNumber.trim()
                    })
                });
                this.lastAccountNumber = this.accNumber;
                this.step = 'pending';
                this.accNumber = '';
                this.accPin = '';
            } catch(e) {
                this.showToast('خطأ في التسجيل', 'error');
            }
            this.submitting = false;
        },

        showToast(msg, type = 'success') {
            this.toast = { show: true, msg, type };
            setTimeout(() => { this.toast.show = false; }, 3000);
        }
    };
}
</script>
</body>
</html>
