<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VEX Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{overflow:hidden;font-family:system-ui,sans-serif;background:#0f172a;color:#fff}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* Top bar */
#topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(0,0,0,0.3);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
.balance{font-size:22px;font-weight:900;color:#fbbf24}
.balance span{font-size:14px;opacity:0.6;font-weight:400}
.vex-btn{background:linear-gradient(135deg,#a78bfa,#8b5cf6);color:#fff;border:none;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;display:none}
.vex-btn.show{display:block}
.stats{font-size:11px;opacity:0.6;margin-top:2px}
/* Game grid */
#grid{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-content:start}
.game-card{background:linear-gradient(145deg,#1e293b,#0f172a);border:1px solid #334155;border-radius:18px;padding:18px 12px;text-align:center;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;position:relative;overflow:hidden}
.game-card:active{transform:scale(0.95)}
.game-card.hot::after{content:'🔥';position:absolute;top:8px;left:8px;font-size:14px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.game-icon{font-size:42px;margin-bottom:8px}
.game-name{font-size:14px;font-weight:700;margin-bottom:4px}
.game-desc{font-size:10px;opacity:0.5;margin-bottom:6px;line-height:1.3}
.game-bets{font-size:10px;color:#fbbf24;opacity:0.8}
.game-rtp{font-size:9px;opacity:0.4;margin-top:2px}
/* Loading */
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f172a;z-index:200}
.spinner{width:40px;height:40px;border:3px solid #334155;border-top:3px solid #fbbf24;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Empty */
#empty{text-align:center;padding:40px;opacity:0.5}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div></div>
<div id="app" style="display:none">
  <div id="topbar">
    <div>
      <div class="balance">💰 <span id="bal">0</span> <span>SAR</span></div>
      <div class="stats" id="stats"></div>
    </div>
    <button class="vex-btn" id="vexBtn">💎 تعويض</button>
  </div>
  <div id="grid"></div>
</div>
<div id="empty" style="display:none">
  <div style="font-size:48px;margin-bottom:12px">🎮</div>
  <p>لا توجد ألعاب متاحة حالياً</p>
</div>
<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.expand(); tg.ready(); }
const uid = new URLSearchParams(location.search).get('uid') || '';
const lang = new URLSearchParams(location.search).get('lang') || 'ar';
const BASE = location.origin;

async function loadBalance() {
  try {
    const r = await fetch(`${BASE}/api/wallet/balance?uid=${uid}`);
    const d = await r.json();
    document.getElementById('bal').textContent = (d.balance || 0).toLocaleString();
  } catch(e) {}
}

async function loadProfile() {
  try {
    const r = await fetch(`${BASE}/api/player/profile?uid=${uid}`);
    const d = await r.json();
    const p = d.profile || {};
    const seg = d.segment || 'new';
    const segLabels = {new:'🟢 جديد',winner:'🔴 رابح',loser:'🟡 خاسر',hot:'🔥 ساخن',churning:'⚠️ قد يغادر',vip:'💎 VIP',regular:'👤 عادي'};
    document.getElementById('stats').textContent = `${segLabels[seg]||seg} | فوز: ${p.win_rate||0}%`;
    if (p.is_vex_partner === 'yes') {
      document.getElementById('vexBtn').classList.add('show');
    }
  } catch(e) {}
}

async function loadGames() {
  try {
    const r = await fetch(`${BASE}/api/games/list`);
    const d = await r.json();
    const games = d.games || [];
    document.getElementById('loading').style.display = 'none';
    if (games.length === 0) {
      document.getElementById('empty').style.display = 'block';
      return;
    }
    document.getElementById('app').style.display = 'flex';
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    games.forEach((g, i) => {
      const card = document.createElement('div');
      card.className = 'game-card' + (i % 4 === 0 ? ' hot' : '');
      card.innerHTML = `
        <div class="game-icon">${g.icon||'🎮'}</div>
        <div class="game-name">${g.name||''}</div>
        <div class="game-desc">${g.description||''}</div>
        <div class="game-bets">${g.min_bet} - ${g.max_bet}</div>
        <div class="game-rtp">RTP: ${g.rtp_target||85}%</div>
      `;
      card.onclick = () => playGame(g.id);
      grid.appendChild(card);
    });
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('empty').style.display = 'block';
  }
}

function playGame(gameId) {
  const url = `${BASE}/webapp/play/${gameId}?uid=${uid}&lang=${lang}`;
  if (tg) {
    tg.openTelegramLink(url);
  } else {
    window.location.href = url;
  }
}

document.getElementById('vexBtn').onclick = () => {
  alert('💎 تعويض — سيتم تحويلك لصفحة التعويض');
};

// Init
loadBalance();
loadProfile();
loadGames();
setInterval(loadBalance, 5000);
</script>
</body>
</html>
