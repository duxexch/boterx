<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>VEX Games</title>
<link rel="stylesheet" href="/static/css/game-base.css?v=20260809">
<style>
#app{overflow-y:auto}
#hub{padding:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;overflow-y:auto;align-content:start}
.game-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px;cursor:pointer;transition:all 0.2s var(--ease);text-align:center;position:relative;overflow:hidden}
.game-card:active{transform:scale(0.95);border-color:var(--gold)}
.game-card:hover{border-color:var(--gold)}
.game-card .hot-badge{position:absolute;top:6px;right:6px;background:var(--red);color:#fff;font-size:8px;padding:2px 6px;border-radius:6px;font-weight:700;animation:pulse 0.8s infinite}
.game-icon{font-size:36px;margin-bottom:6px}
.game-name{font-size:13px;font-weight:700;margin-bottom:2px;color:var(--text)}
.game-desc{font-size:10px;color:var(--muted);margin-bottom:6px;line-height:1.3}
.game-rtp{font-size:10px;color:var(--gold);font-weight:600}
.empty-state{text-align:center;padding:40px;color:var(--muted);display:none}
.empty-icon{font-size:48px;margin-bottom:12px}
#topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar-info{display:flex;flex-direction:column}
.topbar-name{font-size:14px;font-weight:700}
.topbar-seg{font-size:10px;color:var(--muted)}
.topbar-btns{display:flex;gap:6px}
.hub-btn{width:38px;height:38px;border-radius:50%;border:none;font-size:16px;cursor:pointer;transition:all 0.15s}
.hub-btn:active{transform:scale(0.9)}
.hub-btn.dep{background:linear-gradient(135deg,var(--green-dim),#1a8a2e);color:#fff}
.hub-btn.wdr{background:linear-gradient(135deg,var(--gold-dim),var(--gold));color:#000}
.hub-btn.vex{background:linear-gradient(135deg,var(--purple),#7c3aed);color:#fff}
/* Animated game icons */
.game-icon-anim{animation:iconFloat 2s ease-in-out infinite}
.game-icon-anim[data-game="GAME004"]{animation:iconFly 3s ease-in-out infinite}
.game-icon-anim[data-game="GAME005"]{animation:iconRocket 2.5s ease-in-out infinite}
.game-icon-anim[data-game="GAME006"]{animation:iconBounce 1.5s ease-in-out infinite}
.game-icon-anim[data-game="GAME007"]{animation:iconSpin 2s ease-in-out infinite}
.game-icon-anim[data-game="GAME008"]{animation:iconTicket 2s ease-in-out infinite}
.game-icon-anim[data-game="GAME009"]{animation:iconSpin 3s linear infinite}
@keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes iconFly{0%{transform:translateX(0) translateY(0) rotate(0)}50%{transform:translateX(8px) translateY(-4px) rotate(5deg)}100%{transform:translateX(0) translateY(0) rotate(0)}}
@keyframes iconRocket{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.1)}100%{transform:translateY(0) scale(1)}}
@keyframes iconBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes iconSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes iconTicket{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
/* Leaderboard */
.lb-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin:8px 12px 4px;overflow:hidden}
.lb-header{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.lb-header-icon{font-size:16px}
.lb-header-text{font-size:12px;font-weight:700;color:var(--gold)}
.lb-list{max-height:220px;overflow-y:auto}
.lb-list::-webkit-scrollbar{width:2px}
.lb-list::-webkit-scrollbar-thumb{background:var(--border)}
.lb-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid rgba(42,49,66,0.3);font-size:11px;transition:background 0.15s}
.lb-row:active{background:var(--surface-2)}
.lb-row.win .lb-profit{color:var(--green)}
.lb-row.lose .lb-profit{color:var(--red)}
.lb-rank{width:24px;text-align:center;font-weight:700;font-size:14px}
.lb-name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-profit{font-weight:800;font-family:'Courier New',monospace}
.lb-games{font-size:9px;color:var(--muted)}
.lb-empty{text-align:center;padding:16px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="loader-screen" id="loading"><div class="spinner"></div></div>
<div id="app" style="display:none">
  <div id="topbar">
    <div class="topbar-info">
      <div class="topbar-name">💰 <span id="bal">0</span> <span id="cur" style="font-size:11px;color:var(--muted);cursor:pointer" onclick="showCurrencyPicker()">EGP</span></div>
      <div class="topbar-seg" id="stats"></div>
    </div>
    <div class="topbar-btns">
      <button class="hub-btn vex" id="vexBtn" style="display:none" onclick="alert('💎 تعويض')">💎</button>
      <button class="hub-btn dep" onclick="window.location.href=BASE+'/webapp/stats?'+_getAuthParam()" style="background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff">📊</button>
      <button class="hub-btn dep" onclick="showDeposit()">💰</button>
      <button class="hub-btn wdr" onclick="showWithdraw()">💸</button>
    </div>
  </div>
  <div id="hub"></div>
  <div class="lb-section">
    <div class="lb-header">
      <span class="lb-header-icon">🏆</span>
      <span class="lb-header-text">قائمة الأبطال</span>
    </div>
    <div class="lb-list" id="leaderboard"><div class="lb-empty">جاري التحميل...</div></div>
  </div>
  <div class="empty-state" id="empty"><div class="empty-icon">🎮</div><p>لا توجد ألعاب متاحة</p></div>
</div>
<div class="modal-overlay" id="modal"><div class="modal-box" id="modalBox"></div></div>
<script src="/static/js/game-base.js?v=20260809"></script>
<script>
const lang=new URLSearchParams(location.search).get('lang')||'ar';
const GAME_ROUTES={'GAME004':'/webapp/aviator','GAME005':'/webapp/crash','GAME006':'/webapp/mines','GAME007':'/webapp/plinko','GAME008':'/webapp/lottery','GAME009':'/webapp/wheel','GAME010':'/webapp/dice'};
async function loadProfile(){try{const r=await apiFetch(`${BASE}/api/player/profile`);const d=await r.json();const p=d.profile||{};const seg=d.segment||'new';const l={new:'🟢 جديد',winner:'🔴 رابح',loser:'🟡 خاسر',hot:'🔥 ساخن',churning:'⚠️ يغادر',vip:'💎 VIP',regular:'👤 عادي'};if(d.balance!==undefined){document.getElementById('bal').textContent=(d.balance||0).toLocaleString();}if(d.currency){document.getElementById('cur').textContent=d.currency;}const cid=d.customer_id?' | رقم: '+d.customer_id:'';document.getElementById('stats').textContent=`${l[seg]||seg}${cid} | ${p.win_rate||0}%`;if(p.is_vex_partner==='yes')document.getElementById('vexBtn').style.display='block';}catch(e){}}
async function loadGames(){try{const r=await apiFetch(`${BASE}/api/games/list`);const d=await r.json();const gs=d.games||[];document.getElementById('loading').style.display='none';if(gs.length===0){document.getElementById('empty').style.display='block';return;}document.getElementById('app').style.display='flex';const h=document.getElementById('hub');h.innerHTML='';gs.forEach((g,i)=>{const c=document.createElement('div');c.className='game-card';if(i<3)c.innerHTML+='<div class="hot-badge">🔥</div>';const icon=g.icon||'🎮';c.innerHTML+=`<div class="game-icon game-icon-anim" data-game="${g.id}">${icon}</div><div class="game-name">${g.name||''}</div><div class="game-desc">${g.description||''}</div>`;c.onclick=()=>playGame(g.id);h.appendChild(c);});}catch(e){document.getElementById('loading').style.display='none';document.getElementById('empty').style.display='block';}}
function playGame(id){const path=GAME_ROUTES[id]||`/webapp/play/${id}`;window.location.href=`${BASE}${path}?${_getAuthParam()}&lang=${lang}`;}
function closeModal(){document.getElementById('modal').style.display='none';}
async function showDeposit(){document.getElementById('modal').style.display='flex';await showVexDepositModal(0);}
async function showWithdraw(){const bal=parseFloat(document.getElementById('bal').textContent.replace(/,/g,''))||0;document.getElementById('modal').style.display='flex';const mb=document.getElementById('modalBox');let mh='';try{const r=await apiFetch(`${BASE}/api/player/methods`);const d=await r.json();if(d.methods&&d.methods.length>0){mh='<div class="modal-subtitle">اختر وسيلة الاستلام:</div>'+d.methods.map(m=>`<div class="method-item" onclick="selWdr('${m.account_number}','${m.id}')"><span class="method-icon">${m.icon||'💳'}</span><div class="method-info"><div class="method-name">${m.method_name}</div><div class="method-type">${m.account_number}</div></div></div>`).join('');}}catch(e){}mb.innerHTML=`<div class="modal-title">💸 سحب</div><div class="modal-subtitle">رصيدك: ${bal.toLocaleString()}</div>${mh}<div class="modal-subtitle" style="margin-top:8px">✍️ أو اكتب يدوياً:</div><input class="modal-input" id="wdrAcc" placeholder="رقم الحساب"><input class="modal-input" id="wdrAmt" type="number" placeholder="المبلغ" max="${bal}"><button class="modal-btn-primary" onclick="subWdr()">✅ تأكيد السحب</button><button class="modal-btn-secondary" onclick="closeModal()">إلغاء</button>`;
  let wAcc='',wMid='';window.selWdr=function(ac,mid){document.querySelectorAll('.method-item').forEach(m=>m.style.borderColor='var(--border)');event.target.closest('.method-item').style.borderColor='var(--gold)';wAcc=ac;wMid=mid;};window.subWdr=async function(){const a=parseFloat(document.getElementById('wdrAmt').value)||0;const ac=wAcc||document.getElementById('wdrAcc').value.trim();if(a<=0||!ac){alert('أدخل المبلغ ورقم الحساب');return;}try{const r=await apiFetch(`${BASE}/api/wallet/withdraw`,{method:'POST',body:JSON.stringify({uid,amount:a,method_id:wMid,account_number:ac})});const d=await r.json();if(d.success){mb.innerHTML=`<div style="text-align:center;padding:16px"><div style="font-size:28px">⏳</div><div class="modal-title">تم الطلب</div><div class="modal-subtitle">بانتظار موافقة الإدارة</div><button class="modal-btn-secondary" onclick="closeModal();loadBalance();">إغلاق</button></div>`;}else{alert(d.error||'خطأ');}}catch(e){alert('خطأ');}};}
function showCurrencyPicker(){const cs=[{code:'EGP',name:'جنيه مصري 🇪🇬'},{code:'SAR',name:'ريال سعودي 🇸🇦'},{code:'USD',name:'دولار 🇺🇸'},{code:'USDT',name:'تيذر 🪙'},{code:'AED',name:'درهم 🇦🇪'},{code:'KWD',name:'دينار كويتي 🇰🇼'}];document.getElementById('modal').style.display='flex';document.getElementById('modalBox').innerHTML=`<div class="modal-title">💱 اختر العملة</div><div class="modal-subtitle">الحالية: ${document.getElementById('cur').textContent}</div>${cs.map(c=>`<div class="method-item" onclick="chCur('${c.code}')"><span style="font-size:18px">${c.name.slice(-2)}</span><div class="method-info"><div class="method-name">${c.name.slice(0,-3)}</div></div></div>`).join('')}<button class="modal-btn-secondary" onclick="closeModal()">إلغاء</button>`;}
window.chCur=async function(c){try{await apiFetch(`${BASE}/api/player/currency`,{method:'POST',body:JSON.stringify({uid,currency:c})});document.getElementById('cur').textContent=c;closeModal();loadBalance();loadGames();}catch(e){alert('خطأ');}};
loadBalance();loadProfile();loadGames();setInterval(loadBalance,5000);
connectLeaderboardStream('leaderboard');
</script>
</body>
</html>
