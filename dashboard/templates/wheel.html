<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>عجلة الحظ — VEX</title>
<link rel="stylesheet" href="/static/css/game-base.css">
<style>
/* ===== Wheel Pro ===== */
.game-area{background:radial-gradient(ellipse at 50% 100%,#1a0a14 0%,#0a0e17 70%)!important;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}

/* Quick stats */
.quick-stats{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:10}
.qstat{padding:2px 6px;border-radius:4px;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);font-size:9px;font-weight:700}
.qstat.best{color:#fbbf24}
.qstat.rounds{color:#06b6d4}
.qstat.wins{color:#00e701}

/* Other bets */
.other-bets{position:absolute;top:8px;left:8px;max-width:130px;z-index:10;max-height:200px;overflow-y:auto}
.other-bets::-webkit-scrollbar{display:none}
.other-bet{display:flex;align-items:center;gap:4px;padding:3px 8px;margin:2px 0;border-radius:8px;font-size:10px;font-weight:600;backdrop-filter:blur(4px);animation:betSlideIn 0.3s}
.other-bet.active{background:rgba(0,231,1,0.1);border:1px solid rgba(0,231,1,0.2);color:#00e701}
.other-bet.win{background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.3);color:#fbbf24}
.other-bet.lose{background:rgba(255,71,87,0.08);border:1px solid rgba(255,71,87,0.2);color:#ff4757;opacity:0.5}
.other-bet .avatar{width:14px;height:14px;border-radius:50%;background:#334155;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700}
@keyframes betSlideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}

/* Wheel */
#wheel-container{position:relative;width:300px;height:300px;filter:drop-shadow(0 0 40px rgba(251,191,36,0.15))}
#wheel{width:100%;height:100%;transition:transform 5s var(--ease-spring)}
.pointer{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:32px;z-index:10;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.6))}
.result-display{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:36px;font-weight:900;z-index:5;text-shadow:0 0 30px rgba(251,191,36,0.6);opacity:0;transition:all 0.3s}
.result-display.show{opacity:1;animation:resultPop 0.5s var(--ease-spring)}
@keyframes resultPop{0%{transform:translate(-50%,-50%) scale(0)}50%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1)}}

/* Game status */
.game-status{position:absolute;top:12%;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);z-index:5}

/* Recovery msg */
.recovery-msg{position:absolute;top:8%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);padding:8px 16px;border-radius:12px;font-size:12px;font-weight:700;z-index:15;display:none;text-align:center;border:1px solid rgba(255,255,255,0.05)}
.recovery-msg.show{display:block;animation:fadeIn 0.3s}

/* Big win */
.big-win-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:30;pointer-events:none}
.big-win-overlay.show{display:flex}
.big-win-text{font-size:48px;font-weight:900;background:linear-gradient(135deg,#fbbf24,#f59e0b,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:goldBurst 0.8s ease-out}
@keyframes goldBurst{0%{transform:scale(0) rotate(-180deg);opacity:0}50%{transform:scale(1.5) rotate(0);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}

/* Screen shake */
.shake-screen{animation:screenShake 0.4s}
@keyframes screenShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,-2px)}40%{transform:translate(4px,2px)}60%{transform:translate(-2px,4px)}80%{transform:translate(2px,-4px)}}

/* Countdown */
.countdown{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);font-size:64px;font-weight:900;color:var(--gold);z-index:20;text-shadow:0 0 40px rgba(251,191,36,0.6);animation:countdownPop 0.8s}
@keyframes countdownPop{0%{transform:translate(-50%,-50%) scale(2);opacity:0}50%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(0.5);opacity:0}}

/* Auto-spin */
.auto-row{display:flex;gap:6px;align-items:center;margin-top:6px}
.auto-checkbox{accent-color:var(--green);width:14px;height:14px;cursor:pointer}
.auto-input{width:60px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-xs);padding:5px 6px;color:var(--text);font-size:12px;text-align:center;outline:none;font-family:'Courier New',monospace}

/* Potential */
.potential{display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding:6px 10px;background:var(--surface-2);border-radius:var(--radius-xs)}
.pot-label{font-size:10px;color:var(--muted)}
.pot-val{font-size:14px;font-weight:700;color:var(--green);font-family:'Courier New',monospace}
</style>
</head>
<body>
<div class="loader-screen" id="loading"><div class="spinner"></div></div>
<div id="app" style="display:none">
  <div class="game-topbar">
    <div class="topbar-left">
      <button class="btn-back" onclick="goBack()">‹</button>
      <div class="bal-pill"><span class="bal-icon">💰</span><span class="bal-val" id="bal">0</span><span class="bal-cur" id="cur">EGP</span></div>
    </div>
    <div class="topbar-right">
      <span class="streak-badge" id="streak" style="display:none">🔥 0</span>
      <button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊</button>
    </div>
  </div>

  <div class="hist-bar" id="history"></div>

  <div class="game-area" id="gameArea">
    <div class="stars-bg" id="stars"></div>
    <div class="quick-stats">
      <div class="qstat best">أفضل: <span id="qBest">0.00x</span></div>
      <div class="qstat rounds">جولات: <span id="qRounds">0</span></div>
      <div class="qstat wins">فوز: <span id="qWins">0</span></div>
    </div>
    <div class="other-bets" id="otherBets"></div>
    <div class="game-status" id="statusText">ضع رهانك وأدر العجلة!</div>
    <div class="recovery-msg" id="recoveryMsg"></div>
    <div class="big-win-overlay" id="bigWin"><div class="big-win-text" id="bigWinText"></div></div>
    <div id="wheel-container">
      <div class="pointer">🔻</div>
      <canvas id="wheel" width="300" height="300"></canvas>
      <div class="result-display" id="resultDisplay"></div>
    </div>
  </div>

  <div class="bet-panel">
    <div class="bet-row">
      <div class="bet-input-wrap">
        <input type="number" class="bet-input" id="betInput" value="10" min="1" oninput="updatePotential()">
        <span class="bet-cur" id="betCur">EGP</span>
      </div>
    </div>
    <div class="bet-controls">
      <div class="bet-ctrl" onclick="adjustBet(0.5)">½</div>
      <div class="bet-ctrl" onclick="adjustBet(2)">2×</div>
      <div class="bet-ctrl" onclick="setBet('min')">Min</div>
      <div class="bet-ctrl" onclick="setBet('max')">Max</div>
    </div>
    <div class="auto-row">
      <input type="checkbox" class="auto-checkbox" id="autoSpin" onchange="toggleAutoSpin()">
      <span class="auto-label">دوران تلقائي ×</span>
      <input type="number" class="auto-input" id="autoRounds" value="5" min="1" max="50">
      <span class="auto-label">مرات</span>
    </div>
    <div class="potential">
      <span class="pot-label">ربح محتمل (x3):</span>
      <span class="pot-val" id="potVal">30.00</span>
    </div>
    <div class="action-row">
      <button class="btn-action btn-bet-green" id="spinBtn" onclick="spinWheel()">🎡 ادر العجلة</button>
    </div>
  </div>

  <div class="lp-bar">
    <div class="lp-header"><span>👥 <span class="lp-count" id="lpCount">0</span></span><span id="lpTotal">💰 0</span></div>
    <div class="lp-list" id="lpList"></div>
  </div>
</div>

<script src="/static/js/game-base.js"></script>
<script>
let isSpinning=0,curRot=0,qBest=0,qRounds=0,qWins=0;
let autoPlaying=false,autoRoundsLeft=0,currentBet=0;

const SEGMENTS=[
  {m:0,c:'#ff4757',label:'💥'},
  {m:1.5,c:'#fbbf24',label:'1.5x'},
  {m:0,c:'#334155',label:'💥'},
  {m:2,c:'#00e701',label:'2x'},
  {m:0.5,c:'#3b82f6',label:'0.5x'},
  {m:0,c:'#ff4757',label:'💥'},
  {m:3,c:'#a78bfa',label:'3x'},
  {m:0.5,c:'#06b6d4',label:'0.5x'}
];

function drawWheel(){
  const cv=document.getElementById('wheel'),cx=cv.getContext('2d');
  const w=cv.width/2,h=cv.height/2,r=Math.min(w,h)-5,sa=2*Math.PI/SEGMENTS.length;
  cx.clearRect(0,0,cv.width,cv.height);

  // Outer glow ring
  cx.beginPath();cx.arc(w,h,r+3,0,2*Math.PI);
  cx.strokeStyle='rgba(251,191,36,0.2)';cx.lineWidth=4;cx.stroke();

  SEGMENTS.forEach((s,i)=>{
    const a=i*sa-Math.PI/2;
    // Segment
    cx.beginPath();cx.moveTo(w,h);
    cx.arc(w,h,r,a,a+sa);cx.closePath();
    cx.fillStyle=s.c;cx.fill();
    cx.strokeStyle='#1e293b';cx.lineWidth=2;cx.stroke();

    // Label
    cx.save();
    cx.translate(w,h);cx.rotate(a+sa/2);
    cx.fillStyle='#fff';cx.font='bold 14px sans-serif';cx.textAlign='center';
    cx.fillText(s.label,r-24,5);
    cx.restore();
  });

  // Center hub
  cx.beginPath();cx.arc(w,h,20,0,2*Math.PI);
  cx.fillStyle='#131826';cx.fill();
  cx.strokeStyle='#fbbf24';cx.lineWidth=3;cx.stroke();
  // Center dot
  cx.beginPath();cx.arc(w,h,6,0,2*Math.PI);
  cx.fillStyle='#fbbf24';cx.fill();
}

function showCountdown(cb){
  let c=3;
  const show=()=>{
    const el=document.createElement('div');
    el.className='countdown';el.textContent=c;
    document.getElementById('gameArea').appendChild(el);
    soundTick();haptic('light');
    setTimeout(()=>el.remove(),800);
    c--;if(c>0)setTimeout(show,600);else setTimeout(cb,600);
  };
  show();
}

function spinWheel(){
  if(isSpinning)return;
  currentBet=parseFloat(document.getElementById('betInput').value)||0;
  if(currentBet<1)return;

  apiFetch(BASE+'/api/engine/result',{method:'POST',body:JSON.stringify({uid,game_id:'GAME009',bet_amount:currentBet})}).then(r=>r.json()).then(d=>{
    if(!d.success){
      if(d.need_deposit)showVexDepositModal(currentBet);
      else showToast(d.error||'خطأ','error');return;
    }
    isSpinning=1;document.getElementById('spinBtn').disabled=1;
    document.getElementById('resultDisplay').classList.remove('show');
    document.getElementById('statusText').textContent='🎰 جاري الدوران...';
    document.getElementById('bal').textContent=(d.balance_after||0).toLocaleString();
    addOtherBet(currentBet);

    showCountdown(()=>{
      const mult=d.payout/currentBet;
      let ts=0;
      if(mult>=3)ts=6;
      else if(mult>=2)ts=3;
      else if(mult>=1.5)ts=1;
      else if(mult>=0.5)ts=4;
      else if(mult>0)ts=7;
      else ts=Math.random()<0.5?0:2;

      const sa=360/SEGMENTS.length;
      const ta=ts*sa+sa/2;
      const spins=5+Math.floor(Math.random()*2);
      const fr=curRot+spins*360+(360-ta)-(curRot%360);
      const cv=document.getElementById('wheel');
      cv.style.transition='transform 5s var(--ease-spring)';
      cv.style.transform='rotate('+fr+'deg)';
      curRot=fr;

      // Tick sounds
      let tc=0;
      const ti=setInterval(()=>{
        tc++;if(tc>40){clearInterval(ti);return;}
        soundTick();haptic('light');
        if(tc>30)clearInterval(ti);
      },120);

      setTimeout(()=>{
        finishSpin(d,mult);
      },5100);
    });
  }).catch(()=>{isSpinning=0;document.getElementById('spinBtn').disabled=0;showToast('خطأ','error');});
}

function finishSpin(d,mult){
  const rd=document.getElementById('resultDisplay');
  if(d.result==='win'){
    rd.textContent='🎉 +'+d.payout.toFixed(0);
    rd.style.color='#fbbf24';rd.classList.add('show');
    soundWin(mult>=3);haptic('medium');
    fireConfetti(document.getElementById('gameArea'));
    streakWin++;updateStreak(document.getElementById('streak'));
    if(mult>=3){showBigWin(d.payout,mult);document.getElementById('app').classList.add('shake-screen');setTimeout(()=>document.getElementById('app').classList.remove('shake-screen'),400);}
    updateOtherBetWin(d.payout);
    qWins++;
    document.getElementById('statusText').textContent='🎉 فزت '+d.payout.toFixed(0)+'!';
  } else {
    rd.textContent='💔 0';rd.style.color='#ff4757';rd.classList.add('show');
    soundLose();haptic('heavy');
    streakWin=0;updateStreak(document.getElementById('streak'));
    updateOtherBetLose();
    if(currentBet>=20)showRecovery(currentBet);
    document.getElementById('statusText').textContent='💔 حظ أوفر';
  }

  qBest=Math.max(qBest,mult);qRounds++;
  document.getElementById('qBest').textContent=qBest.toFixed(2)+'x';
  document.getElementById('qRounds').textContent=qRounds;
  document.getElementById('qWins').textContent=qWins;
  addHistory('history',mult,d.result==='win',mult>=3);

  isSpinning=0;document.getElementById('spinBtn').disabled=0;

  // Auto-spin continue
  if(autoPlaying&&autoRoundsLeft>0){
    autoRoundsLeft--;
    if(autoRoundsLeft>0){
      showToast('دوران تلقائي: '+autoRoundsLeft+' متبقية','info');
      setTimeout(()=>{if(!isSpinning)spinWheel();},1500);
      return;
    } else {
      autoPlaying=false;
      document.getElementById('autoSpin').checked=false;
    }
  }
}

function toggleAutoSpin(){
  autoPlaying=document.getElementById('autoSpin').checked;
  if(autoPlaying){
    autoRoundsLeft=parseInt(document.getElementById('autoRounds').value)||5;
    if(!isSpinning)spinWheel();
  }
}

function updatePotential(){
  const bet=parseFloat(document.getElementById('betInput').value)||0;
  const el=document.getElementById('potVal');
  if(el)el.textContent=(bet*3).toFixed(2);
}

function showBigWin(payout,m){
  const o=document.getElementById('bigWin');
  document.getElementById('bigWinText').textContent='🎉 +'+payout.toFixed(0)+' @ '+m.toFixed(2)+'x';
  o.classList.add('show');
  setTimeout(()=>o.classList.remove('show'),2500);
}

function showRecovery(lostAmt){
  const msgs=['💪 خسارة '+lostAmt+' — العجلة القادمة أفضل!','🔥 الجو حار — العجلة تدور لصالحك!','⚡ كل دورة تقربك من الجائزة!','🎯 3x ينتظرك!'];
  const m=msgs[Math.floor(Math.random()*msgs.length)];
  const el=document.getElementById('recoveryMsg');el.textContent=m;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3000);
}

// Other bets
function addOtherBet(amt){
  const c=document.getElementById('otherBets');
  const e=document.createElement('div');e.className='other-bet active';e.id='ob';
  e.innerHTML='<div class="avatar">أ</div><span>'+amt+'</span>';
  c.appendChild(e);
}
function updateOtherBetWin(pay){
  const e=document.getElementById('ob');
  if(e){e.className='other-bet win';e.innerHTML='<div class="avatar">أ</div><span>+'+pay.toFixed(0)+'</span>';}
}
function updateOtherBetLose(){
  const e=document.getElementById('ob');
  if(e){e.className='other-bet lose';e.innerHTML='<div class="avatar">أ</div><span>💥</span>';}
}
function simulateFakeBets(){
  if(!isSpinning&&Math.random()<0.3){
    const name=['أحمد','عمر','محمد','خالد','سعد','فهد','ناصر','يوسف','علي','حسن'][Math.floor(Math.random()*10)];
    const bet=[10,20,50,100,200,500][Math.floor(Math.random()*6)];
    const m=SEGMENTS[Math.floor(Math.random()*SEGMENTS.length)].m;
    addPlayer({uid:'fake_'+Math.random().toString(36).substr(2,5),name,bet,status:m>0?'win':'lose',multiplier:m,isMe:false});
  }
}

// Init
createStars('stars');
drawWheel();loadBalance();updatePotential();
document.getElementById('loading').style.display='none';
document.getElementById('app').style.display='flex';
setInterval(loadBalance,5000);
setInterval(simulatePlayers,2500);
setInterval(simulateFakeBets,3000);
simulatePlayers();renderPlayers();
</script>
</body>
</html>
