<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>عجلة الحظ — VEX</title>
<link rel="stylesheet" href="/static/css/game-base.css">
<style>
#wheel-container{position:relative;width:300px;height:300px}
#wheel{width:100%;height:100%;transition:transform 5s var(--ease-spring)}
.pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:30px;z-index:10;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5))}
.result-display{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px;font-weight:900;z-index:5;text-shadow:0 0 20px rgba(251,191,36,0.5);opacity:0;transition:all 0.3s}
.result-display.show{opacity:1}
</style>
</head>
<body>
<div class="loader-screen" id="loading"><div class="spinner"></div></div>
<div id="app" style="display:none">
  <div class="game-topbar">
    <div class="topbar-left"><button class="btn-back" onclick="goBack()">‹</button><div class="bal-pill"><span class="bal-icon">💰</span><span class="bal-val" id="bal">0</span><span class="bal-cur" id="cur">EGP</span></div></div>
    <div class="topbar-right"><span class="streak-badge" id="streak" style="display:none">🔥 0</span><button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊</button></div>
  </div>
  <div class="hist-bar" id="history"></div>
  <div class="game-area" id="gameArea">
    <div id="wheel-container"><div class="pointer">🔻</div><canvas id="wheel" width="300" height="300"></canvas><div class="result-display" id="resultDisplay"></div></div>
  </div>
  <div class="bet-panel">
    <div class="bet-row"><div class="bet-input-wrap"><input type="number" class="bet-input" id="betInput" value="10" min="1"><span class="bet-cur" id="betCur">EGP</span></div></div>
    <div class="bet-controls"><div class="bet-ctrl" onclick="adjustBet(0.5)">½</div><div class="bet-ctrl" onclick="adjustBet(2)">2×</div><div class="bet-ctrl" onclick="setBet('min')">Min</div><div class="bet-ctrl" onclick="setBet('max')">Max</div></div>
    <div class="action-row"><button class="btn-action btn-bet-green" id="spinBtn" onclick="spinWheel()">🎡 ادر العجلة</button></div>
  </div>
</div>
<div class="lp-bar"><div class="lp-header"><span>👥 <span class="lp-count" id="lpCount">0</span></span><span id="lpTotal">💰 0</span></div><div class="lp-list" id="lpList"></div></div>
<script src="/static/js/game-base.js"></script>
<script>
let isSpinning=0,curRot=0;
const SEGMENTS=[{m:0,c:'#ff4757'},{m:1.5,c:'#fbbf24'},{m:0,c:'#334155'},{m:2,c:'#00e701'},{m:0.5,c:'#3b82f6'},{m:0,c:'#ff4757'},{m:3,c:'#a78bfa'},{m:0.5,c:'#06b6d4'}];
function drawWheel(){const cv=document.getElementById('wheel'),cx=cv.getContext('2d'),w=cv.width/2,h=cv.height/2,r=Math.min(w,h)-5,sa=2*Math.PI/SEGMENTS.length;cx.clearRect(0,0,cv.width,cv.height);SEGMENTS.forEach((s,i)=>{const a=i*sa-Math.PI/2;cx.beginPath();cx.moveTo(w,h);cx.arc(w,h,r,a,a+sa);cx.closePath();cx.fillStyle=s.c;cx.fill();cx.strokeStyle='#1e293b';cx.lineWidth=2;cx.stroke();cx.save();cx.translate(w,h);cx.rotate(a+sa/2);cx.fillStyle='#fff';cx.font='bold 13px sans-serif';cx.textAlign='center';cx.fillText(s.m+'x',r-22,5);cx.restore();});cx.beginPath();cx.arc(w,h,18,0,2*Math.PI);cx.fillStyle='#131826';cx.fill();cx.strokeStyle='#fbbf24';cx.lineWidth=2;cx.stroke();}
function spinWheel(){if(isSpinning)return;const bet=parseFloat(document.getElementById('betInput').value)||0;if(bet<1)return;
  apiFetch(`${BASE}/api/engine/result`,{method:'POST',body:JSON.stringify({uid,game_id:'GAME009',bet_amount:bet})}).then(r=>r.json()).then(d=>{
    if(!d.success){if(d.need_deposit)showVexDepositModal(bet);else showToast(d.error||'خطأ','error');return;}
    isSpinning=1;document.getElementById('spinBtn').disabled=1;document.getElementById('resultDisplay').classList.remove('show');
    const mult=d.payout/bet;let ts=0;if(mult>=3)ts=6;else if(mult>=2)ts=3;else if(mult>=1.5)ts=1;else if(mult>=0.5)ts=4;else if(mult>0)ts=7;else ts=Math.random()<0.5?0:2;
    const sa=360/SEGMENTS.length,ta=ts*sa+sa/2,spins=5,fr=curRot+spins*360+(360-ta)-(curRot%360),cv=document.getElementById('wheel');
    cv.style.transition='transform 5s var(--ease-spring)';cv.style.transform=`rotate(${fr}deg)`;curRot=fr;
    let tc=0;const ti=setInterval(()=>{tc++;if(tc>35){clearInterval(ti);return;}soundTick();if(tc>25)clearInterval(ti);},120);
    setTimeout(()=>{const rd=document.getElementById('resultDisplay');if(d.result==='win'){rd.textContent=`🎉 +${d.payout.toFixed(0)}`;rd.style.color='#00e701';rd.classList.add('show');soundWin(mult>=3);haptic('medium');fireConfetti(document.getElementById('gameArea'));streakWin++;updateStreak(document.getElementById('streak'));}else{rd.textContent='💔 0';rd.style.color='#ff4757';rd.classList.add('show');soundLose();haptic('heavy');streakWin=0;updateStreak(document.getElementById('streak'));}
      document.getElementById('bal').textContent=(d.balance_after||0).toLocaleString();
      addHistory('history',mult,d.result==='win',mult>=3);
      isSpinning=0;document.getElementById('spinBtn').disabled=0;},5100);
  }).catch(()=>{isSpinning=0;document.getElementById('spinBtn').disabled=0;showToast('خطأ','error');});
}
drawWheel();loadBalance();document.getElementById('loading').style.display='none';document.getElementById('app').style.display='flex';setInterval(loadBalance,5000);setInterval(simulatePlayers,2500);simulatePlayers();renderPlayers();
</script>
</body>
</html>
