<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>عجلة الحظ — VEX</title>
<link rel="stylesheet" href="/static/css/game-base.css?v=20260811">
<style>
.game-area{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px;overflow:hidden}
.wheel-wrap{position:relative;width:min(70vw,280px);height:min(70vw,280px);flex-shrink:0}
#wheelCanvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 40px rgba(251,191,36,.25),0 8px 30px rgba(0,0,0,.4)}
.wheel-pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:32px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));z-index:10;transition:transform .05s}
.wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:radial-gradient(circle,#fbbf24,#92400e);border:3px solid #fff;box-shadow:0 0 12px rgba(251,191,36,.6);z-index:10}
.wheel-result{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.wheel-result-mult{font-size:28px;font-weight:900;font-family:'Courier New',monospace;opacity:0;transition:opacity .3s,transform .3s;transform:scale(.8)}
.wheel-result-mult.show{opacity:1;transform:scale(1)}
.wheel-result-sub{font-size:13px;color:var(--text-dim);opacity:0;transition:opacity .3s}
.wheel-result-sub.show{opacity:1}
.bet-row{display:flex;align-items:center;gap:6px;width:100%;max-width:320px}
.bet-inp{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px 10px;border-radius:var(--radius-sm);font-size:16px;font-weight:700;text-align:center;font-family:'Courier New',monospace;-moz-appearance:textfield}
.bet-inp::-webkit-inner-spin-button,.bet-inp::-webkit-outer-spin-button{display:none}
.ctrl-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);padding:11px 9px;border-radius:var(--radius-sm);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.ctrl-btn:active{transform:scale(.92)}
.spin-btn{width:100%;max-width:320px;padding:15px;border-radius:var(--radius);font-size:18px;font-weight:900;border:none;cursor:pointer;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000;box-shadow:0 4px 20px rgba(251,191,36,.4);transition:all .2s}
.spin-btn:active{transform:scale(.97)}
.spin-btn:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed;box-shadow:none}
.seg-legend{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:320px}
.seg-chip{padding:3px 8px;border-radius:8px;font-size:10px;font-weight:700;font-family:'Courier New',monospace}
</style>
</head>
<body>
<div id="app" style="display:none">
  <div class="game-topbar">
    <div class="topbar-left">
      <button class="btn-back" onclick="if(tg)tg.close();else history.back()">←</button>
      <div class="bal-pill"><span class="bal-icon">💰</span><span class="bal-val" id="bal">0</span><span class="bal-cur" id="cur">EGP</span></div>
    </div>
    <div class="topbar-right">
      <span class="streak-badge" id="streakBadge" style="display:none"></span>
      <button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊</button>
      <span id="connIndicator">🟢</span>
    </div>
  </div>
  <div class="hist-bar" id="histBar"></div>

  <div class="game-area" style="flex:1;overflow-y:auto">
    <div class="wheel-wrap">
      <div class="wheel-pointer">▼</div>
      <canvas id="wheelCanvas" width="280" height="280"></canvas>
      <div class="wheel-center"></div>
    </div>

    <div class="wheel-result">
      <div class="wheel-result-mult" id="resultMult"></div>
      <div class="wheel-result-sub" id="resultSub"></div>
    </div>

    <div class="bet-row">
      <button class="ctrl-btn" onclick="adjustBet('betInp',0.5)">½</button>
      <input type="number" class="bet-inp" id="betInp" value="10" min="1">
      <button class="ctrl-btn" onclick="adjustBet('betInp',2)">2×</button>
      <button class="ctrl-btn" onclick="setBetMin('betInp',10)">Min</button>
      <button class="ctrl-btn" onclick="setBetMax('betInp',5000)">Max</button>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spin()">🎰 أدر العجلة</button>

    <div class="seg-legend" id="segLegend"></div>
  </div>
</div>
<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);flex-direction:column;gap:12px">
  <div style="font-size:40px">🎡</div>
  <div style="color:var(--text-dim);font-size:14px">جارٍ التحميل...</div>
</div>
<script src="/static/js/game-base.js?v=20260811"></script>
<script>
'use strict';
var canvas = document.getElementById('wheelCanvas');
var ctx = canvas.getContext('2d');
var W = canvas.width; var H = canvas.height;
var cx = W/2; var cy = H/2; var radius = W/2 - 6;
var spinning = false;
var currentAngle = 0;
var SEGMENTS = [
  { mult: 0.0, label: '💀', color: '#1e293b' },
  { mult: 1.5, label: '1.5x', color: '#1d4ed8' },
  { mult: 2.0, label: '2x', color: '#15803d' },
  { mult: 0.5, label: '0.5x', color: '#7c3aed' },
  { mult: 5.0, label: '5x', color: '#b45309' },
  { mult: 1.0, label: '1x', color: '#0e7490' },
  { mult: 10.0, label: '10x', color: '#9d174d' },
  { mult: 0.0, label: '💀', color: '#1e293b' }
];
var N = SEGMENTS.length;
var segAngle = (Math.PI * 2) / N;

function drawWheel(angle) {
  ctx.clearRect(0, 0, W, H);
  // Outer glow
  var glow = ctx.createRadialGradient(cx, cy, radius - 10, cx, cy, radius + 6);
  glow.addColorStop(0, 'rgba(251,191,36,0.0)');
  glow.addColorStop(1, 'rgba(251,191,36,0.15)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, radius + 6, 0, 6.28); ctx.fill();

  for (var i = 0; i < N; i++) {
    var startAngle = angle + i * segAngle - Math.PI/2;
    var endAngle = startAngle + segAngle;
    var seg = SEGMENTS[i];
    // Segment fill
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
    g.addColorStop(0, seg.color + 'cc'); g.addColorStop(1, seg.color);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, radius, startAngle, endAngle); ctx.closePath();
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2; ctx.stroke();
    // Text
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + segAngle/2);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Courier New';
    ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 4;
    ctx.fillText(seg.label, radius - 14, 0);
    ctx.shadowBlur = 0; ctx.restore();
  }
  // Border ring
  ctx.beginPath(); ctx.arc(cx, cy, radius, 0, 6.28);
  ctx.strokeStyle = 'rgba(251,191,36,0.6)'; ctx.lineWidth = 4; ctx.stroke();
  // Inner circle
  ctx.beginPath(); ctx.arc(cx, cy, 22, 0, 6.28);
  var ig = ctx.createRadialGradient(cx-4, cy-4, 2, cx, cy, 22);
  ig.addColorStop(0, '#fbbf24'); ig.addColorStop(1, '#78350f');
  ctx.fillStyle = ig; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
}

function buildLegend() {
  var legend = document.getElementById('segLegend');
  SEGMENTS.forEach(function(s) {
    var chip = document.createElement('div');
    chip.className = 'seg-chip';
    chip.style.background = s.color + '33';
    chip.style.color = '#fff';
    chip.style.border = '1px solid ' + s.color + '66';
    chip.textContent = s.label;
    legend.appendChild(chip);
  });
}

function spin() {
  if (spinning) return;
  var bet = parseFloat(document.getElementById('betInp').value) || 10;
  if (!checkBalanceBeforeBet(bet)) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('resultMult').classList.remove('show');
  document.getElementById('resultSub').classList.remove('show');

  apiFetchCritical(BASE + '/api/wheel/spin', {
    method: 'POST',
    body: JSON.stringify({ uid: uid, bet: bet })
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.error) {
      showToast(d.error, 'error');
      if (d.need_deposit) showDepositModal(bet);
      spinning = false; document.getElementById('spinBtn').disabled = false; return;
    }
    // Find segment index
    var segIdx = d.segment !== undefined ? d.segment : Math.floor(Math.random() * N);
    var seg = SEGMENTS[segIdx];
    var targetAngle = -(segIdx * segAngle) - segAngle/2 + Math.PI/2;
    var fullSpins = (3 + Math.floor(Math.random() * 4)) * Math.PI * 2;
    var finalAngle = targetAngle - fullSpins;
    animateSpin(currentAngle, finalAngle, seg, d.payout || 0, bet);
    loadBalance();
  }).catch(function() {
    showToast('خطأ في الشبكة', 'error');
    spinning = false; document.getElementById('spinBtn').disabled = false;
  });
}

function animateSpin(fromAngle, toAngle, seg, payout, bet) {
  var duration = 4000 + Math.random() * 1000;
  var start = null;
  var tickCount = 0;
  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }
  function frame(ts) {
    if (!start) start = ts;
    var elapsed = ts - start;
    var t = Math.min(elapsed / duration, 1);
    var easedT = easeOut(t);
    currentAngle = fromAngle + (toAngle - fromAngle) * easedT;
    drawWheel(currentAngle);
    // Tick sound as pointer crosses segments
    var segsPerRad = 1 / segAngle;
    var prevSeg = Math.floor((fromAngle + (toAngle - fromAngle) * easeOut((elapsed - 16) / duration)) * segsPerRad);
    var curSeg = Math.floor(currentAngle * segsPerRad);
    if (curSeg !== prevSeg && t < 0.8) { soundSpin(); haptic('light'); }
    if (t < 1) { requestAnimationFrame(frame); }
    else {
      currentAngle = toAngle;
      drawWheel(currentAngle);
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
      showWheelResult(seg, payout, bet);
    }
  }
  requestAnimationFrame(frame);
}

function showWheelResult(seg, payout, bet) {
  var multEl = document.getElementById('resultMult');
  var subEl = document.getElementById('resultSub');
  if (seg.mult === 0) {
    multEl.textContent = '💀 خسارة!';
    multEl.style.color = 'var(--red)';
    subEl.textContent = 'حظ أفضل في المرة القادمة';
    soundLose(); hapticNotif('error');
    streakWin = 0;
  } else {
    multEl.textContent = seg.mult.toFixed(1) + 'x';
    multEl.style.color = seg.mult >= 5 ? 'var(--gold)' : 'var(--green)';
    subEl.textContent = '+ ' + fmtAmount(payout) + ' ' + gameCurrency;
    soundWin(seg.mult >= 5); hapticNotif('success');
    streakWin++;
    if (seg.mult >= 5) showBigWinOverlay(payout, seg.mult);
  }
  multEl.classList.add('show'); subEl.classList.add('show');
  updateStreak(document.getElementById('streakBadge'));
  addHistItem(document.getElementById('histBar'), seg.mult || 0.1);
}

// Init
drawWheel(0);
buildLegend();
document.getElementById('loading').style.display = 'none';
document.getElementById('app').style.display = 'flex';
document.getElementById('app').style.flexDirection = 'column';
document.getElementById('app').style.height = '100dvh';
loadBalance();
setInterval(loadBalance, 10000);
initBackButton();
</script>
</body>
</html>
