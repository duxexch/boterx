{% extends 'base.html' %}
{% block title %}بث رسالة — VEX{% endblock %}
{% block page_title %}📢 بث رسالة{% endblock %}

{% block content %}
<div x-data="broadcastApp()" class="space-y-4 max-w-3xl">
    <!-- Broadcast Form -->
    <div class="bg-slate-800 rounded-xl border border-slate-700 p-6">
        <h3 class="font-semibold mb-4">📢 إرسال بث</h3>
        <div class="space-y-4">
            <!-- Recipient Type -->
            <div>
                <label class="block text-sm text-slate-400 mb-2">👥 المستلمون</label>
                <div class="grid grid-cols-2 gap-2">
                    <button @click="recipient='all'" :class="recipient==='all' ? 'bg-blue-600 text-white border-blue-500' : 'bg-slate-700 text-slate-400 border-slate-600'" class="px-4 py-3 rounded-lg border-2 text-sm font-bold transition">
                        <i class="fas fa-bullhorn block mb-1"></i> جماعي (الكل)
                    </button>
                    <button @click="recipient='single'" :class="recipient==='single' ? 'bg-amber-600 text-white border-amber-500' : 'bg-slate-700 text-slate-400 border-slate-600'" class="px-4 py-3 rounded-lg border-2 text-sm font-bold transition">
                        <i class="fas fa-user block mb-1"></i> فردي
                    </button>
                </div>
            </div>

            <!-- Single User Search (only if recipient=single) -->
            <div x-show="recipient==='single'" x-transition>
                <label class="block text-sm text-slate-400 mb-2">🔍 ابحث عن مستخدم</label>
                <div class="relative">
                    <input type="text" x-model="searchQuery" @input.debounce.300ms="searchUsers()" class="input w-full" placeholder="اسم أو رقم عميل أو telegram_id...">
                    <div x-show="searchResults.length > 0" class="absolute z-10 mt-1 w-full bg-slate-700 border border-slate-600 rounded-lg max-h-48 overflow-y-auto shadow-xl">
                        <template x-for="u in searchResults" :key="u.telegram_id">
                            <div @click="selectUser(u)" class="p-3 hover:bg-slate-600 cursor-pointer border-b border-slate-600/50">
                                <div class="text-sm font-bold text-slate-200" x-text="u.name"></div>
                                <div class="text-xs text-slate-400" x-text="u.customer_id + ' • ' + u.currency"></div>
                            </div>
                        </template>
                    </div>
                </div>
                <div x-show="selectedUser" class="mt-2 p-3 bg-green-600/10 border border-green-600/20 rounded-lg flex items-center justify-between">
                    <div>
                                        <span class="text-sm font-bold text-green-400">✅ تم تحديد: </span>
                        <span class="text-sm text-slate-200" x-text="selectedUser?.name"></span>
                        <span class="text-xs text-slate-400 ml-2" x-text="selectedUser?.customer_id"></span>
                    </div>
                    <button @click="selectedUser=null" class="text-red-400 hover:text-red-300"><i class="fas fa-times"></i></button>
                </div>
            </div>

            <!-- Country Filter -->
            <div x-show="recipient==='all'" x-transition>
                <label class="block text-sm text-slate-400 mb-2">🌍 الدول</label>
                <div class="grid grid-cols-2 gap-2">
                    <button @click="countryFilter='all'" :class="countryFilter==='all' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-400'" class="px-3 py-2 rounded-lg text-sm font-bold transition">🌍 كل الدول</button>
                    <select x-model="countryFilter" x-show="countryFilter!=='all'" class="input text-sm flex-1">
                        <option value="all">🌍 كل الدول</option>
                        <option value="EG">🇪🇬 مصر</option>
                        <option value="SA">🇸🇦 السعودية</option>
                        <option value="AE">🇦🇪 الإمارات</option>
                        <option value="JO">🇯🇴 الأردن</option>
                        <option value="MA">🇲🇦 المغرب</option>
                        <option value="DZ">🇩🇿 الجزائر</option>
                        <option value="TN">🇹🇳 تونس</option>
                        <option value="IQ">🇮🇶 العراق</option>
                        <option value="LY">🇱🇾 ليبيا</option>
                        <option value="SD">🇸🇩 السودان</option>
                        <option value="YE">🇾🇪 اليمن</option>
                        <option value="PS">🇵🇸 فلسطين</option>
                        <option value="KW">🇰🇼 الكويت</option>
                        <option value="QA">🇶🇦 قطر</option>
                        <option value="BH">🇧🇭 البحرين</option>
                        <option value="OM">🇴🇲 عمان</option>
                        <option value="LB">🇱🇧 لبنان</option>
                        <option value="SY">🇸🇾 سوريا</option>
                    </select>
                </div>
                <button x-show="countryFilter==='all'" @click="countryFilter='EG'" class="mt-2 text-xs text-blue-400 hover:text-blue-300">← أو اختر دولة معينة</button>
            </div>

            <!-- Target Channel -->
            <div>
                <label class="block text-sm text-slate-400 mb-2">🎯 وجهة الإرسال</label>
                <div class="grid grid-cols-3 gap-2">
                    <button @click="target='telegram'" :class="target==='telegram' ? 'bg-blue-600 text-white border-blue-500' : 'bg-slate-700 text-slate-400 border-slate-600'" class="px-3 py-2 rounded-lg border-2 text-sm font-bold transition">
                        <i class="fab fa-telegram block text-lg mb-1"></i> تيليغرام
                    </button>
                    <button @click="target='web'" :class="target==='web' ? 'bg-green-600 text-white border-green-500' : 'bg-slate-700 text-slate-400 border-slate-600'" class="px-3 py-2 rounded-lg border-2 text-sm font-bold transition">
                        <i class="fas fa-globe block text-lg mb-1"></i> الموقع
                    </button>
                    <button @click="target='both'" :class="target==='both' ? 'bg-amber-600 text-white border-amber-500' : 'bg-slate-700 text-slate-400 border-slate-600'" class="px-3 py-2 rounded-lg border-2 text-sm font-bold transition">
                        <i class="fas fa-bullhorn block text-lg mb-1"></i> الاثنين
                    </button>
                </div>
            </div>

            <!-- Message Text -->
            <div>
                <label class="block text-sm text-slate-400 mb-2">💬 نص الرسالة</label>
                <textarea x-model="message" rows="4" class="input w-full" placeholder="اكتب رسالتك هنا... (يدعم HTML للتيليغرام)"></textarea>
                <p class="text-xs text-slate-500 mt-1">💡 للتيليغرام: <code>&lt;b&gt;غامق&lt;/b&gt;</code> <code>&lt;code&gt;كود&lt;/code&gt;</code></p>
            </div>

            <!-- Media Attachments (Multiple) -->
            <div>
                <label class="block text-sm text-slate-400 mb-2">📎 المرفقات (متعدد)</label>
                <div class="flex flex-wrap gap-2 mb-2">
                    <template x-for="(media, idx) in mediaList" :key="idx">
                        <div class="relative w-20 h-20 rounded-lg overflow-hidden bg-slate-700 border border-slate-600 group">
                            <img x-show="media.type.startsWith('image')" :src="media.url" class="w-full h-full object-cover">
                            <video x-show="media.type.startsWith('video')" :src="media.url" class="w-full h-full object-cover" muted></video>
                            <i x-show="!media.type.startsWith('image') && !media.type.startsWith('video')" class="fas fa-file text-2xl text-slate-400 w-full h-full flex items-center justify-center"></i>
                            <button @click="mediaList.splice(idx, 1)" class="absolute top-0 right-0 bg-red-600 text-white w-5 h-5 flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition"><i class="fas fa-times"></i></button>
                        </div>
                    </template>
                    <label class="w-20 h-20 rounded-lg border-2 border-dashed border-slate-500 flex items-center justify-center cursor-pointer hover:border-green-500 hover:bg-slate-700 transition">
                        <i class="fas fa-plus text-xl text-slate-400"></i>
                        <input type="file" class="hidden" accept="image/*,video/*" @change="uploadMedia($event)" :disabled="uploading">
                    </label>
                </div>
                <p class="text-xs text-slate-500" x-show="uploading">⏳ جارٍ الرفع...</p>
            </div>

            <!-- Priority -->
            <div>
                <label class="block text-sm text-slate-400 mb-2">⚡ الأولوية</label>
                <div class="grid grid-cols-3 gap-2">
                    <button @click="priority='normal'" :class="priority==='normal' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-400'" class="px-3 py-2 rounded-lg text-xs font-bold transition">🔔 عادية</button>
                    <button @click="priority='high'" :class="priority==='high' ? 'bg-amber-600 text-white' : 'bg-slate-700 text-slate-400'" class="px-3 py-2 rounded-lg text-xs font-bold transition">⚡ عالية</button>
                    <button @click="priority='urgent'" :class="priority==='urgent' ? 'bg-red-600 text-white' : 'bg-slate-700 text-slate-400'" class="px-3 py-2 rounded-lg text-xs font-bold transition">🚨 عاجلة</button>
                </div>
            </div>

            <!-- Info -->
            <div class="flex items-center gap-2 p-3 bg-amber-500/10 border border-amber-500/20 rounded-lg">
                <i class="fas fa-info-circle text-amber-400"></i>
                <p class="text-xs text-amber-300" x-text="getInfoText()"></p>
            </div>

            <!-- Send Button -->
            <button @click="send()" :disabled="sending || (!message.trim() && mediaList.length === 0)" class="btn btn-primary w-full flex items-center justify-center gap-2">
                <span x-show="!sending"><i class="fas fa-paper-plane"></i> إرسال</span>
                <span x-show="sending"><i class="fas fa-spinner fa-spin"></i> جارٍ الإرسال...</span>
            </button>
        </div>
    </div>

    <!-- Recent Broadcasts -->
    <div class="bg-slate-800 rounded-xl border border-slate-700 p-4">
        <div class="flex items-center justify-between mb-3">
            <h4 class="font-semibold text-sm">📋 آخر البثوث</h4>
            <button @click="loadQueue()" class="text-xs text-blue-400 hover:text-blue-300"><i class="fas fa-sync"></i></button>
        </div>
        <template x-if="loadingQueue">
            <p class="text-center text-slate-400 py-4"><i class="fas fa-spinner fa-spin"></i></p>
        </template>
        <div class="space-y-2 max-h-64 overflow-y-auto">
            <template x-for="item in queue" :key="item.id">
                <div class="bg-slate-700/50 rounded-lg p-3 flex items-center gap-3">
                    <span :class="{'bg-green-500/20 text-green-400': item.status==='sent', 'bg-amber-500/20 text-amber-400': item.status==='pending', 'bg-red-500/20 text-red-400': item.status==='failed'}" class="px-2 py-1 rounded text-xs font-bold whitespace-nowrap" x-text="item.status==='sent' ? '✅' : item.status==='pending' ? '⏳' : '❌'"></span>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm text-slate-200 truncate" x-text="item.message || '(وسائط)'"></p>
                        <p class="text-xs text-slate-500" x-text="(item.recipient==='single' ? '👤 ' : '👥 ') + item.created_at"></p>
                    </div>
                </div>
            </template>
            <template x-if="!loadingQueue && queue.length === 0">
                <p class="text-center text-slate-500 py-4 text-sm">لا يوجد بثوث سابقة</p>
            </template>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function broadcastApp() {
    return {
        message: '', target: 'both', recipient: 'all', priority: 'normal', countryFilter: 'all',
        mediaList: [], uploading: false, sending: false,
        searchQuery: '', searchResults: [], selectedUser: null,
        queue: [], loadingQueue: true,

        init() { this.loadQueue(); setInterval(() => this.loadQueue(), 20000); },

        getInfoText() {
            let t = '';
            if (this.recipient === 'single') t = 'رسالة فردية — ';
            else if (this.countryFilter !== 'all') t = 'بث لدولة محددة — ';
            else t = 'بث جماعي — ';
            if (this.target === 'telegram') t += 'عبر تيليغرام';
            else if (this.target === 'web') t += 'عبر الموقع (إشعار فوري)';
            else t += 'عبر تيليغرام والموقع';
            if (this.priority === 'urgent') t += ' — عاجلة';
            return t;
        },

        async searchUsers() {
            if (this.searchQuery.length < 2) { this.searchResults = []; return; }
            try {
                const data = await api('/api/users?q=' + encodeURIComponent(this.searchQuery) + '&limit=10');
                this.searchResults = (data.users || []).slice(0, 5);
            } catch(e) { this.searchResults = []; }
        },
        selectUser(u) { this.selectedUser = u; this.searchQuery = ''; this.searchResults = []; },

        async uploadMedia(event) {
            const file = event.target.files[0];
            if (!file) return;
            this.uploading = true;
            try {
                const formData = new FormData();
                formData.append('file', file);
                const res = await fetch('/api/upload-broadcast-media', { method: 'POST', body: formData, credentials: 'same-origin' });
                if (!res.ok) throw new Error('fail');
                const data = await res.json();
                if (data.success) {
                    this.mediaList.push({ url: data.absolute_url, type: file.type, name: file.name });
                    toast('تم رفع الملف', 'success');
                } else { toast(data.error || 'فشل الرفع', 'error'); }
            } catch(e) { toast('فشل رفع الملف', 'error'); }
            this.uploading = false;
            event.target.value = '';
        },

        async send() {
            if (!this.message.trim() && this.mediaList.length === 0) return toast('اكتب رسالة أو ارفع ملف', 'warning');
            if (this.recipient === 'single' && !this.selectedUser) return toast('اختر مستخدم', 'warning');
            this.sending = true;
            try {
                const payload = {
                    message: this.message,
                    target: this.target,
                    recipient: this.recipient,
                    priority: this.priority,
                    country: this.countryFilter,
                    media_urls: this.mediaList.map(m => m.url),
                    target_user: this.selectedUser ? this.selectedUser.telegram_id : null,
                    target_name: this.selectedUser ? this.selectedUser.name : null,
                };
                const data = await api('/api/broadcast', { method: 'POST', body: JSON.stringify(payload) });
                toast(data.message || 'تم الإرسال', 'success');
                this.message = ''; this.mediaList = []; this.selectedUser = null;
                this.loadQueue();
            } catch(e) { toast('فشل الإرسال', 'error'); }
            this.sending = false;
        },

        async loadQueue() {
            try {
                const data = await api('/api/broadcast/queue');
                this.queue = data.queue || [];
            } catch(e) { this.queue = []; }
            this.loadingQueue = false;
        }
    }
}
</script>
{% endblock %}
