<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation;background:#0b0e11;font-family:system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#app{position:relative !important;inset:auto !important;display:flex !important;flex-direction:column !important;width:100% !important;height:100dvh !important;height:100vh}
.game-area{flex:1 1 0 !important;position:relative !important;overflow:hidden !important;display:block !important;min-height:0 !important;background:radial-gradient(ellipse at 50% 0%,#10141a 0%,#0b0e11 70%) !important}
#plinkoCanvas{display:block;width:100%;height:100%}
.game-topbar{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:#141920;border-bottom:1px solid #262e39;min-height:48px}
.topbar-left{display:flex;align-items:center;gap:8px}
.topbar-right{display:flex;align-items:center;gap:6px}
.btn-back{background:none;border:none;color:#6b7280;font-size:22px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:all .15s}
.btn-back:active{transform:scale(.9);background:#1a2028}
.bal-pill{display:flex;align-items:center;gap:6px;background:#1a2028;padding:6px 14px;border-radius:20px;border:1px solid #262e39}
.bal-icon{font-size:14px;color:#00e701}
.bal-val{font-size:16px;font-weight:800;font-family:'Courier New',monospace;color:#e8eaed}
.bal-cur{font-size:11px;color:#6b7280;padding:2px 6px;border-radius:4px}
.btn-sound{background:none;border:none;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px;color:#6b7280;transition:all .15s}
.btn-sound:active{transform:scale(.9)}
#connIndicator{font-size:14px}

/* ── Controls ── */
.controls-panel{flex-shrink:0;padding:5px 6px max(5px,env(safe-area-inset-bottom));background:#0b0e11;border-top:1px solid #262e39;display:flex;flex-direction:column;gap:4px}
.controls-top{display:flex;align-items:flex-start;gap:5px;justify-content:space-between}
.opt-label{font-size:8px;color:#333d4b;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;text-align:center}
.opt-box{display:flex;align-items:center;gap:1px;background:#0d141c;border:1px solid #1e2d3d;border-radius:8px;padding:2px;flex:1}
.opt-btn{flex:1;padding:5px 3px;border-radius:5px;background:transparent;border:1px solid transparent;color:#8794a3;font-size:10px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center}
.opt-btn.active{background:rgba(0,231,1,.12);border-color:#00e701;color:#00e701;box-shadow:0 0 6px rgba(0,231,1,.15)}
.controls-mid{display:flex;align-items:center;gap:4px}
.bet-inp{flex:1;background:#0d141c;border:1px solid #1e2d3d;color:#e1e8f0;padding:8px;border-radius:8px;font-size:14px;font-weight:700;text-align:center;font-family:'Courier New',monospace;min-width:0}
.bet-inp:focus{outline:none;border-color:#00e701}
.ctrl-btn{background:#0d141c;border:1px solid #1e2d3d;color:#6a7a8a;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;transition:all .15s;min-width:36px;text-align:center}
.ctrl-btn:active{transform:scale(.93);background:#162030}
.auto-section{display:flex;align-items:center;gap:3px}
.auto-inp{background:#0d141c;border:1px solid #1e2d3d;color:#e1e8f0;padding:8px 4px;border-radius:6px;font-size:11px;text-align:center;width:34px;font-weight:700}
.auto-label{font-size:11px}

/* ── Drop button — full width, press-and-hold power ── */
.drop-btn-wrap{width:100%;position:relative}
.drop-btn{
  width:100%;padding:12px;border-radius:10px;font-size:16px;font-weight:900;border:none;cursor:pointer;
  background:linear-gradient(135deg,#00e701,#f59e0b);color:#000;letter-spacing:.5px;
  box-shadow:0 2px 12px rgba(0,231,1,.2);transition:all .1s;
  touch-action:none;user-select:none;-webkit-user-select:none;position:relative;overflow:hidden;
}
.drop-btn:active{transform:scale(.99)}
.drop-btn.charging{background:linear-gradient(135deg,#f59e0b,#ea580c);box-shadow:0 0 20px rgba(234,88,12,.4)}
.drop-btn:disabled{background:#262e39;color:#8794a3;cursor:not-allowed;box-shadow:none}
.drop-btn .power-fill{
  position:absolute;left:0;bottom:0;width:0%;height:100%;
  background:linear-gradient(90deg,rgba(255,255,255,.15),rgba(255,255,255,.3));
  transition:none;pointer-events:none;
}
.drop-btn .power-text{position:relative;z-index:1}
.drop-btn .power-hint{font-size:9px;font-weight:600;opacity:.7;margin-top:2px}

/* Result chips */
.result-row{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:flex;gap:4px;justify-content:center;flex-wrap:wrap;pointer-events:none;z-index:5;max-width:92%}
.result-chip{padding:3px 12px;border-radius:12px;font-size:11px;font-weight:800;font-family:'Courier New',monospace;backdrop-filter:blur(8px);background:rgba(10,14,23,.75)}

/* Big win overlay */
.big-win-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);z-index:50}
.big-win-overlay.show{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.big-win-num{font-size:56px;font-weight:900;font-family:'Courier New',monospace;color:#00e701;text-shadow:0 0 50px rgba(0,231,1,.8)}
.big-win-text{font-size:16px;color:#fff;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <div class="game-topbar">
    <div class="topbar-left">
      <button class="btn-back" onclick="goBack()">←</button>
      <div class="bal-pill"><span class="bal-icon">💰</span><span class="bal-val" id="bal">0</span><span class="bal-cur" id="cur">EGP</span></div>
    </div>
    <div class="topbar-right">
      <button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊</button>
      <span id="connIndicator">🟢</span>
    </div>
  </div>
  <div class="game-area" id="gameArea">
    <canvas id="plinkoCanvas"></canvas>
    <div class="result-row" id="resultRow"></div>
  </div>
  <div class="controls-panel">
    <div class="controls-top">
      <div style="flex:1">
        <div class="opt-label" data-i18n="x046">الصفوف</div>
        <div class="opt-box">
          <div class="opt-btn" id="r8" onclick="setRows(8)">8</div>
          <div class="opt-btn active" id="r12" onclick="setRows(12)">12</div>
          <div class="opt-btn" id="r16" onclick="setRows(16)">16</div>
          <div class="opt-btn" id="r20" onclick="setRows(20)">20</div>
        </div>
      </div>
      <div style="flex:1">
        <div class="opt-label" data-i18n="x055">المخاطرة</div>
        <div class="opt-box">
          <div class="opt-btn active" id="rkL" onclick="setRisk('low')" data-i18n="x177">منخفض</div>
          <div class="opt-btn" id="rkM" onclick="setRisk('med')" data-i18n="x168">متوسط</div>
          <div class="opt-btn" id="rkH" onclick="setRisk('high')" data-i18n="x133">عالي</div>

    <div class="controls-mid">
      <button class="ctrl-btn" onclick="adjBet(0.5)">½</button>

      <div class="auto-section"><span class="auto-label">🔁</span><input class="auto-inp" type="number" id="autoCount" value="1" min="1" max="100"></div>
    </div>
    <div class="drop-btn-wrap">
      <button class="drop-btn" id="dropBtn" ontouchstart="onDropPressStart(event)" ontouchend="onDropPressEnd(event)" onmousedown="onDropPressStart(event)" onmouseup="onDropPressEnd(event)" onmouseleave="onDropPressEnd(event)">
        <div class="power-fill" id="powerFill"></div>
        <div class="power-text" id="dropBtnText" data-i18n="x230">🎯 إسقاط الكرة</div>
        <div class="power-hint" id="powerHint" data-i18n="x039">اضغط مع الاستمرار لزيادة القوة</div>
      </button>
    </div>
  </div>
</div>
<div class="big-win-overlay" id="bigWin"><div style="text-align:center"><div class="big-win-num" id="bwNum"></div><div class="big-win-text" id="bwTxt"></div></div></div>
<script src="/static/js/game-base.js?v=20260816i18n"></script>
<script>
'use strict';

// ══════════════════════════════════════════
//  VEX PLINKO v5 — Crash-safe + Press-power
// ══════════════════════════════════════════

var cv = document.getElementById('plinkoCanvas');
var ctx = cv.getContext('2d');
var gameArea = document.getElementById('gameArea');

var W = 0, H = 0, DPR = 1;
var rows = 12, risk = 'low', dropping = false;
var pegs = [], slots = [], ball = null, trails = [];
var sw = 0, spacing = 0;
var animId = null; // track requestAnimationFrame for cancellation
var powerVal = 0; // 0-100, from press duration
var powerTimer = null;

var MULTS = {
  8:  {low:[5.6,2.1,1.1,1.0,0.5,1.0,1.1,2.1,5.6],med:[13,3,1.3,0.7,0.4,0.7,1.3,3,13],high:[29,4,1.5,0.3,0.2,0.3,1.5,4,29]},
  12: {low:[10,3,1.6,1.4,1.1,1.0,0.5,1.0,1.1,1.4,1.6,3,10],med:[33,11,4,2,1.1,0.6,0.3,0.6,1.1,2,4,11,33],high:[141,21,5.6,2.5,1.2,0.5,0.2,0.5,1.2,2.5,5.6,21,141]},
  16: {low:[16,9,2,1.4,1.4,1.2,1.1,1.0,0.5,1.0,1.1,1.2,1.4,1.4,2,9,16],med:[110,41,10,5,3,1.5,1.0,0.5,0.3,0.5,1.0,1.5,3,5,10,41,110],high:[1000,130,26,9,4,2,0.7,0.2,0.1,0.2,0.7,2,4,9,26,130,1000]},
  20: {low:[50,12,4,2.5,1.8,1.3,1.0,0.7,0.5,0.3,0.2,0.3,0.5,0.7,1.0,1.3,1.8,2.5,4,12,50],med:[500,60,15,5,3,1.5,1.0,0.5,0.3,0.1,0.05,0.1,0.3,0.5,1.0,1.5,3,5,15,60,500],high:[5000,500,80,20,8,3,1.5,0.7,0.3,0.1,0.05,0.1,0.3,0.7,1.5,3,8,20,80,500,5000]}
};
var STYLES = {gold:{fill:'#ffd700',glow:'#f59e0b'},fire:{fill:'#ff6b35',glow:'#ff4500'},neon:{fill:'#00e701',glow:'#00ff41'},ice:{fill:'#22d3ee',glow:'#67e8f9'},purple:{fill:'#a855f7',glow:'#c084fc'},rainbow:{fill:'rainbow',glow:'#ff0080'}};
var selStyle = 'gold';

var _ac=null;
function au(){if(!_ac){try{_ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return _ac}
function osc(f,d,t,v){var a=au();if(!a||!soundOn)return;try{var o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;o.type=t||'sine';g.gain.setValueAtTime(v||0.1,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.start();o.stop(a.currentTime+d)}catch(e){}}
var NOTES=[262,294,330,349,392,440,494,523,587,659,698,784,880,988,1047,1175,1319,1397,1568,1760,2093];
var _ni=0;
function sndPeg(){var n=NOTES[_ni%NOTES.length];_ni++;osc(n,0.04,'sine',0.05);osc(n*2,0.02,'sine',0.015)}
function sndLand(m){osc(180,0.1,'sine',0.08);if(m>=1)osc(300+m*10,0.08,'sine',0.04)}
function sndWin(m){var n=m>=10?[523,659,784,1047,1319]:m>=5?[523,659,784,1047]:m>=2?[523,659,784]:[523,659];n.forEach(function(f,i){setTimeout(function(){osc(f,0.12,'sine',0.08)},i*70)})}
function sndLose(){osc(260,0.08,'sawtooth',0.05);setTimeout(function(){osc(170,0.12,'sawtooth',0.05)},70)}
function sndJackpot(){[392,523,659,784,1047,1319,1568].forEach(function(f,i){setTimeout(function(){osc(f,i===6?0.4:0.16,'triangle',0.1)},i*80)})}
function fmtA(n){return parseFloat(n||0).toLocaleString()}

function adjBet(f){var i=document.getElementById('betInp');i.value=Math.max(1,Math.floor((parseFloat(i.value)||10)*f))}
function setRows(r){if(dropping)return;rows=r;document.querySelectorAll('.opt-btn').forEach(function(b){if(b.id&&b.id.startsWith('r'))b.classList.remove('active')});var rb=document.getElementById('r'+r);if(rb)rb.classList.add('active');initBoard()}
function setRisk(r){if(dropping)return;risk=r;document.querySelectorAll('.opt-btn').forEach(function(b){if(b.id&&b.id.startsWith('rk'))b.classList.remove('active')});var rk=document.getElementById('rk'+r.charAt(0).toUpperCase());if(rk)rk.classList.add('active');initBoard()}

// ══════════════════════════════════════════
//  CANVAS SIZING
// ══════════════════════════════════════════
function resize(){
  var rect=gameArea.getBoundingClientRect();
  W=Math.max(1,Math.round(rect.width));
  H=Math.max(1,Math.round(rect.height));
  DPR=window.devicePixelRatio||1;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',function(){cancelAnim();setTimeout(function(){resize();initBoard()},100)});
window.addEventListener('orientationchange',function(){cancelAnim();setTimeout(function(){resize();initBoard()},200)});

function cancelAnim(){if(animId){cancelAnimationFrame(animId);animId=null}}

// ══════════════════════════════════════════
//  BOARD INIT
// ══════════════════════════════════════════
function initBoard(){
  resize();
  if(W<2||H<2){requestAnimationFrame(function(){initBoard()});return}
  pegs=[];slots=[];
  var slotH=rows>=16?Math.min(48,H*0.08):Math.min(32,H*0.055);
  var topPad=H*0.03,bottomPad=slotH+8;
  var usableH=H-topPad-bottomPad,rowH=usableH/rows;
  spacing=(W*0.90)/(rows+1);
  for(var r=0;r<rows;r++){
    var cols=r+2,rowWidth=(cols-1)*spacing,startX=(W-rowWidth)/2;
    for(var c=0;c<cols;c++){
      pegs.push({x:startX+c*spacing,y:topPad+r*rowH,r:Math.max(2.5,Math.min(spacing*0.16,6)),row:r});
    }
  }
  var sc=rows+1;sw=W/sc;
  var mt=MULTS[rows][risk];
  for(var s=0;s<sc;s++){
    var m=mt[s],col;
    if(m>=1000)col='#ff0080';else if(m>=100)col='#00e701';else if(m>=5)col='#f59e0b';else if(m>=2)col='#00e701';else if(m>=1)col='#06b6d4';else col='#ff4757';
    slots.push({x:s*sw+sw/2,mult:m,color:col,highlight:0,h:slotH});
  }
  draw();
}

// ══════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════
function draw(){
  try{
    var bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#06080f');bg.addColorStop(0.5,'#0b0e11');bg.addColorStop(1,'#080a12');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(30,45,61,0.12)';ctx.lineWidth=0.5;
    for(var gx=0;gx<W;gx+=50){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke()}
    // Pegs
    for(var i=0;i<pegs.length;i++){
      var p=pegs[i];
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.2832);
      var g=ctx.createRadialGradient(p.x-p.r*0.35,p.y-p.r*0.35,0,p.x,p.y,p.r);
      g.addColorStop(0,'#c8d8e8');g.addColorStop(0.6,'#647489');g.addColorStop(1,'#334155');
      ctx.fillStyle=g;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=0.5;ctx.stroke();
      ctx.beginPath();ctx.arc(p.x-p.r*0.3,p.y-p.r*0.3,p.r*0.2,0,6.2832);
      ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fill();
    }
    // Slots
    for(var s=0;s<slots.length;s++){
      var sl=slots[s];var sH=sl.h||32;var sY=H-sH-2;
      if(sl.highlight>0){ctx.shadowColor=sl.color;ctx.shadowBlur=25;sl.highlight--}else{ctx.shadowBlur=0}
      var g2=ctx.createLinearGradient(0,sY,0,H);
      g2.addColorStop(0,sl.color+'22');g2.addColorStop(0.5,sl.color+'55');g2.addColorStop(1,sl.color+'cc');
      ctx.fillStyle=g2;
      ctx.beginPath();
      var x0=sl.x-sw/2+2,x1=sl.x+sw/2-2;
      ctx.moveTo(x0,H);ctx.lineTo(x0,sY);
      ctx.quadraticCurveTo(sl.x,sY-sH*0.25,x1,sY);
      ctx.lineTo(x1,H);ctx.fill();ctx.shadowBlur=0;
      // Text
      ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
      var txt=sl.mult>=100?sl.mult.toFixed(0)+'x':sl.mult.toFixed(sl.mult<10?1:0)+'x';
      if(rows>=16){
        var fs=Math.max(9,Math.min(sw*0.45,14));
        ctx.font='bold '+fs+'px Courier New';
        ctx.save();ctx.translate(sl.x,sY+sH/2);ctx.rotate(-Math.PI/2);
        ctx.fillText(txt,0,0);ctx.restore();
      }else{
        var fs2=Math.max(8,Math.min(sw*0.16,13));
        ctx.font='bold '+fs2+'px Courier New';
        ctx.fillText(txt,sl.x,sY+sH*0.45);
      }
    }
    // Trails
    for(var t=0;t<trails.length;t++){
      var tr=trails[t];
      ctx.globalAlpha=tr.a||0.2;
      ctx.beginPath();ctx.arc(tr.x,tr.y,tr.r,0,6.2832);
      ctx.fillStyle=tr.c||'#00e701';ctx.fill();
    }
    ctx.globalAlpha=1;
    if(ball)drawBall(ball);
  }catch(e){/* crash guard — never throw inside draw */}
}

function drawBall(b){
  var st=STYLES[selStyle];ctx.save();ctx.shadowColor=st.glow;ctx.shadowBlur=16;
  var g=ctx.createRadialGradient(b.x-b.r*0.3,b.y-b.r*0.3,0,b.x,b.y,b.r);
  if(selStyle==='rainbow'){g.addColorStop(0,'#fff');g.addColorStop(0.5,'#ff0080');g.addColorStop(1,'#7c3aed')}
  else{g.addColorStop(0,'#fff');g.addColorStop(0.4,st.fill);g.addColorStop(1,st.glow)}
  ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.2832);ctx.fillStyle=g;ctx.fill();
  ctx.shadowBlur=0;
  ctx.beginPath();ctx.arc(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.28,0,6.2832);
  ctx.fillStyle='rgba(255,255,255,0.65)';ctx.fill();ctx.restore();
}

// ══════════════════════════════════════════
//  PRESS-AND-HOLD POWER METER
// ══════════════════════════════════════════
function onDropPressStart(e){
  if(dropping)return;
  if(e)e.preventDefault();
  powerVal=0;
  var btn=document.getElementById('dropBtn');
  var fill=document.getElementById('powerFill');
  var txt=document.getElementById('dropBtnText');
  var hint=document.getElementById('powerHint');
  btn.classList.add('charging');
  txt.textContent='⚡ شحن...';
  hint.textContent='0%';
  var startT=Date.now();
  if(powerTimer)clearInterval(powerTimer);
  powerTimer=setInterval(function(){
    var elapsed=Date.now()-startT;
    powerVal=Math.min(100,Math.round(elapsed/15)); // 1.5s to full
    fill.style.width=powerVal+'%';
    hint.textContent=powerVal+'%';
    if(powerVal>=100){clearInterval(powerTimer);powerTimer=null}
  },30);
}

function onDropPressEnd(e){
  if(e)e.preventDefault();
  if(powerTimer){clearInterval(powerTimer);powerTimer=null}
  if(dropping)return;
  var btn=document.getElementById('dropBtn');
  var fill=document.getElementById('powerFill');
  var txt=document.getElementById('dropBtnText');
  var hint=document.getElementById('powerHint');
  btn.classList.remove('charging');
  fill.style.width='0%';
  txt.textContent=I18N.t('x230');
  hint.textContent=I18N.t('x039');
  // If barely tapped (power < 5), use default power 50
  var finalPower=powerVal<5?50:powerVal;
  powerVal=0;
  dropBall(finalPower);
}

// ══════════════════════════════════════════
//  BALL DROP — server-authoritative + power affects visual speed
// ══════════════════════════════════════════
function dropBall(power){
  if(dropping)return;
  var bet=parseFloat(document.getElementById('betInp').value)||10;
  if(bet<1){showToast('أدخل مبلغ','error');return}
  if(!checkBalanceBeforeBet(bet))return;
  dropping=true;
  document.getElementById('dropBtn').disabled=true;

  apiFetchCritical(BASE+'/api/plinko/drop',{
    method:'POST',
    body:JSON.stringify({bet:bet,rows:rows,risk:risk})
  })
  .then(function(r){return r.json()})
  .then(function(d){
    if(d.error){
      showToast(d.error,'error');
      if(d.need_deposit)showVexDepositModal(bet);
      dropping=false;document.getElementById('dropBtn').disabled=false;
      return;
    }
    if(d.balance_after!==undefined)document.getElementById('bal').textContent=d.balance_after.toLocaleString();
    loadBalance();
    var dirs=d.directions||[];
    if(!dirs.length&&d.path&&d.path.length>1){
      for(var i=1;i<d.path.length;i++)dirs.push(d.path[i].x>d.path[i-1].x?1:-1);
    }
    startBall(d.slot,d.multiplier,d.payout,bet,dirs,power);
  })
  .catch(function(){
    showToast('خطأ في الاتصال','error');
    dropping=false;document.getElementById('dropBtn').disabled=false;
  });
}

function startBall(targetSlot,mult,payout,bet,dirs,power){
  _ni=0;
  if(!dirs.length){dirs=[];for(var i=0;i<rows;i++)dirs.push(Math.random()<0.5?-1:1)}
  // Power affects: gravity (faster drop = higher power), nudge strength
  var pNorm=power/100; // 0-1
  var gravity=0.18+pNorm*0.25; // 0.18 (slow) to 0.43 (fast)
  var maxV=5.0+pNorm*4.0; // 5 to 9
  var nudgeMult=0.6+pNorm*0.8; // weaker nudge at low power, stronger at high

  var r=Math.max(4,Math.min(W*0.012,7));
  var slotH=rows>=16?Math.min(48,H*0.08):Math.min(32,H*0.055);
  var topPad=H*0.03,bottomPad=slotH+8;
  var usableH=H-topPad-bottomPad,rowH=usableH/rows;

  var rowYs=[];
  for(var i=0;i<rows;i++)rowYs.push(topPad+i*rowH);

  ball={x:W/2,y:topPad-r*2,vx:0,vy:0,r:r};
  trails=[];

  var currentRow=0,lastBounceRow=-1,frames=0,maxFrames=1500;
  var settleY=H-slotH-4;
  var horizVel=0;

  function physics(){
    if(!ball||frames>maxFrames){finish();return}
    frames++;
    ball.vy+=gravity;
    if(ball.vy>maxV)ball.vy=maxV;
    horizVel*=0.95;
    ball.vx=horizVel;
    ball.x+=ball.vx;ball.y+=ball.vy;
    if(ball.x<r){ball.x=r;horizVel=Math.abs(horizVel)*0.4}
    if(ball.x>W-r){ball.x=W-r;horizVel=-Math.abs(horizVel)*0.4}
    if(currentRow<rows){
      var pegY=rowYs[currentRow];
      if(ball.y>=pegY&&lastBounceRow!==currentRow){
        var dir=dirs[currentRow]||1;
        var nudge=Math.max(1.5,spacing*0.06)*nudgeMult;
        horizVel=dir*nudge+(Math.random()-0.5)*0.3;
        ball.vy*=0.55;ball.y=pegY-1;
        sndPeg();haptic('light');
        lastBounceRow=currentRow;currentRow++;
      }
    }
    if(frames%2===0){
      trails.push({x:ball.x,y:ball.y,r:ball.r*0.3,a:0.18,c:STYLES[selStyle].glow});
      if(trails.length>18)trails.shift();
    }
    if(ball.y>settleY){finish();return}
    draw();
    animId=requestAnimationFrame(physics);
  }

  function finish(){
    if(!ball)return;
    // Ball rests in the slot
    if(targetSlot>=0&&targetSlot<slots.length){
      ball.x=slots[targetSlot].x;
      ball.y=H-(slots[targetSlot].h||32)/2-2;
    }
    sndLand(mult);
    for(var i=0;i<14;i++){
      var ang=(i/14)*6.2832,dist=6+Math.random()*14;
      trails.push({x:ball.x+Math.cos(ang)*dist,y:ball.y+Math.sin(ang)*dist,r:ball.r*0.35,a:0.45,c:STYLES[selStyle].glow});
    }
    if(targetSlot>=0&&targetSlot<slots.length)slots[targetSlot].highlight=90;
    draw();
    // Ball stays visible in slot for 1.5s
    var restFrames=0;
    function restLoop(){
      if(restFrames<90){
        restFrames++;draw();
        animId=requestAnimationFrame(restLoop);
      }else{
        ball=null;trails=[];draw();
        animId=null;
      }
    }
    animId=requestAnimationFrame(restLoop);
    // Show result after 1s
    setTimeout(function(){
      dropping=false;
      document.getElementById('dropBtn').disabled=false;
      showResult(mult,payout,bet);
    },1000);
  }

  cancelAnim();
  animId=requestAnimationFrame(physics);
}

// ══════════════════════════════════════════
//  RESULT DISPLAY
// ══════════════════════════════════════════
function showResult(mult,payout,bet){
  var col=mult>=1000?'#ff0080':mult>=5?'#00e701':mult>=2?'#00e701':mult>=1?'#06b6d4':'#ff4757';
  var chip=document.createElement('div');
  chip.className='result-chip';
  chip.style.background=col+'22';chip.style.color=col;chip.style.border='1px solid '+col+'66';
  chip.textContent=mult.toFixed(2)+'x  +'+fmtA(payout);
  var row=document.getElementById('resultRow');
  row.insertBefore(chip,row.firstChild);
  while(row.children.length>5)row.removeChild(row.lastChild);
  if(mult>=10){
    sndJackpot();
    document.getElementById('bwNum').textContent='+'+fmtA(payout);
    document.getElementById('bwTxt').textContent='جائزة كبرى! ('+mult.toFixed(1)+'x)';
    document.getElementById('bigWin').classList.add('show');
    setTimeout(function(){document.getElementById('bigWin').classList.remove('show')},3000);
    haptic('heavy');
  }else if(mult>=2){sndWin(mult);haptic('medium')}
  else if(mult>=1){sndWin(mult)}
  else{sndLose();haptic('light')}
  var ac=parseInt(document.getElementById('autoCount').value)||1;
  if(ac>1){document.getElementById('autoCount').value=ac-1;setTimeout(function(){dropBall(50)},1000)}
}

  requestAnimationFrame(function(){
    initBoard();
    loadBalance();
    setInterval(loadBalance,10000);
    setTimeout(injectDepositButton,100);
  });
});
