<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Plinko — VEX</title>
<link rel="stylesheet" href="/static/css/game-base.css">
<style>
#canvas{position:absolute;inset:0;width:100%;height:100%}
.risk-select{display:flex;gap:4px;justify-content:center;margin-top:6px}
.risk-opt{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;text-align:center;transition:all 0.15s}
.risk-opt.active{background:var(--gold);color:#000;border-color:var(--gold)}
</style>
</head>
<body>
<div class="loader-screen" id="loading"><div class="spinner"></div></div>
<div id="app" style="display:none">
  <div class="game-topbar">
    <div class="topbar-left"><button class="btn-back" onclick="goBack()">‹</button><div class="bal-pill"><span class="bal-icon">💰</span><span class="bal-val" id="bal">0</span><span class="bal-cur" id="cur">EGP</span></div></div>
    <div class="topbar-right"><span class="streak-badge" id="streak" style="display:none">🔥 0</span><button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊</button></div>
  </div>
  <div class="hist-bar" id="history"></div>
  <div class="game-area" id="gameArea">
    <canvas id="canvas"></canvas>
    <div class="mult-display" style="top:40%"><div class="mult-val" id="result" style="font-size:36px;opacity:0;transition:all 0.4s">0.00</div></div>
  </div>
  <div class="bet-panel">
    <div class="bet-row"><div class="bet-input-wrap"><input type="number" class="bet-input" id="betInput" value="10" min="1"><span class="bet-cur" id="betCur">EGP</span></div></div>
    <div class="bet-controls"><div class="bet-ctrl" onclick="adjustBet(0.5)">½</div><div class="bet-ctrl" onclick="adjustBet(2)">2×</div><div class="bet-ctrl" onclick="setBet('min')">Min</div><div class="bet-ctrl" onclick="setBet('max')">Max</div></div>
    <div class="risk-select"><span style="font-size:10px;color:var(--muted);align-self:center">المخاطرة:</span><div class="risk-opt active" data-risk="low" onclick="setRisk('low')">منخفض</div><div class="risk-opt" data-risk="med" onclick="setRisk('med')">متوسط</div><div class="risk-opt" data-risk="high" onclick="setRisk('high')">عالي</div></div>
    <div class="action-row"><button class="btn-action btn-bet-green" id="dropBtn" onclick="dropBall()">إفلات الكرة</button></div>
  </div>
</div>
<div class="lp-bar"><div class="lp-header"><span>👥 <span class="lp-count" id="lpCount">0</span></span><span id="lpTotal">💰 0</span></div><div class="lp-list" id="lpList"></div></div>
<script src="/static/js/game-base.js"></script>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let isDropping=0,ball=null,animF=null,risk='low';
const MULT_LOW=[2.5,1.5,1.1,0.8,0.5,0.3,0.2,0.3,0.5,0.8,1.1,1.5,2.5];
const MULT_MED=[5,3,1.5,1,0.7,0.4,0.1,0.4,0.7,1,1.5,3,5];
const MULT_HIGH=[25,10,5,2,0.5,0.2,0.1,0.2,0.5,2,5,10,25];
const ROWS=12,SLOTS=13;
function getMult(){return risk==='med'?MULT_MED:risk==='high'?MULT_HIGH:MULT_LOW;}
function setRisk(r){risk=r;document.querySelectorAll('.risk-opt').forEach(e=>e.classList.remove('active'));document.querySelector(`.risk-opt[data-risk="${r}"]`).classList.add('active');drawBoard();}
function resizeCanvas(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight;drawBoard();}window.addEventListener('resize',resizeCanvas);
function drawBoard(){
  ctx.clearRect(0,0,canvas.width,canvas.height);const w=canvas.width,h=canvas.height,tp=40,bp=50,ph=h-tp-bp,ps=ph/ROWS;
  for(let r=0;r<ROWS;r++){const pr=r+2,ry=tp+r*ps,sp=w/(pr+1);for(let i=0;i<pr;i++){ctx.beginPath();ctx.arc(sp*(i+1),ry,3,0,Math.PI*2);ctx.fillStyle='#475569';ctx.fill();}}
  const mults=getMult(),sw=w/SLOTS;
  for(let i=0;i<SLOTS;i++){const m=mults[i],c=m>=3?'#34d399':m>=1?'#fbbf24':'#64748b';ctx.fillStyle=c;ctx.fillRect(i*sw+2,h-bp+4,sw-4,bp-8);ctx.fillStyle='#000';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(m+'x',i*sw+sw/2,h-bp/2+4);}
}
function dropBall(){
  if(isDropping)return;
  const betAmt=parseFloat(document.getElementById('betInput').value)||0;if(betAmt<1)return;
  apiFetch(`${BASE}/api/engine/plinko/start`,{method:'POST',body:JSON.stringify({uid,bet_amount:betAmt})}).then(r=>r.json()).then(d=>{
    if(!d.success){if(d.need_deposit)showVexDepositModal(betAmt);else showToast(d.error||'خطأ','error');return;}
    isDropping=1;document.getElementById('dropBtn').disabled=1;
    document.getElementById('bal').textContent=(d.balance_after||0).toLocaleString();
    const target=d.target_slot,path=[],cur=canvas.width/2,cury=20;let cs=0;
    for(let r=0;r<ROWS;r++){const pr=r+2,sp=canvas.width/(pr+1),ry=40+r*((canvas.height-90)/ROWS);if(cs<target&&Math.random()<0.5+(target-cs)/(ROWS-r)*0.5)cs++;const px=sp*(r+1-cs+1);path.push({x:px,y:ry});}
    const sw=canvas.width/SLOTS;path.push({x:target*sw+sw/2,y:canvas.height-50});
    animateBall(path,d.multiplier,d.payout,d.result,d.session_id,betAmt);
  }).catch(()=>{isDropping=0;document.getElementById('dropBtn').disabled=0;});
}
function animateBall(path,mult,pay,res,sid,bet){
  let i=0;ball={x:canvas.width/2,y:20};
  function step(){if(i>=path.length){finish(mult,pay,res,sid,bet);return;}const t=path[i],dx=t.x-ball.x,dy=t.y-ball.y;if(Math.sqrt(dx*dx+dy*dy)<3){i++;if(i<path.length)beep(300+Math.random()*200,0.03);haptic('light');}else{ball.x+=dx*0.15;ball.y+=dy*0.15;}drawBoard();const g=ctx.createRadialGradient(ball.x-2,ball.y-2,1,ball.x,ball.y,7);g.addColorStop(0,'#fde68a');g.addColorStop(1,'#f59e0b');ctx.beginPath();ctx.arc(ball.x,ball.y,7,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();animF=requestAnimationFrame(step);}step();
}
function finish(mult,pay,res,sid,bet){
  isDropping=0;document.getElementById('dropBtn').disabled=0;
  const rd=document.getElementById('result');rd.style.opacity='1';
  if(res==='win'){rd.textContent=`🎉 +${pay.toFixed(2)}`;rd.style.color='var(--green)';rd.className='mult-val';soundWin(mult>=5);haptic('medium');fireConfetti(document.getElementById('gameArea'));streakWin++;updateStreak(document.getElementById('streak'));}else{rd.textContent=`💔 ${mult}x`;rd.style.color='var(--red)';rd.className='mult-val crashed';soundLose();streakWin=0;updateStreak(document.getElementById('streak'));}
  setTimeout(()=>{rd.style.opacity='0';},2500);
  addHistory('history',mult,res==='win',mult>=5);
  apiFetch(`${BASE}/api/engine/plinko/end`,{method:'POST',body:JSON.stringify({session_id:sid,uid,multiplier:mult,payout:pay,result:res,bet_amount:bet})}).catch(()=>{});
  loadBalance();
}
resizeCanvas();loadBalance();document.getElementById('loading').style.display='none';document.getElementById('app').style.display='flex';setInterval(loadBalance,5000);setInterval(simulatePlayers,2500);simulatePlayers();renderPlayers();
</script>
</body>
</html>
