<script src="/static/js/game-base.js?v=20260808"></script>
<script>
'use strict';
var canvas = document.getElementById('plinkoCanvas');
var ctx = canvas.getContext('2d');
var selectedRows = 8;
var selectedRisk = 'low';
var dropping = false;
var balls = [];
var pegRadius = 4;
var ballRadius = 7;
var MULT_TABLES = {
  low: {
    8:  [5.6, 2.1, 1.1, 1.0, 0.5, 1.0, 1.1, 2.1, 5.6],
    12: [10, 3, 1.6, 1.4, 1.1, 1.0, 0.5, 1.0, 1.1, 1.4, 1.6, 3, 10],
    16: [16, 9, 2, 1.4, 1.4, 1.2, 1.1, 1.0, 0.5, 1.0, 1.1, 1.2, 1.4, 1.4, 2, 9, 16]
  },
  med: {
    8:  [13, 3, 1.3, 0.7, 0.4, 0.7, 1.3, 3, 13],
    12: [33, 11, 4, 2, 1.1, 0.6, 0.3, 0.6, 1.1, 2, 4, 11, 33],
    16: [110, 41, 10, 5, 3, 1.5, 1.0, 0.5, 0.3, 0.5, 1.0, 1.5, 3, 5, 10, 41, 110]
  },
  high: {
    8:  [29, 4, 1.5, 0.3, 0.2, 0.3, 1.5, 4, 29],
    12: [141, 21, 5.6, 2.5, 1.2, 0.5, 0.2, 0.5, 1.2, 2.5, 5.6, 21, 141],
    16: [999, 130, 26, 9, 4, 2, 0.7, 0.2, 0.1, 0.2, 0.7, 2, 4, 9, 26, 130, 999]
  }
};
var pegs = [];
var slots = [];
var W, H;

function setRows(r) {
  selectedRows = r;
  ['8','12','16'].forEach(function(v) { document.getElementById('rows'+v).classList.remove('active'); });
  document.getElementById('rows'+r).classList.add('active');
  initBoard();
}
function setRisk(r) {
  selectedRisk = r;
  ['Low','Med','High'].forEach(function(v) { document.getElementById('risk'+v).classList.remove('active'); });
  document.getElementById('risk'+r.charAt(0).toUpperCase()+r.slice(1)).classList.add('active');
  initBoard();
}

function initBoard() {
  W = canvas.clientWidth || 360;
  H = 320;
  canvas.width = W; canvas.height = H;
  pegs = []; slots = [];
  var rows = selectedRows;
  var topPad = 30;
  var botPad = 48;
  var usableH = H - topPad - botPad;
  var rowH = usableH / rows;
  for (var r = 0; r < rows; r++) {
    var cols = r + 2;
    var rowW = (cols - 1) * (W / (rows + 1));
    var startX = (W - rowW) / 2;
    for (var c = 0; c < cols; c++) {
      pegs.push({ x: startX + c * (rowW / (cols - 1)), y: topPad + r * rowH });
    }
  }
  // Slots at bottom
  var multTable = MULT_TABLES[selectedRisk][rows];
  var slotCount = rows + 1;
  var slotW = W / slotCount;
  for (var s = 0; s < slotCount; s++) {
    var mult = multTable[s];
    var hue = 120 - Math.min(s, slotCount - 1 - s) / (slotCount / 2) * 120;
    var color = mult >= 5 ? '#fbbf24' : mult >= 2 ? '#00e701' : mult >= 1 ? '#06b6d4' : '#ff4757';
    slots.push({ x: s * slotW + slotW/2, y: H - 30, w: slotW - 4, mult: mult, color: color });
  }
  drawBoard();
}

function drawBoard() {
  ctx.clearRect(0, 0, W, H);
  // Draw pegs
  pegs.forEach(function(p) {
    ctx.beginPath(); ctx.arc(p.x, p.y, pegRadius, 0, 6.28);
    ctx.fillStyle = 'rgba(148,163,184,0.7)'; ctx.fill();
    ctx.strokeStyle = 'rgba(203,213,225,0.3)'; ctx.lineWidth = 1; ctx.stroke();
  });
  // Draw slots
  slots.forEach(function(s) {
    var g = ctx.createLinearGradient(s.x - s.w/2, s.y - 20, s.x + s.w/2, s.y);
    g.addColorStop(0, s.color + '33'); g.addColorStop(1, s.color + '11');
    ctx.fillStyle = g;
    ctx.fillRect(s.x - s.w/2, H - 44, s.w, 44);
    ctx.strokeStyle = s.color + '66'; ctx.lineWidth = 1;
    ctx.strokeRect(s.x - s.w/2, H - 44, s.w, 44);
    ctx.fillStyle = s.color; ctx.font = 'bold ' + (s.w > 30 ? '11' : '9') + 'px Courier New';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(s.mult >= 100 ? s.mult.toFixed(0) + 'x' : s.mult.toFixed(1) + 'x', s.x, H - 22);
  });
  // Draw balls
  balls.forEach(function(b) {
    var g2 = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, ballRadius);
    g2.addColorStop(0, '#fff'); g2.addColorStop(0.4, '#fbbf24'); g2.addColorStop(1, '#b45309');
    ctx.beginPath(); ctx.arc(b.x, b.y, ballRadius, 0, 6.28);
    ctx.fillStyle = g2; ctx.fill();
    ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 8;
    ctx.fill(); ctx.shadowBlur = 0;
  });
}

function dropBall() {
  if (dropping) return;
  var bet = parseFloat(document.getElementById('betInp').value) || 10;
  if (!checkBalanceBeforeBet(bet)) return;
  dropping = true;
  document.getElementById('dropBtn').disabled = true;
  apiFetchCritical(BASE + '/api/plinko/drop', {
    method: 'POST',
    body: JSON.stringify({ uid: uid, bet: bet, rows: selectedRows, risk: selectedRisk })
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.error) {
      showToast(d.error, 'error');
      if (d.need_deposit) showDepositModal(bet);
      dropping = false; document.getElementById('dropBtn').disabled = false; return;
    }
    // Animate ball with server-provided path or simulate
    var path = d.path || generatePath(selectedRows);
    animateBall(path, d.slot, d.multiplier, d.payout, bet);
    loadBalance();
  }).catch(function() {
    showToast('Ø®Ø·Ø£ ÙÙŠ Ø§Ù„Ø´Ø¨ÙƒØ©', 'error');
    dropping = false; document.getElementById('dropBtn').disabled = false;
  });
}

function generatePath(rows) {
  // Simulate path client-side (visual only; server is authoritative)
  var path = [];
  var x = W / 2 + (Math.random() - 0.5) * 8;
  var y = 10;
  path.push({x: x, y: y});
  for (var r = 0; r < rows; r++) {
    var go = Math.random() < 0.5 ? -1 : 1;
    var pegsInRow = r + 2;
    var rowW = (pegsInRow - 1) * (W / (rows + 1));
    var stepX = rowW / (pegsInRow - 1);
    x += go * stepX * 0.5 + (Math.random() - 0.5) * 4;
    x = Math.max(20, Math.min(W - 20, x));
    y += (H - 78) / rows;
    path.push({x: x, y: y});
  }
  return path;
}

function animateBall(path, slotIdx, mult, payout, bet) {
  var ballObj = { x: path[0].x, y: path[0].y, step: 0, path: path };
  balls.push(ballObj);
  var totalSteps = path.length;
  var stepDuration = 80;
  var anim;
  function step() {
    if (ballObj.step >= totalSteps - 1) {
      // Ball reached bottom
      clearInterval(anim);
      setTimeout(function() {
        var idx = balls.indexOf(ballObj);
        if (idx !== -1) balls.splice(idx, 1);
        drawBoard();
        dropping = false;
        document.getElementById('dropBtn').disabled = false;
        showDropResult(mult, payout, bet, slotIdx);
      }, 400);
      return;
    }
    ballObj.step++;
    var t = ballObj.step / (totalSteps - 1);
    var p0 = path[ballObj.step - 1];
    var p1 = path[ballObj.step];
    // Smooth interpolation
    for (var i = 0; i <= 10; i++) {
      (function(fi) {
        setTimeout(function() {
          var ft = fi / 10;
          ballObj.x = p0.x + (p1.x - p0.x) * ft;
          ballObj.y = p0.y + (p1.y - p0.y) * ft;
          drawBoard();
          if (fi % 3 === 0) soundPlinko();
        }, fi * (stepDuration / 10));
      })(i);
    }
  }
  anim = setInterval(step, stepDuration);
}

function showDropResult(mult, payout, bet, slotIdx) {
  var slot = slots[slotIdx] || {};
  var color = slot.color || (mult >= 2 ? '#00e701' : mult < 1 ? '#ff4757' : '#06b6d4');
  var chip = document.createElement('div');
  chip.className = 'result-chip';
  chip.style.background = color + '22';
  chip.style.color = color;
  chip.style.border = '1px solid ' + color + '66';
  chip.textContent = mult.toFixed(2) + 'x  +' + fmtAmount(payout);
  var row = document.getElementById('resultRow');
  row.insertBefore(chip, row.firstChild);
  while (row.children.length > 4) row.removeChild(row.lastChild);
  addHistItem(document.getElementById('histBar'), mult);
  if (mult >= 2) { soundWin(mult >= 5); hapticNotif('success'); }
  if (mult >= 10) showBigWinOverlay(payout, mult);
  if (mult >= 1) { streakWin++; } else { streakWin = 0; }
  updateStreak(document.getElementById('streakBadge'));

  // Auto-drop
  var autoCount = parseInt(document.getElementById('autoCount').value) || 1;
  if (autoCount > 1) {
    document.getElementById('autoCount').value = autoCount - 1;
    setTimeout(dropBall, 600);
  }
}

function resizeBoard() {
  canvas.width = canvas.clientWidth || 360;
  initBoard();
}

window.addEventListener('resize', function() { setTimeout(resizeBoard, 100); });

// Init
document.getElementById('loading').style.display = 'none';
document.getElementById('app').style.display = 'flex';
document.getElementById('app').style.flexDirection = 'column';
document.getElementById('app').style.height = '100dvh';
requestAnimationFrame(function() { resizeBoard(); });
loadBalance();
setInterval(loadBalance, 10000);
initBackButton();
</script>
