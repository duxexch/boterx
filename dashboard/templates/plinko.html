<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>Plinko — VEX</title>

<style>
/* ── FULL SELF-CONTAINED LAYOUT — do NOT depend on game-base.css for layout ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;overflow:hidden;
  touch-action:manipulation;
  background:#0a0e17;
  font-family:system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
/* Override game-base.css #app */
#app{
  position:relative !important;
  inset:auto !important;
  display:flex !important;
  flex-direction:column !important;
  width:100% !important;
  height:100dvh !important;
  height:100vh; /* fallback */
}
/* Override game-base.css .game-area */
.game-area{
  flex:1 1 0 !important;
  position:relative !important;
  overflow:hidden !important;
  display:block !important;
  min-height:0 !important;
  background:radial-gradient(ellipse at 50% 0%,#0d1521 0%,#0a0e17 70%) !important;
}
#plinkoCanvas{
  display:block;
  width:100%;
  height:100%;
}
.game-topbar{
  flex-shrink:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 12px;
  padding-top:max(8px,env(safe-area-inset-top));
  background:#131826;
  border-bottom:1px solid #2a3142;
  min-height:48px;
}
.topbar-left{display:flex;align-items:center;gap:8px}
.topbar-right{display:flex;align-items:center;gap:6px}
.btn-back{
  background:none;border:none;color:#6b7280;font-size:22px;cursor:pointer;
  padding:4px 8px;border-radius:6px;transition:all .15s;
}
.btn-back:active{transform:scale(.9);background:#1a2032}
.bal-pill{
  display:flex;align-items:center;gap:6px;
  background:#1a2032;padding:6px 14px;border-radius:20px;border:1px solid #2a3142;
}
.bal-icon{font-size:14px;color:#fbbf24}
.bal-val{font-size:16px;font-weight:800;font-family:'Courier New',monospace;color:#e8eaed}
.bal-cur{font-size:11px;color:#6b7280;padding:2px 6px;border-radius:4px}
.btn-sound{
  background:none;border:none;font-size:18px;cursor:pointer;padding:4px 8px;
  border-radius:6px;color:#6b7280;transition:all .15s;
}
.btn-sound:active{transform:scale(.9)}
#connIndicator{font-size:14px}

/* Controls */
.controls-panel{
  flex-shrink:0;
  padding:8px 8px max(8px,env(safe-area-inset-bottom));
  background:#060810;
  border-top:1px solid #1a2a3a;
}
.controls-row{display:flex;align-items:center;gap:4px;flex-wrap:nowrap}
.opt-box{display:flex;align-items:center;gap:1px;background:#111820;border:1px solid #1e2d3d;border-radius:8px;padding:3px}
.opt-btn{
  padding:5px 8px;border-radius:6px;background:#0a1018;border:1px solid #1e2d3d;
  color:#5a6a7a;font-size:10px;font-weight:700;cursor:pointer;transition:all .15s;
  min-width:26px;text-align:center;
}
.opt-btn.active{background:rgba(251,191,36,.12);border-color:#fbbf24;color:#fbbf24;box-shadow:0 0 8px rgba(251,191,36,.15)}
.bet-inp{
  flex:1;background:#0a1018;border:1px solid #1e2d3d;color:#e1e8f0;
  padding:8px;border-radius:8px;font-size:14px;font-weight:700;text-align:center;
  font-family:'Courier New',monospace;min-width:0;
}
.bet-inp:focus{outline:none;border-color:#fbbf24}
.ctrl-btn{
  background:#111820;border:1px solid #1e2d3d;color:#6a7a8a;
  padding:8px 8px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;
}
.ctrl-btn:active{transform:scale(.93)}
.drop-btn{
  padding:10px 16px;border-radius:10px;font-size:15px;font-weight:900;border:none;cursor:pointer;
  background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000;flex:2;letter-spacing:.5px;
  box-shadow:0 2px 12px rgba(251,191,36,.2);
}
.drop-btn:active{transform:scale(.97)}
.drop-btn:disabled{background:#1a2a3a;color:#5a6a7a;cursor:not-allowed;box-shadow:none}
.auto-inp{
  background:#0a1018;border:1px solid #1e2d3d;color:#e1e8f0;
  padding:6px;border-radius:6px;font-size:11px;text-align:center;width:36px;
}

/* Result chips */
.result-row{
  position:absolute;top:6px;left:50%;transform:translateX(-50%);
  display:flex;gap:4px;justify-content:center;flex-wrap:wrap;
  pointer-events:none;z-index:5;max-width:92%;
}
.result-chip{
  padding:3px 12px;border-radius:12px;font-size:11px;font-weight:800;
  font-family:'Courier New',monospace;backdrop-filter:blur(8px);background:rgba(10,14,23,.75);
}

/* Big win overlay */
.big-win-overlay{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.85);backdrop-filter:blur(10px);z-index:50;
}
.big-win-overlay.show{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.big-win-num{
  font-size:56px;font-weight:900;font-family:'Courier New',monospace;
  color:#fbbf24;text-shadow:0 0 50px rgba(251,191,36,.8);
}
.big-win-text{font-size:16px;color:#fff;margin-top:8px}
</style>

<script src="/static/js/game-base.js?v=20260811e"></script>
<script>
'use strict';

// ══════════════════════════════════════════
//  VEX PLINKO — Complete standalone game
// ══════════════════════════════════════════

var cv = document.getElementById('plinkoCanvas');
var ctx = cv.getContext('2d');
var gameArea = document.getElementById('gameArea');

var W = 0, H = 0, DPR = 1;
var rows = 12, risk = 'low', dropping = false;
var pegs = [], slots = [], ball = null, trails = [];
var sw = 0; // slot width
var spacing = 0; // peg horizontal spacing

// ── Multiplier tables (Stake.com exact) ──
var MULTS = {
  8:  {low:[5.6,2.1,1.1,1.0,0.5,1.0,1.1,2.1,5.6],
       med:[13,3,1.3,0.7,0.4,0.7,1.3,3,13],
       high:[29,4,1.5,0.3,0.2,0.3,1.5,4,29]},
  12: {low:[10,3,1.6,1.4,1.1,1.0,0.5,1.0,1.1,1.4,1.6,3,10],
       med:[33,11,4,2,1.1,0.6,0.3,0.6,1.1,2,4,11,33],
       high:[141,21,5.6,2.5,1.2,0.5,0.2,0.5,1.2,2.5,5.6,21,141]},
  16: {low:[16,9,2,1.4,1.4,1.2,1.1,1.0,0.5,1.0,1.1,1.2,1.4,1.4,2,9,16],
       med:[110,41,10,5,3,1.5,1.0,0.5,0.3,0.5,1.0,1.5,3,5,10,41,110],
       high:[1000,130,26,9,4,2,0.7,0.2,0.1,0.2,0.7,2,4,9,26,130,1000]},
  20: {low:[50,12,4,2.5,1.8,1.3,1.0,0.7,0.5,0.3,0.2,0.3,0.5,0.7,1.0,1.3,1.8,2.5,4,12,50],
       med:[500,60,15,5,3,1.5,1.0,0.5,0.3,0.1,0.05,0.1,0.3,0.5,1.0,1.5,3,5,15,60,500],
       high:[5000,500,80,20,8,3,1.5,0.7,0.3,0.1,0.05,0.1,0.3,0.7,1.5,3,8,20,80,500,5000]}
};

// ── Ball visual styles ──
var STYLES = {
  gold:    {fill:'#fbbf24',glow:'#f59e0b'},
  fire:    {fill:'#ff6b35',glow:'#ff4500'},
  neon:    {fill:'#00e701',glow:'#00ff41'},
  ice:     {fill:'#22d3ee',glow:'#67e8f9'},
  purple:  {fill:'#a855f7',glow:'#c084fc'},
  rainbow: {fill:'rainbow',glow:'#ff0080'}
};
var selStyle = 'gold';

// ── Audio ──
var _ac = null;
function au() { if(!_ac) { try { _ac = new (window.AudioContext||window.webkitAudioContext)() } catch(e) {} } return _ac }
function osc(f,d,t,v) { var a=au(); if(!a||!soundOn) return; try { var o=a.createOscillator(),g=a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value=f; o.type=t||'sine'; g.gain.setValueAtTime(v||0.1,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d); o.start(); o.stop(a.currentTime+d) } catch(e) {} }
var NOTES = [262,294,330,349,392,440,494,523,587,659,698,784,880,988,1047,1175,1319,1397,1568,1760,2093];
var _ni = 0;
function sndPeg() { var n=NOTES[_ni%NOTES.length]; _ni++; osc(n,0.04,'sine',0.05); osc(n*2,0.02,'sine',0.015) }
function sndLand(m) { osc(180,0.1,'sine',0.08); if(m>=1) osc(300+m*10,0.08,'sine',0.04) }
function sndWin(m) { var n=m>=10?[523,659,784,1047,1319]:m>=5?[523,659,784,1047]:m>=2?[523,659,784]:[523,659]; n.forEach(function(f,i){ setTimeout(function(){osc(f,0.12,'sine',0.08)},i*70) }) }
function sndLose() { osc(260,0.08,'sawtooth',0.05); setTimeout(function(){osc(170,0.12,'sawtooth',0.05)},70) }
function sndJackpot() { [392,523,659,784,1047,1319,1568].forEach(function(f,i){ setTimeout(function(){osc(f,i===6?0.4:0.16,'triangle',0.1)},i*80) }) }
function fmtA(n) { return parseFloat(n||0).toLocaleString() }

// ── Controls ──
function adjBet(f) { var i=document.getElementById('betInp'); i.value=Math.max(1,Math.floor((parseFloat(i.value)||10)*f)) }
function setRows(r) { rows=r; document.querySelectorAll('.opt-btn').forEach(function(b){ if(b.id&&b.id.startsWith('r')) b.classList.remove('active') }); var rb=document.getElementById('r'+r); if(rb) rb.classList.add('active'); initBoard() }
function setRisk(r) { risk=r; document.querySelectorAll('.opt-btn').forEach(function(b){ if(b.id&&b.id.startsWith('rk')) b.classList.remove('active') }); var rk=document.getElementById('rk'+r.charAt(0).toUpperCase()); if(rk) rk.classList.add('active'); initBoard() }

// ══════════════════════════════════════════
//  CANVAS SIZING — explicit JS calculation (NOT CSS flex)
// ══════════════════════════════════════════
function resize() {
  // Get the game-area element dimensions directly
  var rect = gameArea.getBoundingClientRect();
  W = Math.max(1, Math.round(rect.width));
  H = Math.max(1, Math.round(rect.height));
  DPR = window.devicePixelRatio || 1;

  // Set canvas backing store to physical pixels (4K on high-DPI)
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);

  // CSS size = logical pixels
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';

  // Scale context so all drawing uses logical coordinates
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

window.addEventListener('resize', function() {
  setTimeout(function() { resize(); initBoard() }, 100);
});
window.addEventListener('orientationchange', function() {
  setTimeout(function() { resize(); initBoard() }, 200);
});

// ══════════════════════════════════════════
//  BOARD INIT — tall pyramid filling entire canvas
// ══════════════════════════════════════════
function initBoard() {
  resize();
  if (W < 2 || H < 2) {
    requestAnimationFrame(function() { initBoard() });
    return;
  }

  pegs = [];
  slots = [];

  // Pyramid: pegs fill 85% of canvas height
  var topPad = H * 0.03;
  var bottomPad = H * 0.10;
  var usableH = H - topPad - bottomPad;
  var rowH = usableH / rows;

  // Horizontal spacing: use 90% of canvas width
  // Max pegs in last row = rows+1, so spacing = W*0.90 / (rows+1)
  spacing = (W * 0.90) / (rows + 1);

  for (var r = 0; r < rows; r++) {
    var cols = r + 2; // row 0 = 2 pegs, last row = rows+1 pegs
    var rowWidth = (cols - 1) * spacing;
    var startX = (W - rowWidth) / 2;
    for (var c = 0; c < cols; c++) {
      pegs.push({
        x: startX + c * spacing,
        y: topPad + r * rowH,
        r: Math.max(2.5, Math.min(spacing * 0.16, 6)),
        row: r
      });
    }
  }

  // Slots: rows+1 slots at bottom
  var sc = rows + 1;
  sw = W / sc;
  var mt = MULTS[rows][risk];
  for (var s = 0; s < sc; s++) {
    var m = mt[s];
    var col;
    if (m >= 1000) col = '#ff0080';
    else if (m >= 100) col = '#fbbf24';
    else if (m >= 5) col = '#f59e0b';
    else if (m >= 2) col = '#00e701';
    else if (m >= 1) col = '#06b6d4';
    else col = '#ff4757';
    slots.push({ x: s * sw + sw / 2, mult: m, color: col, highlight: 0 });
  }

  draw();
}

// ══════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════
function draw() {
  // Background
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#06080f');
  bg.addColorStop(0.5, '#0a0e17');
  bg.addColorStop(1, '#080a12');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Subtle vertical guide lines (for depth)
  ctx.strokeStyle = 'rgba(30,45,61,0.15)';
  ctx.lineWidth = 0.5;
  for (var gx = 0; gx < W; gx += 50) {
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
  }

  // Pegs
  for (var i = 0; i < pegs.length; i++) {
    var p = pegs[i];
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, 6.2832);
    var g = ctx.createRadialGradient(p.x - p.r*0.35, p.y - p.r*0.35, 0, p.x, p.y, p.r);
    g.addColorStop(0, '#c8d8e8');
    g.addColorStop(0.6, '#647489');
    g.addColorStop(1, '#334155');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
    // shine
    ctx.beginPath();
    ctx.arc(p.x - p.r*0.3, p.y - p.r*0.3, p.r*0.2, 0, 6.2832);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fill();
  }

  // Slots at bottom
  var slotH = Math.min(32, H * 0.055);
  var slotY = H - slotH - 3;
  for (var s = 0; s < slots.length; s++) {
    var sl = slots[s];
    if (sl.highlight > 0) {
      ctx.shadowColor = sl.color;
      ctx.shadowBlur = 20;
      sl.highlight--;
    } else {
      ctx.shadowBlur = 0;
    }
    var g = ctx.createLinearGradient(0, slotY, 0, H);
    g.addColorStop(0, sl.color + '22');
    g.addColorStop(0.5, sl.color + '55');
    g.addColorStop(1, sl.color + 'cc');
    ctx.fillStyle = g;
    ctx.beginPath();
    var x0 = sl.x - sw/2 + 2;
    var x1 = sl.x + sw/2 - 2;
    ctx.moveTo(x0, H);
    ctx.lineTo(x0, slotY);
    ctx.quadraticCurveTo(sl.x, slotY - slotH*0.25, x1, slotY);
    ctx.lineTo(x1, H);
    ctx.fill();
    ctx.shadowBlur = 0;

    // multiplier text
    ctx.fillStyle = '#fff';
    var fs = Math.max(7, Math.min(sw * 0.14, 12));
    ctx.font = 'bold ' + fs + 'px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var txt = sl.mult >= 100 ? sl.mult.toFixed(0) + 'x' : sl.mult.toFixed(sl.mult < 10 ? 1 : 0) + 'x';
    ctx.fillText(txt, sl.x, slotY + slotH * 0.45);
  }

  // Trails
  for (var t = 0; t < trails.length; t++) {
    var tr = trails[t];
    ctx.globalAlpha = tr.a || 0.2;
    ctx.beginPath();
    ctx.arc(tr.x, tr.y, tr.r, 0, 6.2832);
    ctx.fillStyle = tr.c || '#fbbf24';
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Ball
  if (ball) drawBall(ball);
}

function drawBall(b) {
  var st = STYLES[selStyle];
  ctx.save();
  ctx.shadowColor = st.glow;
  ctx.shadowBlur = 16;
  var g = ctx.createRadialGradient(b.x - b.r*0.3, b.y - b.r*0.3, 0, b.x, b.y, b.r);
  if (selStyle === 'rainbow') {
    g.addColorStop(0, '#fff');
    g.addColorStop(0.5, '#ff0080');
    g.addColorStop(1, '#7c3aed');
  } else {
    g.addColorStop(0, '#fff');
    g.addColorStop(0.4, st.fill);
    g.addColorStop(1, st.glow);
  }
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, 6.2832);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.shadowBlur = 0;
  // highlight
  ctx.beginPath();
  ctx.arc(b.x - b.r*0.3, b.y - b.r*0.3, b.r*0.28, 0, 6.2832);
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.fill();
  ctx.restore();
}

// ══════════════════════════════════════════
//  BALL DROP — guided animation (never stuck)
// ══════════════════════════════════════════
function dropBall() {
  if (dropping) return;
  var bet = parseFloat(document.getElementById('betInp').value) || 10;
  if (bet < 1) { showToast('أدخل مبلغ', 'error'); return }
  if (!checkBalanceBeforeBet(bet)) return;
  dropping = true;
  document.getElementById('dropBtn').disabled = true;

  apiFetchCritical(BASE + '/api/plinko/drop', {
    method: 'POST',
    body: JSON.stringify({ bet: bet, rows: rows, risk: risk })
  })
  .then(function(r) { return r.json() })
  .then(function(d) {
    if (d.error) {
      showToast(d.error, 'error');
      if (d.need_deposit) showVexDepositModal(bet);
      dropping = false;
      document.getElementById('dropBtn').disabled = false;
      return;
    }
    if (d.balance_after !== undefined) {
      document.getElementById('bal').textContent = d.balance_after.toLocaleString();
    }
    loadBalance();
    var dirs = d.directions || [];
    if (!dirs.length && d.path && d.path.length > 1) {
      for (var i = 1; i < d.path.length; i++) {
        dirs.push(d.path[i].x > d.path[i-1].x ? 1 : -1);
      }
    }
    startBall(d.slot, d.multiplier, d.payout, bet, dirs);
  })
  .catch(function() {
    showToast('خطأ في الاتصال', 'error');
    dropping = false;
    document.getElementById('dropBtn').disabled = false;
  });
}

function startBall(targetSlot, mult, payout, bet, dirs) {
  _ni = 0;
  if (!dirs.length) {
    dirs = [];
    for (var i = 0; i < rows; i++) dirs.push(Math.random() < 0.5 ? -1 : 1);
  }

  var r = Math.max(4, Math.min(W * 0.012, 7));
  var topPad = H * 0.03;
  var startY = topPad - r * 2;

  // Compute peg row Y positions
  var rowYs = [];
  var bottomPad = H * 0.10;
  var usableH = H - topPad - bottomPad;
  var rowH = usableH / rows;
  for (var i = 0; i < rows; i++) {
    rowYs.push(topPad + i * rowH);
  }

  ball = { x: W/2, y: startY, vx: 0, vy: 0, r: r };
  trails = [];

  var gravity = 0.28;
  var maxV = 7.0;
  var currentRow = 0;
  var lastBounceRow = -1;
  var frames = 0;
  var maxFrames = 1200;
  var settleY = H * 0.87;
  var horizVel = 0;

  function physics() {
    if (!ball || frames > maxFrames) { finish(); return }
    frames++;

    // Gravity
    ball.vy += gravity;
    if (ball.vy > maxV) ball.vy = maxV;
    // Horizontal damping
    horizVel *= 0.95;
    ball.vx = horizVel;

    // Move
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Wall bounce
    if (ball.x < r) { ball.x = r; horizVel = Math.abs(horizVel) * 0.4 }
    if (ball.x > W - r) { ball.x = W - r; horizVel = -Math.abs(horizVel) * 0.4 }

    // Check peg row bounce
    if (currentRow < rows) {
      var pegY = rowYs[currentRow];
      if (ball.y >= pegY && lastBounceRow !== currentRow) {
        var dir = dirs[currentRow] || 1;
        var nudge = Math.max(1.8, spacing * 0.06);
        horizVel = dir * nudge + (Math.random() - 0.5) * 0.3;
        ball.vy *= 0.55; // bounce up slightly
        ball.y = pegY - 1;
        sndPeg();
        haptic('light');
        lastBounceRow = currentRow;
        currentRow++;
      }
    }

    // Trail
    if (frames % 2 === 0) {
      trails.push({ x: ball.x, y: ball.y, r: ball.r * 0.3, a: 0.18, c: STYLES[selStyle].glow });
      if (trails.length > 18) trails.shift();
    }

    // Check settle
    if (ball.y > settleY) { finish(); return }

    draw();
    requestAnimationFrame(physics);
  }

  function finish() {
    if (!ball) return;
    // Snap to target slot
    if (targetSlot >= 0 && targetSlot < slots.length) {
      ball.x = slots[targetSlot].x;
    }
    sndLand(mult);
    // Particle burst
    for (var i = 0; i < 14; i++) {
      var ang = (i / 14) * 6.2832;
      var dist = 6 + Math.random() * 14;
      trails.push({
        x: ball.x + Math.cos(ang) * dist,
        y: ball.y + Math.sin(ang) * dist,
        r: ball.r * 0.35, a: 0.45, c: STYLES[selStyle].glow
      });
    }
    if (targetSlot >= 0 && targetSlot < slots.length) {
      slots[targetSlot].highlight = 25;
    }
    draw();
    ball = null;
    setTimeout(function() { trails = []; draw() }, 600);
    setTimeout(function() {
      dropping = false;
      document.getElementById('dropBtn').disabled = false;
      showResult(mult, payout, bet);
    }, 650);
  }

  requestAnimationFrame(physics);
}

// ══════════════════════════════════════════
//  RESULT DISPLAY
// ══════════════════════════════════════════
function showResult(mult, payout, bet) {
  var col = mult >= 1000 ? '#ff0080' : mult >= 5 ? '#fbbf24' : mult >= 2 ? '#00e701' : mult >= 1 ? '#06b6d4' : '#ff4757';
  var chip = document.createElement('div');
  chip.className = 'result-chip';
  chip.style.background = col + '22';
  chip.style.color = col;
  chip.style.border = '1px solid ' + col + '66';
  chip.textContent = mult.toFixed(2) + 'x  +' + fmtA(payout);
  var row = document.getElementById('resultRow');
  row.insertBefore(chip, row.firstChild);
  while (row.children.length > 5) row.removeChild(row.lastChild);

  if (mult >= 10) {
    sndJackpot();
    document.getElementById('bwNum').textContent = '+' + fmtA(payout);
    document.getElementById('bwTxt').textContent = 'جائزة كبرى! (' + mult.toFixed(1) + 'x)';
    document.getElementById('bigWin').classList.add('show');
    setTimeout(function() { document.getElementById('bigWin').classList.remove('show') }, 3000);
    haptic('heavy');
  } else if (mult >= 2) { sndWin(mult); haptic('medium') }
  else if (mult >= 1) { sndWin(mult) }
  else { sndLose(); haptic('light') }

  var ac = parseInt(document.getElementById('autoCount').value) || 1;
  if (ac > 1) {
    document.getElementById('autoCount').value = ac - 1;
    setTimeout(dropBall, 1000);
  }
}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
requestAnimationFrame(function() {
  requestAnimationFrame(function() {
    initBoard();
    loadBalance();
    setInterval(loadBalance, 10000);
    setTimeout(injectDepositButton, 100);
  });
});
</script>
