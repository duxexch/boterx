<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#10141a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=20260816">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png?v=20260816">
<title>{{ game.name }} — VEX Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{
  overflow:hidden;
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  background:#10141a;color:#fff;
  /* iOS Safari safe-area */
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
#app{
  position:fixed;inset:0;display:flex;flex-direction:column;
  /* cross-browser full height */
  height:100vh;height:100svh;
}
@media(min-width:600px){
  /* desktop: constrain width and center */
  body{display:flex;align-items:center;justify-content:center;background:#060b14}
  #app{position:relative;width:400px;height:100vh;height:100svh;border-radius:16px;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,0.5)}
}
/* Top bar */
#topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(0,0,0,0.3);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
.balance{font-size:18px;font-weight:900;color:#00e701}
.vex-btn{background:linear-gradient(135deg,#a78bfa,#8b5cf6);color:#fff;border:none;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;display:none}
.vex-btn.show{display:block}
.back-btn{background:none;border:none;color:#8794a3;font-size:20px;cursor:pointer}
/* Game area */
#game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.game-title{font-size:28px;font-weight:900;margin-bottom:8px}
.game-icon-big{font-size:64px;margin-bottom:16px;animation:bounce 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.result-display{font-size:32px;font-weight:900;margin:16px 0;min-height:40px}
.result-win{color:#34d399;animation:winPulse 0.5s ease-out}
.result-lose{color:#ef4444}
@keyframes winPulse{0%{transform:scale(0.5);opacity:0}50%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.motivational{font-size:14px;opacity:0.7;margin-bottom:8px;min-height:20px}
/* Bet bar */
#betbar{padding:12px 14px;background:rgba(0,0,0,0.3);backdrop-filter:blur(10px);position:sticky;bottom:0;z-index:100}
.bet-input-row{display:flex;gap:8px;margin-bottom:8px}
.bet-input{flex:1;background:#1a2028;border:1px solid #262e39;border-radius:10px;padding:10px 14px;color:#fff;font-size:18px;font-weight:700;text-align:center;outline:none}
.bet-input:focus{border-color:#00e701}
.play-btn{background:linear-gradient(135deg,#00e701,#f59e0b);color:#000;border:none;padding:10px 24px;border-radius:10px;font-size:18px;font-weight:900;cursor:pointer;transition:transform 0.15s}
.play-btn:active{transform:scale(0.95)}
.play-btn:disabled{opacity:0.4;cursor:not-allowed}
.quick-bets{display:flex;gap:6px;justify-content:center}
.quick-bet{background:#1a2028;border:1px solid #262e39;border-radius:8px;padding:6px 12px;color:#8794a3;font-size:13px;cursor:pointer}
.quick-bet:active{background:#262e39}
/* Modal */
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.7);z-index:200;backdrop-filter:blur(5px)}
.modal-box{background:linear-gradient(145deg,#1a2028,#10141a);border:1px solid #262e39;border-radius:20px;padding:24px;width:90%;max-width:360px;text-align:center}
.modal-title{font-size:24px;font-weight:900;margin-bottom:8px}
.modal-subtitle{font-size:14px;opacity:0.6;margin-bottom:16px}
.modal-balance{font-size:20px;color:#00e701;font-weight:700;margin-bottom:16px}
.modal-input{width:100%;background:#10141a;border:1px solid #262e39;border-radius:10px;padding:12px;color:#fff;font-size:18px;text-align:center;outline:none;margin-bottom:12px}
.modal-btn{width:100%;background:linear-gradient(135deg,#00e701,#f59e0b);color:#000;border:none;padding:12px;border-radius:10px;font-size:16px;font-weight:900;cursor:pointer;margin-bottom:8px}
.modal-btn.secondary{background:#262e39;color:#fff}
/* Other games scroll */
.other-games{margin-top:16px;border-top:1px solid #262e39;padding-top:12px}
.other-games-title{font-size:12px;opacity:0.5;margin-bottom:8px}
.games-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.games-scroll::-webkit-scrollbar{height:3px}
.games-scroll::-webkit-scrollbar-thumb{background:#262e39;border-radius:3px}
.mini-game{flex-shrink:0;background:#1a2028;border:1px solid #262e39;border-radius:10px;padding:8px 12px;text-align:center;cursor:pointer;min-width:70px}
.mini-game-icon{font-size:24px}
.mini-game-name{font-size:10px;margin-top:2px}
/* Confetti */
.confetti{position:absolute;width:8px;height:8px;pointer-events:none;z-index:150}
/* Deposit */
.deposit-methods{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.deposit-method{background:#1a2028;border:1px solid #262e39;border-radius:10px;padding:10px;display:flex;align-items:center;gap:8px;cursor:pointer}
.deposit-method.selected{border-color:#00e701}
.copy-box{background:#10141a;border:1px solid #262e39;border-radius:8px;padding:8px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.copy-box code{color:#00e701;font-size:13px}

/* Live Players Bar */
#livePlayers{max-height:110px;overflow-y:auto;background:rgba(0,0,0,0.25);border-top:1px solid #1a2028}
#livePlayers::-webkit-scrollbar{width:3px}
#livePlayers::-webkit-scrollbar-thumb{background:#262e39;border-radius:3px}
.lp-header{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font-size:10px;color:#8794a3;border-bottom:1px solid #1a2028}
.lp-count{color:#00e701;font-weight:700}
.lp-list{padding:2px 8px}
.lp-row{display:flex;align-items:center;justify-content:space-between;padding:3px 6px;border-radius:6px;margin:2px 0;font-size:11px;animation:lpSlideIn 0.3s ease-out}
@keyframes lpSlideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.lp-row.playing{background:rgba(148,163,184,0.08);color:#8794a3}
.lp-row.win{background:rgba(52,211,153,0.12);color:#34d399}
.lp-row.lose{background:rgba(239,68,68,0.08);color:#ef4444;opacity:0.6}
.lp-user{display:flex;align-items:center;gap:4px}
.lp-avatar{width:18px;height:18px;border-radius:50%;background:#262e39;display:flex;align-items:center;justify-content:center;font-size:9px}
.lp-name{font-weight:600}
.lp-bet{font-weight:700}
.lp-result{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px}
.lp-result.win{background:#34d399;color:#000}
.lp-result.lose{background:#ef4444;color:#fff}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button class="back-btn" onclick="goBack()">‹</button>
    <div class="balance">💰 <span id="bal">0</span></div>
    <button class="vex-btn" id="vexBtn">💎</button>
  </div>
  <div id="game-area">
    <div class="game-icon-big" id="gameIcon">{{ game.icon }}</div>
    <div class="game-title">{{ game.name }}</div>
    <div class="result-display" id="resultDisplay"></div>
    <div class="motivational" id="motivational"></div>
  </div>
  <div id="betbar">
    <div class="bet-input-row">
      <input type="number" class="bet-input" id="betInput" value="{{ game.min_bet }}" min="{{ game.min_bet }}" max="{{ game.max_bet }}">
      <button class="play-btn" id="playBtn" onclick="playRound()">▶️ العب</button>
    </div>
    <div class="quick-bets" id="quickBets"></div>
  </div>
</div>
<!-- Continue Modal -->
<div id="modal">
  <div class="modal-box" id="modalBox">  </div>
</div>
<!-- Live Players Bar -->
<div id="livePlayers">
  <div class="lp-header">
    <span>👥 <span class="lp-count" id="lpCount">0</span> لاعب</span>
    <span id="lpTotal">💰 0</span>
  </div>
  <div class="lp-list" id="lpList"></div>
</div>
<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.expand(); tg.ready(); }
const uid = new URLSearchParams(location.search).get('uid') || '';
const gameId = '{{ game.id }}';
const gameName = '{{ game.name }}';
const gameIcon = '{{ game.icon }}';
const minBet = {{ game.min_bet }};
const maxBet = {{ game.max_bet }};
const BASE = location.origin;
const initData = tg?.initData || '';

async function apiFetch(url, opts = {}) {
  opts.headers = opts.headers || {};
  opts.headers['X-Telegram-Init-Data'] = initData;
  if (opts.body && typeof opts.body === 'string') {
    opts.headers['Content-Type'] = 'application/json';
  }
  if (uid && !url.includes('uid=')) { url += (url.includes('?') ? '&' : '?') + 'uid=' + uid; }
  return fetch(url, opts);
}
let isPlaying = false;
let lastResult = null;
// Defer AudioContext — browsers block creation until user interaction
let audioCtx = null;
function _getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audioCtx;
}

function beep(f, d, t='sine', v=0.2) {
  const ctx=_getAudioCtx(); if(!ctx) return;
  try {
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.value=f;o.type=t;
    g.gain.setValueAtTime(v,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+d);
    o.start();o.stop(ctx.currentTime+d);
  } catch(e){}
}
function soundWin(){beep(523,0.1);setTimeout(()=>beep(784,0.15),80);setTimeout(()=>beep(1047,0.2),160)}
function soundLose(){beep(300,0.2,'sawtooth',0.15)}
function haptic(t='light'){if(tg?.HapticFeedback?.impactOccurred)tg.HapticFeedback.impactOccurred(t)}

async function loadBalance() {
  try {
    const r = await apiFetch(`${BASE}/api/wallet/balance`);
    const d = await r.json();
    document.getElementById('bal').textContent = (d.balance||0).toLocaleString();
  } catch(e) {}
}

// Quick bet buttons
function initQuickBets() {
  const bets = [minBet, minBet*5, minBet*10, maxBet];
  const labels = ['Min', '×5', '×10', 'Max'];
  const container = document.getElementById('quickBets');
  bets.forEach((b, i) => {
    const btn = document.createElement('div');
    btn.className = 'quick-bet';
    btn.textContent = `${b}`;
    btn.onclick = () => { document.getElementById('betInput').value = b; };
    container.appendChild(btn);
  });
}

async function playRound() {
  if (isPlaying) return;
  const bet = parseFloat(document.getElementById('betInput').value) || 0;
  if (bet < minBet || bet > maxBet) {
    document.getElementById('resultDisplay').textContent = `الحد ${minBet}-${maxBet}`;
    document.getElementById('resultDisplay').className = 'result-display result-lose';
    return;
  }
  
  isPlaying = true;
  document.getElementById('playBtn').disabled = true;
  document.getElementById('resultDisplay').textContent = '';
  document.getElementById('motivational').textContent = '⏳ جارٍ اللعب...';
  
  try {
    const r = await apiFetch(`${BASE}/api/engine/result`, {
      method: 'POST',
      body: JSON.stringify({uid, game_id: gameId, bet_amount: bet})
    });
    const d = await r.json();
    lastResult = d;
    
    if (!d.success) {
      if (d.need_deposit) {
        showDepositModal(bet);
      } else {
        document.getElementById('resultDisplay').textContent = d.error || 'خطأ';
        document.getElementById('resultDisplay').className = 'result-display result-lose';
      }
      isPlaying = false;
      document.getElementById('playBtn').disabled = false;
      return;
    }
    
    // Show result
    const rd = document.getElementById('resultDisplay');
    const mo = document.getElementById('motivational');
    
    if (d.result === 'win') {
      rd.textContent = `🎉 +${d.payout}`;
      rd.className = 'result-display result-win';
      soundWin();
      haptic('medium');
      confettiBurst();
    } else {
      if (d.near_miss) {
        rd.textContent = '💨 كادت!';
        mo.textContent = '🔥 كنت قريباً جداً! حاول مرة أخرى!';
      } else {
        rd.textContent = `❌ -${bet}`;
        mo.textContent = '💪 حظ أوفر!';
      }
      rd.className = 'result-display result-lose';
      soundLose();
      haptic('heavy');
    }
    
    // Psych hints
    const psych = d.psychological_hints || {};
    if (psych.motivational_text) {
      mo.textContent = psych.motivational_text;
    }
    
    // Update balance
    document.getElementById('bal').textContent = (d.balance_after||0).toLocaleString();
    
    // Update live player status
    updateMyLiveStatus(d.result, d.payout);
    
    // Show continue modal
    setTimeout(() => showContinueModal(d, bet), 800);
    
  } catch(e) {
    document.getElementById('resultDisplay').textContent = '❌ خطأ';
    document.getElementById('resultDisplay').className = 'result-display result-lose';
  }
  
  isPlaying = false;
  document.getElementById('playBtn').disabled = false;
}

function showContinueModal(result, lastBet) {
  const balance = result.balance_after || 0;
  const modal = document.getElementById('modal');
  const box = document.getElementById('modalBox');
  
  let html = `
    <div class="modal-title">${result.result === 'win' ? '🎉 ربحت!' : '😔 خسرت'}</div>
    <div class="modal-balance">💰 رصيدك: ${balance.toLocaleString()}</div>
  `;
  
  if (balance >= minBet) {
    html += `
      <input type="number" class="modal-input" id="modalBet" value="${lastBet}" min="${minBet}" max="${maxBet}">
      <button class="modal-btn" onclick="continuePlay()">▶️ العب مرة أخرى</button>
    `;
  } else {
    html += `
      <div class="modal-subtitle">⚠️ رصيدك غير كافٍ</div>
      <button class="modal-btn" onclick="showDepositModal(${minBet})">💰 إيداع سريع</button>
    `;
  }
  
  // Other games
  html += `
    <div class="other-games">
      <div class="other-games-title">🎮 جرّب ألعاب أخرى</div>
      <div class="games-scroll" id="otherGames"></div>
    </div>
    <button class="modal-btn secondary" onclick="goBack()" style="margin-top:8px">🏠 القائمة</button>
  `;
  
  box.innerHTML = html;
  modal.style.display = 'flex';
  
  // Load other games
  loadOtherGames();
}

function continuePlay() {
  const bet = parseFloat(document.getElementById('modalBet').value) || minBet;
  document.getElementById('betInput').value = bet;
  document.getElementById('modal').style.display = 'none';
  document.getElementById('resultDisplay').textContent = '';
  document.getElementById('motivational').textContent = '';
  playRound();
}

async function loadOtherGames() {
  try {
    const r = await apiFetch(`${BASE}/api/games/list`);
    const d = await r.json();
    const container = document.getElementById('otherGames');
    if (!container) return;
    container.innerHTML = '';
    (d.games || []).forEach(g => {
      if (g.id === gameId) return;
      const el = document.createElement('div');
      el.className = 'mini-game';
      el.innerHTML = `<div class="mini-game-icon">${g.icon}</div><div class="mini-game-name">${g.name}</div>`;
      el.onclick = () => { window.location.href = `${BASE}/webapp/play/${g.id}?${_getAuthParam()}&lang=ar`; };
      container.appendChild(el);
    });
  } catch(e) {}
}

async function showDepositModal(required) {
  const modal = document.getElementById('modal');
  const box = document.getElementById('modalBox');

  // Load bot payment methods (active + available for games)
  let methodsHtml = '';
  let botMethods = [];
  let savedWallets = [];
  try {
    const r = await apiFetch(`${BASE}/api/games/payment-methods`);
    const d = await r.json();
    botMethods = d.methods || [];
    savedWallets = d.saved_methods || [];
  } catch(e) {}

  if (botMethods.length === 0) {
    box.innerHTML = `
      <div class="modal-title">💰 إيداع محفظة VEX</div>
      <div class="modal-subtitle">لا توجد وسائل دفع متاحة حالياً</div>
      <button class="modal-btn" onclick="document.getElementById('modal').style.display='none'">إغلاق</button>
    `;
    modal.style.display = 'flex';
    return;
  }

  // Build method selection list
  methodsHtml = botMethods.map(m => `
    <div class="dep-method" onclick="selectGameMethod('${m.id}','${(m.method_name||'').replace(/'/g,"\\'")}','${(m.account_data||'').replace(/'/g,"\\'")}','${(m.icon||'💳')}')">
      <span style="font-size:18px">${m.icon||'💳'}</span>
      <div style="flex:1">
        <div style="font-weight:600;font-size:13px">${m.method_name||''}</div>
        <div style="font-size:11px;color:#8794a3">${m.method_type||''}</div>
      </div>
      <span style="color:#00e701;font-size:14px">‹</span>
    </div>
  `).join('');

  box.innerHTML = `
    <div class="modal-title">💰 إيداع محفظة VEX</div>
    <div class="modal-subtitle">${required ? `رصيدك غير كافٍ — تحتاج ${required}` : 'اختر وسيلة الدفع'}</div>
    <div id="depMethodsList">${methodsHtml}</div>
    <div id="depStep2" style="display:none">
      <div style="font-size:11px;color:#8794a3;margin:10px 0 6px">📋 بيانات الوسيلة:</div>
      <div class="copy-box" onclick="copyMethodData()" style="display:flex;align-items:center;justify-content:space-between;background:#10141a;border:1px solid #262e39;border-radius:10px;padding:10px 12px;cursor:pointer;margin-bottom:10px">
        <code id="methodDataDisplay" style="font-size:13px;color:#00e701;word-break:break-all"></code>
        <span style="font-size:12px;color:#8794a3;flex-shrink:0;margin-right:8px">📋 نسخ</span>
      </div>
      <div style="font-size:11px;color:#8794a3;margin:8px 0 4px">💵 المبلغ الذي سترسله:</div>
      <input type="number" id="depAmount" placeholder="المبلغ" value="${required || minBet}" style="width:100%;background:#10141a;border:1px solid #262e39;border-radius:8px;padding:10px;color:#fff;font-size:15px;font-weight:700;outline:none;margin-bottom:8px">
      <div style="font-size:11px;color:#8794a3;margin:8px 0 4px">🔐 رقم محفظتك (التي سترسل منها):</div>
      <input type="text" id="playerWallet" placeholder="رقم محفظتك" style="width:100%;background:#10141a;border:1px solid #262e39;border-radius:8px;padding:10px;color:#fff;font-size:15px;font-weight:700;outline:none;margin-bottom:8px">
      <div id="savedWalletsHint" style="display:none;font-size:11px;color:#34d399;margin-bottom:6px"></div>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#8794a3;margin-bottom:10px;cursor:pointer">
        <input type="checkbox" id="saveMethod" style="accent-color:#00e701"> حفظ كوسيلة دفع دائمة
      </label>
      <button class="modal-btn" onclick="submitGameDeposit()">✅ تأكيد الإيداع</button>
      <button class="modal-btn secondary" onclick="backToMethods()" style="margin-top:6px">‹ رجوع</button>
    </div>
    <button class="modal-btn secondary" onclick="document.getElementById('modal').style.display='none'" style="margin-top:6px">إلغاء</button>
  `;
  modal.style.display = 'flex';
}

let selectedMethod = null;

function selectGameMethod(methodId, methodName, methodAccountData, icon) {
  selectedMethod = { id: methodId, name: methodName, account_data: methodAccountData, icon: icon };

  // Pre-fill saved wallet if exists
  let savedWallet = '';
  let savedHint = '';
  if (savedWallets.length > 0) {
    const match = savedWallets.find(w => w.method_name && w.method_name.includes(methodName));
    if (match) {
      savedWallet = match.account_number;
      savedHint = `✓ محفظتك المحفوظة: ${savedWallet}`;
    }
  }

  document.getElementById('depMethodsList').style.display = 'none';
  document.getElementById('depStep2').style.display = 'block';
  document.getElementById('methodDataDisplay').textContent = methodAccountData;
  if (savedWallet) {
    document.getElementById('playerWallet').value = savedWallet;
    document.getElementById('savedWalletsHint').style.display = 'block';
    document.getElementById('savedWalletsHint').textContent = savedHint;
  }
}

function copyMethodData() {
  const data = document.getElementById('methodDataDisplay').textContent;
  navigator.clipboard.writeText(data).then(() => {
    haptic('light');
    const btn = document.querySelector('.copy-box span');
    if (btn) { btn.textContent = '✓ تم النسخ'; setTimeout(() => btn.textContent = '📋 نسخ', 1500); }
  });
}

function backToMethods() {
  document.getElementById('depMethodsList').style.display = 'block';
  document.getElementById('depStep2').style.display = 'none';
}

async function submitGameDeposit() {
  const amount = parseFloat(document.getElementById('depAmount').value) || 0;
  const playerWallet = document.getElementById('playerWallet').value.trim();
  const saveMethod = document.getElementById('saveMethod').checked;

  if (amount <= 0) { alert('أدخل المبلغ'); return; }
  if (!playerWallet) { alert('أدخل رقم محفظتك'); return; }
  if (!selectedMethod) { alert('اختر وسيلة دفع'); return; }

  try {
    const r = await apiFetch(`${BASE}/api/deposit/quick`, {
      method: 'POST',
      body: JSON.stringify({
        uid, amount,
        method_id: selectedMethod.id,
        method_name: selectedMethod.name,
        method_account_data: selectedMethod.account_data,
        player_wallet: playerWallet,
        save_method: saveMethod
      })
    });
    const d = await r.json();
    if (d.success) {
      document.getElementById('modalBox').innerHTML = `
        <div class="modal-title">⏳ بانتظار التأكيد</div>
        <div class="modal-subtitle">تم إرسال طلب الإيداع<br>سيتم إضافة الرصيد لمحفظة VEX بعد موافقة الإدارة</div>
        <button class="modal-btn" onclick="document.getElementById('modal').style.display='none';loadBalance();">إغلاق</button>
      `;
    } else {
      alert(d.error || 'خطأ في الإيداع');
    }
  } catch(e) { alert('خطأ في الاتصال'); }
}

function confettiBurst() {
  const colors = ['#00e701','#06b6d4','#a78bfa','#34d399','#ef4444'];
  const area = document.getElementById('game-area');
  for (let i = 0; i < 20; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = '50%';
    c.style.top = '50%';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.borderRadius = Math.random()>0.5?'50%':'2px';
    area.appendChild(c);
    const angle = Math.random()*Math.PI*2;
    const dist = 60+Math.random()*120;
    c.animate([
      {transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:`translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px) rotate(${Math.random()*720}deg)`,opacity:0}
    ],{duration:600+Math.random()*400,easing:'ease-out'});
    setTimeout(()=>c.remove(),1000);
  }
}

loadBalance();

// Live Players System
const livePlayers = [];

function addLivePlayer(data) {
  const existing = livePlayers.findIndex(p => p.uid === data.uid);
  if (existing >= 0) {
    livePlayers[existing] = data;
  } else {
    livePlayers.unshift(data);
    if (livePlayers.length > 30) livePlayers.pop();
  }
  renderLivePlayers();
}

function renderLivePlayers() {
  const list = document.getElementById('lpList');
  if (!list) return;
  const count = document.getElementById('lpCount');
  const total = document.getElementById('lpTotal');
  
  count.textContent = livePlayers.length;
  const totalBet = livePlayers.reduce((s, p) => s + (p.bet || 0), 0);
  total.textContent = '💰 ' + totalBet.toLocaleString();
  
  list.innerHTML = '';
  livePlayers.forEach(p => {
    const row = document.createElement('div');
    row.className = 'lp-row ' + (p.status || 'playing');
    const avatar = p.name ? p.name[0].toUpperCase() : '?';
    let resultBadge = '';
    if (p.status === 'win') resultBadge = `<span class="lp-result win">+${(p.payout || 0).toFixed(0)}</span>`;
    else if (p.status === 'lose') resultBadge = `<span class="lp-result lose">-${p.bet}</span>`;
    row.innerHTML = `
      <div class="lp-user">
        <div class="lp-avatar">${avatar}</div>
        <span class="lp-name">${p.name || '???'}${p.isMe ? ' (أنت)' : ''}</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="lp-bet">${p.bet}</span>
        ${resultBadge}
      </div>
    `;
    list.appendChild(row);
  });
}

// Simulate live players (in production: fetch from /api/games/live-players)
const fakeNames = ['أحمد','عمر','محمد','خالد','سعد','فهد','ناصر','يوسف','علي','حسن','ماجد','وليد','طارق','بدر','راشد','عبدالله','مازن','تركي','فيصل','سلمان'];

function simulatePlayers() {
  if (Math.random() < 0.6 && livePlayers.length < 15) {
    const name = fakeNames[Math.floor(Math.random()*fakeNames.length)];
    const bet = [10,20,50,100,200,500][Math.floor(Math.random()*6)];
    addLivePlayer({
      uid: 'bot_' + Math.random().toString(36).substr(2,5),
      name: name, bet: bet, status: 'playing', payout: 0, isMe: false
    });
  }
  
  livePlayers.forEach(p => {
    if (p.status === 'playing' && !p.isMe && Math.random() < 0.2) {
      if (Math.random() < 0.45) {
        p.status = 'win';
        p.payout = p.bet * (1.5 + Math.random() * 2);
      } else {
        p.status = 'lose';
        p.payout = 0;
      }
    }
  });
  
  renderLivePlayers();
}

// Add self when playing
const originalPlayRound = playRound;
playRound = function() {
  const bet = parseFloat(document.getElementById('betInput').value) || 0;
  if (bet > 0 && !isPlaying) {
    addLivePlayer({
      uid: uid, name: 'أنت', bet: bet,
      status: 'playing', payout: 0, isMe: true
    });
  }
  originalPlayRound();
};

// Update self after result
function updateMyLiveStatus(result, payout) {
  const me = livePlayers.find(p => p.uid === uid);
  if (me) {
    me.status = result === 'win' ? 'win' : 'lose';
    me.payout = payout;
    renderLivePlayers();
  }
}

setInterval(simulatePlayers, 2500);
simulatePlayers();
renderLivePlayers();
</script>
