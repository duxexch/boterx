<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/i18n-auto.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png?v=20260816">
<link rel="icon" href="/favicon.ico?v=20260816" sizes="any">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=20260816">
<meta charset="UTF-8">
<meta property="og:title" content="VEX Games — العب واربح">
<meta property="og:description" content="منصة ألعاب تيليغرام الأقوى — جوائز حقيقية وألعاب مثيرة">
<meta property="og:type" content="website">
<meta property="og:image" content="https://vex.deals/static/icons/og-image.jpg?v=20260821">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://vex.deals/static/icons/og-image.jpg?v=20260821">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Mines — VEX</title>
<link rel="stylesheet" href="/static/css/game-base.css?v=20260818">
<style>
.game-area{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:8px;overflow:hidden}
.mines-setup{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:340px}
.mines-label{font-size:12px;color:var(--text-dim);text-align:center}
.mines-count-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.mc-btn{padding:6px 12px;border-radius:var(--radius-xs);background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s var(--ease)}
.mc-btn.active{background:rgba(255,71,87,.2);border-color:var(--red);color:var(--red)}
.mc-btn:active{transform:scale(.94)}
.grid-wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:100%;max-width:340px;aspect-ratio:1}
.cell{border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,6vw,28px);transition:all .2s var(--ease-spring);position:relative;overflow:hidden}
.cell:active{transform:scale(.9)}
.cell.disabled{cursor:default;pointer-events:none}
.cell.revealed-safe{background:rgba(0,231,1,.12);border-color:rgba(0,231,1,.4);animation:gemPop .3s var(--ease-spring)}
.cell.revealed-mine{background:rgba(255,71,87,.2);border-color:var(--red);animation:minePop .4s var(--ease-spring)}
.cell.end-mine{background:rgba(255,71,87,.1);border-color:rgba(255,71,87,.3)}
.cell.end-safe{background:rgba(0,231,1,.08);border-color:rgba(0,231,1,.2)}
@keyframes gemPop{0%{transform:scale(.5) rotate(-20deg);opacity:0}60%{transform:scale(1.2) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
@keyframes minePop{0%{transform:scale(1)}20%{transform:scale(1.3)}100%{transform:scale(1)}}
.mines-info{display:flex;gap:12px;justify-content:center}
.minfo{text-align:center;background:var(--surface);padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--border)}
.minfo-val{font-size:18px;font-weight:900;font-family:'Courier New',monospace;color:var(--text)}
.minfo-val.gold{color:var(--gold)}
.minfo-val.green{color:var(--green)}
.minfo-label{font-size:10px;color:var(--text-dim);margin-top:2px}
.bet-row{display:flex;align-items:center;gap:6px;width:100%;max-width:340px}
.bet-inp{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:var(--radius-sm);font-size:16px;font-weight:700;text-align:center;font-family:'Courier New',monospace;-moz-appearance:textfield}
.bet-inp::-webkit-inner-spin-button,.bet-inp::-webkit-outer-spin-button{display:none}
.ctrl-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);padding:10px 10px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.ctrl-btn:active{transform:scale(.92);background:var(--surface-3)}
.action-btn{width:100%;max-width:340px;padding:14px;border-radius:var(--radius);font-size:16px;font-weight:900;border:none;cursor:pointer;transition:all .2s var(--ease);letter-spacing:.5px}
.action-btn.start{background:linear-gradient(135deg,#00e701,#0d9e10);color:#000}
.action-btn.cashout{background:linear-gradient(135deg,#00e701,#f59e0b);color:#000;animation:cashoutGlow 1.5s infinite alternate}
.action-btn.disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed;pointer-events:none}
@keyframes cashoutGlow{from{box-shadow:0 0 10px rgba(0,231,1,.3)}to{box-shadow:0 0 25px rgba(0,231,1,.6)}}
.action-btn:active:not(.disabled){transform:scale(.97)}
.mines-phase-msg{font-size:13px;color:var(--text-dim);text-align:center;min-height:20px}
.mult-progress{width:100%;max-width:340px;background:var(--surface-2);border-radius:20px;height:8px;overflow:hidden;border:1px solid var(--border)}
.mult-fill{height:100%;background:linear-gradient(90deg,var(--green),#00e701);border-radius:20px;width:0%;transition:width .4s var(--ease);box-shadow:0 0 8px rgba(0,231,1,.4)}
</style>
</head>
<body>
<div id="app" style="display:none">
  <div class="game-topbar">
    <div class="topbar-left">
      <button class="btn-back" id="backBtn" onclick="handleBack()">←</button>
      <div class="bal-pill"><span class="bal-icon">💰</span><span class="bal-val" id="bal">0</span><span class="bal-cur" id="cur">EGP</span></div>
    </div>
    <div class="topbar-right">
      <span class="streak-badge" id="streakBadge" style="display:none"></span>
      <button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊</button>
      <span id="connIndicator">🟡</span>
    </div>
  </div>

  <div class="hist-bar" id="histBar"></div>

  <div class="game-area" style="flex:1;overflow-y:auto">
    <!-- Mines Info -->
    <div class="mines-info">
      <div class="minfo"><div class="minfo-val green" id="multVal">1.00x</div><div class="minfo-label" data-i18n="x056">المضاعف</div></div>
      <div class="minfo"><div class="minfo-val gold" id="potWin">0</div><div class="minfo-label" data-i18n="x044">الربح المحتمل</div></div>
      <div class="minfo"><div class="minfo-val" id="safeCount">0</div><div class="minfo-label" data-i18n="x176">مكشوف</div></div>
    </div>

    <!-- Multiplier progress bar -->
    <div class="mult-progress"><div class="mult-fill" id="multFill"></div></div>

    <!-- Grid -->
    <div class="grid-wrap" id="grid"></div>

    <div class="mines-phase-msg" id="phaseMsg" data-i18n="x025">اختر عدد الألغام وضع رهانك</div>

    <!-- Setup (shown before game) -->
    <div id="setupPanel">
      <div class="mines-setup">
        <div class="mines-label" data-i18n="x283">🔴 عدد الألغام</div>
        <div class="mines-count-row" id="minesCountRow"></div>
        <div class="bet-row">
          <button class="ctrl-btn" onclick="adjustBet('betInp',0.5)">½</button>
          <input type="number" class="bet-inp" id="betInp" value="10" min="1">
          <button class="ctrl-btn" onclick="adjustBet('betInp',2)">2×</button>
          <button class="ctrl-btn" onclick="setBetMin('betInp',10)">Min</button>
          <button class="ctrl-btn" onclick="setBetMax('betInp',5000)">Max</button>
        </div>
      </div>
    </div>

    <!-- Action buttons -->
    <button class="action-btn start" id="actionBtn" onclick="handleAction()" data-i18n="x225">🎮 ابدأ اللعبة</button>
  </div>
</div>
<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);flex-direction:column;gap:12px">
  <div style="font-size:40px">💣</div>
  <div style="color:var(--text-dim);font-size:14px" data-i18n="x096">جارٍ التحميل...</div>
</div>
<script src="/static/js/game-base.js?v=20260816i18n"></script>
<script>
'use strict';
var MINES_OPTIONS = [1,3,5,7,10,15,20,24];
var selectedMines = 3;
var gameActive = false;
var gameId = null;
var revealedCells = 0;
var currentMult = 1.0;
var betAmount = 10;
var TOTAL_CELLS = 25;

// Build mines count buttons
(function() {
  var row = document.getElementById('minesCountRow');
  MINES_OPTIONS.forEach(function(n) {
    var btn = document.createElement('button');
    btn.className = 'mc-btn' + (n === selectedMines ? ' active' : '');
    btn.textContent = n + ' 💣';
    btn.onclick = function() {
      selectedMines = n;
      document.querySelectorAll('.mc-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
    };
    row.appendChild(btn);
  });
})();

// Build grid
function buildGrid(reveal) {
  var g = document.getElementById('grid');
  g.innerHTML = '';
  for (var i = 0; i < TOTAL_CELLS; i++) {
    (function(idx) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = 'cell' + idx;
      cell.dataset.idx = idx;
      cell.onclick = function() { if (gameActive) revealCell(idx); };
      g.appendChild(cell);
    })(i);
  }
}

function revealCell(idx) {
  if (!gameActive) return;
  apiFetchCritical(BASE + '/api/mines/reveal', {
    method: 'POST',
    body: JSON.stringify({ uid: uid, cell: idx })
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.error) { showToast(d.error, 'error'); return; }
    var cell = document.getElementById('cell' + idx);
    if (d.is_mine) {
      cell.classList.add('revealed-mine');
      cell.textContent = '💣';
      soundBomb(); hapticNotif('error');
      gameOver(d);
    } else {
      cell.classList.add('revealed-safe');
      cell.textContent = '💎';
      soundGem(); haptic('medium');
      revealedCells++;
      currentMult = d.multiplier || currentMult;
      updateInfo();
      if (d.all_safe) { cashoutAuto(d); }
    }
  }).catch(function() { showToast(I18N.t('x108'), 'error'); });
}

function updateInfo() {
  document.getElementById('multVal').textContent = currentMult.toFixed(2) + 'x';
  document.getElementById('potWin').textContent = fmtAmount(betAmount * currentMult);
  document.getElementById('safeCount').textContent = revealedCells;
  var maxSafe = TOTAL_CELLS - selectedMines;
  var pct = maxSafe > 0 ? (revealedCells / maxSafe * 100) : 0;
  document.getElementById('multFill').style.width = Math.min(pct, 100) + '%';
}

function handleAction() {
  if (!gameActive) { startGame(); }
  else { doCashout(); }
}

function startGame() {
  betAmount = parseFloat(document.getElementById('betInp').value) || 10;
  if (!checkBalanceBeforeBet(betAmount)) return;
  apiFetchCritical(BASE + '/api/mines/new', {
    method: 'POST',
    body: JSON.stringify({ uid: uid, bet: betAmount, mines_count: selectedMines })
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.error) { showToast(d.error, 'error'); if (d.need_deposit) showDepositModal(); return; }
    gameId = d.game_id;
    gameActive = true;
    revealedCells = 0;
    currentMult = 1.0;
    document.getElementById('setupPanel').style.display = 'none';
    document.getElementById('actionBtn').className = 'action-btn cashout';
    document.getElementById('actionBtn').textContent = I18N.t('y152');
    document.getElementById('phaseMsg').textContent = I18N.t('y033');
    buildGrid();
    updateInfo();
    setGamePhase('playing');
    loadBalance();
    haptic('medium');
  }).catch(function() { showToast(I18N.t('y064'), 'error'); });
}

function doCashout() {
  if (!gameActive) return;
  apiFetchCritical(BASE + '/api/mines/cashout', {
    method: 'POST',
    body: JSON.stringify({ uid: uid })
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.error) { showToast(d.error, 'error'); return; }
    gameActive = false;
    showResult(true, d.payout, currentMult);
    revealAll(d.mine_cells || []);
    setGamePhase('idle');
    loadBalance();
    addHistItem(document.getElementById('histBar'), currentMult);
    setTimeout(resetGame, 2500);
  }).catch(function() { showToast(I18N.t('y065'), 'error'); });
}

function gameOver(d) {
  gameActive = false;
  setGamePhase('idle');
  revealAll(d.mine_cells || []);
  showResult(false, 0, 0);
  streakWin = 0;
  addHistItem(document.getElementById('histBar'), 1.0);
  setTimeout(resetGame, 2500);
  loadBalance();
}

function cashoutAuto(d) {
  gameActive = false;
  showResult(true, d.payout, currentMult);
  setGamePhase('idle');
  loadBalance();
  setTimeout(resetGame, 2500);
}

function revealAll(mineCells) {
  for (var i = 0; i < TOTAL_CELLS; i++) {
    var cell = document.getElementById('cell' + i);
    if (!cell) continue;
    if (!cell.classList.contains('revealed-safe') && !cell.classList.contains('revealed-mine')) {
      if (mineCells.indexOf(i) !== -1) {
        cell.classList.add('end-mine'); cell.textContent = '💣';
      } else {
        cell.classList.add('end-safe'); cell.textContent = '💎';
      }
    }
    cell.classList.add('disabled');
  }
}

function showResult(win, payout, mult) {
  if (win) {
    document.getElementById('phaseMsg').textContent = I18N.t('y135') + fmtAmount(payout) + ' (' + mult.toFixed(2) + 'x)';
    document.getElementById('phaseMsg').style.color = 'var(--green)';
    streakWin++; updateStreak(document.getElementById('streakBadge'));
    soundWin(mult > 5);
    hapticNotif('success');
    if (payout > betAmount * 5) showBigWinOverlay(payout, mult);
  } else {
    document.getElementById('phaseMsg').textContent = I18N.t('y149');
    document.getElementById('phaseMsg').style.color = 'var(--red)';
    streakWin = 0; updateStreak(document.getElementById('streakBadge'));
    hapticNotif('error');
  }
}

function resetGame() {
  document.getElementById('setupPanel').style.display = '';
  document.getElementById('actionBtn').className = 'action-btn start';
  document.getElementById('actionBtn').textContent = I18N.t('x225');
  document.getElementById('phaseMsg').textContent = I18N.t('x025');
  document.getElementById('phaseMsg').style.color = '';
  document.getElementById('multVal').textContent = '1.00x';
  document.getElementById('potWin').textContent = '0';
  document.getElementById('safeCount').textContent = '0';
  document.getElementById('multFill').style.width = '0%';
  currentMult = 1.0; revealedCells = 0;
  buildGrid();
  setGamePhase('idle');
}

function handleBack() {
  if (gameActive) {
    showBackConfirmModal(function(ok) { if (ok) { if (tg) tg.close(); else history.back(); } });
  } else { if (tg) tg.close(); else history.back(); }
}

// Init
buildGrid();
document.getElementById('loading').style.display = 'none';
document.getElementById('app').style.display = 'flex';
document.getElementById('app').style.flexDirection = 'column';
document.getElementById('app').style.height = '100dvh';
loadBalance();
setInterval(loadBalance, 10000);
initBackButton();
setConnStatus('connected');
</script>
<script>if(window.I18N)I18N.mountToggle();</script>
<script src="/static/js/auth-gate.js?v=20260821"></script>
</body>
</html>
