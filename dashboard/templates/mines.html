<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Mines — VEX</title>
<link rel="stylesheet" href="/static/css/game-base.css">
<style>
#game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;overflow-y:auto}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:360px;width:100%}
.tile{aspect-ratio:1;background:var(--surface-2);border:2px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:all 0.2s var(--ease)}
.tile:active{transform:scale(0.92)}
.tile.revealed{cursor:default}
.tile.gem{background:rgba(0,231,1,0.1);border-color:var(--green);animation:gemPop 0.3s var(--ease-spring)}
.tile.mine{background:rgba(255,71,87,0.1);border-color:var(--red);animation:shake 0.3s}
@keyframes gemPop{0%{transform:scale(0.5)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
#mult-text{font-size:24px;font-weight:900;font-family:'Courier New',monospace;color:var(--gold);margin:8px 0}
#game-status{font-size:12px;color:var(--muted);margin:4px 0;text-align:center}
.mine-select{display:flex;gap:4px;justify-content:center;margin-top:6px}
.mine-opt{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 14px;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;transition:all 0.15s}
.mine-opt.active{background:var(--gold);color:#000;border-color:var(--gold)}
</style>
</head>
<body>
<div class="loader-screen" id="loading"><div class="spinner"></div></div>
<div id="app" style="display:none">
  <div class="game-topbar">
    <div class="topbar-left"><button class="btn-back" onclick="goBack()">‹</button><div class="bal-pill"><span class="bal-icon">💰</span><span class="bal-val" id="bal">0</span><span class="bal-cur" id="cur">EGP</span></div></div>
    <div class="topbar-right"><span class="streak-badge" id="streak" style="display:none">🔥 0</span><button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊</button></div>
  </div>
  <div class="hist-bar" id="history"></div>
  <div class="game-area" id="gameArea">
    <div id="mult-text">1.00x</div>
    <div id="game-status">ضع رهانك وابدأ اللعب!</div>
    <div id="grid"></div>
  </div>
  <div class="bet-panel">
    <div class="bet-row"><div class="bet-input-wrap"><input type="number" class="bet-input" id="betInput" value="10" min="1" oninput="updatePotential()"><span class="bet-cur" id="betCur">EGP</span></div></div>
    <div class="bet-controls"><div class="bet-ctrl" onclick="adjustBet(0.5)">½</div><div class="bet-ctrl" onclick="adjustBet(2)">2×</div><div class="bet-ctrl" onclick="setBet('min')">Min</div><div class="bet-ctrl" onclick="setBet('max')">Max</div></div>
    <div class="mine-select"><span style="font-size:10px;color:var(--muted);align-self:center">الألغام:</span><div class="mine-opt active" data-mines="3" onclick="setMines(3)">3</div><div class="mine-opt" data-mines="5" onclick="setMines(5)">5</div><div class="mine-opt" data-mines="7" onclick="setMines(7)">7</div><div class="mine-opt" data-mines="10" onclick="setMines(10)">10</div></div>
    <div class="action-row"><button class="btn-action btn-bet-green" id="betBtn" onclick="startGame()">ابدأ</button><button class="btn-action btn-cashout-gold" id="cashBtn" onclick="cashOut()" style="display:none">سحب</button></div>
  </div>
</div>
<div class="lp-bar"><div class="lp-header"><span>👥 <span class="lp-count" id="lpCount">0</span></span><span id="lpTotal">💰 0</span></div><div class="lp-list" id="lpList"></div></div>
<script src="/static/js/game-base.js"></script>
<script>
let gameState='waiting',mineCount=3,revealed=0,sid='',mult=1,gameId='GAME006',betAmt=0,tiles=[];
function setMines(n){if(gameState!=='waiting')return;mineCount=n;document.querySelectorAll('.mine-opt').forEach(e=>e.classList.remove('active'));document.querySelector(`.mine-opt[data-mines="${n}"]`).classList.add('active');}
function renderGrid(){const g=document.getElementById('grid');g.innerHTML='';tiles=[];for(let i=0;i<25;i++){const t=document.createElement('div');t.className='tile';t.dataset.idx=i;t.onclick=()=>revealTile(i);g.appendChild(t);tiles.push(t);}}
function startGame(){if(gameState!=='waiting')return;betAmt=parseFloat(document.getElementById('betInput').value)||0;if(betAmt<1)return;apiFetch(`${BASE}/api/engine/mines/start`,{method:'POST',body:JSON.stringify({uid,bet_amount:betAmt,mine_count:mineCount})}).then(r=>r.json()).then(d=>{if(!d.success){if(d.need_deposit)showVexDepositModal(betAmt);else showToast(d.error||'خطأ','error');return;}gameState='playing';sid=d.session_id;revealed=0;mult=1;document.getElementById('bal').textContent=(d.balance_after||0).toLocaleString();document.getElementById('betBtn').style.display='none';document.getElementById('cashBtn').style.display='block';document.getElementById('cashBtn').textContent='💰 سحب';document.getElementById('game-status').textContent=`اكشف المربعات وتجنب ${mineCount} ألغام!`;document.querySelectorAll('.mine-opt').forEach(e=>e.style.opacity='0.3');renderGrid();}).catch(()=>showToast('خطأ','error'));}
function revealTile(i){if(gameState!=='playing'||tiles[i].classList.contains('revealed'))return;apiFetch(`${BASE}/api/engine/mines/reveal`,{method:'POST',body:JSON.stringify({session_id:sid,uid,tile_index:i})}).then(r=>r.json()).then(d=>{if(!d.success)return;tiles[i].classList.add('revealed');if(d.is_mine){tiles[i].classList.add('mine');tiles[i].textContent='💣';soundLose();haptic('heavy');endGame(false);}else{tiles[i].classList.add('gem');tiles[i].textContent='💎';revealed++;mult=d.multiplier;document.getElementById('mult-text').textContent=d.multiplier.toFixed(2)+'x';document.getElementById('cashBtn').textContent=`💰 سحب (${(betAmt*d.multiplier).toFixed(0)})`;beep(659,0.08);haptic('light');if(d.game_over)endGame(true);}}).catch(()=>{});}
function cashOut(){if(gameState!=='playing'||revealed===0)return;apiFetch(`${BASE}/api/engine/mines/cashout`,{method:'POST',body:JSON.stringify({session_id:sid,uid,multiplier:mult,bet_amount:betAmt,revealed})}).then(r=>r.json()).then(d=>{if(d.success){document.getElementById('bal').textContent=(d.balance_after||0).toLocaleString();document.getElementById('game-status').textContent=`✅ +${(d.payout).toFixed(0)} @ ${mult.toFixed(2)}x`;soundCashOut();haptic('medium');fireConfetti(document.getElementById('gameArea'));streakWin++;updateStreak(document.getElementById('streak'));endGame(true,true);}}).catch(()=>{});}
function endGame(won,cashed){gameState='ended';if(!cashed){apiFetch(`${BASE}/api/engine/mines/end`,{method:'POST',body:JSON.stringify({session_id:sid,uid,won,multiplier:mult,bet_amount:betAmt})}).catch(()=>{});}if(!won){streakWin=0;updateStreak(document.getElementById('streak'));}addHistory('history',won?mult:0,won,won&&mult>=5);document.getElementById('cashBtn').style.display='none';setTimeout(resetGame,3000);}
function resetGame(){gameState='waiting';revealed=0;mult=1;document.getElementById('mult-text').textContent='1.00x';document.getElementById('game-status').textContent='ضع رهانك وابدأ اللعب!';document.getElementById('betBtn').style.display='block';document.getElementById('cashBtn').style.display='none';document.querySelectorAll('.mine-opt').forEach(e=>e.style.opacity='1');renderGrid();}
renderGrid();loadBalance();updatePotential();document.getElementById('loading').style.display='none';document.getElementById('app').style.display='flex';setInterval(loadBalance,5000);setInterval(simulatePlayers,2500);simulatePlayers();renderPlayers();
</script>
</body>
</html>
