<style>
.game-area{overflow:hidden;position:relative;flex:1}
#canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.plane-mult{position:absolute;z-index:10;pointer-events:none;transform:translate(15px,-50%);opacity:0;transition:opacity .2s}
.plane-mult-val{font-size:clamp(18px,5vw,26px);font-weight:900;font-family:'Courier New',monospace;letter-spacing:-1px;text-shadow:0 0 20px rgba(0,231,1,.5),0 2px 4px rgba(0,0,0,.5);white-space:nowrap;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:8px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.plane-mult-val.flying{color:#00e701}
.plane-mult-val.cashed{color:#00e701}
.plane-mult-val.crashed{color:#ff4757}
.mult-display{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;opacity:0;transition:opacity .3s}
.mult-display.show{opacity:1}
.mult-val{font-size:clamp(40px,12vw,64px);font-weight:900;font-family:'Courier New',monospace;letter-spacing:-3px;color:var(--muted);transition:color .3s,text-shadow .3s}
.mult-val.flying{color:#00e701;text-shadow:0 0 60px rgba(0,231,1,.4)}
.mult-val.crashed{color:#ff4757;text-shadow:0 0 40px rgba(255,71,87,.4);animation:shake .4s}
.mult-val.cashed{color:#00e701;text-shadow:0 0 40px rgba(0,231,1,.5)}
.game-status{position:absolute;top:10%;left:50%;transform:translateX(-50%);font-size:clamp(11px,3vw,13px);color:var(--muted);z-index:5;text-align:center}
.result-msg{position:absolute;top:52%;left:50%;transform:translate(-50%,0);font-size:clamp(13px,4vw,16px);font-weight:700;z-index:10;display:none;padding:10px 20px;border-radius:var(--radius-sm);background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.result-msg.show{display:block;animation:fadeIn .3s}
.countdown{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(50px,18vw,80px);font-weight:900;color:#00e701;z-index:15;text-shadow:0 0 40px rgba(0,231,1,.5);animation:cdPop .9s ease-out}
@keyframes cdPop{0%{transform:translate(-50%,-50%) scale(2);opacity:0}30%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(.5);opacity:0}}
.parachutes-layer{position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden}
.parachute-item{position:absolute;display:flex;flex-direction:column;align-items:center;animation:pDesc 3s ease-out forwards}
.parachute-icon{font-size:clamp(24px,7vw,32px);filter:drop-shadow(0 3px 8px rgba(0,0,0,.5));animation:pSway 1.5s ease-in-out infinite}
@keyframes pSway{0%,100%{transform:translateX(-3px) rotate(-5deg)}50%{transform:translateX(3px) rotate(5deg)}}
.parachute-amount{font-size:clamp(10px,3vw,13px);font-weight:900;font-family:'Courier New',monospace;background:linear-gradient(135deg,rgba(0,231,1,.95),rgba(245,158,11,.95));color:#000;padding:2px 10px;border-radius:10px;margin-top:-4px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,231,1,.3)}
.parachute-name{font-size:clamp(8px,2.5vw,10px);color:#00e701;margin-top:2px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.8)}
@keyframes pDesc{0%{transform:translateY(-15px) scale(.3);opacity:0}10%{transform:translateY(0) scale(1);opacity:1}80%{opacity:1}100%{transform:translateY(250px) scale(.5);opacity:0}}
.session-stats{position:absolute;bottom:8px;left:10px;display:flex;gap:6px;z-index:10;font-size:clamp(8px,2.5vw,10px);font-weight:600}
.stat-pill{padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.stat-pill.w{color:#00e701}.stat-pill.l{color:#ff4757}.stat-pill.p{color:#00e701}
.recovery-msg{position:absolute;top:16%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:8px 16px;border-radius:12px;font-size:clamp(10px,3vw,12px);font-weight:700;z-index:15;display:none;text-align:center}
.recovery-msg.show{display:block;animation:fadeIn .3s}
.big-win-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:30;pointer-events:none}
.big-win-overlay.show{display:flex}
.big-win-text{font-size:clamp(32px,12vw,48px);font-weight:900;color:#00e701;text-shadow:0 0 40px rgba(0,231,1,.6);animation:bwB .6s ease-out}
@keyframes bwB{0%{transform:scale(0);opacity:0}50%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:1}}
.bet-slots{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}
.bet-slot{background:var(--surface-2);border:2px solid var(--border);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
.bet-slot.active{border-color:rgba(0,231,1,.3)}
.bet-input{width:100%;background:var(--bg);border:2px solid var(--border);border-radius:8px;padding:8px;color:var(--text);font-size:16px;font-weight:700;text-align:center;outline:none;font-family:'Courier New',monospace}
.bet-input:focus{border-color:var(--green)}
.quick-bets{display:flex;gap:3px;flex-wrap:wrap}
.qb{padding:4px 8px;border-radius:6px;background:var(--surface-3);border:1px solid var(--border);color:var(--muted);font-size:10px;font-weight:700;cursor:pointer;transition:all .1s}
.qb:active{transform:scale(.9)}
.auto-row{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.auto-row input{accent-color:var(--green);width:14px;height:14px}
.bet-btn{width:100%;border:none;padding:12px;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:1px}
.bet-btn:active{transform:scale(.97)}
.bet-btn:disabled{opacity:.3;cursor:not-allowed}
.bet-btn.idle{background:linear-gradient(135deg,#0d7a1f,#1a5c2e);color:#fff;box-shadow:0 2px 10px rgba(13,122,31,.4)}
.bet-btn.betting{background:#333d4b;color:#a8b3bf}
.bet-btn.jump{background:#ff4757;color:#fff;animation:jp .8s infinite}
.bet-btn.queued{background:linear-gradient(135deg,#00a801,#8a6d0a);color:#fff}
.bet-btn.done{background:var(--surface-3);color:var(--muted)}
@keyframes jp{0%,100%{box-shadow:0 0 0 0 rgba(255,71,87,.5)}50%{box-shadow:0 0 0 10px rgba(255,71,87,0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
/* شريط اللاعبين — واقعي بدون فلاش */
.players-panel{background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;height:160px;overflow:hidden;display:flex;flex-direction:column}
.total-bets-bar{padding:6px 12px;font-size:12px;font-weight:800;color:var(--gold);border-bottom:1px solid var(--border);text-align:center;background:rgba(255,215,0,.05)}
.players-list{height:100%;overflow-y:auto;padding:4px 8px;-webkit-overflow-scrolling:touch}
.players-list::-webkit-scrollbar{width:3px}
.players-list::-webkit-scrollbar-thumb{background:var(--border)}
.prow{display:flex;align-items:center;justify-content:space-between;padding:3px 6px;border-radius:6px;margin:1px 0;font-size:11px;transition:background .3s}
.prow.win{background:rgba(0,231,1,.06)}
.prow.participating{background:transparent;opacity:.7}
.prow.lost{background:rgba(255,71,87,.04);opacity:.5}
.prow .pavatar{width:18px;height:18px;border-radius:50%;background:#262e39;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;margin-left:4px}
.prow .pname{flex:1;font-weight:600;margin:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pbet{font-family:'Courier New',monospace;font-weight:700;color:var(--muted);margin:0 6px}
.prow .pmult{font-family:'Courier New',monospace;font-weight:700;padding:1px 5px;border-radius:4px;font-size:10px}
.prow .pmult.win{background:rgba(0,231,1,.12);color:var(--green)}
.prow .pmult.lost{background:rgba(255,71,87,.08);color:var(--red)}
.prow .pmult.participating{color:var(--muted)}
.prow .ppay{font-family:'Courier New',monospace;font-weight:700;color:var(--gold);margin-right:4px}
</style>
</head>
<body>
<div class="loader-screen" id="loading"><div class="skeleton-bar"></div><div class="skeleton-bar tall"></div><div class="skeleton-bar short"></div></div>
<div id="app" style="display:none">
  <div class="game-topbar">
    <div class="topbar-left">
      <button class="btn-back" onclick="goBack()">‹</button>
      <div class="bal-pill"><span class="bal-icon">💰</span><span class="bal-val" id="bal">0</span><span class="bal-cur" id="cur">EGP</span></div>
    </div>
    <div class="topbar-right">
      <span id="connIndicator">🟡</span>
      <button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊</button>

    <div class="plane-mult" id="planeMult"><div class="plane-mult-val flying" id="planeMultVal">1.00x</div></div>

        <div class="qb" onclick="setBet(1,10)">10</div><div class="qb" onclick="setBet(1,50)">50</div>
        <div class="qb" onclick="setBet(1,100)">100</div><div class="qb" onclick="setBet(1,500)">500</div>

      <div class="auto-row"><input type="checkbox" id="auto1"><span data-i18n="x079">تلقائي</span><input type="number" id="autoVal1" value="2.0" step="0.1" min="1.1" style="width:36px;font-size:10px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px;color:var(--text)"><span style="font-size:10px">x</span></div>
      <div class="quick-bets"><div class="qb" onclick="setAutoX(1,3)">3x</div><div class="qb" onclick="setAutoX(1,4)">4x</div><div class="qb" onclick="setAutoX(1,5)">5x</div></div>
      <button class="bet-btn idle" id="btn1" onclick="onBtn(1)" data-i18n="x125">رهان</button>
    </div>
    <div class="bet-slot" id="slot2">
      <input type="number" class="bet-input" id="bet2" value="0" min="0" placeholder="المبلغ" data-i18n-ph="x052">
      <div class="quick-bets">
        <div class="qb" onclick="setBet(2,10)">10</div><div class="qb" onclick="setBet(2,50)">50</div>
        <div class="qb" onclick="setBet(2,100)">100</div><div class="qb" onclick="setBet(2,500)">500</div>
        <div class="qb" onclick="setBet(2,1000)">1K</div>
      </div>
      <div class="auto-row"><input type="checkbox" id="auto2"><span data-i18n="x079">تلقائي</span><input type="number" id="autoVal2" value="2.0" step="0.1" min="1.1" style="width:36px;font-size:10px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px;color:var(--text)"><span style="font-size:10px">x</span></div>
      <div class="quick-bets"><div class="qb" onclick="setAutoX(2,3)">3x</div><div class="qb" onclick="setAutoX(2,4)">4x</div><div class="qb" onclick="setAutoX(2,5)">5x</div></div>
      <button class="bet-btn idle" id="btn2" onclick="onBtn(2)" disabled data-i18n="x125">رهان</button>
    </div>
  </div>
  <!-- إجمالي رهانات الجولة + شريط اللاعبين -->
  <div class="players-panel" id="playersPanel">
    <div class="total-bets-bar" id="totalBetsBar">💰 <span id="totalBetsEgp">0</span> جنيه</div>

  </div>
</div>

<script>
'use strict';
var canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
var roundPhase='connecting',currentMult=1.0,crashPoint=0;
var pollTimer=null,animF=null,_flyStartT=0,trail=[];
var sessionW=0,sessionL=0,sessionPL=0;
var weather='day',lightningFlash=0,rainDrops=[],bgStars=[];
var bgScroll=0,planeX=0,planeY=0,PX=0.35,PY=0.45;
var lastPhase='',countdownEl=null,slot2On=false;
// حالات الرهان: idle|betting|jump|cashed|lost|queued
var bets={1:{st:'idle',amt:0,req:''},2:{st:'idle',amt:0,req:''}};

function resizeCanvas(){canvas.width=Math.max(1,canvas.clientWidth||window.innerWidth);canvas.height=Math.max(1,canvas.clientHeight||window.innerHeight)}
window.addEventListener('resize',resizeCanvas);
function pickWeather(){weather=['day','night','storm'][Math.floor(Math.random()*3)];if(weather==='storm'){rainDrops=[];for(var i=0;i<60;i++)rainDrops.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,len:8+Math.random()*12,spd:6+Math.random()*8})}if(weather==='night'){bgStars=[];for(var i=0;i<80;i++)bgStars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height*0.7,r:Math.random()*1.5,tw:Math.random()*6.28})}}
function setBet(s,v){document.getElementById('bet'+s).value=v;if(s===2){slot2On=v>0;var b=document.getElementById('slot2');b.classList.toggle('active',slot2On);if(bets[2].st==='idle'){var btn=document.getElementById('btn2');btn.disabled=!slot2On}}}
function setAutoX(s,v){document.getElementById('autoVal'+s).value=v;document.getElementById('auto'+s).checked=true}

// ── Drawing ──
function drawBg(a){var w=canvas.width,h=canvas.height,s=bgScroll;if(weather==='day'){var g=ctx.createLinearGradient(0,0,0,h);if(a<0.4){g.addColorStop(0,'#4a90d9');g.addColorStop(0.4,'#7eb8e8');g.addColorStop(0.7,'#b3d9f2');g.addColorStop(1,'#d4e8f5')}else{g.addColorStop(0,'#0b0e11');g.addColorStop(0.4,'#1a3a5c');g.addColorStop(0.8,'#3a6a9c');g.addColorStop(1,'#5a8abc')}ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}else if(weather==='night'){var g2=ctx.createLinearGradient(0,0,0,h);g2.addColorStop(0,'#020410');g2.addColorStop(0.4,'#080d20');g2.addColorStop(0.8,'#0c1530');g2.addColorStop(1,'#101a3a');ctx.fillStyle=g2;ctx.fillRect(0,0,w,h);var sa=0.3+a*0.5;bgStars.forEach(function(s2){s2.tw+=0.05;var tw=0.4+Math.sin(s2.tw)*0.6;var sx=(s2.x-s*0.1)%w;if(sx<0)sx+=w;ctx.beginPath();ctx.arc(sx,s2.y,s2.r,0,6.28);ctx.fillStyle='rgba(255,255,255,'+(sa*tw)+')';ctx.fill()})}else{var g3=ctx.createLinearGradient(0,0,0,h);g3.addColorStop(0,'#1a1a2e');g3.addColorStop(0.4,'#16213e');g3.addColorStop(0.8,'#0f3460');g3.addColorStop(1,'#1a4a70');ctx.fillStyle=g3;ctx.fillRect(0,0,w,h);if(lightningFlash>0){ctx.fillStyle='rgba(255,255,255,'+(lightningFlash*0.4)+')';ctx.fillRect(0,0,w,h);lightningFlash-=0.05}ctx.strokeStyle='rgba(150,170,200,0.5)';ctx.lineWidth=1.5;rainDrops.forEach(function(d){d.y+=d.spd;d.x-=4;if(d.y>h){d.y=-10;d.x=Math.random()*w}if(d.x<0)d.x=w;ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-3,d.y+d.len);ctx.stroke()})}}
function drawRw(a){var w=canvas.width,h=canvas.height,al=Math.max(0,1-a*3.5);if(al<=0)return;var gy=h-30,s=bgScroll;for(var i=0;i<12;i++){var hx=((i*80-s*0.3)%(w+100))-50,hy=gy-12-(i%2)*3,hw=14,hh=10+(i%3)*3;ctx.fillStyle='rgba('+(180-(i%4)*15)+','+(160-(i%3)*10)+',140,'+(al*0.6)+')';ctx.fillRect(hx,hy,hw,hh);ctx.fillStyle='rgba('+(120-(i%3)*15)+',80,60,'+(al*0.6)+')';ctx.beginPath();ctx.moveTo(hx-1,hy);ctx.lineTo(hx+hw/2,hy-5);ctx.lineTo(hx+hw+1,hy);ctx.closePath();ctx.fill()}ctx.fillStyle='rgba(40,80,50,'+al+')';ctx.fillRect(0,gy-8,w,10);ctx.fillStyle='rgba(30,32,40,'+al+')';ctx.fillRect(0,gy,w,30);ctx.fillStyle='rgba(0,231,1,'+(al*0.9)+')';var sw=25,gap=20,off=s%(sw+gap);for(var x=-off;x<w;x+=sw+gap)ctx.fillRect(x,gy+13,sw,3.5)}
function drawTrail(px,py,ang){if(trail.length<2)return;ctx.save();ctx.strokeStyle='rgba(0,231,1,0.35)';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(trail[0].x,trail[0].y);for(var i=1;i<trail.length;i++)ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke();ctx.lineTo(trail[trail.length-1].x,canvas.height);ctx.lineTo(trail[0].x,canvas.height);ctx.closePath();var fg=ctx.createLinearGradient(0,0,0,canvas.height);fg.addColorStop(0,'rgba(0,231,1,0.06)');fg.addColorStop(1,'rgba(0,231,1,0)');ctx.fillStyle=fg;ctx.fill();ctx.translate(px,py);ctx.rotate(ang);for(var j=0;j<8;j++){var ps=(8-j)*1.2,pX=-29-j*6,pY=(Math.random()-0.5)*4,al=0.5-j*0.05;ctx.beginPath();ctx.arc(pX,pY,ps,0,6.28);ctx.fillStyle='rgba(255,'+(140+j*15)+','+(40+j*20)+','+al+')';ctx.fill();if(j<4){ctx.beginPath();ctx.arc(pX,pY,ps*0.4,0,6.28);ctx.fillStyle='rgba(255,255,200,'+(al*0.8)+')';ctx.fill()}}ctx.restore()}
function drawPlane(px,py,ang){ctx.save();ctx.translate(px,py);ctx.rotate(ang);ctx.scale(1.8,1.8);var bg=ctx.createLinearGradient(0,-6,0,6);bg.addColorStop(0,'#f8fafc');bg.addColorStop(0.4,'#e2e8f0');bg.addColorStop(1,'#94a3b8');ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(18,0);ctx.quadraticCurveTo(17,-6,10,-6);ctx.lineTo(-10,-6);ctx.quadraticCurveTo(-14,-6,-14,-3);ctx.lineTo(-14,3);ctx.quadraticCurveTo(-14,6,-10,6);ctx.lineTo(10,6);ctx.quadraticCurveTo(17,6,18,0);ctx.closePath();ctx.fill();ctx.fillStyle='#1e40af';ctx.beginPath();ctx.moveTo(16,-1);ctx.lineTo(-12,-1);ctx.lineTo(-12,1);ctx.lineTo(16,1);ctx.closePath();ctx.fill();ctx.fillStyle='#1e3a5f';for(var i=0;i<6;i++)ctx.fillRect(2+i*2.2,-4,1.2,1.8);ctx.fillStyle='#0f172a';ctx.beginPath();ctx.ellipse(12,-1.5,3.5,2,0,0,6.28);ctx.fill();ctx.fillStyle='#cbd5e1';ctx.fillRect(-10,-5,4,8);ctx.fillStyle='#1a1a2e';ctx.fillRect(-9.5,-4.5,3,7);ctx.fillStyle='#94a3b8';ctx.beginPath();ctx.moveTo(-6,-4);ctx.lineTo(-3,-6);ctx.lineTo(-3,4);ctx.lineTo(-6,2);ctx.closePath();ctx.fill();var wg=ctx.createLinearGradient(0,-16,0,16);wg.addColorStop(0,'#cbd5e1');wg.addColorStop(0.5,'#94a3b8');wg.addColorStop(1,'#64748b');ctx.fillStyle=wg;ctx.beginPath();ctx.moveTo(4,0);ctx.lineTo(-2,-16);ctx.lineTo(-6,-16);ctx.lineTo(-5,0);ctx.lineTo(-6,16);ctx.lineTo(-2,16);ctx.closePath();ctx.fill();ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(-4,-15,1,0,6.28);ctx.fill();ctx.fillStyle='#00e701';ctx.beginPath();ctx.arc(-4,15,1,0,6.28);ctx.fill();ctx.fillStyle='#475569';ctx.beginPath();ctx.ellipse(-2,-8,3,1.5,0.1,0,6.28);ctx.fill();ctx.fillStyle='#1e40af';ctx.beginPath();ctx.moveTo(-10,-6);ctx.lineTo(-16,-14);ctx.lineTo(-11,-14);ctx.lineTo(-7,-6);ctx.closePath();ctx.fill();ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.arc(-12,-11,1.5,0,6.28);ctx.fill();ctx.fillStyle='#94a3b8';ctx.beginPath();ctx.moveTo(-11,0);ctx.lineTo(-15,-4);ctx.lineTo(-13,-4);ctx.lineTo(-11,-1);ctx.lineTo(-11,1);ctx.lineTo(-13,4);ctx.lineTo(-15,4);ctx.closePath();ctx.fill();ctx.fillStyle='#cbd5e1';ctx.beginPath();ctx.arc(17,0,1.5,0,6.28);ctx.fill();ctx.restore()}

// ── Polling ──
function startPolling(){if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(poll,1000);poll()}
async function poll(){try{var r=await apiFetch(BASE+'/api/aviator/state');var d=await r.json();var ci=document.getElementById('connIndicator');if(ci)ci.textContent='🟢';handleState(d)}catch(e){var ci=document.getElementById('connIndicator');if(ci)ci.textContent='🔴'}}
function handleState(d){
  var np=d.phase;currentMult=d.multiplier||1.0;if(d.crash_point)crashPoint=d.crash_point;
  // استرجاع حالة الرهان من السيرفر (لو العميل حدّث الصفحة)
  if(d.my_bet&&d.my_bet.placed&&!bets[1].placed){
    bets[1].st=d.my_bet.cashed_out?'cashed':'jump';
    bets[1].amt=d.my_bet.amount||0;
    if(d.my_bet.cashed_out){
      setBtn(1,'done','✓ '+(d.my_bet.cash_mult*d.my_bet.amount).toFixed(0));
    } else if(np==='flying'){
      setBtn(1,'jump',I18N.t('y085'));
    } else if(np==='waiting'){
      setBtn(1,'betting',I18N.t('x018'));
    }
  }
  if(np!==lastPhase){if(np==='waiting')onWaiting(d);else if(np==='flying')onFlying(d);else if(np==='crashed')onCrashed(d);lastPhase=np}
  else{if(np==='flying'){document.getElementById('mult').textContent=currentMult.toFixed(2)+'x';document.getElementById('planeMultVal').textContent=currentMult.toFixed(2)+'x'}}
  if(d.history){var h=document.getElementById('history');h.innerHTML='';d.history.forEach(function(v){var el=document.createElement('div');el.className='hist-item '+(v>=1.5?'hist-win':'hist-lose')+(v>=3?' hist-big':'');el.textContent=v.toFixed(2)+'x';h.appendChild(el)})}
  // عرض اللاعبين الوهميين
  if(d.players){renderFakePlayers(d.players)}
  if(d.total_bets_egp){document.getElementById('totalBetsEgp').textContent=d.total_bets_egp.toLocaleString()}
}

function renderFakePlayers(players){
  var list=document.getElementById('playersList');
  if(!list)return;
  // تحديث سلس بدون فلاش — تعديل الصفوف الموجودة بدل إعادة كتابة الكل
  list.innerHTML='';
  players.forEach(function(p){
    var row=document.createElement('div');
    row.className='prow '+p.status;
    var multHtml='';
    var payHtml='';
    if(p.status==='cashed'){
      multHtml='<span class="pmult win">'+p.multiplier.toFixed(2)+'x</span>';
      payHtml='<span class="ppay">+'+p.payout.toFixed(0)+'</span>';
    } else if(p.status==='lost'){
      multHtml='<span class="pmult lost">💥</span>';
    } else {
      multHtml='<span class="pmult participating">⏳</span>';
    }
    row.innerHTML='<div class="pavatar">'+p.avatar+'</div>'+
      '<span class="pname">'+p.name+'</span>'+
      '<span class="pbet">'+p.bet+'</span>'+
      multHtml+payHtml;
    list.appendChild(row);
  });
}

function setBtn(s,cls,txt){var b=document.getElementById('btn'+s);b.className='bet-btn '+cls;b.textContent=txt;b.disabled=false}

// ── onWaiting: العد التنازلي + تفعيل الأزرار ──
function onWaiting(d){
  roundPhase='waiting';trail=[];
  ctx.clearRect(0,0,canvas.width,canvas.height);drawBg(0);drawRw(0);
  planeX=40;planeY=canvas.height-30;drawPlane(planeX,planeY,0);
  document.getElementById('multDisplay').classList.add('show');
  document.getElementById('mult').textContent='1.00x';
  document.getElementById('mult').className='mult-val';
  document.getElementById('planeMult').style.opacity='0';
  document.getElementById('statusText').textContent=I18N.t('y076');
  document.getElementById('crashMsg').classList.remove('show');
  document.getElementById('recoveryMsg').classList.remove('show');

  for(var s=1;s<=2;s++){
    if(bets[s].st==='queued'){
      // طابور → راهن تلقائياً في الجولة الجديدة
      var amt=parseFloat(document.getElementById('bet'+s).value)||0;
      if(amt>=1){placeBet(s,amt);continue}
      // لو مفيش مبلغ → إلغاء الطابور
      bets[s].st='idle';setBtn(s,'idle',I18N.t('x125'));
      if(s===2&&!slot2On)document.getElementById('btn2').disabled=true;
    }
    if(bets[s].st==='betting'){
      // راهن ولم يلغَ → زر إلغاء (رمادي) — يمكن الإلغاء خلال 6 ثواني
      setBtn(s,'betting',I18N.t('x018'));
    } else if(bets[s].st!=='cashed'&&bets[s].st!=='lost'&&bets[s].st!=='queued'){
      // إعادة تعيين
      bets[s].st='idle';bets[s].amt=0;
      setBtn(s,'idle',I18N.t('x125'));
      if(s===2&&!slot2On)document.getElementById('btn2').disabled=true;
    }
    // auto-play: راهن تلقائي لو checkbox مفعل
    if(document.getElementById('auto'+s).checked&&bets[s].st==='idle'){
      var av=parseFloat(document.getElementById('bet'+s).value)||0;
      if(av>=1)placeBet(s,av);
    }
  }

  // Countdown 6
  var c=6;if(countdownEl)countdownEl.remove();
  function tick(){if(roundPhase!=='waiting')return;if(countdownEl)countdownEl.remove();countdownEl=document.createElement('div');countdownEl.className='countdown';countdownEl.textContent=c;document.getElementById('gameArea').appendChild(countdownEl);soundTick();haptic('light');setTimeout(function(){if(countdownEl){countdownEl.remove();countdownEl=null}},850);c--;if(c>0)setTimeout(tick,1000)}
  setTimeout(tick,200);
}

// ── onFlying: الطائرة تطير ──
function onFlying(d){
  roundPhase='flying';_flyStartT=performance.now();trail=[];bgScroll=0;pickWeather();
  document.getElementById('multDisplay').classList.remove('show');
  document.getElementById('planeMult').style.opacity='1';
  document.getElementById('planeMultVal').className='plane-mult-val flying';
  document.getElementById('statusText').textContent='';
  document.getElementById('crashMsg').classList.remove('show');

  for(var s=1;s<=2;s++){
    if(bets[s].st==='betting'){
      // راهن → زر قفز (أحمر)
      bets[s].st='jump';setBtn(s,'jump',I18N.t('y085'));
    } else if(bets[s].st==='idle'){
      // لم يراهن → زر رهان (يقبل الطابور للجولة القادمة)
      setBtn(s,'idle',I18N.t('x125'));
    }
  }
  haptic('light');if(animF)cancelAnimationFrame(animF);animate();
}

// ── Animation ──
function animate(){
  if(roundPhase!=='flying')return;
  var el=(performance.now()-_flyStartT)/1000;
  var m=Math.pow(Math.E,0.07*el);m=Math.max(1.0,m);currentMult=m;
  document.getElementById('mult').textContent=m.toFixed(2)+'x';
  document.getElementById('mult').className='mult-val flying';
  // Auto-cashout: قفز تلقائي عند قيمة الاكس المحددة
  for(var s=1;s<=2;s++){
    if(bets[s].st==='jump'){
      var autoChk=document.getElementById('auto'+s);
      var autoVal=parseFloat(document.getElementById('autoVal'+s).value)||0;
      if(autoChk&&autoChk.checked&&autoVal>0&&m>=autoVal){doJump(s);}
    }
  }
  var cx=canvas.width*PX,cy=canvas.height*PY,td=3.5;
  if(el<td){var p=el/td,e=p*p*(3-2*p);planeX=40+e*(cx-40);planeY=canvas.height-30-e*(canvas.height-30-cy);trail.push({x:planeX,y:planeY});if(trail.length>120)trail.shift();bgScroll=e*20}
  else{planeX=cx;planeY=cy;bgScroll+=2+m*0.3}
  var alt=Math.min(1,el/10);
  ctx.clearRect(0,0,canvas.width,canvas.height);drawBg(alt);drawRw(alt);
  var a22=22*Math.PI/180;var ang=el<td?-(a22*(1-(el/td)*0.5)):-(8*Math.PI/180)+Math.sin(el*1.5)*0.03;
  drawTrail(planeX,planeY,ang);drawPlane(planeX,planeY,ang);
  var pm=document.getElementById('planeMult');pm.style.left=planeX+'px';pm.style.top=planeY+'px';
  document.getElementById('planeMultVal').textContent=m.toFixed(2)+'x';
  animF=requestAnimationFrame(animate);
}

// ── onCrashed: الانفجار ──
function onCrashed(d){
  roundPhase='crashed';if(animF)cancelAnimationFrame(animF);
  var cm=d.crash_point||d.multiplier||crashPoint||1.0;currentMult=cm;
  document.getElementById('planeMult').style.opacity='0';
  document.getElementById('multDisplay').classList.add('show');
  document.getElementById('mult').textContent=cm.toFixed(2)+'x';
  document.getElementById('mult').className='mult-val crashed';
  document.getElementById('planeMultVal').className='plane-mult-val crashed';
  var msg=document.getElementById('crashMsg');msg.textContent='💥 '+cm.toFixed(2)+'x';msg.style.color='var(--red)';msg.classList.add('show');
  createExplosion();soundCrash();haptic('heavy');
  for(var s=1;s<=2;s++){
    if(bets[s].st==='jump'){
      bets[s].st='lost';sessionL++;sessionPL-=bets[s].amt;
      var be=document.getElementById('recoveryMsg');
      be.innerHTML='🔥 <b data-i18n="x065">انفجرت أموالك!</b><br><span style="color:#ff4757;font-weight:900;font-size:16px">'+bets[s].amt.toFixed(0)+'</span> '+I18N.t('z047');
      be.style.color='#ff4757';be.classList.add('show');
      setTimeout(function(){be.classList.remove('show')},4000);
    }
    bets[s].st='idle';bets[s].amt=0;
    setBtn(s,'idle',I18N.t('x125'));
    if(s===2&&!slot2On)document.getElementById('btn2').disabled=true;
  }
  updateSessionStats();loadBalance();
}

// ── زر الرهان ──
function onBtn(s){
  var st=bets[s].st;

  // idle + waiting → راهن → إلغاء
  if(st==='idle'&&roundPhase==='waiting'){
    var amt=parseFloat(document.getElementById('bet'+s).value)||0;
    if(amt<1){showToast(I18N.t('y010'),'error');return}
    placeBet(s,amt);return;
  }

  // betting + waiting → إلغاء → رهان
  if(st==='betting'&&roundPhase==='waiting'){
    bets[s].st='idle';bets[s].amt=0;
    setBtn(s,'idle',I18N.t('x125'));
    if(s===2&&!slot2On)document.getElementById('btn2').disabled=true;
    showToast(I18N.t('y040'),'info');return;
  }

  // jump + flying → قفز!
  if(st==='jump'&&roundPhase==='flying'){doJump(s);return;}

  // idle + flying → طابور للجولة القادمة
  if(st==='idle'&&(roundPhase==='flying'||roundPhase==='crashed')){
    var amt2=parseFloat(document.getElementById('bet'+s).value)||0;
    if(amt2<1){showToast(I18N.t('y010'),'error');return}
    bets[s].st='queued';bets[s].amt=amt2;
    setBtn(s,'queued',I18N.t('y114'));
    showToast(I18N.t('y126'),'success');return;
  }

  // queued → إلغاء الطابور
  if(st==='queued'){
    bets[s].st='idle';bets[s].amt=0;
    setBtn(s,'idle',I18N.t('x125'));
    if(s===2&&!slot2On)document.getElementById('btn2').disabled=true;
    showToast(I18N.t('y041'),'info');return;
  }
}

function placeBet(s,amt){
  var btn=document.getElementById('btn'+s);
  btn.disabled=true;btn.textContent='⏳';
  checkBalanceBeforeBet(amt).then(function(ok){
    if(!ok){btn.disabled=false;btn.textContent=I18N.t('x125');return}
    bets[s].req='b'+s+'_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);
    apiFetchCritical(BASE+'/api/aviator/bet',{method:'POST',body:JSON.stringify({bet_amount:amt,auto_val:0,request_id:bets[s].req})})
    .then(function(r){return r.json()}).then(function(d){
      if(d.success){
        bets[s].st='betting';bets[s].amt=amt;
        document.getElementById('bal').textContent=d.balance_after.toLocaleString();
        setBtn(s,'betting',I18N.t('x018'));
        soundTick();haptic('light');
      }else{
        btn.disabled=false;btn.textContent=I18N.t('x125');
        if(d.need_deposit)showVexDepositModal(amt);else showToast(d.error||I18N.t('x106'),'error');
      }
    }).catch(function(){btn.disabled=false;btn.textContent=I18N.t('x125');showToast(I18N.t('x106'),'error')});
  });
}

function doJump(s){
  if(bets[s].st!=='jump')return;
  var pay=Math.floor(bets[s].amt*currentMult*100)/100;
  bets[s].st='cashed';
  setBtn(s,'done','✓ '+pay.toFixed(0));
  var msg=document.getElementById('crashMsg');
  msg.textContent='✅ +'+pay.toFixed(2)+' @ '+currentMult.toFixed(2)+'x';
  msg.style.color='var(--gold)';msg.classList.add('show');
  document.getElementById('planeMultVal').className='plane-mult-val cashed';
  soundCashOut();haptic('medium');fireConfetti(document.getElementById('gameArea'));
  if(currentMult>=3)showBigWin(pay,currentMult);
  sessionW++;sessionPL+=pay-bets[s].amt;updateSessionStats();
  // باراشوت مع المبلغ يتحرك للأسفل
  spawnParachuteWithMoney(planeX,planeY,pay);
  var req='c'+s+'_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);
  apiFetchCritical(BASE+'/api/aviator/cashout',{method:'POST',body:JSON.stringify({request_id:req})})
  .then(function(r){return r.json()}).then(function(d){if(d.success&&d.balance_after!==undefined)document.getElementById('bal').textContent=d.balance_after.toLocaleString()})
  .catch(function(){});
}

// باراشوت: رجل يقفز بمظلة + المبلغ يتحرك معه للأسفل
function spawnParachuteWithMoney(px,py,amount){
  var layer=document.getElementById('parachutesLayer');
  var el=document.createElement('div');
  el.style.cssText='position:absolute;left:'+px+'px;top:'+py+'px;z-index:25;pointer-events:none;transform:translateX(-50%)';
  el.innerHTML='<div style="font-size:32px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5));animation:pSway 1.5s ease-in-out infinite">🪂</div>'+
    '<div style="font-size:14px;font-weight:900;font-family:Courier New,monospace;background:linear-gradient(135deg,rgba(0,231,1,.95),rgba(245,158,11,.95));color:#000;padding:3px 12px;border-radius:10px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,231,1,.4);margin-top:-6px">+'+amount.toFixed(0)+'</div>'+
    '<div style="font-size:20px;margin-top:2px">🧍</div>';
  layer.appendChild(el);
  // أنيمشن: يتحرك للأسفل ببطء
  var startY=py;
  var endY=canvas.height-50;
  var duration=2500;
  var start=performance.now();
  function fall(now){
    var t=Math.min(1,(now-start)/duration);
    var eased=1-Math.pow(1-t,2); // ease-out
    var y=startY+(endY-startY)*eased;
    el.style.top=y+'px';
    el.style.opacity=t>0.8?(1-t)*5:1; // يتلاشى في النهاية
    if(t<1){requestAnimationFrame(fall)}else{el.remove()}
  }
  requestAnimationFrame(fall);
}

// ── Helpers ──
function updateSessionStats(){document.getElementById('sWin').textContent=sessionW;document.getElementById('sLoss').textContent=sessionL;document.getElementById('sPL').textContent=sessionPL>=0?'+'+sessionPL.toFixed(0):sessionPL.toFixed(0)}
function createExplosion(){var a=document.getElementById('gameArea');for(var i=0;i<20;i++){var p=document.createElement('div');p.style.cssText='position:absolute;width:4px;height:4px;border-radius:50%;pointer-events:none;z-index:20;left:'+planeX+'px;top:'+planeY+'px;background:'+['#ff4757','#00e701','#ff8c42'][i%3];a.appendChild(p);var ang=(i/20)*6.28,dist=60+Math.random()*100;p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(ang)*dist+'px,'+Math.sin(ang)*dist+'px) scale(0)',opacity:0}],{duration:800,easing:'ease-out'});setTimeout(function(){p.remove()},800)}}
function showBigWin(p,m){var o=document.getElementById('bigWin');document.getElementById('bigWinText').textContent='🎉 +'+p.toFixed(0)+' @ '+m.toFixed(2)+'x';o.classList.add('show');soundWin(true);setTimeout(function(){o.classList.remove('show')},2500)}

// ── Init ──
document.getElementById('loading').style.display='none';
document.getElementById('app').style.display='flex';
requestAnimationFrame(function(){resizeCanvas();pickWeather();drawBg(0);drawRw(0);planeX=40;planeY=canvas.height-30;drawPlane(planeX,planeY,0)});
loadBalance();startPolling();setInterval(loadBalance,5000);setTimeout(injectDepositButton,100);
</script>
