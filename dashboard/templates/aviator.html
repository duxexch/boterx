<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Aviator — VEX</title>
<link rel="stylesheet" href="/static/css/game-base.css">
<style>
#canvas{position:absolute;inset:0;width:100%;height:100%}
</style>
</head>
<body>
<div class="loader-screen" id="loading"><div class="spinner"></div></div>
<div id="app" style="display:none">
  <div class="game-topbar">
    <div class="topbar-left">
      <button class="btn-back" onclick="goBack()">‹</button>
      <div class="bal-pill"><span class="bal-icon">💰</span><span class="bal-val" id="bal">0</span><span class="bal-cur" id="cur">EGP</span></div>
    </div>
    <div class="topbar-right">
      <span class="streak-badge" id="streak" style="display:none">🔥 0</span>
      <button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊</button>
    </div>
  </div>
  <div class="hist-bar" id="history"></div>
  <div class="game-area" id="gameArea">
    <div class="stars-bg" id="stars"></div>
    <canvas id="canvas"></canvas>
    <div class="game-status" id="statusText">ضع رهانك وانتظر الإقلاع</div>
    <div class="mult-display"><div class="mult-val" id="mult">1.00x</div></div>
    <div class="result-msg" id="crashMsg"></div>
  </div>
  <div class="bet-panel">
    <div class="bet-row">
      <div class="bet-input-wrap">
        <input type="number" class="bet-input" id="betInput" value="10" min="1" oninput="updatePotential()">
        <span class="bet-cur" id="betCur">EGP</span>
      </div>
    </div>
    <div class="bet-controls">
      <div class="bet-ctrl" onclick="adjustBet(0.5)">½</div>
      <div class="bet-ctrl" onclick="adjustBet(2)">2×</div>
      <div class="bet-ctrl" onclick="setBet('min')">Min</div>
      <div class="bet-ctrl" onclick="setBet('max')">Max</div>
    </div>
    <div class="auto-row">
      <label style="display:flex;align-items:center;gap:4px">
        <input type="checkbox" class="auto-checkbox" id="autoCashout" onchange="updatePotential()">
        <span class="auto-label">Auto</span>
      </label>
      <input type="number" class="auto-input" id="autoVal" placeholder="2.0" step="0.1" min="1.1" value="2.0" oninput="updatePotential()">
      <span class="auto-label">x</span>
      <div style="flex:1"></div>
      <div class="potential"><span class="pot-label">ربح:</span><span class="pot-val" id="potVal">0.00</span></div>
    </div>
    <div class="action-row">
      <button class="btn-action btn-bet-green" id="betBtn" onclick="placeBet()">رهان</button>
      <button class="btn-action btn-cashout-gold" id="cashBtn" onclick="cashOut()" style="display:none">سحب</button>
    </div>
  </div>
</div>
<div class="lp-bar"><div class="lp-header"><span>👥 <span class="lp-count" id="lpCount">0</span></span><span id="lpTotal">💰 0</span></div><div class="lp-list" id="lpList"></div></div>
<script src="/static/js/game-base.js"></script>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let state='waiting',mult=1,crashPt=1,betAmt=0,hasBet=0,cashedOut=0,cashMult=0,sid='',animF=null,startT=0,trail=[],autoVal=2.0,history=[];

function resizeCanvas(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight;}
window.addEventListener('resize',resizeCanvas);

function draw(px,py,tr){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='rgba(42,49,66,0.3)';ctx.lineWidth=1;
  for(let x=0;x<canvas.width;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
  for(let y=0;y<canvas.height;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
  if(tr.length>1){
    ctx.strokeStyle='#00e701';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(tr[0].x,tr[0].y);
    for(let i=1;i<tr.length;i++)ctx.lineTo(tr[i].x,tr[i].y);ctx.stroke();
    ctx.lineTo(tr[tr.length-1].x,canvas.height);ctx.lineTo(tr[0].x,canvas.height);ctx.closePath();
    const g=ctx.createLinearGradient(0,0,0,canvas.height);g.addColorStop(0,'rgba(0,231,1,0.15)');g.addColorStop(1,'rgba(0,231,1,0)');ctx.fillStyle=g;ctx.fill();
  }
  if(state==='flying'){ctx.font='36px sans-serif';ctx.textAlign='center';ctx.fillText('✈️',px,py);}
}

function animate(){
  if(state!=='flying')return;
  const e=(Date.now()-startT)/1000;mult=Math.exp(0.08*e);
  document.getElementById('mult').textContent=mult.toFixed(2)+'x';
  document.getElementById('mult').className='mult-val flying';
  if(!cashedOut&&hasBet&&autoVal>0&&mult>=autoVal&&document.getElementById('autoCashout').checked)cashOut();
  if(mult>=crashPt){crash();return;}
  const p=Math.min(1,e/10),px=50+p*(canvas.width-100),py=canvas.height-50-p*(canvas.height-150);
  trail.push({x:px,y:py});if(trail.length>200)trail.shift();
  draw(px,py,trail);
  if(Math.floor(e*4)!==Math.floor((e-0.016)*4))soundTick();
  animF=requestAnimationFrame(animate);
}

function placeBet(){
  if(state!=='waiting'||hasBet)return;
  betAmt=parseFloat(document.getElementById('betInput').value)||0;autoVal=parseFloat(document.getElementById('autoVal').value)||0;
  if(betAmt<1)return;
  apiFetch(`${BASE}/api/engine/aviator/start`,{method:'POST',body:JSON.stringify({uid,bet_amount:betAmt})}).then(r=>r.json()).then(d=>{
    if(!d.success){if(d.need_deposit)showVexDepositModal(betAmt);else showToast(d.error||'خطأ','error');return;}
    hasBet=1;cashedOut=0;sid=d.session_id;crashPt=d.crash_point;
    document.getElementById('bal').textContent=(d.balance_after||0).toLocaleString();
    document.getElementById('betBtn').disabled=1;document.getElementById('betBtn').textContent='⏳';
    document.getElementById('statusText').textContent='⏳ جاهز للإقلاع...';
    updatePotential();
  }).catch(()=>showToast('خطأ في الاتصال','error'));
}

function startFlight(){
  state='flying';mult=1;trail=[];startT=Date.now();
  document.getElementById('mult').textContent='1.00x';document.getElementById('mult').className='mult-val flying';
  document.getElementById('statusText').textContent='';document.getElementById('crashMsg').classList.remove('show');
  document.getElementById('betBtn').style.display='none';document.getElementById('cashBtn').style.display='block';
  document.getElementById('cashBtn').textContent='سحب';
  haptic('light');animate();
}

function cashOut(){
  if(state!=='flying'||cashedOut||!hasBet)return;
  cashedOut=1;cashMult=mult;const payout=betAmt*cashMult;
  apiFetch(`${BASE}/api/engine/aviator/cashout`,{method:'POST',body:JSON.stringify({session_id:sid,uid,multiplier:cashMult,bet_amount:betAmt})}).then(r=>r.json()).then(d=>{
    if(d.success){
      document.getElementById('bal').textContent=(d.balance_after||0).toLocaleString();
      const m=document.getElementById('crashMsg');m.textContent=`✅ +${payout.toFixed(2)} @ ${cashMult.toFixed(2)}x`;m.style.color='var(--gold)';m.classList.add('show');
      document.getElementById('mult').className='mult-val cashed';
      document.getElementById('cashBtn').style.display='none';
      soundCashOut();haptic('medium');fireConfetti(document.getElementById('gameArea'));
      streakWin++;updateStreak(document.getElementById('streak'));
    }
  }).catch(()=>{});
}

function crash(){
  state='crashed';cancelAnimationFrame(animF);
  document.getElementById('mult').textContent=crashPt.toFixed(2)+'x';document.getElementById('mult').className='mult-val crashed';
  const m=document.getElementById('crashMsg');m.textContent=`💥 ${crashPt.toFixed(2)}x`;m.style.color='var(--red)';m.classList.add('show');
  document.getElementById('cashBtn').style.display='none';
  soundCrash();haptic('heavy');
  if(!cashedOut){streakWin=0;updateStreak(document.getElementById('streak'));}
  addHistory('history',crashPt,cashedOut,crashPt>=3);
  apiFetch(`${BASE}/api/engine/aviator/end`,{method:'POST',body:JSON.stringify({session_id:sid,uid,crash_point:crashPt,cashed_out:cashedOut,multiplier:cashMult,bet_amount:betAmt})}).catch(()=>{});
  setTimeout(resetGame,3000);
}

function resetGame(){
  state='waiting';hasBet=0;cashedOut=0;mult=1;trail=[];ctx.clearRect(0,0,canvas.width,canvas.height);
  document.getElementById('mult').textContent='1.00x';document.getElementById('mult').className='mult-val';
  document.getElementById('statusText').textContent='ضع رهانك وانتظر الإقلاع';document.getElementById('crashMsg').classList.remove('show');
  document.getElementById('betBtn').disabled=0;document.getElementById('betBtn').textContent='رهان';
  document.getElementById('betBtn').style.display='block';document.getElementById('cashBtn').style.display='none';
  updatePotential();
}

createStars('stars');resizeCanvas();loadBalance();updatePotential();
document.getElementById('loading').style.display='none';document.getElementById('app').style.display='flex';
setInterval(loadBalance,5000);setInterval(simulatePlayers,2500);simulatePlayers();renderPlayers();
let rt;function startRound(){if(rt)clearTimeout(rt);rt=setTimeout(()=>{if(state==='waiting')startFlight();},4000);}
startRound();
</script>
</body>
</html>
