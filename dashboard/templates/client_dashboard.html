<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0e11">
<title>لوحة العميل — VEX</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png?v=20260816">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e11;--surface:#141920;--surface2:#1a1f2e;--border:#262e39;--green:#00e701;--text:#eef2f6;--muted:#6b7a90;--red:#ff4757;--amber:#fbbf24;--blue:#60a5fa}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Cairo,sans-serif;background:var(--bg);min-height:100vh;color:var(--text);-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0}

/* Layout */
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 100px}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:36px;border-radius:10px}
.brand-n{font-weight:900;font-size:15px}
.brand-sub{font-size:10px;color:var(--muted)}
.logout{background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:8px 14px;font-size:11px;cursor:pointer;font-weight:700;transition:all .2s}
.logout:active{transform:scale(.95);color:var(--red);border-color:var(--red)}

/* Hero */
.hero{background:linear-gradient(135deg,rgba(0,231,1,.08),rgba(0,231,1,.02));border:1px solid rgba(0,231,1,.2);border-radius:18px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-30px;left:-30px;width:100px;height:100px;background:radial-gradient(circle,rgba(0,231,1,.1),transparent);border-radius:50%}
.hero h1{font-size:18px;font-weight:900;margin-bottom:4px;position:relative}
.hero .bot{color:var(--muted);font-size:12px;position:relative}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:5px 14px;border-radius:99px;font-weight:700;margin-top:10px;position:relative}
.badge.ok{background:rgba(0,231,1,.12);color:var(--green)}
.badge.exp{background:rgba(255,71,87,.12);color:var(--red)}
.badge.sus{background:rgba(251,191,36,.12);color:var(--amber)}

/* Sub Box */
.sub-box{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.sub-l{font-size:12px;color:var(--muted)}
.sub-d{font-size:22px;font-weight:900}

/* Balance */
.bal-card{background:var(--surface);border:1px solid rgba(0,231,1,.3);border-radius:18px;margin-bottom:16px;overflow:hidden}
.bal-header{padding:14px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.bal-body{text-align:center;padding:20px 16px}
.bal-amount{font-size:36px;font-weight:900;color:var(--green);line-height:1}
.bal-currency{font-size:11px;color:var(--muted);margin-top:4px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center}
.stat .v{font-size:20px;font-weight:900}
.stat .k{font-size:9px;color:var(--muted);margin-top:2px}
.stat .e{font-size:16px;margin-bottom:2px}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;margin-bottom:16px;overflow:hidden}
.card h3{font-size:13px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface2);font-weight:700;display:flex;align-items:center;gap:6px}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:14px 16px}
.chip{font-size:10px;padding:4px 10px;border-radius:99px;background:rgba(0,231,1,.08);color:var(--green);border:1px solid rgba(0,231,1,.2);font-weight:700}

/* Tabs */
.tabs{display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:8px 14px;font-size:11px;cursor:pointer;font-weight:700;white-space:nowrap;transition:all .2s;flex-shrink:0}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tabs button:active{transform:scale(.95)}

/* Payment Methods */
.pm-list{padding:12px 16px}
.pm-opt{background:var(--surface2);border:2px solid var(--border);border-radius:14px;padding:14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .2s}
.pm-opt:active{transform:scale(.98)}
.pm-opt.selected{border-color:var(--green);background:rgba(0,231,1,.04)}
.pm-icon{font-size:28px;flex-shrink:0}
.pm-info{flex:1;min-width:0}
.pm-name{font-size:13px;font-weight:700}
.pm-sub{font-size:10px;color:var(--muted);margin-top:1px}
.pm-copy{background:rgba(0,231,1,.12);color:var(--green);border:none;border-radius:8px;padding:7px 12px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0}
.pm-copy:active{transform:scale(.93)}

/* Form */
.f-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;-webkit-appearance:none}
.f-input:focus{border-color:var(--green)}
.f-label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px}
.f-btn{width:100%;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:900;cursor:pointer;transition:all .15s}
.f-btn:active{transform:scale(.97)}
.f-btn.green{background:var(--green);color:#000}
.f-btn.amber{background:var(--amber);color:#000}
.f-note{font-size:11px;color:var(--muted);margin-bottom:12px;line-height:1.6}

/* Success/Error Toast */
.msg{position:fixed;top:16px;left:16px;right:16px;z-index:99;border-radius:14px;padding:12px 16px;font-size:13px;font-weight:700;text-align:center;animation:msgIn .3s;pointer-events:none}
.msg.ok{background:rgba(0,231,1,.15);color:var(--green);border:1px solid rgba(0,231,1,.3)}
.msg.err{background:rgba(255,71,87,.15);color:var(--red);border:1px solid rgba(255,71,87,.3)}
@keyframes msgIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

/* Table */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;font-size:11px;border-collapse:collapse}
th{background:var(--surface2);color:var(--muted);text-align:right;padding:9px 12px;font-size:10px;white-space:nowrap;position:sticky;top:0}
td{padding:9px 12px;border-top:1px solid var(--border);white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:6px 8px env(safe-area-inset-bottom);z-index:45}
.bottom-nav-inner{display:flex;justify-content:space-around}
.bn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:10px;font-size:9px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .2s;position:relative;-webkit-tap-highlight-color:transparent}
.bn:active{transform:scale(.93)}
.bn.active{color:var(--green)}
.bn .bn-i{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.bn.active .bn-i{background:rgba(0,231,1,.12)}

/* Note */
.note{font-size:11px;color:var(--muted);padding:12px 16px;line-height:1.8}

/* Responsive */
@media(min-width:640px){
  .stats{grid-template-columns:repeat(6,1fr)}
  .bottom-nav{display:none}
  .wrap{padding-bottom:40px}
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <!-- Toast -->
  <div id="toast" class="msg" style="display:none"></div>

  <!-- Header -->
  <div class="hdr">
    <div class="brand">
      <img src="/static/icons/logo-full.png" alt="VEX" onerror="this.style.display='none'">
      <div><div class="brand-n" id="cname">—</div><div class="brand-sub">بوابة العميل</div></div>
    </div>
    <button class="logout" onclick="logout()">خروج ⏻</button>
  </div>

  <!-- Hero -->
  <div class="hero">
    <h1 id="hname">—</h1>
    <div class="bot" id="hbot">—</div>
    <span class="badge" id="hbadge">—</span>
  </div>

  <!-- Subscription -->
  <div class="sub-box">
    <div><div class="sub-l">📅 الاشتراك</div><div style="font-size:13px;font-weight:700;margin-top:2px" id="subend">—</div></div>
    <div class="sub-d" id="subdays">—</div>
  </div>

  <!-- Balance -->
  <div class="bal-card">
    <div class="bal-header">💰 رصيدك الحالي</div>
    <div class="bal-body">
      <div class="bal-amount" id="balance">0.00</div>
      <div class="bal-currency">EGP</div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats" id="stats"></div>

  <!-- Features -->
  <div class="card">
    <h3>🎯 مميزاتك</h3>
    <div class="chips" id="featOn"></div>
    <div class="note" id="featOffWrap" style="display:none"><b>غير مفعّل:</b> <span id="featOff"></span></div>
  </div>

  <!-- Deposit/Withdraw -->
  <div class="card">
    <h3>💳 إيداع / سحب</h3>
    <div class="tabs" id="finTabs">
      <button class="on" onclick="swFin(this,'deposit')">💰 إيداع</button>
      <button onclick="swFin(this,'withdraw')">💸 سحب</button>
      <button onclick="swFin(this,'history')">📋 السجل</button>
    </div>
    <!-- Deposit -->
    <div id="finDeposit" class="pm-list">
      <div class="f-note">اختر وسيلة الدفع وأرسل طلب إيداع</div>
      <div id="pmList"></div>
      <div style="margin-top:14px">
        <label class="f-label">المبلغ (EGP)</label>
        <input id="depAmount" type="number" min="1" placeholder="0.00" class="f-input" inputmode="decimal">
      </div>
      <div style="margin-top:10px">
        <label class="f-label">ملاحظة (اختياري)</label>
        <input id="depNote" type="text" placeholder="مثال: تحويل بنكي" class="f-input">
      </div>
      <button onclick="submitDeposit()" class="f-btn green" style="margin-top:16px">إرسال طلب الإيداع</button>
    </div>
    <!-- Withdraw -->
    <div id="finWithdraw" class="pm-list" style="display:none">
      <div class="f-note">اختر وسيلة السحب — يُخصم من رصيدك</div>
      <div id="pmListW"></div>
      <div style="margin-top:14px">
        <label class="f-label">المبلغ (EGP)</label>
        <input id="wdAmount" type="number" min="1" placeholder="0.00" class="f-input" inputmode="decimal">
      </div>
      <div style="margin-top:10px">
        <label class="f-label">ملاحظة (اختياري)</label>
        <input id="wdNote" type="text" placeholder="مثال: سحب أرباح" class="f-input">
      </div>
      <button onclick="submitWithdraw()" class="f-btn amber" style="margin-top:16px">إرسال طلب السحب</button>
    </div>
    <!-- History -->
    <div id="finHistory" style="display:none">
      <div class="tbl-wrap" style="max-height:300px;overflow-y:auto">
        <table><thead id="finThead"></thead><tbody id="finTbody"></tbody></table>
        <div class="empty" id="finEmpty" style="display:none">لا توجد معاملات</div>
      </div>
    </div>
  </div>

  <!-- Operations -->
  <div class="card">
    <h3>📊 عملياتك</h3>
    <div class="tabs" id="opsTabs">
      <button class="on" onclick="sw(this,'users')">👥 المستخدمين</button>
      <button onclick="sw(this,'transactions')">💳 المعاملات</button>
      <button onclick="sw(this,'svrp_wallets')">💎 التعويض</button>
    </div>
    <div class="tbl-wrap" style="max-height:300px;overflow-y:auto;margin-top:8px">
      <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
      <div class="empty" id="empty" style="display:none">لا توجد بيانات</div>
    </div>
  </div>

  <div style="text-align:center;font-size:10px;color:var(--muted);padding:10px 0">VEX Client Portal © 2026</div>
</div>

<!-- Bottom Nav (Mobile) -->
<div class="bottom-nav">
  <div class="bottom-nav-inner">
    <div class="bn active" onclick="navTab(this,'home')"><div class="bn-i">🏠</div>الرئيسية</div>
    <div class="bn" onclick="navTab(this,'finance')"><div class="bn-i">💳</div>الدفع</div>
    <div class="bn" onclick="navTab(this,'ops')"><div class="bn-i">📊</div>العمليات</div>
  </div>
</div>

<script>
var FEATURES={{features|tojson}};
var ME={{client|tojson}};
var selectedPM='';
var currentSection='home';

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function showToast(msg,type){
  var t=document.getElementById('toast');
  t.textContent=msg;t.className='msg '+(type||'ok');t.style.display='block';
  setTimeout(function(){t.style.display='none'},2500);
}
function render(){
  document.getElementById('cname').textContent=ME.name;
  document.getElementById('hname').textContent='أهلاً، '+ME.name;
  document.getElementById('hbot').textContent='🤖 @'+(ME.bot_username||'—')+(ME.running?' · يعمل الآن':' · متوقف');
  var b=document.getElementById('hbadge');
  if(ME.status==='suspended'){b.className='badge sus';b.textContent='⏸️ حسابك موقوف'}
  else if(ME.expired){b.className='badge exp';b.textContent='⏳ اشتراكك منتهي'}
  else{b.className='badge ok';b.textContent='🟢 اشتراك نشط'}
  document.getElementById('subend').textContent=ME.subscription_end||'—';
  var sd=document.getElementById('subdays');
  if(ME.expired){sd.textContent='منتهي';sd.style.color='var(--red)'}
  else{sd.textContent='متبقي '+ME.days_left+' يوم';sd.style.color=ME.days_left<=3?'var(--amber)':'var(--green)'}
  var s=ME.stats||{};
  var items=[['👥',s.total_users||0,'مستخدم'],['💳',s.total_transactions||0,'معاملة'],['📥',s.deposits||0,'إيداع'],['📤',s.withdrawals||0,'سحب'],['⏳',s.pending||0,'معلقة'],['🚫',s.banned||0,'محظور']];
  document.getElementById('stats').innerHTML=items.map(function(i){
    return '<div class="stat"><div class="e">'+i[0]+'</div><div class="v">'+i[1]+'</div><div class="k">'+i[2]+'</div></div>';
  }).join('');
  var on=(ME.features||[]).map(function(f){return '<span class="chip">'+esc(FEATURES[f]||f)+'</span>'}).join('');
  document.getElementById('featOn').innerHTML=on||'<span class="empty">لا توجد مميزات</span>';
  var off=Object.keys(FEATURES).filter(function(f){return(ME.features||[]).indexOf(f)<0});
  if(off.length){document.getElementById('featOffWrap').style.display='block';document.getElementById('featOff').textContent=off.map(function(f){return FEATURES[f]}).join('، ')}
}
function sw(btn,kind){
  document.getElementById('opsTabs').querySelectorAll('button').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  fetch('/api/client/data?type='+kind+'&limit=50').then(function(r){return r.json()}).then(function(d){
    var fields=(d.fields||[]).slice(0,7),rows=d.rows||[];
    document.getElementById('thead').innerHTML='<tr>'+fields.map(function(f){return'<th>'+esc(f)+'</th>'}).join('')+'</tr>';
    document.getElementById('tbody').innerHTML=rows.map(function(r){return'<tr>'+fields.map(function(f){return'<td>'+esc(r[f]||'-')+'</td>'}).join('')+'</tr>'}).join('');
    document.getElementById('empty').style.display=rows.length?'none':'block';
  });
}
function navTab(el,section){
  currentSection=section;
  document.querySelectorAll('.bn').forEach(function(b){b.classList.remove('active')});
  el.classList.add('active');
  // Scroll to section
  if(section==='home')window.scrollTo({top:0,behavior:'smooth'});
  else if(section==='finance')document.querySelector('.card:nth-of-type(2)').scrollIntoView({behavior:'smooth'});
  else if(section==='ops')document.querySelector('.card:last-of-type').scrollIntoView({behavior:'smooth'});
}
function logout(){fetch('/api/client/logout',{method:'POST'}).then(function(){window.location='/client-login'})}

// ── Payment Methods ──
function loadPaymentMethods(){
  fetch('/api/client/payment-methods').then(function(r){return r.json()}).then(function(d){
    var ms=d.methods||[];
    var html=ms.map(function(m){
      var icon=m.pm_type==='bank_transfer'?'🏦':m.pm_type==='vodafone_cash'?'📱':m.pm_type==='usdt'?'💵':'💰';
      return'<div class="pm-opt" data-id="'+m.id+'" onclick="selectPM(\''+m.id+'\')">'
        +'<div class="pm-icon">'+icon+'</div>'
        +'<div class="pm-info"><div class="pm-name">'+esc(m.name)+'</div>'
        +'<div class="pm-sub">'+esc(m.bank_name||m.pm_type)+'</div></div>'
        +'<button class="pm-copy" onclick="event.stopPropagation();copyAcc(\''+esc(m.account_number)+'\')"><i class="fas fa-copy"></i> نسخ</button>'
        +'</div>';
    }).join('');
    document.getElementById('pmList').innerHTML=html||'<div class="empty">لا توجد وسائل دفع</div>';
    document.getElementById('pmListW').innerHTML=html||'<div class="empty">لا توجد وسائل دفع</div>';
  });
}
function selectPM(id){
  selectedPM=id;
  document.querySelectorAll('.pm-opt').forEach(function(el){
    el.classList.toggle('selected',el.dataset.id===id);
  });
}
function copyAcc(num){navigator.clipboard.writeText(num).then(function(){showToast('تم النسخ: '+num,'ok')}).catch(function(){showToast('فشل النسخ','err')})}
function swFin(btn,kind){
  document.getElementById('finTabs').querySelectorAll('button').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  document.getElementById('finDeposit').style.display=kind==='deposit'?'block':'none';
  document.getElementById('finWithdraw').style.display=kind==='withdraw'?'block':'none';
  document.getElementById('finHistory').style.display=kind==='history'?'block':'none';
  if(kind==='history')loadFinHistory();
  if(kind==='finance'||kind==='deposit')loadPaymentMethods();
}
function submitDeposit(){
  var amt=parseFloat(document.getElementById('depAmount').value);
  var note=document.getElementById('depNote').value;
  if(!selectedPM){showToast('اختر وسيلة الدفع','err');return}
  if(!amt||amt<=0){showToast('أدخل مبلغ صحيح','err');return}
  fetch('/api/client/deposit-request',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({amount:amt,method:selectedPM,note:note})
  }).then(function(r){return r.json()}).then(function(d){
    if(d.success){showToast('✅ تم إرسال طلب الإيداع','ok');document.getElementById('depAmount').value='';document.getElementById('depNote').value=''}
    else{showToast('❌ '+d.error,'err')}
  });
}
function submitWithdraw(){
  var amt=parseFloat(document.getElementById('wdAmount').value);
  var note=document.getElementById('wdNote').value;
  if(!selectedPM){showToast('اختر وسيلة السحب','err');return}
  if(!amt||amt<=0){showToast('أدخل مبلغ صحيح','err');return}
  fetch('/api/client/withdraw-request',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({amount:amt,method:selectedPM,note:note})
  }).then(function(r){return r.json()}).then(function(d){
    if(d.success){showToast('✅ تم إرسال طلب السحب','ok');document.getElementById('wdAmount').value='';document.getElementById('wdNote').value=''}
    else{showToast('❌ '+d.error,'err')}
  });
}
function loadFinHistory(){
  fetch('/api/client/my-transactions').then(function(r){return r.json()}).then(function(d){
    var txs=d.transactions||[];
    document.getElementById('finThead').innerHTML='<tr><th>التاريخ</th><th>النوع</th><th>المبلغ</th><th>الوسيلة</th><th>الحالة</th></tr>';
    document.getElementById('finTbody').innerHTML=txs.map(function(tx){
      var typeIcon=tx.type==='deposit'?'💰':'💸';
      var typeLabel=tx.type==='deposit'?'إيداع':'سحب';
      var statusLabel=tx.status==='pending'?'⏳ معلق':tx.status==='approved'?'✅ مقبول':'❌ مرفوض';
      var statusColor=tx.status==='pending'?'var(--amber)':tx.status==='approved'?'var(--green)':'var(--red)';
      return'<tr><td>'+esc(tx.created_at)+'</td><td>'+typeIcon+' '+typeLabel+'</td><td style="font-weight:900;color:'+(tx.type==='deposit'?'var(--green)':'var(--red)')+'">'+parseFloat(tx.amount).toFixed(2)+'</td><td>'+esc(tx.method)+'</td><td style="color:'+statusColor+';font-weight:700">'+statusLabel+'</td></tr>';
    }).join('');
    document.getElementById('finEmpty').style.display=txs.length?'none':'block';
  });
}

// Init
render();
sw(document.querySelector('#opsTabs .on'),'users');
loadPaymentMethods();
