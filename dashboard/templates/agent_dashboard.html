<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png?v=20260816">
<link rel="icon" href="/favicon.ico?v=20260816" sizes="any">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=20260816">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الوكيل — {{ agent.bot_name }}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0b0e11;color:#eef2f6;min-height:100vh}
.nav{position:sticky;top:0;background:rgba(6,8,16,.95);backdrop-filter:blur(10px);border-bottom:1px solid #262e39;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:50}
.nav-title{font-weight:800;font-size:15px}
.nav-title span{color:#00e701}
.container{max-width:600px;margin:0 auto;padding:16px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.kpi{background:linear-gradient(135deg,#141920,#10141a);border:1px solid #262e39;border-radius:14px;padding:14px;text-align:center}
.kpi-label{font-size:10px;color:#8794a3;margin-bottom:4px}
.kpi-val{font-size:22px;font-weight:800}
.kpi-val.green{color:#00e701}.kpi-val.amber{color:#fbbf24}.kpi-val.red{color:#ff4757}.kpi-val.blue{color:#3b82f6}.kpi-val.cyan{color:#06b6d4}.kpi-val.purple{color:#a78bfa}
.section{background:linear-gradient(135deg,#141920,#10141a);border:1px solid #262e39;border-radius:14px;padding:16px;margin-bottom:14px}
.section-title{font-size:14px;font-weight:700;margin-bottom:12px;color:#00e701}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:right;padding:6px;color:#8794a3;border-bottom:1px solid #262e39;font-weight:600}
td{padding:6px;border-bottom:1px solid #141920}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700}
.tag-approved{background:rgba(0,231,1,.15);color:#00e701}
.tag-pending{background:rgba(251,191,36,.15);color:#fbbf24}
.tag-rejected{background:rgba(255,71,87,.15);color:#ff4757}
.method{display:flex;align-items:center;gap:10px;padding:10px;background:#1a2028;border:1px solid #262e39;border-radius:10px;margin-bottom:8px}
.method-icon{font-size:20px}
.method-info{flex:1}
.method-name{font-size:13px;font-weight:700}
.method-data{font-size:11px;color:#8794a3;font-family:monospace}
.btn{padding:10px 16px;border-radius:10px;border:none;font-weight:700;font-size:13px;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#00e701,#0d7a2f);color:#0b0e11}
.btn-deposit{background:rgba(0,231,1,.12);border:1px solid rgba(0,231,1,.3);color:#00e701}
.btn-edit{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);color:#3b82f6;padding:6px 10px;font-size:11px}
input,select{background:#1a2028;border:1px solid #262e39;border-radius:8px;padding:10px;color:#eef2f6;font-size:14px;width:100%}
.search{margin-bottom:10px}
.empty{text-align:center;color:#8794a3;padding:20px;font-size:13px}
.logout{color:#ff4757;text-decoration:none;font-size:12px}
</style>
<link rel="stylesheet" href="/static/css/bg-logo.css?v=1">
</head>
<body>
<div class="nav">
  <div class="nav-title">🤖 <span>{{ agent.bot_name }}</span></div>
  <a href="/agent-logout" class="logout">خروج ←</a>
</div>
<div class="container">
  <!-- KPIs -->
  <div class="kpis">
    <div class="kpi"><div class="kpi-label">الرصيد</div><div class="kpi-val green" id="balance">0</div></div>
    <div class="kpi"><div class="kpi-label">🔒 الضمان</div><div class="kpi-val cyan" id="escrow">0</div></div>
    <div class="kpi"><div class="kpi-label">معاملات اليوم</div><div class="kpi-val blue" id="daily">0/0</div></div>
    <div class="kpi"><div class="kpi-label">حالة المرور</div><div class="kpi-val" id="traffic">—</div></div>
  </div>
  <!-- Performance -->
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">
    <div class="kpi"><div class="kpi-label">📊 الدرجة</div><div class="kpi-val" id="score">50</div></div>
    <div class="kpi"><div class="kpi-label">التصنيف</div><div class="kpi-val" id="tier">🥉 Bronze</div></div>
    <div class="kpi"><div class="kpi-label">⚡ سرعة الاستجابة</div><div class="kpi-val" id="speed">—</div></div>
  </div>

  <!-- Pending matching requests -->
  <div class="section" id="pendingSection">
    <div class="section-title">🔔 طلبات المطابقة المعلقة <span id="pendingCount"></span></div>
    <div id="pendingList"></div>
  </div>

  <!-- Deposit Balance -->
  <div class="section">
    <div class="section-title">💰 إيداع الرصيد</div>
    <div id="depMethodBox" class="method" style="display:none">
      <span class="method-icon">🏦</span>
      <div class="method-info">
        <div class="method-name" id="depMethodName">—</div>
        <div class="method-data" id="depMethodData">—</div>
      </div>
    </div>
    <div id="depNoMethod" class="empty" style="display:none">لم يحدد الأدمن وسيلة إيداع لك بعد — تواصل مع الإدارة</div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input type="number" id="depAmount" placeholder="المبلغ" style="flex:1">
      <input type="text" id="depWallet" placeholder="رقم محفظتك / مرجع التحويل" style="flex:1">
    </div>
    <button class="btn btn-deposit" onclick="depositBalance()" style="width:100%">💸 طلب إيداع الرصيد</button>
    <div id="depHistory" style="margin-top:10px"></div>
  </div>

  <!-- Payment Methods -->
  <div class="section">
    <div class="section-title">💳 وسائل الدفع</div>
    <div id="methodsList"></div>
  </div>

  <!-- Transactions -->
  <div class="section">
    <div class="section-title">📜 سجل المعاملات</div>
    <input type="text" class="search" id="txnSearch" placeholder="🔍 بحث..." oninput="loadTxns()">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
      <select id="txnStatus" onchange="loadTxns()">
        <option value="">كل الحالات</option>
        <option value="pending">معلق</option>
        <option value="approved">مقبول</option>
        <option value="rejected">مرفوض</option>
      </select>
      <select id="txnType" onchange="loadTxns()">
        <option value="">كل الأنواع</option>
        <option value="deposit">إيداع</option>
        <option value="withdraw">سحب</option>
      </select>
      <input type="date" id="txnFrom" onchange="loadTxns()">
      <input type="date" id="txnTo" onchange="loadTxns()">
      <input type="number" id="txnMin" placeholder="أقل مبلغ" oninput="loadTxns()">
      <input type="number" id="txnMax" placeholder="أعلى مبلغ" oninput="loadTxns()">
    </div>
    <div id="txnTable"></div>
  </div>
</div>

<script>
function loadSelf(){
  fetch('/api/agent/self').then(r=>r.json()).then(d=>{
    document.getElementById('balance').textContent=parseFloat(d.balance||0).toFixed(0);
    document.getElementById('escrow').textContent=parseFloat(d.escrow_balance||0).toFixed(0);
    document.getElementById('deposit').textContent=parseFloat(d.security_deposit||0).toFixed(0);
    document.getElementById('daily').textContent=(d.current_daily_count||0)+'/'+(d.max_daily_transactions||0);
    var t=document.getElementById('traffic');
    t.textContent=d.traffic_enabled==='yes'?'▶️ نشط':'⏸️ متوقف';
    t.className='kpi-val '+(d.traffic_enabled==='yes'?'green':'red');
    // Performance score + tier
    var score = parseFloat(d.performance_score||50);
    var scoreEl = document.getElementById('score');
    scoreEl.textContent = score.toFixed(0);
    scoreEl.className = 'kpi-val ' + (score >= 80 ? 'purple' : score >= 60 ? 'amber' : score >= 40 ? 'blue' : 'green');
    var tiers = {platinum:'💎 Platinum',gold:'🥇 Gold',silver:'🥈 Silver',bronze:'🥉 Bronze'};
    var tierEl = document.getElementById('tier');
    tierEl.textContent = tiers[d.tier] || tiers.bronze;
    // Response speed
    var avgSec = parseFloat(d.avg_response_seconds||0);
    var speedEl = document.getElementById('speed');
    speedEl.textContent = avgSec > 0 ? avgSec.toFixed(0) + ' ثانية' : '—';
    speedEl.className = 'kpi-val ' + (avgSec < 60 ? 'green' : avgSec < 180 ? 'amber' : 'red');
    // Deposit method
    var box=document.getElementById('depMethodBox'), none=document.getElementById('depNoMethod');
    if(d.deposit_method_name){
      box.style.display='flex';none.style.display='none';
      document.getElementById('depMethodName').textContent=d.deposit_method_name;
      document.getElementById('depMethodData').textContent=d.deposit_method_data||'—';
    }else{box.style.display='none';none.style.display='block'}
  });
}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function loadPending(){
  fetch('/api/agent/self/pending').then(r=>r.json()).then(d=>{
    var list=d.transactions||[];
    document.getElementById('pendingCount').textContent=list.length?('('+list.length+')'):'';
    var h='';
    list.forEach(function(t){
      var tid=t.txn_id||t.id;
      h+='<div class="method"><span class="method-icon">'+(t.type==='deposit'?'💵':'💸')+'</span>'
        +'<div class="method-info"><div class="method-name">'+(t.type==='deposit'?'إيداع (تدفع للمستخدم)':'سحب (تستلم من المستخدم)')+' — '+esc(t.amount)+' '+esc(t.currency||'EGP')+'</div>'
        +'<div class="method-data">'+esc(t.user_name||t.user_id||'—')
        +(t.company_name?' · '+esc(t.company_name):'')
        +' · '+esc((t.created_at||'').slice(0,16))
        +(tid?' · <span style="opacity:.7">'+esc(tid)+'</span>':'')+'</div></div>'
        +'<button class="btn btn-primary" style="padding:6px 10px;font-size:11px" onclick="processTxn(\''+esc(tid)+'\',\'approved\')">✔ قبول</button>'
        +'<button class="btn" style="background:rgba(255,71,87,.15);color:#ff4757;padding:6px 10px;font-size:11px" onclick="processTxn(\''+esc(tid)+'\',\'rejected\')">✖ رفض</button></div>';
    });
    if(!h)h='<div class="empty">لا توجد طلبات معلقة</div>';
    document.getElementById('pendingList').innerHTML=h;
  });
}
function processTxn(tid,decision){
  if(!confirm(decision==='approved'?'تأكيد قبول الطلب؟':'تأكيد رفض الطلب؟'))return;
  fetch('/api/agent/self/transactions/'+tid+'/process',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:decision})})
  .then(r=>r.json()).then(d=>{
    if(d.success){loadSelf();loadPending();loadTxns()}
    else{alert(d.error||'فشل')}
  });
}
function loadDepHistory(){
  fetch('/api/agent/self/deposits').then(r=>r.json()).then(d=>{
    var list=(d.requests||[]).slice(0,5);
    if(!list.length){document.getElementById('depHistory').innerHTML='';return}
    var h='<table><thead><tr><th>المبلغ</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody>';
    list.forEach(function(r){
      h+='<tr><td>'+esc(r.amount)+'</td><td><span class="tag tag-'+esc(r.status)+'">'+esc(r.status)+'</span></td><td>'+esc((r.created_at||'').slice(0,16))+'</td></tr>';
    });
    document.getElementById('depHistory').innerHTML=h+'</tbody></table>';
  });
}
function loadMethods(){
  fetch('/api/agent/self/payment-methods').then(r=>r.json()).then(d=>{
    var h='';
    (d.methods||[]).forEach(function(m){
      h+='<div class="method"><span class="method-icon">'+esc(m.icon||'💳')+'</span><div class="method-info"><div class="method-name">'+esc(m.method_name)+'</div><div class="method-data">'+esc(m.account_data||'—')+'</div></div><button class="btn btn-edit" data-mid="'+esc(m.id)+'" onclick="editMethod(this.dataset.mid)">✏️</button></div>';
    });
    if(!h)h='<div class="empty">لا توجد وسائل دفع</div>';
    document.getElementById('methodsList').innerHTML=h;
  });
}
function editMethod(mid){
  var newData=prompt('بيانات الحساب الجديدة:');
  if(newData===null)return;
  fetch('/api/agent/self/payment-methods/'+mid,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({account_data:newData})}).then(r=>r.json()).then(d=>{if(d.success){loadMethods();alert('تم التحديث')}else{alert('فشل')}});
}
function loadTxns(){
  var p=new URLSearchParams();
  var s=document.getElementById('txnSearch').value; if(s)p.set('search',s);
  var st=document.getElementById('txnStatus').value; if(st)p.set('status',st);
  var ty=document.getElementById('txnType').value; if(ty)p.set('type',ty);
  var f=document.getElementById('txnFrom').value; if(f)p.set('date_from',f);
  var t2=document.getElementById('txnTo').value; if(t2)p.set('date_to',t2);
  var mn=document.getElementById('txnMin').value; if(mn)p.set('min_amount',mn);
  var mx=document.getElementById('txnMax').value; if(mx)p.set('max_amount',mx);
  var qs=p.toString();
  fetch('/api/agent/self/transactions'+(qs?'?'+qs:'')).then(r=>r.json()).then(d=>{
    var h='<table><thead><tr><th>النوع</th><th>المبلغ</th><th>المستخدم</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody>';
    (d.transactions||[]).forEach(function(t){
      var cls='tag-'+(t.status||'pending');
      h+='<tr><td>'+(t.type==='deposit'?'💵':t.type==='withdraw'?'💸':'💰')+'</td><td>'+esc(t.amount)+'</td><td>'+esc(t.user_name||'—')+'</td><td><span class="tag '+cls+'">'+esc(t.status)+'</span></td><td>'+esc((t.created_at||t.processed_at||'').slice(0,16))+'</td></tr>';
    });
    if(!(d.transactions||[]).length)h+='<tr><td colspan="5" class="empty">لا توجد معاملات</td></tr>';
    h+='</tbody></table>';
    document.getElementById('txnTable').innerHTML=h;
  });
}
function depositBalance(){
  var amt=document.getElementById('depAmount').value;
  var wal=document.getElementById('depWallet').value;
  if(!amt||!wal){alert('املأ جميع الحقول');return}
  fetch('/api/agent/self/deposit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:parseFloat(amt),reference:wal})})
  .then(r=>r.json()).then(d=>{
    if(d.success){alert(d.message||'تم');document.getElementById('depAmount').value='';document.getElementById('depWallet').value='';loadDepHistory()}
    else{alert(d.error||'فشل')}
  });
}
loadSelf();loadPending();loadMethods();loadTxns();loadDepHistory();
setInterval(function(){loadSelf();loadPending();sendHeartbeat()},15000);
function sendHeartbeat(){
  fetch('/api/agent/self/heartbeat',{method:'POST'}).catch(function(){});
}
</script>
</body>
</html>
