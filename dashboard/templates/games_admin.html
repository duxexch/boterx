{% extends "base.html" %}
{% block content %}
<div x-data="gamesAdmin()" x-init="init()" class="space-y-6">

  <!-- Stats Cards -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="bg-slate-800 rounded-xl p-4">
      <div class="text-2xl font-bold text-amber-400" x-text="stats.total_wagered?.toLocaleString() || '0'"></div>
      <div class="text-xs text-slate-400" data-i18n="total_wagered">Total Wagered</div>
    </div>
    <div class="bg-slate-800 rounded-xl p-4">
      <div class="text-2xl font-bold text-green-400" x-text="stats.net_profit?.toLocaleString() || '0'"></div>
      <div class="text-xs text-slate-400" data-i18n="net_profit">Net Profit</div>
    </div>
    <div class="bg-slate-800 rounded-xl p-4">
      <div class="text-2xl font-bold text-blue-400" x-text="(stats.platform_edge * 100)?.toFixed(1) + '%' || '0%'"></div>
      <div class="text-xs text-slate-400" data-i18n="platform_edge">Platform Edge</div>
    </div>
    <div class="bg-slate-800 rounded-xl p-4">
      <div class="text-2xl font-bold text-purple-400" x-text="stats.active_players || '0'"></div>
      <div class="text-xs text-slate-400" data-i18n="active_players">Active Players</div>
    </div>
  </div>

  <!-- Risk Alerts -->
  <div class="bg-slate-800 rounded-xl p-4" x-show="alerts.length > 0">
    <h3 class="text-sm font-bold text-red-400 mb-3">⚠️ <span data-i18n="risk_alerts">Risk Alerts</span> (<span x-text="alerts.length"></span>)</h3>
    <div class="space-y-2">
      <template x-for="alert in alerts" :key="alert.id">
        <div class="flex items-center justify-between bg-slate-900 rounded-lg p-3">
          <div>
            <span class="text-xs font-bold" :class="alert.severity === 'critical' ? 'text-red-400' : alert.severity === 'high' ? 'text-orange-400' : 'text-yellow-400'" x-text="alert.severity"></span>
            <span class="text-sm text-slate-300 mr-2" x-text="alert.message"></span>
          </div>
          <button @click="resolveAlert(alert.id)" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded">✓</button>
        </div>
      </template>
    </div>
  </div>

  <!-- Pending Deposits -->
  <div class="bg-slate-800 rounded-xl p-4">
    <h3 class="text-sm font-bold text-amber-400 mb-3">💰 <span data-i18n="pending_deposits">Pending Deposits</span> (<span x-text="deposits.length"></span>)</h3>
    <div class="space-y-2" x-show="deposits.length > 0">
      <template x-for="dep in deposits" :key="dep.id">
        <div class="flex items-center justify-between bg-slate-900 rounded-lg p-3">
          <div class="text-sm">
            <span class="font-bold text-amber-400" x-text="dep.amount"></span>
            <span class="text-slate-400 mr-2">— <span x-text="dep.account_number"></span></span>
            <span class="text-xs text-slate-500">UID: <span x-text="dep.user_id"></span></span>
          </div>
          <div class="flex gap-2">
            <button @click="approveDeposit(dep.id)" class="bg-green-600 hover:bg-green-500 text-white text-xs px-3 py-1 rounded-lg" data-i18n="approve">Approve</button>
            <button @click="rejectDeposit(dep.id)" class="bg-red-600 hover:bg-red-500 text-white text-xs px-3 py-1 rounded-lg" data-i18n="reject">Reject</button>
          </div>
        </div>
      </template>
    </div>
    <div class="text-sm text-slate-500" x-show="deposits.length === 0" data-i18n="no_pending_deposits">No pending deposits</div>
  </div>

  <!-- Tabs -->
  <div class="flex gap-2 border-b border-slate-700">
    <button @click="tab='games'" :class="tab==='games' ? 'text-amber-400 border-amber-400' : 'text-slate-400 border-transparent'" class="pb-2 px-4 border-b-2 font-medium text-sm" data-i18n="games">Games</button>
    <button @click="tab='players'" :class="tab==='players' ? 'text-amber-400 border-amber-400' : 'text-slate-400 border-transparent'" class="pb-2 px-4 border-b-2 font-medium text-sm" data-i18n="players">Players</button>
    <button @click="tab='config'" :class="tab==='config' ? 'text-amber-400 border-amber-400' : 'text-slate-400 border-transparent'" class="pb-2 px-4 border-b-2 font-medium text-sm" data-i18n="config">Config</button>
  </div>

  <!-- Games Tab -->
  <div x-show="tab==='games'" class="space-y-3">
    <template x-for="game in games" :key="game.id">
      <div class="bg-slate-800 rounded-xl p-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="text-3xl" x-text="game.icon"></span>
          <div>
            <div class="font-bold text-sm" x-text="game.name"></div>
            <div class="text-xs text-slate-400" x-text="game.description"></div>
            <div class="text-xs text-amber-400 mt-1">
              Min: <span x-text="game.min_bet"></span> | Max: <span x-text="game.max_bet"></span> | RTP: <span x-text="game.rtp_target"></span>% | Edge: <span x-text="game.house_edge_pct"></span>%
            </div>
          </div>
        </div>
        <button @click="toggleGame(game.id)" class="text-xs px-3 py-1 rounded-lg" :class="game.is_active === 'yes' ? 'bg-green-600' : 'bg-slate-600'" x-text="game.is_active === 'yes' ? '✅ Active' : '⏸️ Off'"></button>
      </div>
    </template>
    <button @click="showAddGame = true" class="w-full bg-slate-800 hover:bg-slate-700 rounded-xl p-3 text-sm text-slate-400 border border-dashed border-slate-600">➕ <span data-i18n="add_game">Add Game</span></button>
  </div>

  <!-- Players Tab -->
  <div x-show="tab==='players'" class="space-y-3">
    <div class="flex gap-2">
      <select x-model="sortBy" @change="loadPlayers()" class="bg-slate-800 text-white text-sm rounded-lg px-3 py-2 border border-slate-600">
        <option value="total_wagered">Total Wagered</option>
        <option value="net_position">Net Position</option>
        <option value="total_games">Total Games</option>
        <option value="lifetime_value">LTV</option>
      </select>
    </div>
    <template x-for="p in players" :key="p.telegram_id">
      <div class="bg-slate-800 rounded-xl p-3">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <span class="font-bold text-sm" x-text="p.name || p.telegram_id"></span>
            <span class="text-xs px-2 py-0.5 rounded-full" :class="segmentColor(getSegment(p))" x-text="getSegment(p)"></span>
            <span x-show="p.is_vex_partner === 'yes'" class="text-xs px-2 py-0.5 rounded-full bg-purple-600 text-white">💎 VEX</span>
          </div>
          <div class="flex gap-1">
            <button @click="toggleVex(p.telegram_id, p.is_vex_partner !== 'yes')" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded" x-text="p.is_vex_partner === 'yes' ? 'Remove VEX' : 'Set VEX'"></button>
            <button @click="cooldownPlayer(p.telegram_id)" class="text-xs bg-blue-700 hover:bg-blue-600 px-2 py-1 rounded">❄️ Cooldown</button>
          </div>
        </div>
        <div class="grid grid-cols-4 gap-2 text-xs">
          <div class="bg-slate-900 rounded p-2"><div class="text-slate-500">Games</div><div class="font-bold" x-text="p.total_games"></div></div>
          <div class="bg-slate-900 rounded p-2"><div class="text-slate-500">Wagered</div><div class="font-bold text-amber-400" x-text="Number(p.total_wagered || 0).toFixed(0)"></div></div>
          <div class="bg-slate-900 rounded p-2"><div class="text-slate-500">Net</div><div class="font-bold" :class="Number(p.net_position) >= 0 ? 'text-green-400' : 'text-red-400'" x-text="Number(p.net_position || 0).toFixed(0)"></div></div>
          <div class="bg-slate-900 rounded p-2"><div class="text-slate-500">Heat</div><div class="font-bold" :class="Number(p.heat_level) > 7 ? 'text-red-400' : Number(p.heat_level) > 5 ? 'text-yellow-400' : 'text-green-400'" x-text="(p.heat_level || '0') + '/10'"></div></div>
        </div>
      </div>
    </template>
  </div>

  <!-- Config Tab -->
  <div x-show="tab==='config'" class="space-y-4">
    <div class="bg-slate-800 rounded-xl p-4 space-y-3">
      <h3 class="text-sm font-bold text-amber-400" data-i18n="algorithm_config">Algorithm Configuration</h3>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-slate-400" data-i18n="target_edge">Target Edge (%)</label>
          <input type="number" x-model="config.target_house_edge" class="w-full bg-slate-900 text-white rounded-lg px-3 py-2 border border-slate-600 text-sm">
        </div>
        <div>
          <label class="text-xs text-slate-400" data-i18n="max_daily_loss">Max Daily Loss/Player</label>
          <input type="number" x-model="config.max_daily_loss_per_player" class="w-full bg-slate-900 text-white rounded-lg px-3 py-2 border border-slate-600 text-sm">
        </div>
        <div>
          <label class="text-xs text-slate-400" data-i18n="max_daily_win">Max Daily Win/Player</label>
          <input type="number" x-model="config.max_daily_win_per_player" class="w-full bg-slate-900 text-white rounded-lg px-3 py-2 border border-slate-600 text-sm">
        </div>
        <div>
          <label class="text-xs text-slate-400" data-i18n="max_bets_hour">Max Bets/Hour</label>
          <input type="number" x-model="config.max_bets_per_hour" class="w-full bg-slate-900 text-white rounded-lg px-3 py-2 border border-slate-600 text-sm">
        </div>
        <div>
          <label class="text-xs text-slate-400" data-i18n="compensation_interval">Compensation Interval</label>
          <input type="number" x-model="config.compensation_interval" class="w-full bg-slate-900 text-white rounded-lg px-3 py-2 border border-slate-600 text-sm">
        </div>
        <div>
          <label class="text-xs text-slate-400" data-i18n="min_balance">Min Balance to Play</label>
          <input type="number" x-model="config.min_balance_to_play" class="w-full bg-slate-900 text-white rounded-lg px-3 py-2 border border-slate-600 text-sm">
        </div>
      </div>
      <button @click="saveConfig()" class="bg-amber-500 hover:bg-amber-400 text-black font-bold text-sm px-4 py-2 rounded-lg" data-i18n="save">Save</button>
    </div>
  </div>

  <!-- Add Game Modal -->
  <div x-show="showAddGame" x-transition class="fixed inset-0 bg-black/70 flex items-center justify-center z-50" @click.self="showAddGame = false">
    <div class="bg-slate-800 rounded-2xl p-6 w-11/12 max-w-md space-y-3">
      <h3 class="font-bold text-lg" data-i18n="add_game">Add Game</h3>
      <input x-model="newGame.name" placeholder="Name" class="w-full bg-slate-900 rounded-lg px-3 py-2 border border-slate-600 text-sm">
      <input x-model="newGame.icon" placeholder="Icon (emoji)" class="w-full bg-slate-900 rounded-lg px-3 py-2 border border-slate-600 text-sm">
      <input x-model="newGame.description" placeholder="Description" class="w-full bg-slate-900 rounded-lg px-3 py-2 border border-slate-600 text-sm">
      <input x-model="newGame.min_bet" type="number" placeholder="Min Bet" class="w-full bg-slate-900 rounded-lg px-3 py-2 border border-slate-600 text-sm">
      <input x-model="newGame.max_bet" type="number" placeholder="Max Bet" class="w-full bg-slate-900 rounded-lg px-3 py-2 border border-slate-600 text-sm">
      <input x-model="newGame.base_win_chance" type="number" step="0.01" placeholder="Win Chance (0-1)" class="w-full bg-slate-900 rounded-lg px-3 py-2 border border-slate-600 text-sm">
      <input x-model="newGame.house_edge_pct" type="number" placeholder="House Edge %" class="w-full bg-slate-900 rounded-lg px-3 py-2 border border-slate-600 text-sm">
      <button @click="addGame()" class="w-full bg-amber-500 text-black font-bold py-2 rounded-lg text-sm" data-i18n="add">Add</button>
    </div>
  </div>

</div>

<script>
function gamesAdmin() {
  return {
    tab: 'games',
    stats: {},
    alerts: [],
    deposits: [],
    games: [],
    players: [],
    sortBy: 'total_wagered',
    config: {},
    showAddGame: false,
    newGame: { name: '', icon: '🎮', description: '', min_bet: 10, max_bet: 1000, base_win_chance: 0.45, house_edge_pct: 15 },

    async init() {
      await Promise.all([this.loadStats(), this.loadAlerts(), this.loadDeposits(), this.loadGames(), this.loadPlayers(), this.loadConfig()]);
      setInterval(() => { this.loadStats(); this.loadAlerts(); this.loadDeposits(); }, 10000);
    },

    async loadStats() {
      try { const r = await fetch('/api/games/stats'); this.stats = await r.json(); } catch(e) {}
    },
    async loadAlerts() {
      try { const r = await fetch('/api/games/alerts'); this.alerts = (await r.json()).alerts || []; } catch(e) {}
    },
    async loadDeposits() {
      try { const r = await fetch('/api/deposit/pending'); this.deposits = (await r.json()).deposits || []; } catch(e) {}
    },
    async loadGames() {
      try { const r = await fetch('/api/games/all'); this.games = (await r.json()).games || []; } catch(e) {}
    },
    async loadPlayers() {
      try { const r = await fetch('/api/games/top-players?sort=' + this.sortBy); this.players = (await r.json()).players || []; } catch(e) {}
    },
    async loadConfig() {
      try { const r = await fetch('/api/games/config'); this.config = (await r.json()).config || {}; } catch(e) {}
    },

    async approveDeposit(id) {
      await fetch(`/api/deposit/${id}/approve`, { method: 'POST', headers: {'Content-Type':'application/json'} });
      toast('Approved', 'success'); this.loadDeposits(); this.loadStats();
    },
    async rejectDeposit(id) {
      await fetch(`/api/deposit/${id}/reject`, { method: 'POST', headers: {'Content-Type':'application/json'} });
      toast('Rejected', 'info'); this.loadDeposits();
    },
    async resolveAlert(id) {
      toast('Resolved', 'success'); this.loadAlerts();
    },
    async toggleGame(id) {
      await fetch(`/api/games/${id}/toggle`, { method: 'POST', headers: {'Content-Type':'application/json'} });
      this.loadGames();
    },
    async addGame() {
      await fetch('/api/games/create', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(this.newGame) });
      this.showAddGame = false; this.loadGames(); toast('Game added', 'success');
    },
    async saveConfig() {
      await fetch('/api/games/config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(this.config) });
      toast('Config saved', 'success');
    },
    async toggleVex(uid, isPartner) {
      await fetch('/api/player/vex-status', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({uid, is_partner: isPartner}) });
      this.loadPlayers(); toast('VEX status updated', 'success');
    },
    async cooldownPlayer(uid) {
      toast('Cooldown activated', 'info'); this.loadPlayers();
    },

    getSegment(p) {
      const games = Number(p.total_games || 0);
      const net = Number(p.net_position || 0);
      const heat = Number(p.heat_level || 0);
      if (games < 10) return 'new';
      if (net > 1000) return 'winner';
      if (net < -1000) return 'loser';
      if (heat > 7) return 'hot';
      if (Number(p.churn_risk || 0) > 60) return 'churning';
      if (Number(p.lifetime_value || 0) > 5000) return 'vip';
      return 'regular';
    },
    segmentColor(seg) {
      const colors = { new:'bg-green-600', winner:'bg-red-600', loser:'bg-yellow-600', hot:'bg-orange-600', churning:'bg-blue-600', vip:'bg-purple-600', regular:'bg-slate-600' };
      return colors[seg] || 'bg-slate-600';
    },
  };
}
</script>
{% endblock %}
