<script>
const COLORS = ['#EF4444', '#3B82F6', '#22C55E', '#FBBF24', '#A855F7', '#F97316', '#06B6D4', '#EC4899'];
let prizes = [];
let spinCost = 0;
let balance = 0;
let freeSpinsLeft = 0;
let totalSpins = 0;
let isSpinning = false;
let currentAngle = 0;

// Parse URL params
const params = new URLSearchParams(window.location.search);
const roundId = params.get('round_id') || '';
const tg = window.Telegram?.WebApp;

// Init
async function init() {
    if (tg) { tg.ready(); tg.expand(); }
    try {
        const res = await fetch('/api/wheel/rounds');
        const data = await res.json();
        const active = (data.rounds || []).find(r => r.status === 'active');
        if (!active) {
            document.getElementById('roundName').textContent = 'Ù„Ø§ ØªÙˆØ¬Ø¯ Ø¬ÙˆÙ„Ø© Ù†Ø´Ø·Ø©';
            document.getElementById('spinBtn').disabled = true;
            return;
        }
        const round = active;
        prizes = (round.prizes || 'Ø­Ø¸ Ø£ÙˆÙØ±').split('|').map(p => p.trim());
        spinCost = parseFloat(round.spin_cost || 0);
        const maxPerUser = parseInt(round.max_spins_per_user || 1);
        document.getElementById('roundName').textContent = round.name || 'Ø¹Ø¬Ù„Ø© Ø§Ù„Ø­Ø¸';
        document.getElementById('spinCost').textContent = spinCost + ' ' + (round.currency || 'SAR');

        // Get user spins
        const spinsRes = await fetch('/api/wheel/my-spins?round_id=' + round.id);
        const spinsData = await spinsRes.json();
        totalSpins = spinsData.total_spins || 0;
        freeSpinsLeft = Math.max(0, maxPerUser - totalSpins);

        // Get balance
        try {
            const balRes = await fetch('/api/svrp/wallets');
            const balData = await balRes.json();
            const wallet = (balData.wallets || []).find(w => w.telegram_id == (tg?.initDataUnsafe?.user?.id || ''));
            balance = wallet ? parseFloat(wallet.balance || 0) : 0;
        } catch(e) { balance = 0; }

        document.getElementById('balance').textContent = balance.toFixed(0) + ' ' + (round.currency || 'SAR');
        document.getElementById('freeSpins').textContent = freeSpinsLeft;
        document.getElementById('totalSpins').textContent = totalSpins;
        document.getElementById('participants').textContent = round.participants || 0;

        // Update badge
        const badge = document.getElementById('spinBadge');
        if (freeSpinsLeft > 0) {
            badge.innerHTML = '<span class="free-spins-badge">' + freeSpinsLeft + ' Ù…Ø¬Ø§Ù†ÙŠØ© Ù…ØªØ¨Ù‚ÙŠØ©</span>';
        } else if (spinCost > 0 && balance >= spinCost) {
            badge.innerHTML = '<span class="paid-spins-badge">Ø¯ÙˆØ±Ø§Øª Ø¥Ø¶Ø§ÙÙŠØ© Ø¨Ù€ ' + spinCost + '</span>';
        } else {
            badge.innerHTML = '<span style="color:#EF4444;font-size:12px">Ù„Ø§ ØªÙˆØ¬Ø¯ Ø¯ÙˆØ±Ø§Øª</span>';
            document.getElementById('spinBtn').disabled = true;
        }

        // Draw prize list
        const listEl = document.getElementById('prizeList');
        listEl.innerHTML = prizes.map((p, i) => 
            '<div class="prize-item"><div class="prize-color" style="background:' + COLORS[i % COLORS.length] + '"></div>' + p + '</div>'
        ).join('');

        drawWheel(0);
    } catch(e) {
        console.error(e);
        document.getElementById('roundName').textContent = 'Ø®Ø·Ø£ ÙÙŠ Ø§Ù„ØªØ­Ù…ÙŠÙ„';
    }
}

function drawWheel(angle) {
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const cx = 180, cy = 180, radius = 175;
    const numPrizes = prizes.length;
    const arc = (Math.PI * 2) / numPrizes;

    ctx.clearRect(0, 0, 360, 360);
    
    for (let i = 0; i < numPrizes; i++) {
        const start = angle + i * arc;
        const end = start + arc;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = COLORS[i % COLORS.length];
        ctx.fill();
        ctx.strokeStyle = '#0F172A';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Text
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(start + arc / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 13px Tahoma';
        const prizeText = prizes[i].substring(0, 15);
        ctx.fillText(prizeText, radius - 15, 5);
        ctx.restore();
    }
}

function startSpin() {
    if (isSpinning) return;
    isSpinning = true;
    document.getElementById('spinBtn').disabled = true;

    // Determine if free or paid
    const useFree = freeSpinsLeft > 0;
    const cost = useFree ? 0 : spinCost;

    if (!useFree && balance < cost) {
        document.getElementById('resultEmoji').textContent = 'âš ï¸';
        document.getElementById('resultPrize').textContent = 'Ø±ØµÙŠØ¯ ØºÙŠØ± ÙƒØ§ÙÙ';
        document.getElementById('resultMsg').textContent = 'Ù„Ø§ ÙŠÙˆØ¬Ø¯ Ø±ØµÙŠØ¯ ÙƒØ§ÙÙ Ù„Ù„Ø¯ÙˆØ±Ø§Ù†';
        document.getElementById('resultOverlay').classList.add('show');
        isSpinning = false;
        setTimeout(() => { document.getElementById('resultOverlay').classList.remove('show'); document.getElementById('spinBtn').disabled = false; }, 2000);
        return;
    }

    // Random target
    const numPrizes = prizes.length;
    const targetIndex = Math.floor(Math.random() * numPrizes);
    const arcPerPrize = (Math.PI * 2) / numPrizes;
    const targetAngle = -(targetIndex * arcPerPrize + arcPerPrize / 2) - Math.PI / 2;
    
    // Add extra rotations
    const extraRotations = 5;
    const totalRotation = extraRotations * Math.PI * 2 + targetAngle - currentAngle;
    const duration = 4000;
    const startTime = performance.now();

    function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        // Easing: easeOutQuart
        const eased = 1 - Math.pow(1 - progress, 4);
        currentAngle = (totalRotation * eased) % (Math.PI * 2);
        // Normalize to keep positive
        const drawAngle = currentAngle - Math.PI / 2;
        drawWheel(drawAngle);

        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            onSpinComplete(targetIndex, useFree, cost);
        }
    }
    requestAnimationFrame(animate);
}

function onSpinComplete(prizeIndex, usedFree, cost) {
    const prize = prizes[prizeIndex];
    
    // Show result
    document.getElementById('resultEmoji').textContent = 'ðŸŽ‰';
    document.getElementById('resultPrize').textContent = prize;
    document.getElementById('resultMsg').textContent = usedFree 
        ? 'Ù…Ø¨Ø±ÙˆÙƒ! ØªÙ…Øª Ø¥Ø¶Ø§ÙØ© Ø§Ù„Ø¬Ø§Ø¦Ø²Ø© Ù„Ù…Ø­ÙØ¸ØªÙƒ' 
        : 'Ù…Ø¨Ø±ÙˆÙƒ! ØªÙ… Ø®ØµÙ… ' + cost + ' ÙˆØ¥Ø¶Ø§ÙØ© Ø§Ù„Ø¬Ø§Ø¦Ø²Ø© Ù„Ù…Ø­ÙØ¸ØªÙƒ';
    document.getElementById('resultOverlay').classList.add('show');

    // Confetti
    for (let i = 0; i < 50; i++) {
        const c = document.createElement('div');
        c.className = 'confetti-piece';
        c.style.left = Math.random() * 100 + '%';
        c.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
        c.style.animationDelay = Math.random() * 0.5 + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 2000);
    }

    // Send data to bot
    if (tg) {
        tg.sendData(JSON.stringify({
            round_id: roundId,
            prize: prize,
            prize_index: prizeIndex,
            used_free: usedFree,
            cost: cost
        }));
    }

    // Update local counts
    totalSpins++;
    if (usedFree) { freeSpinsLeft--; }
    else { balance -= cost; }
    document.getElementById('freeSpins').textContent = freeSpinsLeft;
    document.getElementById('totalSpins').textContent = totalSpins;
    document.getElementById('balance').textContent = balance.toFixed(0) + ' SAR';

    // Update badge
    const badge = document.getElementById('spinBadge');
    if (freeSpinsLeft > 0) {
        badge.innerHTML = '<span class="free-spins-badge">' + freeSpinsLeft + ' Ù…Ø¬Ø§Ù†ÙŠØ© Ù…ØªØ¨Ù‚ÙŠØ©</span>';
    } else if (spinCost > 0 && balance >= spinCost) {
        badge.innerHTML = '<span class="paid-spins-badge">Ø¯ÙˆØ±Ø§Øª Ø¥Ø¶Ø§ÙÙŠØ© Ø¨Ù€ ' + spinCost + '</span>';
    } else {
        badge.innerHTML = '<span style="color:#EF4444;font-size:12px">Ù„Ø§ ØªÙˆØ¬Ø¯ Ø¯ÙˆØ±Ø§Øª</span>';
    }

    isSpinning = false;
    setTimeout(() => {
        document.getElementById('resultOverlay').classList.remove('show');
        if (freeSpinsLeft > 0 || (spinCost > 0 && balance >= spinCost)) {
            document.getElementById('spinBtn').disabled = false;
        }
    }, 3000);
}

init();
</script>
